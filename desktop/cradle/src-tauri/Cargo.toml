[package]
name = "oi-cradle"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oi-cradle-kernel = { path = "../kernel" }
tauri-plugin-dialog = "=2.7.1"
tauri = { version = "=2.11.5", features = ["unstable"] }

[workspace]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
