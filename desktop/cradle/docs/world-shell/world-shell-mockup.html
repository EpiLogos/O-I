<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Shell Mockup</title>
<!--
  WORLD SHELL — reference mockup, revision 3 (8 Oct 2026).

  Four arrangements of one shell (O:I #375): Base · Factory · Expressions · Technē.
  Each composes the same frame differently:
              LEFT browser + aperture slot   CENTRE panes (apertures)    RIGHT companion + launcher   BOTTOM detail
   Base       Central ground · documents     Day · Flow · Beings · Things  situated agent             document devices (text, highlight, note, packet, answer, form)
   Factory    sessions · agents · runs       session grid · thread         result desk                agent chain (gateway → agent → skills → world → git)
   Expressions compact bounded graph         living Expressions field      Anima · Nara/oracle        Studio (the engine's own controls)
   Technē     to-hand source navigator       the current lens (M0′–M5′)    Epii                       the instrument's own controls

  Panes carry no header: a view is pulled in as an aperture (launcher, browser), each pane keeps its
  own context, and the focused pane's context and view controls sit in the aperture slot under the
  browser (where Live keeps the groove pool). Devices are never a separate "rack" that composes an
  instrument: in Technē the instrument's native controls are what modify its form.

  M4′ World / Places renders real bodies: lit, procedurally generated planets in one solar-system
  space, with the relations between bodies drawn as a connective layer. Earth is your local root
  anchor (the Mūlādhāra relation), not everyone's planet; each World builds its own body.

  Linkable states: ?mode=techne&lens=M4&scale=system&ap=3 · ?mode=base&doc=thing · ?mode=expressions
-->
<style>
:root{
  --bg-0:#26292d; --bg-1:#33363b; --bg-2:#3f4348; --bg-3:#4a4e54; --surface:#43464c;
  --line:#24262a; --line-strong:#3d4147;
  --text:#d4d7da; --text-dim:#a2a7ad; --text-faint:#71767c;
  --accent:#ffbe00; --accent-soft:rgba(255,190,0,.13); --sel:#7ec3e6; --rec:#e0523f; --green:#8fd0a8; --stall:#ff9b4a;
  --fizz:#5cc6b4; --honey:#e2a35e; --bumble:#d985a6;
  --w-ariadne:#d1a46c; --w-satya:#5fb3b0; --w-kestrel:#a9c4dc; --w-field:#7ec3e6;
  --mercurius:#c9a0dc; --selfc:#9fc7e8; --tower:#d8c89a;
  /* paper documents (cradle documents/*.html tokens) */
  --paper:#EFEFED; --pfield:#FAFAF8; --ink:#111; --pmid:#6E6E6A; --pfaint:#A3A39E; --prule:#C9C9C4; --hl:#FFE97A;
  --serif:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1d20;overflow:hidden}
body{font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.fit{position:absolute;left:50%;top:50%;transform-origin:center}
.frame{--dock-w:320px;width:1920px;height:1200px;display:grid;background:var(--bg-1);padding:0 6px;
  grid-template-columns:400px minmax(0,1fr) var(--dock-w);grid-template-rows:64px minmax(0,1fr) 300px 28px;
  grid-template-areas:"tp tp tp" "br ct dk" "dt dt dk" "sb sb sb"}
.frame.no-browser{grid-template-columns:0 minmax(0,1fr) var(--dock-w)}
.frame.no-dock{grid-template-columns:400px minmax(0,1fr) 0}
.frame.no-detail{grid-template-rows:64px minmax(0,1fr) 0 28px}
.mono{font-family:var(--mono)} .dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
@keyframes blink{50%{opacity:.25}} @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ---------------- transport ---------------- */
.tp{grid-area:tp;margin:0 -6px;padding:3px 10px 8px;border-bottom:3px solid var(--line);display:flex;flex-direction:column}
.title{height:18px;text-align:center;font-size:12px;color:var(--text-dim)} .title b{color:var(--text);font-weight:500}
.ctl{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.g{display:flex;align-items:center;gap:2px;white-space:nowrap}
.gl{font-size:8.5px;color:var(--text-faint);margin-right:3px}
.nc{height:19px;min-width:17px;padding:1px 4px;background:var(--bg-0);border:1px solid #30343a;line-height:14px;font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:3px}
.nc:hover{color:var(--text)} .nc.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)}
.fld{height:19px;padding:2px 6px;font-size:10px;background:var(--bg-0);color:var(--text);display:flex;align-items:center;gap:4px;font-family:var(--mono);white-space:nowrap}
.fld small{font-size:8.5px;color:var(--text-faint)} .fld.act{box-shadow:inset 0 -2px 0 var(--accent)}
.tbtn{width:20px;height:22px;display:grid;place-items:center;color:var(--text-dim)}
.tbtn.play{color:var(--accent)} .tbtn.on.play{color:#1d1f22;background:var(--accent)} .tbtn.rec{color:#c9c8ad} .tbtn.on.rec{color:var(--rec)}
.sp{flex:1;min-width:4px}
.cpu{width:33px;height:17px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--bg-0) 0,var(--bg-0) 9px,var(--line) 9px,var(--line) 10px);position:relative;overflow:hidden}
.cpu i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--w-field) 0,var(--w-field) 9px,transparent 9px,transparent 10px)}
.surf{display:flex;gap:4px;align-items:center;margin-left:6px}
.surf button{color:var(--text-dim);height:22px;padding:0 6px;display:flex;align-items:center;gap:5px;font-size:10.5px;border:1px solid transparent}
.surf button.on{color:#1d1f22;background:var(--accent)} .surf button:hover:not(.on){color:var(--text);border-color:var(--line-strong)}
.chrome{width:20px;height:20px;display:grid;place-items:center;color:var(--text-dim)} .chrome.on{color:var(--accent)}
.ap{display:flex;align-items:center;height:19px;background:var(--bg-0);border:1px solid #30343a}
.ap button{height:17px;padding:0 6px;font-size:10px;color:var(--text-faint);border-right:1px solid #30343a}
.ap button:last-child{border-right:none} .ap button.in{color:var(--text-dim)} .ap button.on{background:var(--w-field);color:#1d1f22}
.seg{display:flex;border:1px solid var(--line);width:max-content;max-width:100%}
.seg button{padding:1px 7px;font-size:10px;color:var(--text-dim);background:var(--bg-1);border-right:1px solid var(--line);height:17px;white-space:nowrap}
.seg button:last-child{border-right:none} .seg button.on{background:var(--accent);color:#1d1f22}

/* ---------------- browser + aperture slot ---------------- */
.br{grid-area:br;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg-1);border:1px solid var(--line-strong);border-right:4px solid var(--line);border-radius:3px 0 0 3px;overflow:hidden;margin-top:4px}
.bsearch{display:flex;height:25px;flex:none;padding:2px;gap:1px;border-bottom:1px solid var(--line);align-items:center}
.bsearch span{width:20px;display:grid;place-items:center;color:var(--text-faint);cursor:pointer}
.bsearch input{flex:1;background:var(--bg-0);border:none;outline:none;color:var(--text);font-size:11px;padding:2px 6px;height:20px}
.bsearch input::placeholder{color:var(--text-faint)}
.bcols{display:flex;flex:1;min-height:0}
.bcats{width:112px;flex:none;border-right:1px solid var(--line);padding:0 3px;font-size:11px;overflow:hidden}
.bcats h6{font-weight:400;font-size:10.5px;color:var(--text-faint);padding:6px 3px 2px}
.bcat{display:flex;align-items:center;gap:6px;padding:2px 3px;color:var(--text-dim);border-radius:2px;white-space:nowrap;cursor:default}
.bcat.on{background:var(--bg-3);color:var(--text)} .bcat .n{margin-left:auto;font-size:9px;color:var(--text-faint)}
.bcat i{width:11px;text-align:center;font-style:normal;color:var(--text-faint)}
.bres{flex:1;min-width:0;background:var(--bg-2);display:flex;flex-direction:column}
.bhead{display:flex;justify-content:space-between;height:20px;background:var(--bg-0);padding:2px 5px;font-size:10px;color:var(--text-dim);flex:none}
.blist{overflow:auto;flex:1}
.bitem{height:23px;display:flex;align-items:center;gap:6px;padding:2px 5px;color:var(--text-dim);font-size:11px;white-space:nowrap;cursor:default}
.bitem:hover{background:var(--bg-3);color:var(--text)} .bitem.on{background:var(--bg-3);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.bitem .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bitem .st{margin-left:auto;font-size:9.5px;color:var(--text-faint);flex:none}
.bitem.ind1{padding-left:18px} .bitem.ind2{padding-left:31px}
.bsep{font-size:9.5px;color:var(--text-faint);padding:7px 6px 2px;display:flex;justify-content:space-between}
.wb{font-size:8.5px;padding:0 4px;height:13px;line-height:12px;border:1px solid currentColor;border-radius:7px;flex:none}
.kg{width:12px;height:12px;flex:none;display:grid;place-items:center;font-size:10px}
.newforms{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px}
.newforms button{height:44px;background:var(--bg-1);border:1px solid var(--line);color:var(--text-dim);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.newforms button:hover{border-color:var(--text-faint);color:var(--text)} .newforms button b{font:15px var(--serif);color:var(--text)}
.slot{height:46%;min-height:120px;display:flex;flex-direction:column;border-top:5px solid var(--line);background:var(--bg-2)}
.sloth{height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px;flex:none;white-space:nowrap}
.sloth .r{margin-left:auto;color:var(--text-faint);font-size:10px;display:flex;gap:2px;align-items:center}
.slotb{flex:1;overflow:auto;padding:4px 0 8px}
.sec{padding:8px 8px 3px;font-size:10px;color:var(--text-faint);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:6px;padding:2px 8px;font-size:11px;min-height:22px}
.row .k{color:var(--text-dim)}
.ctx{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px;align-items:center;padding:2px 8px;font-size:11px;min-height:21px}
.ctx .k{color:var(--text-faint);font-size:10px} .ctx .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ctx .v b{font-weight:500}
.ctx .v .kg{display:inline-grid;vertical-align:-2px;margin-right:3px} .ctx .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.pin-t{font-size:9px;border:1px solid var(--line);background:var(--bg-0);padding:0 5px;height:16px;line-height:14px;color:var(--text-faint);cursor:pointer}
.pin-t.on{color:var(--accent);border-color:var(--accent)}
.ladder{display:flex;flex-direction:column;border:1px solid var(--line)}
.ladder button{height:20px;padding:0 8px 0 6px;font-size:10.5px;color:var(--text-faint);display:flex;align-items:center;gap:7px;text-align:left;background:var(--bg-1);border-bottom:1px solid var(--line)}
.ladder button:last-child{border-bottom:none}
.ladder button i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.ladder button.on{color:var(--text);background:var(--bg-3)} .ladder button.on i{background:var(--accent);opacity:1}
.bt{height:20px;padding:0 9px;font-size:10.5px;background:var(--bg-1);border:1px solid var(--line);color:var(--text-dim);white-space:nowrap}
.bt:hover{color:var(--text);border-color:var(--text-faint)} .bt.pri{background:var(--accent);border-color:var(--accent);color:#1d1f22}
.bt.fld2{background:var(--w-field);border-color:var(--w-field);color:#1d1f22} .bt[disabled]{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;gap:4px;padding:5px 8px}

/* ---------------- centre: headerless panes ---------------- */
.ct{grid-area:ct;min-width:0;min-height:0;margin:4px 4px 4px 0;display:flex;position:relative}
.split{display:flex;flex:1;gap:4px;min-width:0;min-height:0;align-items:stretch!important} .split.row{flex-direction:row} .split.col{flex-direction:column}
.ct>.pane,.split>.pane{flex:1}
.snapghost{position:fixed;z-index:40;background:#ffbe0026;border:1px solid var(--accent);pointer-events:none;display:none}
.pmenu-w{position:relative} .pmenu{position:absolute;right:0;top:24px;z-index:70;background:#1d1f22f2;border:1px solid var(--line-strong);display:none;flex-direction:column;min-width:170px;box-shadow:0 10px 30px #0008}
.pmenu.on{display:flex} .pmenu button{height:24px;display:flex;align-items:center;gap:8px;padding:0 9px;font-size:11px;color:var(--text-dim);text-align:left} .pmenu button:hover{background:var(--bg-3);color:var(--text)} .pmenu button i{font-style:normal;width:14px;color:var(--accent)}
.tilesh{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11px}
.tiles{flex:1;min-height:0;overflow:auto;padding:5px;display:flex;flex-direction:column;gap:5px}
.tile{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;min-width:0;flex:none}
.tlh{height:24px;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--bg-2);font-size:11px;border-bottom:1px solid var(--line)}
.tlh .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tlh .x{color:var(--text-faint);font-size:10px;cursor:pointer}
.tlb{position:relative;overflow:hidden;background:var(--bg-2)}
.sb .tg{display:flex;gap:2px} .sb .tg button{padding:1px 8px;color:var(--text-dim);display:flex;gap:4px;align-items:center;height:20px;border:1px solid var(--line)} .sb .tg button.on{color:var(--accent)}
.clipv{flex:1;display:flex;min-width:0;background:var(--bg-1);border:1px solid var(--line);overflow:hidden}
.cprops{width:230px;flex:none;border-right:1px solid var(--line);overflow:auto}
.cph{height:22px;display:flex;align-items:center;gap:6px;padding:0 7px;color:#21282e;font-weight:500;font-size:11px;white-space:nowrap;overflow:hidden}
.ccol{border-right:1px solid var(--line);overflow:auto;padding:4px 0;min-width:0}
.ccol:last-child{border-right:none;flex:1}
.ccol h5{font-weight:400;font-size:9.5px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;padding:4px 10px}
.ifold{width:26px;flex:none;background:var(--bg-2);border:1px solid var(--line);writing-mode:vertical-rl;display:flex;align-items:center;gap:8px;padding:8px 0;font-size:11px;color:var(--text-dim);cursor:pointer}
.ifold:hover{color:var(--text);border-color:var(--text-faint)} .ifold b{font-family:var(--mono);font-weight:400;color:var(--accent);font-size:10px}
.surf button{padding:0;width:24px;justify-content:center}
.ct.solo{grid-template:1fr/1fr} .ct.duo{grid-template:1fr/1fr 1fr} .ct.quad{grid-template:1fr 1fr/1fr 1fr} .ct.wide{grid-template:1fr/1.6fr 1fr}
.pane{background:var(--bg-2);border:1px solid var(--line-strong);position:relative;overflow:hidden;min-width:0;min-height:0}
.pane.focus{border-color:var(--accent)}
.pb{position:absolute;inset:0;overflow:hidden}
/* per-pane tab rail (#375: compact vertical rail, auto-hidden) */
.trail{position:absolute;left:0;top:0;bottom:0;width:6px;z-index:8;display:flex;flex-direction:column;gap:1px;padding-top:6px;transition:width .15s}
.trail:hover{width:150px;background:#1d1f22ee;border-right:1px solid var(--line-strong)}
.tab{height:22px;display:flex;align-items:center;gap:7px;padding:0 0 0 1px;font-size:10.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;cursor:pointer}
.tab i{width:3px;height:16px;background:var(--text-faint);flex:none;opacity:.6} .tab.on i{background:var(--accent);opacity:1}
.tab:hover{color:var(--text)} .tab.on{color:var(--text)}
.tab .x{margin-left:auto;margin-right:6px;color:var(--text-faint);font-size:9px}
.hud{position:absolute;z-index:4;display:flex;gap:4px;align-items:center;font-size:10px}
.hud.tl{left:14px;top:10px} .hud.tr{right:10px;top:10px} .hud.bl{left:14px;bottom:10px;flex-direction:column;align-items:flex-start} .hud.br{right:10px;bottom:10px} .hud.tc{left:50%;top:10px;transform:translateX(-50%)}
.chip{height:19px;display:flex;align-items:center;gap:5px;padding:0 7px;background:#1d1f22d9;border:1px solid var(--line-strong);color:var(--text-dim);font-size:10px;white-space:nowrap}
.chip b{color:var(--text);font-weight:500} .chip.on{color:#1d1f22;background:var(--accent);border-color:var(--accent)}
button.chip:hover{color:var(--text)}
.lensbar{display:flex;background:#1d1f22e6;border:1px solid var(--line-strong)}
.lensbar button{height:22px;padding:0 9px;font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:5px;border-right:1px solid #ffffff0c}
.lensbar button:last-child{border-right:none} .lensbar button b{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--text-faint)}
.lensbar button.on{color:#1d1f22;background:var(--accent)} .lensbar button.on b{color:#1d1f22}
.legend{background:#1d1f22d9;border:1px solid var(--line-strong);padding:5px 8px;display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--text-dim)}
.legend .li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.fogmsg{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:4;font-size:10.5px;color:var(--text-dim);background:#1d1f22e0;border:1px solid var(--line-strong);padding:4px 10px;white-space:nowrap}
.fogmsg b{color:var(--text);font-weight:500}

/* planets / space */
.space{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 45%,#141820 0,#0b0d11 80%)}
.space canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.mk{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.pin .lab{font-size:10px;color:var(--text-dim);background:#0d0f13b8;padding:0 4px;line-height:14px}
.pin .lab small{display:block;font-size:9px;color:var(--text-faint);line-height:12px}
.pin:hover .lab{color:var(--text)} .pin.sel .lab{color:#1d1f22;background:var(--accent)} .pin.sel .lab small{color:#3a3320}
.pin.body{transform:translate(-50%,0)} .pin.body .lab{background:transparent;text-align:center;font-size:11px;color:var(--text)}
.pin.body .lab small{font-size:9.5px}
.pin .g{width:16px;height:16px;display:grid;place-items:center;flex:none}
.pin.ar{transform:translate(-8px,-50%)}
.rel-l{position:absolute;transform:translate(-50%,-50%);font-size:9px;color:var(--text-dim);background:#0b0d11cc;padding:0 5px;border-radius:7px;border:1px solid #ffffff14;white-space:nowrap;pointer-events:auto;cursor:default}
.placecur{position:absolute;pointer-events:none;width:26px;height:26px;border:1.5px dashed var(--accent);border-radius:50%;transform:translate(-50%,-50%)}

/* paper documents (Day · Flow · Beings · Things) */
.doc{position:absolute;inset:0;overflow:auto;background:var(--paper);color:var(--ink);font:15px/1.6 var(--serif)}
.doc.ink{--paper:#20231f;--pfield:#282c26;--ink:#eeeee8;--pmid:#b2b7aa;--pfaint:#8e9688;--prule:#555e50}
.doc .inner{max-width:760px;margin:0 auto;padding:30px 44px 80px}
.doc .bar{display:flex;justify-content:space-between;align-items:center;font:11px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--pmid);letter-spacing:.06em}
.doc .bar .views{display:flex;gap:18px} .doc .bar .views span{padding-bottom:3px;border-bottom:2px solid transparent;cursor:pointer}
.doc .bar .views span.on{color:var(--ink);border-color:var(--ink)}
.doc .eyebrow{font:11px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--pmid);margin:34px 0 12px}
.doc h1{font:400 40px/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 12px}
.doc .subtitle{font:italic 19px/1.4 var(--serif);color:var(--pmid)}
.doc p{margin:0 0 12px} .doc h3{font:400 13px 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--pmid);margin:22px 0 8px;border-top:1px solid var(--prule);padding-top:12px}
.doc mark{background:var(--hl);color:#111;padding:0 1px}
.doc mark.sel{background:#000;color:#fff}
.doc .note-a{border-bottom:1px dashed var(--pmid)}
.doc .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.doc .chips span{font:10.5px 'Helvetica Neue',Helvetica,Arial,sans-serif;border:1px solid var(--prule);padding:2px 7px;color:var(--pmid);border-radius:2px}
.doc .ent{display:grid;grid-template-columns:44px 1fr;gap:12px;margin:18px 0}

.die div i{display:block;height:3px;background:var(--prule)} .die div i.f{background:var(--pmid)}
.die-l{display:grid;grid-template-columns:262px 1fr;gap:30px}

.fl{border-top:1px solid var(--prule);padding-top:7px}

/* factory */

.toolrow{margin-left:34px;border:1px solid var(--line);background:var(--bg-1);font-family:var(--mono);font-size:10.5px;color:var(--text-dim);padding:3px 8px;display:flex;gap:8px}

/* constellation / canvas / timeline / scenes / palace / expression (carried from rev 2) */
.cn{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#3a3e44 0,#2a2d32 80%)}
.cn.form{background:radial-gradient(ellipse at 50% 50%,#2a2833 0,#141318 85%)}
.cn svg.g{position:absolute;inset:0;width:100%;height:100%}
.node{cursor:pointer} .node text{font-size:10px;fill:var(--text-dim);paint-order:stroke;stroke:#2a2d32;stroke-width:3px}
.cn.form .node text{stroke:#17161c;fill:#cfc8d8} .node.focus text{fill:var(--text);font-size:11.5px;font-weight:500} .node:hover text{fill:var(--text)}
.edge-l{font-size:8.5px;fill:var(--text-faint)}
.cnlist{position:absolute;inset:0;overflow:auto;padding:40px 14px 12px;font-size:11px}
.cnlist .li{display:flex;align-items:center;gap:7px;height:24px;padding:0 6px;cursor:pointer;color:var(--text-dim);border-bottom:1px solid #ffffff08}
.cnlist .li:hover{background:var(--bg-3);color:var(--text)} .cnlist .li .r{margin-left:auto;font-size:9.5px;color:var(--text-faint);font-family:var(--mono)}
.cv{position:absolute;inset:0;background-color:#2c2f34;background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:18px 18px}
.cv svg.e{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.art{position:absolute;background:var(--bg-1);border:1px solid var(--line-strong);font-size:10.5px;cursor:move;user-select:none;box-shadow:0 4px 14px #0005}
.art.sel{outline:1px solid var(--accent)} .art .ah{height:18px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:9.5px;color:var(--text-faint);border-bottom:1px solid var(--line);white-space:nowrap}

.frm{position:absolute;border:1px dashed #ffffff30;background:#ffffff06} .frm span{position:absolute;top:-17px;left:0;font-size:10px;color:var(--text-faint)}
.note{position:absolute;width:150px;background:#e8d48a;color:#3a3420;font-size:10.5px;padding:7px 8px;line-height:1.35;box-shadow:0 4px 12px #0006;transform:rotate(-1.5deg);cursor:move}
.promote{position:absolute;z-index:5;transform:translate(-50%,-50%);height:19px;padding:0 7px;font-size:9.5px;background:#1d1f22f0;border:1px dashed var(--accent);color:var(--accent);white-space:nowrap;cursor:pointer}
.tl{position:absolute;inset:0;display:flex;flex-direction:column}
.ruler{height:22px;flex:none;display:grid;grid-template-columns:minmax(0,1fr) var(--hw,190px);border-bottom:1px solid var(--line)}
.lensed .tl{top:40px} .lensed .scn{padding-top:40px}
.tl .ov{height:14px;flex:none;border-bottom:1px solid var(--line);background:var(--bg-1);position:relative} .tl .ov i{position:absolute;top:2px;bottom:2px;border:1px solid var(--text-faint)}
.ticks{position:relative;font-size:10px;color:var(--text-dim);overflow:hidden}

.ticks span.today{color:var(--accent);border-left-color:var(--accent)}
.rset{display:flex;align-items:center;padding:0 6px;font-size:10px;color:var(--text-faint);border-left:1px solid var(--line)}
.arows{flex:1;overflow:auto;position:relative}
.arow{display:grid;grid-template-columns:minmax(0,1fr) var(--hw,190px);border-bottom:1px solid var(--line);min-height:26px}
.arow.grp{min-height:20px;border-bottom:2px solid var(--line)} .lane{position:relative;background:var(--bg-2);overflow:hidden} .arow.grp .lane{background:#383c41}
.ac{position:absolute;top:3px;bottom:3px;min-width:4px;background:var(--tc);border:1px solid #0004;color:#22282c;font-size:9.5px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;line-height:17px}
.ac.sel{box-shadow:0 0 0 1px var(--accent),0 0 0 2px #1d1f22}
.ac.claim{box-shadow:inset 3px 0 0 #1d1f2266} .ac.inferred{background:transparent;border:1px dashed var(--tc);color:var(--tc)}
.ac.hypothesis{background:#00000024;border:1px solid var(--tc);color:var(--tc)} .ac.disputed{background:repeating-linear-gradient(135deg,var(--tc) 0,var(--tc) 5px,#00000040 5px,#00000040 8px)}
.ac.ghost{background:transparent;border:1px dotted var(--text-faint);color:var(--text-faint)} .ac.live{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),#0007)}
.ac.pt{width:9px!important;padding:0;border-radius:50%;top:8px;bottom:8px}
.ahead{background:var(--bg-1);border-left:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10px;min-width:0}

.cursor{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;z-index:3}
.cursor.now{background:#ffffff55} .cursor.occ{background:var(--accent);width:2px}
.cursor .rd{position:absolute;top:2px;left:4px;font-size:9px;font-family:var(--mono);white-space:nowrap;background:#1d1f22d8;padding:0 4px;color:var(--text)}
.needle{position:absolute;top:2px;bottom:2px;width:2px;background:var(--tc);z-index:3;pointer-events:none}
.rel{position:absolute;inset:0;pointer-events:none;z-index:2}
.scn{position:absolute;inset:0;display:flex}

.scol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:2px solid var(--line)}

.scell.f{background:var(--tc);color:#252a2d} .scell.f .tri{width:0;height:0;border-left:7px solid #252a2dbb;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;flex:none}

.scell.cur{box-shadow:inset 0 0 0 1px var(--accent)} .scell.playing.f .tri{animation:blink .6s steps(2) infinite} .scell.recs{background:var(--rec);color:#fff}

.smain .scell.cur .tri{border-left-color:var(--accent)} .smain .scell.cur{color:var(--text)}
.palace{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2d2a24 0,#1b1a17 80%)}
.palace svg{position:absolute;inset:0;width:100%;height:100%}

.toolrail button.on{color:var(--accent)} .toolrail button:hover{color:var(--text)}
.toolbelt{position:absolute;z-index:5;display:flex;gap:1px;background:#1d1f22f0;border:1px solid var(--line-strong);transform:translate(-50%,0)}
.toolbelt button{height:22px;padding:0 8px;font-size:10px;color:var(--text-dim)} .toolbelt button.on{color:var(--accent)} .toolbelt button:hover{color:var(--text)}
.scenes{position:absolute;left:0;right:0;bottom:0;height:92px;display:flex;gap:6px;padding:6px 10px 8px 52px;background:#141318ee;border-top:1px solid #ffffff10}
.fcell{width:118px;flex:none;border:1px solid var(--line-strong);background:#1b1a20;display:flex;flex-direction:column;cursor:pointer;position:relative}
.fcell.on{border-color:var(--accent)} .fcell .pv{flex:1;position:relative;overflow:hidden}
.fcell .n{height:17px;font-size:9.5px;color:var(--text-dim);padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}

/* ---------------- detail (per arrangement) ---------------- */
.dt{grid-area:dt;min-width:0;min-height:0;display:flex;flex-direction:column;padding:0 4px 4px 0}

.dth b{color:var(--text);font-weight:500} .dth .r{margin-left:auto;color:var(--text-faint)}
.chain{flex:1;min-height:0;display:flex;gap:6px;padding:8px;overflow:hidden;align-items:stretch;background:var(--bg-1);border:1px solid var(--line)}
.dev{background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.dev.sel{outline:1px solid var(--accent);outline-offset:-1px}

.db{flex:1;display:flex;gap:10px;padding:7px;min-height:0}
.vis{background:var(--bg-0);border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.ctrls{display:grid;grid-template-columns:repeat(2,minmax(62px,auto));gap:8px 6px;align-content:start}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:ns-resize;user-select:none}
.knob .kl,.tog .kl{font-size:9.5px;color:var(--text-dim);white-space:nowrap} .knob .kv{font-size:9.5px;font-family:var(--mono);color:var(--text)}

.dlist{display:flex;flex-direction:column;gap:2px;min-width:0}
.dli{display:flex;align-items:center;gap:6px;height:20px;flex:none;padding:0 5px;background:var(--bg-1);border:1px solid var(--line);font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.dli .n{overflow:hidden;text-overflow:ellipsis;flex:1} .dli.on{border-color:var(--accent);color:var(--text)} .dli .d{font-family:var(--mono);color:var(--text-faint);font-size:9px}
.dropz{width:140px;flex:none;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-faint);font-size:10.5px;padding:10px}

.tin{height:19px;background:var(--bg-0);border:1px solid var(--line);color:var(--text);font-size:10.5px;padding:0 6px;outline:none;width:100%}
/* instrument (Technē) and Studio (Expressions): one instrument frame, its own sections */
.inst{flex:1;display:flex;flex-direction:column;background:var(--bg-2);border:1px solid var(--line);min-width:0}
.insth{height:22px;display:flex;align-items:center;gap:7px;padding:0 7px;border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap;background:linear-gradient(#4a4e54,#43464c)}
.insth .k{font-family:var(--mono);color:var(--accent);font-size:10.5px} .insth .own{font-size:9.5px;color:var(--text-faint)} .insth .r{margin-left:auto;font-size:10px;color:var(--text-faint);display:flex;gap:8px;align-items:center}

.isec .ctrls{gap:7px 4px}

/* ---------------- right: companion + launcher ---------------- */

.comph{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap}
.comph .who{display:flex;align-items:center;gap:5px} .comph .who b{font-weight:500}
.ctabs{display:flex;gap:1px;height:23px;flex:none;border-bottom:1px solid var(--line);background:var(--bg-1);padding:0 4px;align-items:flex-end}
.ctabs span{height:20px;padding:0 9px;font-size:10.5px;color:var(--text-faint);display:flex;align-items:center;cursor:pointer;border:1px solid transparent;border-bottom:none}
.ctabs span.on{color:var(--text);background:var(--bg-2);border-color:var(--line)}
.compb{flex:1;min-height:0;overflow:auto;background:var(--bg-2)}
.cm{padding:8px 10px;font-size:11.5px;line-height:1.5;color:var(--text-dim)}
.cm .who{font-size:10px;color:var(--text-faint);margin-bottom:2px;display:flex;align-items:center;gap:5px} .cm .who b{color:var(--text);font-weight:500}
.cm .bub{background:var(--bg-1);border:1px solid var(--line);padding:6px 8px;color:var(--text)}

.kvs{display:grid;grid-template-columns:78px 1fr;padding:1px 10px;font-size:10.5px;color:var(--text-dim)}
.kvs span:last-child{font-family:var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl2{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:10.5px;border-bottom:1px solid #ffffff06;cursor:pointer}
.hl2:hover{background:var(--bg-3)} .hl2 .d{width:6px;height:6px;border-radius:50%;flex:none} .hl2 .r{margin-left:auto;color:var(--text-faint);font-size:9.5px;font-family:var(--mono)}
.launch{height:300px;flex:none;border-top:5px solid var(--line);display:flex;flex-direction:column;background:var(--bg-2);margin-bottom:4px}
.lh{height:25px;flex:none;display:flex;align-items:center;gap:5px;padding:0 5px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px}
.lh input{flex:1;min-width:0;height:18px;background:var(--bg-0);border:1px solid var(--line);padding:0 6px;font-size:10.5px;color:var(--text);outline:none}
.lgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:122px;gap:5px;padding:5px}
.lcell{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;cursor:pointer;position:relative;min-width:0}
.lcell:hover{border-color:var(--text-faint)} .lcell.on{border-color:var(--accent)}
.lcell .pv{flex:1;background:var(--bg-0);margin:4px;position:relative;overflow:hidden}
.lcell .nm{height:19px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10.5px;white-space:nowrap}
.lcell .nm small{margin-left:auto;font-size:9px;color:var(--text-faint)}

/* ---------------- status ---------------- */
.sb{grid-area:sb;margin:0 -6px;border-top:1px solid var(--line);background:var(--bg-1);display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--text-dim);font-size:11px;min-width:0}
.sb .i{width:16px;height:16px;border-radius:50%;background:var(--bg-3);display:grid;place-items:center;font-size:10px;flex:none}
.sb .info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg-0);padding:2px 8px;height:20px}
.sb .info b{color:var(--text);font-weight:500;margin-right:6px}
.scrim{position:absolute;inset:0;background:#0008;z-index:50;display:none;place-items:center} .scrim.on{display:grid}
.dlg{width:460px;background:var(--bg-1);border:1px solid var(--line-strong);box-shadow:0 20px 60px #000a}
.dlg .dh2{height:28px;display:flex;align-items:center;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px}
.dlg .dbody{padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--text-dim)} .dlg .dbody b{color:var(--text);font-weight:500}
.dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:60;background:#1d1f22f0;border:1px solid var(--line-strong);padding:7px 14px;font-size:11.5px;box-shadow:0 10px 30px #0008;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1} .toast b{color:var(--accent);font-weight:500}
.bee-s .wing{transform-box:fill-box;transform-origin:50% 100%}
.bee-s.working .wing{animation:flap .12s infinite alternate} .bee-s.working .bodyg{animation:bob 1.4s ease-in-out infinite} .bee-s.idle .bodyg{animation:breathe 3.2s ease-in-out infinite}
@keyframes flap{to{transform:scaleY(.35)}} @keyframes bob{50%{transform:translateY(-1.5px)}} @keyframes breathe{50%{transform:translateY(.6px)}}
.spinr{transform-box:view-box} @keyframes rot{to{transform:rotate(360deg)}} @keyframes rotr{to{transform:rotate(-360deg)}}
.live-dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, D2R=Math.PI/180;

/* ============================== §DATA ==============================
   Fixture shaped like the native contracts. Nothing here is a new store:
   each record names the owner it stands in for.                       */

/* civil time — Central owns the day (civil-time-policy) */

const ty=h=>TODAY0+h/24/365;                                  // hour of today → year
const CLOCK={nowH:14+37/60};                                  // advances in the loop

   participant composes it; what another World shows you is its Projection.  */

const PLACES={

/* disclosure ladder — local source → public (#110). Projection is the local ↔ shared boundary. */
const LADDER=['local source','addressable','retrieved','rendered','selected for projection','admitted to field','public'];

const A={
  fizz:{n:'Fizz',hex:'#5cc6b4',state:'working',role:'Technē₂ · relation',model:'opus-5.5',doing:'reading CW 13 §IV — Mercurius as the stone',run:'run:214',reads:['src:cw13','src:mdr','stone1950'],at:'mac · env-1'},

  for(let i=0;i<14;i++){const rr=R*(1.35+i*.07);ctx.beginPath();ctx.ellipse(cx,cy,rr,rr*.28,-.18,0,7);ctx.strokeStyle=`rgba(${200+i*3},${205+i*2},215,${.10+.08*Math.sin(i*1.7)**2})`;ctx.lineWidth=R*.05;ctx.stroke()}ctx.restore()}
/* forward projection for pins */
function proj(la,lo,cx,cy,R,rot,tilt){const f=la*D2R,l=(lo-rot)*D2R,x=Math.cos(f)*Math.sin(l),y=Math.sin(f),z=Math.cos(f)*Math.cos(l),ct=Math.cos(tilt*D2R),st=Math.sin(tilt*D2R);return [cx+R*x,cy-R*(y*ct-z*st),y*st+z*ct]}
function unproj(x,y,cx,cy,R,rot,tilt){const nx=(x-cx)/R,ny=(y-cy)/R,r2=nx*nx+ny*ny;if(r2>1)return null;const nz=Math.sqrt(1-r2),vy=-ny,ct=Math.cos(tilt*D2R),st=Math.sin(tilt*D2R);const wy=vy*ct+nz*st,wz=-vy*st+nz*ct;

function landAt(key,la,lo){const T=TEX[key]||buildTex(key);const i=Math.min(T.W-1,((lo+180)/360*T.W)|0),j=Math.min(T.H-1,((90-la)/180*T.H)|0);return T.land[j*T.W+i]}
function snapLocs(){for(const l of LOCS){if(landAt('central',l.la,l.lo))continue;let best=null;for(let r=2;r<30&&!best;r+=2)for(let a=0;a<360;a+=30){const la=clamp(l.la+r*Math.sin(a*D2R),-70,70),lo=l.lo+r*Math.cos(a*D2R);if(landAt('central',la,lo)){best=[la,lo];break}}if(best){l.la=best[0];l.lo=best[1]}}}
const SYL=['ar','ven','tis','ol','mer','cu','ra','el','sol','tor','an','is','lu','men','dra','ka','vel','ri','on','sa','the','mo','ny','ast','ce','ion'];
function nameSuggest(seed,i){const p=k=>SYL[(h3(seed,i,k,9)*SYL.length)|0];const w=p(1)+p(2)+(h3(seed,i,3,9)>.5?p(3):'');const kinds=['Reach','Sound','Isles','Shore','Fell','Straits','Bay','Heights'];return w[0].toUpperCase()+w.slice(1)+' '+kinds[(h3(seed,i,4,9)*kinds.length)|0]}

/* ---------- camera ---------- */
function camT(t){if(!t.cam){const l=LOCS.find(x=>x.id===S.selLoc)||LOCS[1];t.cam={rot:l.lo,tilt:l.la*.6};t.tgt={...t.cam}}return t.cam}
function aimAt(t,la,lo){camT(t);t.tgt.rot=lo;t.tgt.tilt=t.scale==='region'?clamp(la-38,-80,60):clamp(la,-60,60)*.7}

/* ---------- the system: bodies around the field's star ---------- */
function sysPos(key,W,H,time){const m=Math.min(W*1.0,H*2.1),sx=W*.5,sy=H*.5;
  const at=(r,a)=>[sx+Math.cos(a*D2R)*r*m,sy+Math.sin(a*D2R)*r*m*.40];
  if(key==='star')return[sx,sy];
  if(key==='circle'||key==='ariadne'||key==='satya'){const c=at(CIRCLE.at[0],CIRCLE.at[1]+time*.6);if(key==='circle')return c;const b=PLANETS[key],a=b.orbit[1]+time*4;return[c[0]+Math.cos(a*D2R)*m*.075,c[1]+Math.sin(a*D2R)*m*.032]}
  if(key==='earth'){const c=sysPos('central',W,H,time);return[c[0]+m*.075,c[1]-m*.045]}
  if(['oi','arch','qlmef'].includes(key)){const c=sysPos('central',W,H,time),i=['oi','arch','qlmef'].indexOf(key),a=time*9+i*120;return[c[0]+Math.cos(a*D2R)*m*.055,c[1]+Math.sin(a*D2R)*m*.022]}
  if(key==='commons')return[W*.10,H*.16];
  const b=PLANETS[key];return at(b.orbit[0],b.orbit[1]+time*(key==='kestrel'?.4:.8))}
const bodyR=(key,m)=>m*.042*PLANETS[key].r;
function sysShown(key){const ap=S.ap;if(key==='central'||key==='earth')return true;if(['oi','arch','qlmef'].includes(key))return ap>=1;if(key==='commons')return ap>=3;return ap>=2}
function drawSystem(t,ctx,W,H,time){const m=Math.min(W,H);const [sx,sy]=sysPos('star',W,H,time);
  /* stars, dust */
  for(let i=0;i<260;i++){const x=h3(i,1,2,5)*W,y=h3(i,3,4,5)*H,s=h3(i,5,6,5);ctx.fillStyle=`rgba(255,255,255,${.12+s*.5})`;ctx.fillRect(x,y,s>.92?1.6:.8,s>.92?1.6:.8)}
  const band=ctx.createLinearGradient(0,H*.2,W,H*.8);band.addColorStop(0,'rgba(120,130,170,0)');band.addColorStop(.5,'rgba(120,130,170,.05)');band.addColorStop(1,'rgba(120,130,170,0)');ctx.fillStyle=band;ctx.fillRect(0,0,W,H);

  const mm=Math.min(W*1.0,H*2.1);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;
  for(const r of [.24,.42])if(r===.24||S.ap>=2){ctx.beginPath();ctx.ellipse(sx,sy,r*mm,r*mm*.40,0,0,7);ctx.stroke()}
  if(S.ap>=2){const c=sysPos('circle',W,H,time);ctx.beginPath();ctx.ellipse(sx,sy,CIRCLE.at[0]*mm,CIRCLE.at[0]*mm*.40,0,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(209,164,108,.22)';ctx.setLineDash([2,4]);ctx.beginPath();ctx.ellipse(c[0],c[1],mm*.075,mm*.032,0,0,7);ctx.stroke();ctx.setLineDash([]);
    const hg=ctx.createRadialGradient(c[0],c[1],0,c[0],c[1],mm*.12);hg.addColorStop(0,'rgba(209,164,108,.07)');hg.addColorStop(1,'rgba(209,164,108,0)');ctx.fillStyle=hg;ctx.beginPath();ctx.arc(c[0],c[1],mm*.12,0,7);ctx.fill()}
  /* star — the field */
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,m*.16);sg.addColorStop(0,'rgba(255,244,214,1)');sg.addColorStop(.06,'rgba(255,226,170,.95)');sg.addColorStop(.18,'rgba(255,190,110,.35)');sg.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,m*.16,0,7);ctx.fill();ctx.fillStyle='#fff8e8';ctx.beginPath();ctx.arc(sx,sy,m*.016+Math.sin(time*2)*.6,0,7);ctx.fill();
  /* relations between bodies */
  for(const L of LINKS){if(S.ap<L.ap)continue;if(L.t==='contribution'&&S.admitted.has('contrib:vessel'))continue;
    const A1=sysPos(L.a,W,H,time),B1=sysPos(L.b,W,H,time);drawLink(ctx,A1,B1,L,time,[sx,sy])}
  if(S.contact&&S.ap>=2)drawLink(ctx,sysPos('central',W,H,time),sysPos('ariadne',W,H,time),{col:'#d1a46c',t:'a2a',flow:1},time,[sx,sy],.35);
  /* bodies, back to front */
  const keys=Object.keys(PLANETS).filter(sysShown).sort((a,b)=>sysPos(a,W,H,time)[1]-sysPos(b,W,H,time)[1]);
  for(const k of keys){const [x,y]=sysPos(k,W,H,time);const R=bodyR(k,m);let lx=sx-x,ly=-(sy-y)*-1;const dx=sx-x,dy=sy-y,dd=Math.hypot(dx,dy)||1;const L=[dx/dd*.92,-dy/dd*.92,.38];const ln=Math.hypot(...L);L[0]/=ln;L[1]/=ln;L[2]/=ln;
    if(PLANETS[k].rings)ringHalf(ctx,x,y,R,false);
    drawSphere(ctx,k,x,y,R,time*12*(k==='earth'?1.5:1)+(PLANETS[k].seed||0),PLANETS[k].tilt,L,{vw:W,vh:H});
    if(PLANETS[k].rings)ringHalf(ctx,x,y,R,true);
    if((S.viewAs!=='me'&&k==='central')){ctx.fillStyle='rgba(30,34,40,.55)';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill()}
    if(t.selBody===k||(S.spine.world===k&&k!=='central')){ctx.strokeStyle='rgba(255,190,0,.85)';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,R+5,0,7);ctx.stroke()}}
  if(S.ap>=3){const [cx2,cy2]=sysPos('commons',W,H,time);const g=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,22);g.addColorStop(0,'rgba(200,210,255,.9)');g.addColorStop(1,'rgba(160,170,230,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx2,cy2,22,0,7);ctx.fill();
    for(let i=0;i<5;i++){const a=i/5*6.28+time*.2;ctx.fillStyle='#9aa6d8';ctx.beginPath();ctx.arc(cx2+Math.cos(a)*30,cy2+Math.sin(a)*12,2.4,0,7);ctx.fill()}}}
function drawLink(ctx,A1,B1,L,time,star,bend0=.18){const bend=L.bend??bend0;const mx=(A1[0]+B1[0])/2,my=(A1[1]+B1[1])/2;const ox=mx-star[0],oy=my-star[1],ol=Math.hypot(ox,oy)||1;const len=Math.hypot(B1[0]-A1[0],B1[1]-A1[1]);
  const cx=mx+ox/ol*len*bend,cy=my+oy/ol*len*bend;ctx.save();ctx.strokeStyle=L.col;ctx.globalAlpha=L.t==='anchor'?.8:.55;ctx.lineWidth=L.t==='anchor'?1.6:1.2;if(L.dash)ctx.setLineDash([4,5]);
  ctx.shadowColor=L.col;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(A1[0],A1[1]);ctx.quadraticCurveTo(cx,cy,B1[0],B1[1]);ctx.stroke();ctx.restore();
  {const u=L.u??.5;L._mid=[(1-u)*(1-u)*A1[0]+2*(1-u)*u*cx+u*u*B1[0],(1-u)*(1-u)*A1[1]+2*(1-u)*u*cy+u*u*B1[1]]}
  if(L.flow&&S.pulse)for(let i=0;i<4;i++){const u=(time*.16+i/4)%1,x=(1-u)*(1-u)*A1[0]+2*(1-u)*u*cx+u*u*B1[0],y=(1-u)*(1-u)*A1[1]+2*(1-u)*u*cy+u*u*B1[1];ctx.fillStyle=L.col;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}}

/* ---------- one body, close: body (whole) and region (a coast) ---------- */
function bodyGeo(t,W,H){const m=Math.min(W,H);return t.scale==='region'?{cx:W*.5,cy:H*.5+m*.78,R:m*1.18,q:2}:{cx:W*.44,cy:H*.52,R:m*.36,q:1}}
function drawBody(t,ctx,W,H,time){const key=t.body||'central',b=PLANETS[key];const m=Math.min(W,H);
  for(let i=0;i<200;i++){const x=h3(i,1,2,5)*W,y=h3(i,3,4,5)*H,s=h3(i,5,6,5);ctx.fillStyle=`rgba(255,255,255,${.1+s*.4})`;ctx.fillRect(x,y,.9,.9)}
  const c=camT(t);const a=.16;c.rot+=(((t.tgt.rot-c.rot+540)%360)-180)*a;c.tilt+=(t.tgt.tilt-c.tilt)*a;
  const moving=Math.abs(((t.tgt.rot-c.rot+540)%360)-180)>.05||Math.abs(t.tgt.tilt-c.tilt)>.05;
  const {cx,cy,R,q}=bodyGeo(t,W,H);const L=[-.62,.42,.66];
  /* companion: Earth beside your body, your body beside Earth — the anchor relation */
  const compKey=key==='central'?'earth':key==='earth'?'central':null;const comp=compKey&&t.scale==='body'?[W*.86,H*.2,m*.075]:null;
  if(comp){drawSphere(ctx,compKey,comp[0],comp[1],comp[2],time*8,PLANETS[compKey].tilt,L,{vw:W,vh:H});
    ctx.save();ctx.strokeStyle='#e07a6f';ctx.globalAlpha=.75;ctx.lineWidth=1.5;ctx.shadowColor='#e07a6f';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(cx+R*.72,cy-R*.62);ctx.quadraticCurveTo(W*.78,H*.12,comp[0]-comp[2]*.9,comp[1]+comp[2]*.4);ctx.stroke();ctx.restore()}
  if(b.rings)ringHalf(ctx,cx,cy,R,false);
  drawSphere(ctx,key,cx,cy,R,c.rot,c.tilt,L,{vw:W,vh:H,q:moving&&q===1?2:q});
  if(b.rings)ringHalf(ctx,cx,cy,R,true);
  if(key==='central'&&S.viewAs!=='me'){ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();ctx.fillStyle='rgba(30,34,40,.5)';ctx.fillRect(0,0,W,H);ctx.restore()}
  /* anchor lines: located artefacts on your body → their places on Earth */
  if(comp&&key==='central'&&S.showAnchors!==false)for(const l of LOCS){if(!l.anchor)continue;const [x,y,z]=proj(l.la,l.lo,cx,cy,R,c.rot,c.tilt);if(z<.15)continue;
    ctx.save();ctx.strokeStyle='rgba(224,122,111,.45)';ctx.setLineDash([2,4]);ctx.lineDashOffset=-time*14;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo((x+comp[0])/2,Math.min(y,comp[1])-40,comp[0],comp[1]);ctx.stroke();ctx.restore()}
  if(['oi','arch','qlmef'].length&&key==='central'&&S.ap>=1&&t.scale==='body'){['oi','arch','qlmef'].forEach((k,i)=>{const a=time*6+i*120,x=cx+Math.cos(a*D2R)*R*1.45,y=cy+Math.sin(a*D2R)*R*.42;if(Math.sin(a*D2R)<0&&Math.hypot(x-cx,y-cy)<R)return;drawSphere(ctx,k,x,y,Math.max(6,R*PLANETS[k].r*.3),time*20,0,L,{vw:W,vh:H})})}
  t._geo={cx,cy,R,rot:c.rot,tilt:c.tilt,comp};return moving}

/* ---------- pins (HTML, rebuilt only when the camera moves) ---------- */
function worldPins(t,pb,W,H,time){const ov=pb.querySelector('.mk');if(!ov)return;
  if(t.scale==='system'){const sig=['s',S.ap,S.spine.subject,t.selBody,S.admitted.size,!!S.contact,W,H,Math.floor(time*2)].join('|');if(ov.dataset.sig===sig)return;ov.dataset.sig=sig;
    const m=Math.min(W,H);let h='';for(const k of Object.keys(PLANETS).filter(sysShown)){const [x,y]=sysPos(k,W,H,time),b=PLANETS[k],R=bodyR(k,m),Wd=WORLDS[b.world];
      const sub=k==='central'?'your body · built':k==='earth'?'root anchor · Mūlādhāra':b.kind==='moon'?'project world':Wd.presence==='live'?'live · '+Wd.activity:Wd.activity;
      h+=`<div class="pin body ${t.selBody===k?'sel':''}" style="left:${x}px;top:${y+R+(b.rings?R*.4:6)}px" data-body="${k}" data-i="${b.n}|${k==='earth'?'Earth is your local anchor — the root (Mūlādhāra) relation. Real geography lives here; your own body is built.':k==='central'?'Your built body. Double-click to land on it; build it in M4′.':b.kind==='moon'?'A project World your World contains.':'Their built body — you see only what they project. Double-click to land.'}">${b.kind==='moon'?'<span style="display:block;width:14px;height:14px;margin-top:-18px"></span>':`<span class="lab">${b.n}<small>${sub}</small></span>`}</div>`}
    h+=`<div class="pin" style="left:${W*.5}px;top:${H*.5+Math.min(W,H)*.05}px" data-i="oi:field:public|The shared field’s star: the relation in which bodies become mutually addressable. FieldNow pulses here."><span class="lab" style="background:transparent;color:#ffe2aa;font-size:9.5px">oi:field:public</span></div>`;
    for(const L of LINKS){if(S.ap<L.ap||!L._mid||L.t==='anchor')continue;if(L.t==='contribution'&&S.admitted.has('contrib:vessel'))continue;h+=`<span class="rel-l" style="left:${L._mid[0]}px;top:${L._mid[1]}px;border-color:${L.col}55" data-i="${L.t}|${L.n}">${L.n}</span>`}
    if(S.ap>=2){const c=sysPos('circle',W,H,time);h+=`<span class="rel-l" style="left:${c[0]}px;top:${c[1]-Math.min(W,H)*.075}px;color:#d1a46c" data-i="jung-circle · nested field|A field contained in the public field. Ariadne and Satya orbit a shared centre; you participate.">jung-circle · nested</span>`}
    if(S.ap>=3)h+=`<div class="pin body" style="left:${W*.10}px;top:${H*.16+28}px" data-i="Alchemy commons|A federated field at one remove: another star."><span class="lab">alchemy-commons<small>federated · 5 worlds</small></span></div>`;
    if(S.ap<2)h+=`<div class="fogmsg">Aperture <b>${APERTURE[S.ap].k}</b> — other Worlds are outside it.</div>`;
    ov.innerHTML=h;return}
  const g=t._geo;if(!g)return;const key=t.body||'central';
  const sig=['b',key,t.scale,g.rot.toFixed(1),g.tilt.toFixed(1),S.spine.subject,S.selLoc,S.viewAs,LOCS.length,W,H,S.placing].join('|');if(ov.dataset.sig===sig)return;ov.dataset.sig=sig;let h='';
  if(key==='central'){for(const l of LOCS){const [x,y,z]=proj(l.la,l.lo,g.cx,g.cy,g.R,g.rot,g.tilt);if(z<.08||x<0||x>W||y<0||y>H)continue;const vis=S.viewAs==='me'||projOf(E[l.id])>=5;if(!vis)continue;
    const sel=S.selLoc===l.id,ic=l.kind==='palace'?'⌂':l.kind==='portal'?'⇄':l.kind==='route'?'⤳':'◎';const holds=l.holds.map(id=>E[id]?.n).filter(Boolean);
    h+=`<div class="pin ar ${sel?'sel':''}" style="left:${x}px;top:${y}px" data-enc="${l.id}" data-i="${l.n}|${l.kind} on Central${l.anchor?' · anchored to '+PLACES[l.anchor].n+', Earth':''}${l.portal?' · portal to '+WORLDS[l.portal].n:''} · holds ${holds.join(', ')}"><span class="g" style="color:${l.kind==='palace'?'var(--tower)':l.kind==='portal'?'var(--w-ariadne)':'#f2e6c8'};font-size:13px;text-shadow:0 0 4px #000">${ic}</span><span class="lab">${l.n}${t.scale==='region'||sel?`<small>${holds.slice(0,2).join(' · ')}</small>`:''}</span></div>`}
    if(g.comp)h+=`<div class="pin body" style="left:${g.comp[0]}px;top:${g.comp[1]+g.comp[2]+4}px" data-body="earth" data-i="Earth · root anchor|Your located artefacts anchor to real places here. Double-click to land on Earth."><span class="lab">Earth<small>root anchor</small></span></div>`}
  else if(key==='earth'){const pts=[];const done=new Set();for(const id in E){const e=E[id];if(!e.place||e.kind==='place'||!ownE(e)||done.has(e.place))continue;done.add(e.place);const pl=PLACES[e.place];const [x,y,z]=proj(pl.la,pl.lo,g.cx,g.cy,g.R,g.rot,g.tilt);if(z<.08)continue;
      const n=Object.values(E).filter(x2=>x2.place===e.place&&ownE(x2)&&x2.kind!=='place').length;pts.push({e,pl,x,y,n,sel:placeOf(subj())===pl})}
    pts.sort((a,b)=>(b.sel-a.sel)||(b.n-a.n));const kept=[];for(const q of pts){const near=kept.find(o=>Math.hypot(o.x-q.x,o.y-q.y)<30);if(near){near.more=(near.more||0)+1;near.names=(near.names||[]).concat(q.pl.n);continue}kept.push(q)}
    for(const q of kept)h+=`<div class="pin ar ${q.sel?'sel':''}" style="left:${q.x}px;top:${q.y}px" data-enc="${q.e.id}" data-i="${q.pl.n}${q.more?' + '+q.names.join(', '):''}|${q.n} occurrence${q.n>1?'s':''} · ${q.pl.frame} · precision ${q.pl.pr}${q.more?' — zoom to Region to separate':''}"><span class="g" style="color:var(--accent);font-size:11px;text-shadow:0 0 4px #000">●</span><span class="lab">${q.pl.n}${q.more?`<small>+ ${q.names.join(' · ')}</small>`:''}</span></div>`;
    if(g.comp)h+=`<div class="pin body" style="left:${g.comp[0]}px;top:${g.comp[1]+g.comp[2]+4}px" data-body="central" data-i="Central · your body|"><span class="lab">Central<small>your body</small></span></div>`}
  else{for(const ol of OTHERLOCS[key]||[]){const [x,y,z]=proj(ol.la,ol.lo,g.cx,g.cy,g.R,g.rot,g.tilt);if(z<.08)continue;h+=`<div class="pin ar" style="left:${x}px;top:${y}px" data-enc="${ol.holds[0]}" data-i="${ol.n}|${WORLDS[key].n}’s location · projected"><span class="g" style="color:${WORLDS[key].hex};font-size:13px;text-shadow:0 0 4px #000">◎</span><span class="lab">${ol.n}<small>${ol.holds.map(id=>E[id]?.n).join(' · ')}</small></span></div>`}
    h+=`<div class="fogmsg"><b>${WORLDS[key].n}’s body</b> — read-only: you see what ${WORLDS[key].n} has projected.</div>`}
  if(key==='central'&&S.viewAs!=='me')h+=`<div class="fogmsg">Your body as the <b>${S.viewAs}</b> sees it — only projected locations remain.</div>`;
  ov.innerHTML=h}
</script>
<script>
/* ---------- Timeline ---------- */
const AN=[[-600,0],[0,6],[1000,11],[1500,16],[1600,21],[1875,27],[1900,33],[1913,37],[1925,42],[1933,46],[1944,50],[1950,53],[1961,56],[2000,58.5],[2026.6,60]];
function tx(y,lens){const conc=lens==='concurrency';const dEnd=conc?14:60,tS=conc?16:62;
  if(y>=TODAY0){const h=(y-TODAY0)*365*24;return tS+(clamp(h,7,22)-7)/15*(99-tS)}
  let v=AN[AN.length-1][1];for(let k=1;k<AN.length;k++){if(y<=AN[k][0]){const[y0,p0]=AN[k-1],[y1,p1]=AN[k];v=p0+(y-y0)/(y1-y0)*(p1-p0);break}}

function drawForm(p,svg,lw,P2,focus,moving){const t=performance.now()/1000;let h='<defs>'+lw.nodes.map(n=>{const c=hueOf(E[n.id]);return `<radialGradient id="fg-${n.id.replace(/[^a-z0-9]/gi,'')}"><stop offset="0" stop-color="${c}" stop-opacity=".9"/><stop offset=".35" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient>`}).join('')+'</defs>';

  for(const e of lw.edges){const a=P2(e.a),b=P2(e.b);if(!a||!b)continue;const mx=(a[0]+b[0])/2+(a[1]-b[1])*.18,my=(a[1]+b[1])/2+(b[0]-a[0])*.18;const col=hueOf(E[e.b]);
    h+=`<path d="M${a[0]} ${a[1]}Q${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="${col}" stroke-opacity="${e.st==='fact'?.35:.18}" stroke-width="${e.a===focus||e.b===focus?1.6:.8}" stroke-dasharray="${e.st==='fact'?'':'2 4'}"/>`}
  for(const n of lw.nodes){const e=E[n.id];const [x,y]=P2(n.id);const r=n.d===0?46:n.d===1?22:13;const pulse=1+.06*Math.sin(t*1.4+x*.01);

const ARTS=[

const NOTES=[{id:'n1',x:.80,y:.40,t:'Is the stone the vessel? — ask Parasakti before promoting.'}];

const CV_EDGES=[['stone1950','mercurius','INSTANTIATES','fact'],['stone1950','src:mdr','SOURCED_FROM','fact'],['expr:field','mercurius','EXPRESSES','inferred'],['src:cw13','mercurius','DESCRIBES','fact'],['vessel','stone1950','ECHOES','proposal']];
function cvPos(a,W,H){const q=S.canvasPos[a.id];return q?q:[a.x*W,a.y*H]}
function canvasBody(p,i){return `<div class="cv" data-cvp="${i}"><svg class="e"></svg>
  <div class="arts"></div></div>`}
function cvEdges(pb){const cv=pb.querySelector('.cv');if(!cv)return;const W=cv.clientWidth,H=cv.clientHeight;const arts=cv.querySelector('.arts');
  let html='';const box={};
  for(const a of ARTS){if(!admitted(E[a.id]))continue;const [x,y]=cvPos(a,W,H);const e=E[a.id];const sel=S.spine.subject===a.id;
    html+=`<div class="art ${sel?'sel':''}" data-art="${a.id}" style="left:${x}px;top:${y}px;width:${a.w}px;${a.shared?'border:1px dashed var(--w-ariadne)':''}" data-i="${e.n}|${KIND[e.kind].l} · opens at ${e.rev}. Drag to arrange (presentation); double-click to encounter."><div class="ah">${kg(e.kind,hueOf(e))}<span>${KIND[e.kind].l}</span><span style="margin-left:auto">${e.rev}</span></div><div class="ab">${a.body()}</div></div>`}

  arts.innerHTML=html;

  let fr='';for(const f of FRAMES){const bs=f.m.map(id=>box[id]).filter(Boolean);if(!bs.length)continue;const x0=Math.min(...bs.map(b=>b[0]))-12,y0=Math.min(...bs.map(b=>b[1]))-12,x1=Math.max(...bs.map(b=>b[0]+b[2]))+12,y1=Math.max(...bs.map(b=>b[1]+b[3]))+12;
    fr+=`<div class="frm" style="left:${x0}px;top:${y0}px;width:${x1-x0}px;height:${y1-y0}px"><span>${f.n}</span></div>`}

  const c=id=>{const b=box[id];return b?[b[0]+b[2]/2,b[1]+b[3]/2]:null};let s='';let promo='';
  for(const [a,b,t,st0] of CV_EDGES){const A1=c(a),B1=c(b);if(!A1||!B1)continue;const promoted=S.promoted.has(a+'>'+b);const st=st0==='proposal'&&promoted?'claim':st0;
    const dash=st==='fact'?'':st==='proposal'?'7 5':st==='claim'?'6 3':'2 4';const col=st==='proposal'?'#ffbe00':st==='claim'?'#c79ae0':'#d4d7da';
    s+=`<line x1="${A1[0]}" y1="${A1[1]}" x2="${B1[0]}" y2="${B1[1]}" stroke="${col}" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="${dash}"/>`;

    else s+=`<text x="${mx}" y="${my-4}" text-anchor="middle" font-size="9" fill="${col}" style="paint-order:stroke;stroke:#2c2f34;stroke-width:3px">${t}${st!=='fact'?' · '+st:''}</text>`}
  cv.querySelector('svg.e').innerHTML=s;arts.insertAdjacentHTML('beforeend',promo)}


/* ---------- M5′ palace interior ---------- */
function palaceSVG(p,W,H){const room=S.room||'stone';let s=`<svg viewBox="0 0 ${W} ${H}">`;
  const X=v=>v*W,Y=v=>v*H;
  s+=`<rect x="0" y="${H*.86}" width="${W}" height="${H*.14}" fill="#2b4252"/><text x="${W-14}" y="${H*.95}" text-anchor="end" font-size="11" fill="#7ea4bd" opacity=".7">Obersee</text>`;
  s+=`<path d="M${X(.05)} ${Y(.86)}L${X(.95)} ${Y(.86)}" stroke="#4f6a7a" stroke-width="2"/>`;
  /* guided path */
  const cen=r=>r.shape==='circle'?[X(r.x)+r.r*Math.min(W,H)*.72,Y(r.y)+r.r*Math.min(W,H)*.72]:[X(r.x+r.w)-14,Y(r.y+r.h)-14];
  const pathPts=PATH.map(id=>cen(ROOMS.find(r=>r.id===id)));
  s+=`<path d="${pathPts.map((q,i)=>(i?'L':'M')+q[0]+' '+q[1]).join('')}" stroke="var(--tower)" stroke-width="1.5" stroke-dasharray="3 5" fill="none" opacity=".7"/>`;
  for(const r of ROOMS){const on=r.id===room;const fog=r.priv&&S.viewAs!=='me';const col=r.priv?'#9aa0a8':'#d8c89a';
    s+=`<g class="room" data-room="${r.id}" data-i="${r.n}|${r.why}">`;
    if(r.shape==='circle')s+=`<circle cx="${X(r.x)}" cy="${Y(r.y)}" r="${r.r*Math.min(W,H)}" fill="${col}" fill-opacity="${on?.22:.10}" stroke="${on?'var(--accent)':col}" stroke-width="${on?2:1.2}"/>`;
    else s+=`<rect x="${X(r.x)}" y="${Y(r.y)}" width="${X(r.w)}" height="${Y(r.h)}" fill="${col}" fill-opacity="${on?.22:.10}" stroke="${on?'var(--accent)':col}" stroke-width="${on?2:1.2}"/>`;
    const [lx,ly]=r.shape==='circle'?[X(r.x),Y(r.y)-r.r*Math.min(W,H)-8]:[X(r.x)+6,Y(r.y)-7];
    s+=`<text x="${lx}" y="${ly}" text-anchor="${r.shape==='circle'?'middle':'start'}" font-size="12" fill="${on?'#ffbe00':'#cfc6a8'}">${r.n}${r.priv?'  · private':''}</text></g>`;
    if(fog){s+=`<rect x="${X(r.x)}" y="${Y(r.y)}" width="${X(r.w)}" height="${Y(r.h)}" fill="#2a2d32" opacity=".85"/><text x="${X(r.x+r.w/2)}" y="${Y(r.y+r.h/2)}" text-anchor="middle" font-size="11" fill="#71767c">not projected</text>`;continue}
    const [ox,oy]=r.shape==='circle'?[X(r.x)-60,Y(r.y)-12]:[X(r.x)+10,Y(r.y)+12];
    r.objs.forEach((id,i)=>{const e=E[id];if(!e)return;const col2=hueOf(e);const sel=id===S.spine.subject;
      s+=`<g class="pobj" data-enc="${id}" data-inpalace="1" data-i="${e.n}|${KIND[e.kind].l} · opens at revision ${e.rev}${ownE(e)?'':' · shared object from '+WORLDS[e.w].n+' — walk to it, not own it'}"><rect x="${ox}" y="${oy+i*26}" width="${Math.min(170,X(r.w||r.r*1.6)-20)}" height="21" fill="#1d1f22" fill-opacity=".85" stroke="${sel?'#ffbe00':ownE(e)?'#4a4e54':col2}" ${ownE(e)?'':'stroke-dasharray="3 2"'}/>
        <text x="${ox+8}" y="${oy+i*26+14.5}" font-size="10.5" fill="${col2}">${KIND[e.kind].g}</text><text x="${ox+22}" y="${oy+i*26+14.5}" font-size="10.5" fill="#d4d7da">${e.n.length>24?e.n.slice(0,23)+'…':e.n}</text></g>`})}
  pathPts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="8" fill="#1d1f22" stroke="var(--tower)"/><text x="${q[0]}" y="${q[1]+3.5}" text-anchor="middle" font-size="9.5" fill="#d8c89a">${i+1}</text>`});
  /* portals */
  const ct=ROOMS.find(r=>r.id==='court');[['Ravenna','pl:ravenna',ct.x+.005,ct.y+ct.h+.035],['Ariadne’s vessel','vessel',ct.x+.09,ct.y+ct.h+.035]].forEach(([n,id,x,y])=>{
    s+=`<g class="pobj" data-enc="${id}" data-i="Portal · ${n}|A portal is an authored link out of the palace; walking through it is an encounter like any other."><path d="M${X(x)} ${Y(y)+16}v-10a7 7 0 0 1 14 0v10" fill="none" stroke="${id==='vessel'?'var(--w-ariadne)':'#d8c89a'}" stroke-width="1.5"/><text x="${X(x)+20}" y="${Y(y)+12}" font-size="10.5" fill="${id==='vessel'?'#c79ae0':'#cfc6a8'}">→ ${n}</text></g>`});
  return s+'</svg>'}

  if(v==='terminal')return `<div class="thread"><div style="padding:14px 18px;font:11px/1.6 var(--mono);color:var(--text-dim)"><span style="color:var(--fizz)">fizz@env-1 $</span> aikit knowledge search "Mercurius stone"<br>4 subjects · 11 locators<br><span style="color:var(--fizz)">fizz@env-1 $</span> oi explore localWhole stone1950 --depth 2<br><span style="color:var(--green)">17 nodes · 2 shared · budget 24</span><br><span style="color:var(--fizz)">fizz@env-1 $</span> correlate --run 214 --attempt 2<br>reading CW13 §IV <span style="animation:blink 1s infinite">▍</span></div></div>`;

/* ============================== documents · Day · Flow · Beings · Things ============================== */
const SANS="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif";
function selTool(){return `<span class="seltool" style="left:50%;top:0" data-i="Selection|The highlight-context system: Highlight · Note · To packet · Answer this. The packet is exactly what an agent receives — nothing else is loaded.">${['Highlight','Note','To packet','Answer this'].map(x=>`<span data-sel="${x}">${x}</span>`).join('')}</span>`}
function docView(t,i){const D=DOCS[t.doc];const sv=D.save==='edited'?'edited since save':'saved';
  if(t.doc==='day'){const fc=t.face??D.face,F=D.faces[fc];const net=[[null,0,null,null],[1,2,3,4],[null,5,null,null]];
    const cells=net.flat().map(n=>n==null?'<span></span>':`<div class="${n===fc?'on':''}" data-face="${i}.${n}" data-i="${n} · ${D.faces[n].n}|${D.faces[n].k} — click to turn the die to this face."><b>${n}</b>${D.faces[n].n}<i class="${n!==2?'f':''}"></i></div>`).join('');
    const body=F.prose?`<p>The stone keeps returning as a place, not an object. Every time I read the chapter on the Tower, the cube at the water’s edge stops being a thing he carved and becomes <mark>a site where the inscription happens</mark>.</p>
      <p style="position:relative">Fizz’s correlation puts four occurrences around it — 1923, 1942, 1950, and Ariadne’s vessel from Prague. <span class="note-a">The vessel echoes rather than causes</span>; that matters for how I place it.</p><div class="sidenote">Note · This is the palace room.</div>
      <div class="flds" style="margin-top:14px"><div class="fl"><div class="lb">Patterns noticed</div><ul><li>place before object</li><li>containers that are also contents</li></ul></div><div class="fl"><div class="lb">Recurring themes</div><ul><li>the stone</li><li>inscription</li></ul></div><div class="fl"><div class="lb">Connections made</div><ul><li>stone ↔ vessel (claim, Ariadne)</li><li>Tower ↔ walk stop 2</li></ul></div><div class="fl"><div class="lb">Mermaid</div><ul style="font:12px var(--mono);color:var(--pmid)"><li>stone --> vessel</li><li>stone --> palace room</li></ul></div></div>`
      :`<div class="flds">${F.f.map(([lb,items,done])=>`<div class="fl"><div class="lb">${lb}</div><ul>${items.map(x=>`<li class="${done?'done':''}">${x}</li>`).join('')}</ul></div>`).join('')}</div>`;

      <div><div class="eyebrow" style="margin-top:0">${fc} · ${F.k}</div><h1 style="font-size:34px">${F.n}</h1>${body}</div></div></div></div>`}
  if(t.doc==='flow'){const view=t.view||D.view;const ent=(who,i2,html,agent,marg)=>`<div class="ent ${agent?'agent':''}"><div class="who">${agent?dotsInitial('Fz'):`<b>F</b>`}${i2}</div><div class="body">${html}${marg?`<span class="marg">${marg}</span>`:''}</div></div>`;

      ${ent('Fz','1',`<p>In the essay Mercurius is the arcane substance, at once the vessel and what it holds. Read against your stone, <span style="position:relative"><mark class="sel">the vessel is the stone’s other face</mark>${S.selText.on?selTool():''}</span>: the cube at the water is carved to carry an inscription, and the inscription names what it carries.</p><p>Ariadne’s projection reads the Rudolfine vessel the same way, from the Rosarium plates. It echoes your stone; it does not cause it.</p>`,1,'Check against Rosarium pl. 10 before admitting.')}

function dotsInitial(s){let d='';for(let k=0;k<26;k++){const a=k/26*6.283,r=11+((k*7)%5);d+=`<circle cx="${18+r*Math.cos(a)}" cy="${16+r*Math.sin(a)*.8}" r="${.8+(k%3)*.35}" fill="var(--pmid)" opacity="${.25+(k%4)*.15}"/>`}

function exView(t,i){const e=subj();const s=e.subj||'mercurius';const col=SUBJ[s]||hueOf(e);const W=1000,H=600,cx=W*.47,cy=H*.48;
  const on=k=>pv('x.'+k)==='on';const sky=S.clock==='occasion'?SKY.occ:SKY.now;let g='';
  if(on('m1')){let d='';for(let k=0;k<=360;k++){const u=k/360*6.283*2,r=150+42*Math.cos(1.5*u);d+=(k?'L':'M')+(cx+r*Math.cos(u)).toFixed(1)+' '+(cy+r*.62*Math.sin(u)).toFixed(1)}
    g+=`<g class="spinr" style="animation:rot 90s linear infinite;transform-origin:${cx}px ${cy}px"><path d="${d}" fill="none" stroke="${col}" stroke-opacity=".3"/><ellipse cx="${cx}" cy="${cy}" rx="190" ry="118" fill="none" stroke="${col}" stroke-opacity=".12"/></g>`}
  if(on('m2')){g+=`<g class="spinr" style="animation:rotr 240s linear infinite;transform-origin:${cx}px ${cy}px"><circle cx="${cx}" cy="${cy}" r="232" fill="none" stroke="#fff" stroke-opacity=".08"/>`;
    BODIES.forEach((b,k)=>{const a=(180-sky[k])*D2R,x=cx+Math.cos(a)*232,y=cy-Math.sin(a)*232;g+=`<line x1="${x}" y1="${y}" x2="${cx}" y2="${cy}" stroke="${b[2]}" stroke-opacity="${k===2?.42:.1}"/><circle cx="${x}" cy="${y}" r="11" fill="#141318" stroke="${b[2]}" stroke-opacity=".7"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-size="13" fill="${b[2]}">${b[0]}</text>`});g+='</g>'}
  if(on('m3')){const a=180-sky[0];g+=`<path d="${arcP(cx,cy,196,90-a-30,90-a+30)}" stroke="#ffbe00" stroke-width="3" fill="none" stroke-opacity=".85"/><path d="${arcP(cx,cy,186,90-a+70,90-a+110)}" stroke="#7ec3e6" stroke-width="2" fill="none" stroke-opacity=".7"/>`}
  let dots='';const n=Math.round(pv('x.density'));const sym=pv('x.sym');for(let k=0;k<n;k++){const a=k/n*6.283,r=64+16*Math.sin(sym*a)+6*Math.cos(3*a);dots+=`<circle cx="${(cx+r*Math.cos(a)).toFixed(1)}" cy="${(cy+r*Math.sin(a)).toFixed(1)}" r="${1+(k%3)*.5}" fill="${col}" fill-opacity="${.3+(k%4)*.15}"/>`}
  g+=`<g class="spinr" style="animation:rot ${Math.round(80-pv('x.speed')*60)}s linear infinite;transform-origin:${cx}px ${cy}px">${dots}</g><circle cx="${cx}" cy="${cy}" r="44" fill="#141318" stroke="${col}" stroke-opacity=".5"/>`;
  g+=s==='self'?`<circle cx="${cx}" cy="${cy}" r="24" fill="none" stroke="${col}" stroke-width="2.4"/><circle cx="${cx}" cy="${cy}" r="4" fill="${col}"/>`:mercGlyph(cx,cy+4,22,col,2.6);
  if(on('m4')){const x=W*.9;CHAKRA.forEach((c,k)=>{const y=H*.1+k*(H*.74/6),lit=k===0||k===2;g+=`<circle cx="${x}" cy="${y}" r="${lit?12:9}" fill="${c[1]}" fill-opacity="${lit?.55:.2}" stroke="${c[1]}"/><text x="${x-20}" y="${y+4}" text-anchor="end" font-size="10" fill="${lit?'#d4d7da':'#71767c'}">${c[0]}</text>`})}
  const scenes=['the stone','the vessel','the field','the Tower','the walk'];
  return `<div class="ex"><svg class="stage" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>
    <div class="toolrail">${[['↖','Select',1],['✥','Orbit'],['◎','Formation'],['⌖','Bind / follow'],['◉','Capture'],['▤','Library']].map(([gl,n2,o])=>`<button class="${o?'on':''}" ${n2==='Library'?'data-lib="1"':''} data-i="${n2}|The Expressions tool rail — tools act on the field; the Studio below holds their settings.">${gl}</button>`).join('')}</div>
    <div class="toolbelt" style="left:47%;top:calc(48% + 60px)" data-i="Toolbelt|The selected object’s toolbelt: exact input, bind, follow, duplicate.">${['Bind','Follow','Exact…','Duplicate','Open source ↗'].map((x,k)=>`<button class="${k===0?'on':''}">${x}</button>`).join('')}</div>

    ${S.lib?`<div class="lib"><div class="h">Library <span class="faint" style="margin-left:auto">browsing keeps the subject and camera</span></div><div class="grid">${['glyphs','cymatics','particles','images','scenes','formations'].map(x=>`<div>${x}</div>`).join('')}</div></div>`:''}
    <div class="scenes">${scenes.map((x,k)=>`<div class="fcell ${k===0?'on':''}" data-i="Scene ${k+1}|${x} — a scene of this Expression; scenes sequence into a Journey in Technē (M3′)."><div class="pv">${thumb(k)}</div><div class="n">${k+1} · ${x}</div></div>`).join('')}<div class="fcell" style="border-style:dashed;align-items:center;justify-content:center;color:var(--text-faint);font-size:10px" data-i="Capture|Capture the field as a new scene (still or video).">＋ scene</div></div></div>`}
function thumb(k){const c=['#c9a0dc','#d1a46c','#c9a0dc','#d8c89a','#9fc7e8'][k];let d='';for(let j=0;j<40;j++){const a=j/40*6.283,r=17+6*Math.sin((3+k)*a);d+=`<circle cx="${59+r*Math.cos(a)}" cy="${34+r*Math.sin(a)}" r="1.2" fill="${c}"/>`}return `<svg width="116" height="70" viewBox="0 0 118 70" style="position:absolute;inset:0;margin:auto">${d}${k===0?mercGlyph(59,36,8,c,1.5):''}</svg>`}

    const clips=s.grp?Array.from({length:6},(_,k)=>k<3?`<div class="cs" style="background:var(--bg-1);gap:2px;padding:4px 5px">${s.clips.map(c=>`<i style="flex:1;height:100%;background:${c[1]};opacity:.85"></i>`).join('')}</div>`:`<div class="cs"><span class="sg2"></span></div>`).join('')

  return `<div class="sg">${cols}<div style="flex:1;background:var(--bg-2)"></div><div class="trk" style="width:100px;--tc:var(--bg-1)"><div class="thd" style="background:var(--bg-1);color:var(--text-dim)">Main</div>${['plan','correlate','draft','review','return','close'].map((x,k)=>`<div class="cs" style="color:var(--text-dim)">▸ ${k+1} ${x}</div>`).join('')}</div></div>`}

  <div class="m"><span>${bee('fizz',22)}</span><div><div class="w"><b>Fizz</b>14:24</div><div class="t">Marked. Drafting the field now — it will appear in Expressions and in the Stone room as <i>draft</i>.</div></div></div>

  if((el=q('#win'))){S.win=!S.win;return render()}
  if((el=q('#home'))){S.mode='techne';const t=cur(fp());if(t.ap==='lens'){t.lens='M4';t.scale='system';t.body='central'}return render()}

  /* panes, tabs, apertures */
  if((el=q('[data-tabx]'))){const [i,k]=el.dataset.tabx.split('.').map(Number);const p=M().panes[i];p.tabs.splice(k,1);p.ti=Math.min(p.ti,p.tabs.length-1);return render()}

  if((el=q('[data-pinp]'))){const p=M().panes[+el.dataset.pinp];p.pin=p.pin?null:S.spine.subject;return render()}
  if((el=q('[data-lens]'))){const [i,k]=el.dataset.lens.split('.');const t=cur(M().panes[+i]);t.lens=k;if(k==='M4'&&!t.scale)t.scale='system';if(k==='M5')S.room=S.room||'stone';M().focus=+i;return render()}
  if((el=q('[data-scale]'))){const [i,k]=el.dataset.scale.split('.');const t=cur(M().panes[+i]);t.scale=k;if(k!=='system'&&k!=='palace'){const l=LOCS.find(x=>x.id===S.selLoc);if(l&&(t.body||'central')==='central')aimAt(t,l.la,l.lo);else if(t.body==='earth')aimAt(t,PLACES.bollingen.la,PLACES.bollingen.lo)}return render()}

  if((el=q('[data-cnv]'))){const [i,v]=el.dataset.cnv.split('.');cur(M().panes[+i]).cnv=v;return render()}

  if((el=q('[data-expand]'))){S.expand.add(el.dataset.expand);return render()}
  if((el=q('[data-promote]'))){const k=el.dataset.promote;dialog('Promote a relation','Drawn on the Canvas, <b>vessel ECHOES the stone</b> is presentation. Promoting sends a native Action to the relation owner (<b>Wiki · typed relations</b>): type ECHOES · standing <b>claim</b> · basis Rosarium pl. 10. It is never upgraded to fact by promotion.','Send Action',()=>{S.promoted.add(k);toast('Landed as <b>claim</b> · wiki r42')});return}
  if((el=q('[data-admit]'))){dialog('Admit a contribution','<b>Ariadne</b> contributed <b>vessel ECHOES the stone</b> (claim · basis Rosarium pl. 10). Admitting brings it into your World as Ariadne’s claim; nothing of yours is projected back.','Admit as claim',()=>{S.admitted.add('contrib:vessel');toast('Admitted — the contribution link closes in the field')});return}

  if((el=q('[data-project]'))){const s=subj();dialog('Project into a field',`Project <b>${s.n}</b> into <b>${FIELDS[S.spine.field].ref}</b>? Label, place, occasion and basis cross; notes, drafts and private rooms stay yours. This publishes into a shared carrier.`,'Propose projection',()=>{S.projected[s.id]=5});return}

const scaleOf=el=>{const r=el.getBoundingClientRect();return r.width/el.offsetWidth||1};

  const kn=T.closest('[data-knob]');if(kn){const k=kn.dataset.knob,d=PD[k],y0=e.clientY,v0=pv(k);const mv=ev=>{const st=Math.round((y0-ev.clientY)/6);const v=clamp(v0+st*d.step,d.min,d.max);if(Math.abs(v-pv(k))>1e-9)setP(k,+v.toFixed(3))};

/* ============================== loop ============================== */
let lastMin=performance.now();

    if(v==='world'&&t.scale!=='palace'){const cv=pb.querySelector('canvas');if(cv&&pb.clientWidth>60&&pb.clientHeight>60){const W=pb.clientWidth,H=pb.clientHeight,dpr=window.devicePixelRatio||1;if(cv.width!==Math.round(W*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
      if(t._cv!==cv){t._cv=cv;t._still=false}const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);

      worldPins(t,pb,W,H,time)}}
