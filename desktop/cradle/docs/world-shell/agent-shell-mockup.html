<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Shell Mockup</title>
<style>
/* Tokens and frame geometry from packages/live-shell/ui/src/styles.css (env-1 seat,
   45e15ed8b). Revision 4: tileable context dock + 2×2 launcher, thread view in
   the centre, per-thread needles, git device, stepped nesting. */
:root{
  --bg-0:#26292d; --bg-1:#33363b; --bg-2:#3f4348; --bg-3:#4a4e54; --surface:#43464c;
  --line:#24262a; --line-strong:#3d4147;
  --text:#d4d7da; --text-dim:#a2a7ad; --text-faint:#71767c;
  --accent:#ffbe00; --accent-soft:rgba(255,190,0,.13); --sel:#7ec3e6; --rec:#e0523f; --green:#8fd0a8; --stall:#ff9b4a;
  --fizz:#5cc6b4; --honey:#e2a35e; --bumble:#d985a6; --drone:#8fbfb6;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1d20;overflow:hidden}
body{font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
.fit{position:absolute;left:50%;top:50%;transform-origin:center}
svg{display:block}
.frame{--dock-w:300px;width:1920px;height:1200px;display:grid;background:var(--bg-1);padding:0 6px;
  grid-template-columns:400px minmax(0,1fr) var(--dock-w);grid-template-rows:64px minmax(0,1fr) 300px 28px;
  grid-template-areas:"tp tp tp" "br ct dk" "ch ch dk" "sb sb sb"}
.frame.no-browser{grid-template-columns:0 minmax(0,1fr) var(--dock-w)}
.frame.no-dock{grid-template-columns:400px minmax(0,1fr) 0}
.frame.no-browser.no-dock{grid-template-columns:0 minmax(0,1fr) 0}
.frame.no-detail{grid-template-rows:64px minmax(0,1fr) 0 28px}
.mono{font-family:var(--mono)} .dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
@keyframes blink{50%{opacity:.25}}

/* ================= transport ================= */
.tp{grid-area:tp;margin:0 -6px;padding:3px 10px 8px;border-bottom:3px solid var(--line);display:flex;flex-direction:column}
.title{height:18px;text-align:center;font-size:12px;color:var(--text-dim)} .title b{color:var(--text);font-weight:500}
.ctl{flex:1;display:flex;align-items:center;gap:7px}
.g{display:flex;align-items:center;gap:2px;white-space:nowrap}
.nc{height:19px;min-width:17px;padding:1px 4px;background:var(--bg-0);border:1px solid #30343a;line-height:14px;font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:3px}
.nc:hover{color:var(--text)} .nc.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)} .nc.warn{color:var(--stall)}
.fld{height:19px;padding:2px 6px;font-size:10px;background:var(--bg-0);color:var(--text);display:flex;align-items:center;gap:4px;font-family:var(--mono)}
.fld small{font-size:8.5px;color:var(--text-faint)}
.tbtn{width:20px;height:22px;display:grid;place-items:center;color:var(--text-dim)}
.tbtn.play{color:var(--accent)} .tbtn.rec{color:#c9c8ad}
.tbtn.on.play{color:#1d1f22;background:var(--accent)} .tbtn.on.rec{color:var(--rec)}
.sp{flex:1;min-width:4px}
.cpu{width:33px;height:17px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--bg-0) 0,var(--bg-0) 9px,var(--line) 9px,var(--line) 10px);position:relative;overflow:hidden}
.cpu i{position:absolute;left:0;top:0;bottom:0;width:38%;background:repeating-linear-gradient(90deg,#8fd0a8 0,#8fd0a8 9px,transparent 9px,transparent 10px)}
.surf{display:flex;gap:6px;align-items:center;margin-left:6px}
.surf button{color:var(--text-dim);width:22px;height:22px;display:grid;place-items:center} .surf button.on{color:var(--accent)} .surf button.soon{opacity:.45}
.chrome{width:20px;height:20px;display:grid;place-items:center;color:var(--text-dim)} .chrome.on{color:var(--accent)}

/* ================= browser ================= */
.br{grid-area:br;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg-1);border:1px solid var(--line-strong);border-right:4px solid var(--line);border-radius:3px 0 0 3px;overflow:hidden;margin-top:4px}
.bsearch{display:flex;height:25px;flex:none;padding:2px;gap:1px;border-bottom:1px solid var(--line)}
.bsearch span{width:20px;display:grid;place-items:center;color:var(--text-faint)}
.bsearch div{flex:1;background:var(--bg-0);color:var(--text-faint);font-size:11px;padding:2px 6px}
.bcols{display:flex;flex:1;min-height:0}
.bcats{width:112px;flex:none;border-right:1px solid var(--line);padding:0 3px;font-size:11px;overflow:hidden}
.bcats h6{font-weight:400;font-size:10.5px;color:var(--text-faint);padding:6px 3px 2px}
.bcat{display:flex;align-items:center;gap:6px;padding:2px 3px;color:var(--text-dim);cursor:default;border-radius:2px}
.bcat.on{background:var(--bg-3);color:var(--text)} .bcat svg{width:11px;height:11px;flex:none}
.bres{flex:1;min-width:0;background:var(--bg-2);display:flex;flex-direction:column}
.bfilt{height:21px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:2px 5px;color:var(--text-dim);font-size:10px;background:var(--bg-1)}
.bhead{display:flex;justify-content:space-between;height:20px;background:var(--bg-0);padding:2px 5px;font-size:10px;color:var(--text-dim)}
.bitem{height:23px;display:flex;align-items:center;gap:6px;padding:2px 5px;color:var(--text-dim);font-size:11px;cursor:grab;white-space:nowrap}
.bitem:hover{background:var(--bg-3);color:var(--text)}
.bitem .st{margin-left:auto;font-size:10px;color:var(--text-faint)}
.bitem .sdk{font-size:8.5px;border:1px solid var(--line-strong);padding:0 3px;color:var(--sel)}
.pool{height:46%;min-height:85px;display:flex;flex-direction:column;border-top:5px solid var(--line);background:var(--bg-2)}
.poolh{height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px;flex:none}
.poolh .r{margin-left:auto;color:var(--text-faint);font-size:10px}
.poolb{flex:1;overflow:auto;padding:4px 0 8px}
.sec{padding:6px 8px 2px;font-size:10px;color:var(--text-faint);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:6px;padding:2px 8px;font-size:11px;min-height:22px}
.row .k{color:var(--text-dim)}
.seg{display:flex;border:1px solid var(--line);width:max-content;max-width:100%}
.seg button{padding:1px 7px;font-size:10px;color:var(--text-dim);background:var(--bg-1);border-right:1px solid var(--line);height:17px}
.seg button:last-child{border-right:none} .seg button.on{background:var(--accent);color:#1d1f22}
.tgl{display:flex;align-items:center;gap:6px;padding:2px 8px;font-size:11px;min-height:22px;cursor:default}
.tgl .lt{width:9px;height:9px;border-radius:50%;border:1px solid #0007;background:var(--bg-0);flex:none;cursor:pointer}
.tgl .lt.on{background:var(--accent)} .tgl .r{margin-left:auto;font-size:10px;color:var(--text-faint)} .tgl.off{color:var(--text-faint)}
.slider{height:5px;background:var(--bg-0);position:relative;flex:1} .slider i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.fold{display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:10.5px;color:var(--text-faint);cursor:pointer;border-top:1px solid var(--line);margin-top:6px}
.fold .tri{font-size:8px;width:8px} .foldb{display:none} .foldb.open{display:block}
.kv{display:grid;grid-template-columns:78px 1fr;padding:1px 8px;font-size:10.5px;color:var(--text-dim)}
.kv span:last-child{font-family:var(--mono);color:var(--text)}

/* ================= centre ================= */
.ct{grid-area:ct;min-width:0;min-height:0;margin:4px 4px 4px 0;background:var(--bg-2);border:1px solid var(--line-strong);position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none}.view.on{display:flex}
#session{flex-direction:row}
.tracks{display:flex;flex:none}
.trk{flex:none;display:flex;flex-direction:column;border-right:2px solid var(--line);background:var(--bg-2);position:relative}
.trk.muted .thd{filter:saturate(.25) brightness(.8)}
.rails{position:absolute;left:0;top:0;bottom:0;pointer-events:none;z-index:2;display:flex}
.rails i{width:3px;height:100%;margin-right:1px;opacity:.9}
.thd{height:26px;flex:none;display:flex;align-items:center;gap:4px;padding:3px 4px;border-bottom:2px solid var(--line);font-size:10px;color:#21282e;font-weight:500;background:var(--tc);white-space:nowrap;overflow:hidden;cursor:default}
.thd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.trk.d1 .thd,.trk.d2 .thd{font-size:9.5px;font-weight:400}
.trk.grp .thd{background:linear-gradient(var(--tc),var(--tc)) top/100% 21px no-repeat,#2c3034;border-bottom:2px solid var(--tc);padding-bottom:7px}
.trk.sel .thd{box-shadow:inset 0 0 0 1px #ffffffb0}
.thd .gf{font-size:8px;width:10px;cursor:pointer}
.slots{flex:1;min-height:0;background:var(--bg-2)}
.cs{height:26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px;font-size:10px;position:relative;cursor:default}
.cs .sg{width:9px;height:9px;border:1px solid var(--line);flex:none;cursor:pointer}
.cs:hover .sg{border-color:var(--text-faint)}
.cs.clip{background:var(--tc);color:#252a2d}
.cs.clip .tri{width:0;height:0;border-left:7px solid #252a2dbb;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;flex:none;cursor:pointer}
.cs.clip .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.cs.done{opacity:.55}
.cs.run .tri{animation:blink 1s steps(2) infinite} .cs.queued .tri{animation:blink .35s steps(2) infinite}
.cs.stall{background:repeating-linear-gradient(135deg,var(--tc) 0,var(--tc) 7px,#ff9b4a55 7px,#ff9b4a55 9px)}
.cs.stall .tri{border-left-color:var(--stall)}
.cs .pg{position:absolute;left:0;bottom:0;height:2px;background:#252a2dbb}
.cs .op{font-size:9px;opacity:0;padding:0 2px;cursor:pointer} .cs.clip:hover .op{opacity:.9}
.cs.selc{box-shadow:inset 0 0 0 1px var(--accent)}
.cs.recs{background:var(--rec);color:#fff}
.cs.grp{background:var(--bg-1);padding:3px 4px;gap:2px}
.cs.grp i{height:100%;flex:1;background:var(--tc);opacity:.85} .cs.grp i.e{background:transparent} .cs.grp i.s{background:var(--stall)}
.stoprow{height:22px;flex:none;display:flex;align-items:center;gap:3px;padding:0 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stoprow .hs{width:18px;height:16px;display:grid;place-items:center;background:var(--bg-0);border:1px solid var(--line);cursor:pointer}
.stoprow .hs i{width:8px;height:8px;background:var(--text-dim)}
.stoprow .rt{width:18px;height:16px;display:grid;place-items:center;background:var(--bg-0);border:1px solid var(--line);color:var(--text-faint);font-size:11px;cursor:pointer}
.stoprow .rt.lit{background:var(--stall);color:#1d1f22;border-color:var(--stall);animation:blink 1.2s steps(2) infinite}
.stoprow .tc{width:18px;height:10px;background:var(--tc);margin-left:auto}
.strip{height:228px;flex:none;display:flex;flex-direction:column;padding:4px 4px 5px;gap:2px;font-size:10px;color:var(--text-dim)}
.strip .lb{font-size:9.5px;color:var(--text-faint);margin-top:2px}
.dd{height:16px;border:1px solid var(--line);background:var(--bg-1);color:var(--text);display:flex;align-items:center;gap:4px;padding:0 3px;font-size:10px;white-space:nowrap;overflow:hidden}
.dd .t{flex:1;overflow:hidden;text-overflow:ellipsis} .dd::after{content:'▾';font-size:8px;color:var(--text-faint)}
.mon{display:flex;gap:2px}
.mon span{border:1px solid var(--line);background:var(--bg-1);padding:0 3px;height:14px;line-height:12px;font-size:9px;color:var(--text-faint);cursor:pointer}
.mon span.on{background:var(--accent);color:#1d1f22}
.vol{display:flex;gap:5px;flex:1;margin-top:5px;min-height:0}
.mc{width:28px;display:flex;flex-direction:column;align-items:center;gap:3px}
.num{height:20px;width:24px;display:grid;place-items:center;background:var(--accent);color:#292c31;font-weight:500;font-size:11px;cursor:pointer}
.num.off{background:var(--bg-0);color:var(--text-faint)}
.sbtn{width:24px;height:13px;font-size:9px;border:1px solid var(--line);background:var(--bg-1);display:grid;place-items:center;color:var(--text-dim);cursor:pointer}
.sbtn.arm.on{background:var(--rec);color:#fff;border-color:var(--rec)}
.ctxv{width:28px;height:13px;border:1px solid var(--line);background:var(--bg-1);border-radius:8px;font-size:8.5px;text-align:center;color:var(--text-faint);line-height:11px}
.fcol{flex:1;display:flex;gap:3px;height:100%;position:relative}
.rail{width:4px;height:100%;background:#202327;border:1px solid #17191b;position:relative;flex:none}
.rail i{position:absolute;left:0;right:0;bottom:0;background:var(--green)}
.cap{position:absolute;left:-4px;width:12px;height:7px;background:var(--text-dim);border:1px solid #17191b}
.scale{display:flex;flex-direction:column;justify-content:space-between;height:100%;font-size:8px;color:var(--text-faint);line-height:8px}
.main{width:96px;flex:none;border-left:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column}
.main .cs{background:var(--bg-2);color:var(--text-dim)}
.main .cs .tri{width:0;height:0;border-left:7px solid var(--text-faint);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.gapfill{flex:1;background:var(--bg-2)}

/* arrangement */
#arr{flex-direction:column}
.ov{height:14px;flex:none;border-bottom:1px solid var(--line);background:var(--bg-1);position:relative}
.ov i{position:absolute;top:2px;bottom:2px;border:1px solid var(--text-faint);left:62%;width:30%}
.ruler{height:22px;flex:none;display:grid;grid-template-columns:minmax(0,1fr) 230px;border-bottom:1px solid var(--line)}
.ticks{position:relative;font-size:10px;color:var(--text-dim);overflow:hidden}
.ticks span{position:absolute;top:4px;padding-left:3px;border-left:1px solid var(--text-faint);height:14px;line-height:12px}
.rset{display:flex;align-items:center;gap:6px;padding:0 6px;font-size:10px;color:var(--text-faint);border-left:1px solid var(--line)}
.arows{flex:1;overflow:auto;position:relative}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 230px;border-bottom:2px solid var(--line);min-height:30px}
.lane{position:relative;background:var(--bg-2);overflow:hidden}
.lane.sub{background-color:#3a3e43}
.ac{position:absolute;top:3px;bottom:3px;background:var(--tc);border:1px solid #0004;color:#22282c;font-size:10px;padding:1px 4px;overflow:hidden;white-space:nowrap;cursor:default}
.ac small{display:block;font-size:9px;opacity:.7}
.ac.done{opacity:.6}
.ac.run{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),#0007)}
.ac.stall{background:repeating-linear-gradient(135deg,var(--tc) 0,var(--tc) 6px,#00000026 6px,#00000026 9px)}
.ac.selc{box-shadow:0 0 0 1px var(--accent)}
.qd{position:absolute;top:8px;bottom:8px;border:1px dashed var(--tc);color:var(--text-dim);font-size:9.5px;padding:0 5px;white-space:nowrap;display:flex;align-items:center;background:#00000018}
.ev{position:absolute;top:3px;bottom:3px;background:var(--bg-1);border-left:2px solid var(--tc);font-size:9.5px;color:var(--text-dim);padding:0 4px;white-space:nowrap;overflow:hidden;line-height:15px;cursor:pointer;width:112px}
.ev:hover{color:var(--text);background:var(--bg-3);z-index:2}
.needle{position:absolute;top:0;bottom:0;width:2px;background:var(--tc);z-index:3;pointer-events:none;box-shadow:0 0 0 1px #0006}
.needle.stall{background:var(--stall)}
.needle .rd{position:absolute;left:5px;top:2px;font-size:9px;font-family:var(--mono);white-space:nowrap;background:#1d1f22d8;color:var(--text);padding:0 4px;border-left:2px solid var(--tc)}
.needle.stall .rd{border-left-color:var(--stall);color:var(--stall)}
.needle.left .rd{left:auto;right:5px;border-left:none;border-right:2px solid var(--stall)}
.nowline{position:absolute;top:0;bottom:0;width:1px;background:#ffffff28;pointer-events:none;z-index:1}
.ahead{background:var(--bg-1);border-left:1px solid var(--line);display:grid;grid-template-columns:100px 66px 52px;gap:2px;padding:2px;font-size:10px;align-content:start}
.ahead .nmc{background:var(--tc);color:#21282e;height:16px;padding:0 4px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;font-weight:500;cursor:default}
.ahead .lname{grid-column:1/3;color:var(--text-faint);height:16px;line-height:16px}
.ahead .mx{display:flex;gap:2px}
.ahead .mx span{height:16px;min-width:16px;padding:0 3px;font-size:9px;display:grid;place-items:center;background:var(--bg-0);border:1px solid var(--line);cursor:pointer}
.ahead .mx span.n{background:var(--accent);color:#21282e}

/* thread view */
#thread{flex-direction:column;background:var(--bg-1)}
.th-h{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11.5px}
.th-h .back{color:var(--text-dim)} .th-h .back:hover{color:var(--text)}
.th-h .r{margin-left:auto;display:flex;gap:4px}
.th-b{flex:1;display:flex;min-height:0}.th-b .tmain{flex:1}
.tree{padding:3px 0;background:var(--bg-1)}
.sfilt{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line)}
.tnode{display:flex;align-items:center;gap:6px;height:28px;padding-right:8px;font-size:11px;cursor:pointer;white-space:nowrap}
.tnode:hover{background:var(--bg-2)} .tnode.on{background:var(--bg-3)}
.tnode .st{margin-left:auto;font-size:9.5px;color:var(--text-faint)}
.tnode .rails{position:static;height:28px;flex:none}
.tnode .rails i{margin-right:4px}
.tnode.tk{height:21px;font-size:10.5px;color:var(--text-dim)} .tnode.tk.cur{color:var(--accent)}
.tmain{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.msgs{flex:1;overflow:auto;padding:16px 40px 10px;display:flex;flex-direction:column;gap:9px}
.taskdiv{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-faint);margin:6px 0 2px;max-width:900px}
.taskdiv::after{content:'';flex:1;height:1px;background:var(--line-strong)}
.taskdiv b{color:#21282e;background:var(--tc);font-weight:500;padding:1px 6px;font-size:10px}
.m{display:grid;grid-template-columns:24px 1fr;gap:10px;max-width:900px}
.m .w{font-size:10.5px;color:var(--text-dim);margin-bottom:1px} .m .w b{color:var(--text);font-weight:600;margin-right:6px}
.m .t{font-size:13px;line-height:1.5}
.toolrow{margin-left:34px;max-width:866px;border:1px solid var(--line);background:var(--bg-1);font-family:var(--mono);font-size:11px;color:var(--text-dim);cursor:pointer}
.toolrow .h{display:flex;gap:8px;align-items:center;padding:3px 8px}
.toolrow .h .k{color:var(--text);background:var(--bg-0);padding:0 4px;border:1px solid var(--line)}
.toolrow .h .x{margin-left:auto;color:var(--text-faint)}
.toolrow .o{display:none;border-top:1px solid var(--line);padding:5px 8px;white-space:pre;background:var(--bg-0)}
.toolrow.open .o{display:block}
.toolrow .lnk{color:var(--sel)}
.ok{color:var(--green)} .bad{color:#e3806f}
.steer{color:var(--accent);font-size:10.5px;margin-top:3px}
.card{margin-top:6px;border:1px solid var(--line);background:var(--bg-1);max-width:560px}
.card .ch2{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px}
.card .cf{display:flex;gap:6px;padding:7px 10px}
.stallcard{margin-left:34px;max-width:640px;border:1px solid var(--stall);background:#ff9b4a14;padding:8px 10px;font-size:12px}
.stallcard .cf{display:flex;gap:6px;margin-top:6px}
.bt{height:20px;padding:0 9px;font-size:10.5px;background:var(--bg-2);border:1px solid var(--line)}
.bt.pri{background:var(--accent);border-color:var(--accent);color:#1d1f22}
.bt.warn{background:var(--stall);border-color:var(--stall);color:#1d1f22}
.workline{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);padding:0 40px 6px}
.workline i{width:7px;height:7px;border-radius:50%;animation:blink 1.2s infinite}
.composer{margin:0 40px 12px;border:1px solid var(--line-strong);background:var(--bg-1);display:flex;align-items:center;gap:10px;padding:9px 12px;max-width:900px}
.composer .ph{flex:1;color:var(--text-faint);font-size:12.5px}
.composer .k{font-size:10px;color:var(--text-faint);font-family:var(--mono)}
.wave{display:none;gap:2px;align-items:center;height:14px;flex:1}
.wave i{width:3px;height:14px;background:var(--rec);animation:wv .9s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.3)}}
.voice .wave{display:flex} .voice .ph{display:none}

/* ================= detail ================= */
.ch{grid-area:ch;min-width:0;min-height:0;display:flex;gap:4px;padding-bottom:4px;padding-right:4px}
.dpane{flex:1;min-width:0;display:none;border:1px solid var(--line);background:var(--bg-1)} .dpane.on{display:flex}
.chain{flex:1;display:flex;gap:6px;padding:8px;overflow:hidden;align-items:stretch}
.dev{background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.dev.sel{outline:1px solid var(--accent);outline-offset:-1px}
.dh{height:21px;display:flex;align-items:center;gap:5px;padding:0 5px;border-bottom:1px solid var(--line);font-size:11px;cursor:default;white-space:nowrap}
.dh .pw{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none;cursor:pointer} .dh .pw.off{border-color:var(--text-faint)}
.dh .x{margin-left:auto;display:flex;gap:7px;color:var(--text-faint);font-size:10px} .dh .x span{cursor:pointer} .dh .x span:hover{color:var(--text)}
.db{flex:1;display:flex;gap:8px;padding:7px;min-height:0}
.dev.folded{width:24px} .dev.folded .dh{writing-mode:vertical-rl;height:auto;flex:1;border:none;padding:6px 0;justify-content:flex-start;gap:7px;align-items:center;width:22px}
.vis{background:var(--bg-0);border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.knobs{display:grid;grid-template-columns:repeat(2,64px);gap:6px 2px;align-content:start}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:ns-resize;user-select:none}
.knob .kl{font-size:9.5px;color:var(--text-dim);white-space:nowrap} .knob .kv{font-size:9.5px;font-family:var(--mono);color:var(--text)}
.tog{display:flex;flex-direction:column;align-items:center;gap:3px}
.tog .kl{font-size:9.5px;color:var(--text-dim)}
.tog .tg{display:flex;border:1px solid var(--line)}
.tog .tg span{font-size:9.5px;padding:1px 5px;background:var(--bg-0);color:var(--text-faint);cursor:pointer} .tog .tg span.on{background:var(--accent);color:#1d1f22}
.rack{display:flex;gap:0}
.rack .chains{width:150px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding-right:6px}
.chainrow{display:flex;align-items:center;gap:6px;height:22px;padding:0 5px;background:var(--bg-1);border:1px solid var(--line);font-size:10.5px;cursor:default}
.chainrow .lt{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none;cursor:pointer;margin-left:auto}
.chainrow.offc{color:var(--text-faint)} .chainrow.offc .lt{background:var(--bg-0);border:1px solid var(--text-faint)}
.chainrow .md{font-size:9px;color:var(--text-faint);margin-left:auto}
.macros{display:grid;grid-template-columns:repeat(2,62px);gap:6px 2px;padding-left:8px;align-content:start}
.dropz{width:150px;flex:none;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-faint);font-size:11px;padding:10px}
.cprops{width:210px;flex:none;border-right:1px solid var(--line);overflow:auto;font-size:11px}
.cph{height:21px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--tc);color:#21282e;font-weight:500}
.cpsec{border-bottom:1px solid var(--line)}
.cpsec .t{height:21px;display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--text-dim);font-size:10.5px;cursor:pointer;background:var(--bg-2)}
.cpsec .b{padding:5px 6px;display:none;gap:4px;flex-direction:column} .cpsec.open .b{display:flex} .cpsec .b .kv{padding:0}
.log{flex:1;min-width:0;display:flex;flex-direction:column}
.logbar{height:24px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border-bottom:1px solid var(--line);background:var(--bg-2);font-size:10.5px}
.logbar .r{margin-left:auto;color:var(--text-faint)}
.lines{flex:1;overflow:auto;padding:4px 0;font-size:11.5px}
.ln{display:grid;grid-template-columns:62px 18px 1fr;gap:6px;padding:2px 10px;align-items:start;cursor:default}
.ln:hover{background:#ffffff08}
.ln .tm{font-family:var(--mono);font-size:10px;color:var(--text-faint);padding-top:2px}
.ln .tool{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);display:flex;gap:8px;align-items:center}
.ln .tool .k{color:var(--text);background:var(--bg-0);padding:0 4px;border:1px solid var(--line)}
.lines.folded .ln.msg{display:none}

/* ================= context dock: tiles + launcher ================= */
.dk{grid-area:dk;min-height:0;min-width:0;display:flex;flex-direction:column;border-left:4px solid var(--line);margin-top:4px;position:relative;background:var(--bg-1)}
.grip{position:absolute;left:-7px;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:5}
.grip:hover{background:#ffbe0033}
.tilesh{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11px}
.tilesh .r{margin-left:auto;display:flex;gap:3px}
.tiles{flex:1;min-height:0;overflow:auto;padding:5px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:5px;align-content:start}
.tile{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;min-width:0}
.tlh{height:24px;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--bg-2);font-size:11px;border-bottom:1px solid var(--line)}
.tlh .t{flex:1} .tlh .x{color:var(--text-faint);font-size:10px;display:flex;gap:7px} .tlh .x span{cursor:pointer} .tlh .x span:hover{color:var(--text)}
.tlb{position:relative;overflow:hidden}
.launch{height:300px;flex:none;border-top:5px solid var(--line);display:flex;flex-direction:column;background:var(--bg-2);margin-bottom:4px}
.launch.folded{height:30px}
.lh{height:25px;flex:none;display:flex;align-items:center;gap:5px;padding:0 5px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px}
.lh input{flex:1;min-width:0;height:18px;background:var(--bg-0);border:1px solid var(--line);padding:0 6px;font-size:10.5px;color:var(--text);outline:none}
.lh .f{color:var(--text-faint);cursor:pointer;width:16px;text-align:center}
.lgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:126px;gap:5px;padding:5px}
.lcell{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;cursor:pointer;position:relative;min-width:0}
.lcell:hover{border-color:var(--text-faint)} .lcell.on{border-color:var(--accent)}
.lcell .pv{flex:1;background:var(--bg-0);margin:4px;position:relative;overflow:hidden}
.lcell .nm{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10.5px}
.lcell .nm .s{margin-left:auto;font-size:9px;color:var(--sel)}
.lcell .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hive{position:relative;height:200px;background:radial-gradient(ellipse at 50% 60%,#3b4046 0,#30343a 70%);overflow:hidden}
.hive .bee{position:absolute;cursor:pointer;text-align:center;font-size:9.5px;color:var(--text-dim)}
.hive .bee .lab{white-space:nowrap;margin-top:-2px} .hive .bee.sel .lab{color:var(--accent)} .hive .bee.muted{opacity:.35}
.hl{display:flex;align-items:center;gap:6px;padding:2px 6px;font-size:10.5px;cursor:default}
.hl .d{width:6px;height:6px;border-radius:50%;flex:none}
.term{font-family:var(--mono);font-size:10px;line-height:1.5;padding:6px;color:var(--text-dim);background:#1f2124;height:200px;overflow:hidden}
.term .p{color:var(--fizz)} .term .o{color:var(--green)}
.ftree{padding:4px 6px;font-family:var(--mono);font-size:10px;line-height:1.75;color:var(--text-dim)}
.ftree .fm{color:var(--accent)} .ftree .a{color:var(--fizz)}
.web{padding:8px} .web .u{font-family:var(--mono);font-size:9.5px;color:var(--sel);margin-bottom:6px}
.web .pg{background:var(--bg-0);border:1px solid var(--line);padding:8px;color:var(--text-dim);line-height:1.5} .web .pg b{color:var(--text);display:block;margin-bottom:3px}
.web .pg mark{background:var(--accent-soft);color:var(--text)}
.ctxpin{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:9.5px;color:var(--text-faint);border-bottom:1px solid var(--line)}

/* ================= status ================= */
.sb{grid-area:sb;margin:0 -6px;border-top:1px solid var(--line);background:var(--bg-1);display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--text-dim);font-size:11px;min-width:0}
.sb .i{width:16px;height:16px;border-radius:50%;background:var(--bg-3);display:grid;place-items:center;font-size:10px;flex:none}
.sb .info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg-0);padding:2px 8px;height:20px}
.sb .info b{color:var(--text);font-weight:500;margin-right:6px}
.sb .tg{display:flex;gap:2px}
.sb .tg button{padding:1px 8px;color:var(--text-dim);display:flex;gap:4px;align-items:center;height:20px;border:1px solid var(--line)}
.sb .tg button.on{color:var(--accent)}

/* sprites */
.bee-s .wing{transform-box:fill-box;transform-origin:50% 100%}
.bee-s.working .wing{animation:flap .12s infinite alternate}
.bee-s.working .bodyg{animation:bob 1.4s ease-in-out infinite}
.bee-s.idle .bodyg{animation:breathe 3.2s ease-in-out infinite}
@keyframes flap{to{transform:scaleY(.35)}} @keyframes bob{50%{transform:translateY(-1.5px)}} @keyframes breathe{50%{transform:translateY(.6px)}}
.form{transform-box:fill-box;transform-origin:center} .form.spin{animation:spin 14s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="fit" id="fit"><div class="frame" id="frame">

<!-- ================= TRANSPORT — every control has an agent function ================= -->
<header class="tp">
  <div class="title"><b>Flight Path</b> — Release Cut</div>
  <div class="ctl">
    <button class="chrome on" id="tBrowser" data-i="Browser|Show or hide the browser (⌘⌥B).">▥</button>
    <div class="g">
      <button class="nc" data-i="Link|Joins these sessions to agents in other harnesses and on other machines (Mac, Omarchy): one ledger, one clock. 2 peers.">Link</button>
      <button class="nc" id="tap" data-i="Tap · ping|Asks every running agent for a status line now instead of at the next heartbeat. Answers land in the Agents tile.">Tap</button>
      <button class="fld" id="effort" data-i="Effort|Where Live has tempo: how hard the armed session thinks per turn (low → max). Each task can override it."><span id="effV">high</span></button>
      <button class="nc" id="effDn" data-i="Effort −|One step less effort.">‹</button><button class="nc" id="effUp" data-i="Effort +|One step more effort.">›</button>
      <span class="fld" data-i="Budget|Where Live has the time signature: turns used / allowed for the selected session.">2 / 12</span>
      <button class="nc on" id="hb" data-i="Heartbeat|Where Live has the metronome: running agents check in on a cadence. Each check-in moves that thread’s needle in the Arrangement; a needle that stops is a stall.">●◦</button>
      <button class="nc" data-i="Interrupt quantize|Where Live has launch quantization: how fast Stop and Steer land — now · next tool · next turn.">next tool ▾</button>
    </div>
    <div class="g" style="margin-left:14px">
      <button class="nc" id="tokScope" data-i="Tokens|Where Live has key and scale: a token counter. Click to switch what it counts — selected session · group · everything open.">Σ</button>
      <span class="fld" data-i="Tokens in|Tokens read by the counted sessions."><small>in</small><span id="tokIn">142k</span></span>
      <span class="fld" data-i="Tokens out|Tokens written by the counted sessions."><small>out</small><span id="tokOut">38k</span></span>
    </div>
    <div class="sp"></div>
    <div class="g">
      <button class="nc on" id="follow" data-i="Follow|The Arrangement scrolls with the live needles and Context tiles follow what the selected agent touches. Off: nothing moves your view.">➜</button>
      <span class="fld" data-i="Position|Where Live shows bars.beats.sixteenths: task . turn . step of the selected session.">212 . 2 . 7</span>
      <button class="tbtn play on" id="play" data-i="Run|Live’s Play. Launches the selected task, or every queued one. Enter in a composer is the same press."><svg width="15" height="15" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg></button>
      <button class="tbtn" id="stop" data-i="Stop all|Once: every running agent pauses at the next quantize point and keeps context. Twice: turns are cancelled and unlanded writes return to basis. Per-session hard stop sits on each track."><svg width="15" height="15" viewBox="0 0 24 24"><path d="M6 6h12v12H6z" fill="currentColor"/></svg></button>
      <button class="tbtn rec" id="rec" data-i="Voice|Live’s Record. Records speech into a new task clip on the armed track, or into the open thread’s composer."><svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 5.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13z" fill="currentColor"/></svg></button>
      <button class="nc on" id="od" data-i="Steer · overdub|On: what you send while an agent runs steers the running turn. Off: it queues as the next task.">+</button>
      <button class="nc" id="arm" data-i="Write arm|Live’s automation arm. Off: writes arrive as proposals. On: writes inside each world device land directly, with a receipt.">⌘</button>
      <button class="nc warn" data-i="Hand back|Live’s re-enable automation. Lit: you edited something an agent holds (HeroShot physics, Honey). Press to hand it back.">←</button>
      <button class="nc" data-i="Capture|Live’s session record. Records what you do by hand into a new clip on the armed track — a worked example an agent can learn as a skill.">○</button>
    </div>
    <div class="g">
      <span class="fld faint" data-i="Write window · in|Punch-in: no writes before this step (here: until the plan is approved).">plan ✓</span>
      <button class="nc" data-i="Punch in|Turns the write window’s start on or off.">⌁</button>
      <button class="nc" id="loop" data-i="Loop|The selected task repeats until its stop condition or cap — a routine."><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3.5l3.5 3.5-3.5 3.5M20.5 7H8.5a5 5 0 0 0-5 5M7 20.5L3.5 17 7 13.5M3.5 17h12a5 5 0 0 0 5-5"/></svg></button>
      <button class="nc" data-i="Punch out|Writes stop after this step (here: before deploy).">⌁</button>
      <span class="fld faint" data-i="Write window · out|Punch-out step, or the loop cap when Loop is on.">deploy</span>
    </div>
    <div class="sp"></div>
    <div class="g">
      <button class="nc" data-i="Point|Live’s draw mode. Mark the stage or any tile; the armed agent receives the mark as a reference.">✎</button>
      <button class="nc" data-i="Keys|Live’s computer keyboard: number keys launch task rows, letters fire rack macros, Space runs.">▥</button>
      <button class="nc" data-i="Earth view (planned)|The Earth / Solar-System projection of the World. The button holds its place; the projection is still to be built."><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3 3 3 14 0 17M12 3.5c-3 3-3 14 0 17"/></svg></button>
      <button class="nc" data-i="Map|Live’s MIDI map. Bind a key, pad or spoken phrase to any control — ‘Fizz, retry’.">Map</button>
      <span class="fld" data-i="Throughput|Where Live shows sample rate: tokens per second across running agents.">84 t/s</span>
      <span class="fld" data-i="Context|Where Live shows CPU load: the selected session’s context-window fill.">38 %</span>
      <span class="cpu" data-i="Spend|Where Live’s CPU meter sits: session spend against its cap."><i></i></span>
    </div>
    <nav class="surf">
      <button class="on" id="vSession" data-i="Session · Tab|Tracks are sessions, clips are tasks."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4v16M12 4v16M19 4v16"/></svg></button>
      <button id="vArr" data-i="Arrangement · Tab|The run viewer: sessions over time, one live needle per thread."><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg></button>
      <button class="soon" data-i="Expressions|The native Expressions application (outside this mockup)."><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM12 10v4M10 12h4"/></svg></button>
      <button class="soon" data-i="Technē|Knowledge and instruments (outside this mockup)."><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 5h4v4H5zM15 15h4v4h-4zM15 4h5v5h-5zM4 15h5v5H4zM9 7h6M7 9v6M9 17h6M17 9v6"/></svg></button>
      <button class="soon" data-i="Workbench|Native sources and sessions (outside this mockup)."><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></svg></button>
    </nav>
    <button class="chrome on" id="tDetail" data-i="Detail|Show or hide the device/clip detail (⌘⌥L).">▤</button>
    <button class="chrome on" id="tDock" data-i="Context dock|Show or hide the context dock: tiles above, launcher below."><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg></button>
  </div>
</header>

<!-- ================= BROWSER ================= -->
<aside class="br" id="br">
  <div class="bsearch"><span>‹</span><span>›</span><div>Search (⌘F)</div></div>
  <div class="bcols">
    <nav class="bcats" id="bcats"></nav>
    <div class="bres">
      <div class="bfilt"><span>○ Filters</span><span>In set</span></div>
      <div class="bhead"><span>Name</span><span id="bheadR">Seated</span></div>
      <div id="bitems" style="overflow:auto;flex:1"></div>
    </div>
  </div>
  <section class="pool">
    <div class="poolh"><span id="pIcon"></span><b id="pName" style="font-weight:500"></b><span class="r" id="pKind"></span></div>
    <div class="poolb" id="pool"></div>
  </section>
</aside>

<!-- ================= CENTRE ================= -->
<main class="ct">
  <section class="view on" id="session"><div class="tracks" id="tracks"></div><div class="gapfill"></div><div class="main" id="mainCol"></div></section>
  <section class="view" id="arr">
    <div class="ov"><i></i></div>
    <div class="ruler"><div class="ticks" id="ticks"></div><div class="rset" id="arrScope"></div></div>
    <div class="arows" id="arows"></div>
  </section>
  <section class="view" id="thread"></section>
  <section class="view" id="gw" style="flex-direction:column;background:var(--bg-1)"></section>
</main>

<!-- ================= CONTEXT DOCK ================= -->
<aside class="dk" id="dk">
  <div class="grip" id="grip" data-i="Resize|Drag left to give the context more room; tiles reflow into columns."></div>
  <div class="tilesh"><span>Context</span><span class="faint" id="tileCount"></span>
    <span class="r"><button class="nc" id="wider" data-i="Wider|Grow the dock leftwards for richer compositions; Session/Arrangement give up width.">⇤</button><button class="nc" id="narrower" data-i="Narrower|Shrink the dock back.">⇥</button></span></div>
  <div class="tiles" id="tiles"></div>
  <section class="launch" id="launch">
    <div class="lh"><span class="f" id="lfold" data-i="Fold|Fold the launcher to its search bar; tiles take the height.">▾</span><input id="lsearch" placeholder="Open context… terminal, files, web"><span class="f" id="lmore" data-i="Library|The full context library is also in the browser under Context, where SDK widgets appear too.">⋯</span></div>
    <div class="lgrid" id="lgrid"></div>
  </section>
</aside>

<!-- ================= DETAIL ================= -->
<section class="ch" id="ch">
  <div class="dpane on" id="paneDev"><div class="chain" id="chain"></div></div>
  <div class="dpane" id="paneClip"></div>
</section>

<!-- ================= STATUS ================= -->
<footer class="sb">
  <span class="i">i</span>
  <div class="info" id="info"><b>Info</b>Hover anything to read what it does. Double-click a task clip (or its ↗) to open the thread.</div>
  <span id="counts"></span>
  <span id="sTrack" style="color:var(--text)"></span>
  <div class="tg"><button id="tgClip">▢ Clip</button><button id="tgDev" class="on">◷ Device</button></div>
</footer>

</div></div>

<script>

  if(q('#effDn')){const a=trAgent(tr(S.track))||A.fizz;a.eff=Math.max(0,a.eff-1);render();return}
  if(q('#tap')){Object.values(A).forEach(a=>{if(a.state==='working'&&!/pinged/.test(a.doing))a.doing+=' · pinged '+fmt(NOW).slice(3)});renderDock();if(S.view==='arr')renderArr();return}
  if(q('#tokScope')){S.tokScope=(S.tokScope+1)%3;$('#tokIn').textContent=['142k','186k','311k'][S.tokScope];$('#tokOut').textContent=['38k','51k','74k'][S.tokScope];$('#info').innerHTML=`<b>Tokens</b>counting ${['the selected session','the whole group','everything open'][S.tokScope]}`;return}
  if(x=q('#rec')){x.classList.toggle('on');const on=x.classList.contains('on');const t=T.find(o=>o.arm);
    if(S.view!=='thread'&&t){if(on)t.recSlot=[0,1,2,3,4,5,6,7].find(i=>!t.clips[i]);else if(t.recSlot!=null){t.clips[t.recSlot]={n:'new task (voice)',s:'queued'};t.recSlot=null}}
    render();return}
  if(q('#stop')){$('#play').classList.remove('on');T.forEach(t=>{if(t.agent&&!t.group&&['working'].includes(trAgent(t).state))stopLive(t,'idle','paused at next tool · context kept')});render();return}
  if(x=q('#follow')){x.classList.toggle('on');S.follow=x.classList.contains('on');return}
  if(x=q('#play,#od,#arm,#hb,#loop')){x.classList.toggle('on');return}
});
document.addEventListener('input',e=>{if(e.target.id==='lsearch'){S.q=e.target.value;renderDock()}});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Tab'){e.preventDefault();S.view=S.view==='arr'?'session':'arr';render()}});
/* knobs + dock grip */
let drag=null;
document.addEventListener('mousedown',e=>{const k=e.target.closest('[data-knob]');if(k){drag={k:k.dataset.knob,y:e.clientY,acc:0,a:trAgent(tr(S.track))||(k.dataset.knob==='gstall'?A.fizz:null)};e.preventDefault();return}
  if(e.target.id==='grip'){drag={grip:1,x:e.clientX,w:dockW()};e.preventDefault()}});
document.addEventListener('mousemove',e=>{if(!drag)return;const sc=parseFloat($('#fit').dataset.s||1);
  if(drag.grip){setDock(Math.max(260,Math.min(900,drag.w+(drag.x-e.clientX)/sc)));return}
  if(!drag.a)return;drag.acc+=drag.y-e.clientY;drag.y=e.clientY;
  while(Math.abs(drag.acc)>=14){const d=Math.sign(drag.acc);drag.acc-=d*14;const a=drag.a;
    if(drag.k==='aut')a.aut=Math.min(2,Math.max(0,a.aut+d));if(drag.k==='eff')a.eff=Math.min(4,Math.max(0,a.eff+d));if(drag.k==='gstall'){G.stall=Math.min(300,Math.max(30,G.stall+30*d));render();continue}if(drag.k==='bud')a.max=Math.min(24,Math.max(Math.max(a.used,2),a.max+2*d));render()}});
document.addEventListener('mouseup',()=>drag=null);
const dockW=()=>parseInt(getComputedStyle($('#frame')).getPropertyValue('--dock-w'))||300;
function setDock(w){$('#frame').style.setProperty('--dock-w',Math.round(w)+'px');renderDock();if(S.view==='arr')renderArr()}
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-i]');if(!el)return;const [t,p]=el.dataset.i.split('|');$('#info').innerHTML=`<b>${t}</b>${p||''}`});
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1200);$('#fit').dataset.s=s;$('#fit').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();render();
/* live clock: each running thread's needle advances (×3 speed); a stalled needle stays where output stopped */
setInterval(()=>{if(!$('#play').classList.contains('on'))return;NOW+=3/60;
  T.forEach(t=>(t.clips||[]).forEach(c=>{if(c&&c.s==='run')c.p=(c.p+.008)%1}));
  G.seq+=Object.values(A).filter(a=>a.state==='working').length;G.ring=Math.min(G.ringMax,G.ring+1);G.hbAge=(G.hbAge+3)%15;
  const tick=Math.round(NOW*20)%4;FRAMES.push([fmt(NOW),['lead','test','gw','lead'][tick],['message.delta','tool.progress','hb','message.delta'][tick],['“…hand off placement to Honey”','pnpm test --all '+(31+Math.round((NOW-36.2)*4))+'/48','active_turns 2 · progress '+G.seq,'“…no retuning”'][tick]]);
  if(S.view==='gw')renderGw();if(S.tiles.includes('frames'))renderDock();
  if(S.view==='arr')renderArr();
  $$('.cs.run .pg').forEach(p=>{const [tid,i]=p.parentElement.dataset.clip.split(':');p.style.width=tr(tid).clips[+i].p*100+'%'})},1000);
</script>
</body>
