</style>
<div class="toast" id="toast"></div>
<script>
/* ============================== render ============================== */
function render(){renderTransport();renderEncbar();renderBrowser();renderPool();renderPanes();renderRack();renderDock();renderStatus();
  $('#frame').classList.toggle('no-browser',!$('#tBrowser').classList.contains('on'));$('#frame').classList.toggle('no-dock',!$('#tDock').classList.contains('on'));$('#frame').classList.toggle('no-detail',!$('#tDetail').classList.contains('on'))}
let toastT;function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function dialog(title,body,okLabel,onOk){$('#dlg').innerHTML=`<div class="dh2">${title}</div><div class="dbody">${body}</div><div class="df"><button class="bt" data-dlg="no">Cancel</button><button class="bt pri" data-dlg="ok">${okLabel}</button></div>`;$('#scrim').classList.add('on');dialog.ok=onOk}

/* ============================== walks: play and record ============================== */
function launchScene(k){const s=WALK[k];if(!s)return;S.walkI=k;S.clock=S.clock==='now'?'occasion':S.clock;
  encounter(s.e,'journey',{scale:s.scale,enter:s.scale==='palace',noTrail:false});if(s.scale==='palace'){S.room='stone'}}
let lastStep=0;
function stepWalk(t){if(!S.playing)return;if(t-lastStep<S.pace)return;lastStep=t;const n=S.walkI+1;if(n>=WALK.length){if(pv('journey','loop')==='on')launchScene(0);else{S.playing=false;render()}}else launchScene(n)}
function stopRecording(){S.recording=false;const ids=[...new Set(S.recWalk)];if(ids.length<2){toast('Walk discarded — fewer than two stops.');render();return}
  const id='walk2';add(id,{kind:'journey',n:'Walk · '+nowLabel(),subj:subj().subj||'mercurius',proj:0,prov:'recorded walk · '+ids.length+' scenes',rev:'r1'});
  JOURNEYS.walk2={n:E[id].n,stops:()=>ids.map(e=>({e,scale:placeOf(E[e])?'surface':'orbit',x:'fly',ex:'—',nar:''}))};
  toast(`Recorded <b>${E[id].n}</b> — ${ids.length} scenes. It is a Journey now: Scenes, Earth routes, the browser.`);render()}

/* ============================== events ============================== */
let lastClick={k:null,t:0};
const dbl=k=>{const now=performance.now();const r=lastClick.k===k&&now-lastClick.t<380;lastClick={k,t:now};return r};
const paneIdx=el=>{const pe=el.closest('[data-pane]');return pe?+pe.dataset.pane:null};
const pane=i=>panes()[i];
document.addEventListener('click',e=>{
  const T=e.target;const q=s=>T.closest(s);let el;
  if(e.button!==0)return;
  if(T.closest('.scrim')){if((el=q('[data-dlg]'))){$('#scrim').classList.remove('on');if(el.dataset.dlg==='ok'&&dialog.ok)dialog.ok();render()}return}
  const pi=paneIdx(T);if(pi!=null&&pi!==L().focus){L().focus=pi}
  if(window._dragged){window._dragged=false;return}
  /* transport */
  if((el=q('[data-ap]'))){S.ap=+el.dataset.ap;return render()}
  if((el=q('[data-arr]'))){S.arr=el.dataset.arr;return render()}
  if((el=q('[data-clock]'))){S.clock=el.dataset.clock;return render()}
  if((el=q('#viewAs'))){S.viewAs={me:'field',field:'public',public:'me'}[S.viewAs];return render()}
  if((el=q('#link'))){S.link=!S.link;if(!S.link)S.ap=Math.min(S.ap,1);toast(S.link?'Linked to <b>oi:field:public</b> · SpaceTimeDB carrier':'Local carrier only — the same grammar over local material');return render()}
  if((el=q('#tapNow'))){S.clock='now';if(dbl('tap'))goHome();return render()}
  if((el=q('#paceDn'))){S.pace=Math.max(2,S.pace-1);return render()}
  if((el=q('#paceUp'))){S.pace=Math.min(12,S.pace+1);return render()}
  if((el=q('#pulse'))){S.pulse=!S.pulse;return render()}
  if((el=q('#follow'))){S.follow=!S.follow;return render()}
  if((el=q('#play'))){if(S.playing){S.playing=false}else{S.playing=true;lastStep=performance.now()/1000;S.clock='walk';panes().forEach(p=>{if(p.proj==='earth')p.showRoute=true});launchScene(S.walkI<0||S.walkI>=WALK.length-1?0:S.walkI+1);return}return render()}
  if((el=q('#stop'))){if(S.recording)return stopRecording();if(!S.playing&&S.walkI>=0){S.walkI=-1;S.clock='now'}S.playing=false;return render()}
  if((el=q('#rec'))){if(S.recording)return stopRecording();S.recording=true;S.recWalk=[];toast('<b>Recording a walk</b> — every encounter becomes a scene. ● again or ■ to keep it.');return render()}
  if((el=q('#od'))){S.od=!S.od;return render()}
  if((el=q('#win'))){S.win=!S.win;return render()}
  if((el=q('#placeMode'))){S.placeMode=!S.placeMode;if(S.placeMode)toast(`Place tool — click the World to place <b>${subj().n}</b> there (presentation).`);return render()}
  if((el=q('#home'))){goHome();return render()}
  if((el=q('#tBrowser'))||(el=q('#tDock'))||(el=q('#tDetail'))){el.classList.toggle('on');return render()}
  if((el=q('#wider'))){S.dockW=Math.min(760,S.dockW+230);return render()}
  if((el=q('#narrower'))){S.dockW=Math.max(300,S.dockW-230);return render()}
  if((el=q('#lfold'))){S.lfold=!S.lfold;return render()}
  /* encounter bar */
  if((el=q('#eBack'))||(el=q('#bBack'))){goTrail(S.ti-1);return}
  if((el=q('#eFwd'))||(el=q('#bFwd'))){goTrail(S.ti+1);return}
  if((el=q('[data-layout]'))){L().layout=el.dataset.layout;const want={solo:1,duo:2,quad:4}[L().layout];const def=['earth','timeline','constellation','expression'];
    while(L().panes.length<want){const used=L().panes.map(p=>p.proj);const k=def.find(d=>!used.includes(d))||'earth';L().panes.push(k==='earth'?{proj:k,scale:'surface'}:k==='timeline'?{proj:k,tl:'arr'}:k==='constellation'?{proj:k,cn:'field'}:{proj:k})}return render()}
  if((el=q('[data-spine]'))){const k=el.dataset.spine;if(k==='world'){S.pool={type:'world',id:'w:'+S.spine.world}}else if(k==='field'){S.cat='fields'}else if(k==='occ'){S.clock=S.clock==='occasion'?'now':'occasion'}else S.pool={type:'enc',id:S.spine.subject};return render()}
  /* panes */
  if((el=q('[data-proj]'))){const [i,k]=el.dataset.proj.split('.');const p=pane(+i);p.proj=k;p.full=null;if(k==='earth'&&!p.scale)p.scale='surface';if(k==='timeline'&&!p.tl)p.tl='arr';if(k==='constellation'&&!p.cn)p.cn='field';L().focus=+i;return render()}
  if((el=q('[data-scale]'))){const [i,k]=el.dataset.scale.split('.');const p=pane(+i);if(k==='palace'){p.scale='palace';S.room=S.room||'tower'}else{setScale(p,k)}return render()}
  if((el=q('[data-cos]'))){const [i,k]=el.dataset.cos.split('.');const p=pane(+i);p.cos=p.cos||{m1:1,m2:1,m3:1};p.cos[k]=p.cos[k]?0:1;return render()}
  if((el=q('[data-route]'))){const p=pane(+el.dataset.route);p.showRoute=!p.showRoute;return render()}
  if((el=q('[data-home]'))){goHome(pane(+el.dataset.home));return render()}
  if((el=q('[data-solo]'))){const i=+el.dataset.solo;const p=pane(i);L().panes.splice(i,1);L().panes.unshift(p);L().layout='solo';L().focus=0;return render()}
  if((el=q('[data-tl]'))&&el.tagName==='BUTTON'){const [i,k]=el.dataset.tl.split('.');pane(+i).tl=k;return render()}
  if((el=q('[data-lens]'))){const [i,k]=el.dataset.lens.split('.');pane(+i).lens=k;return render()}
  if((el=q('[data-cn]'))){const [i,k]=el.dataset.cn.split('.');pane(+i).cn=k;return render()}
  if((el=q('[data-cnv]'))){const [i,k]=el.dataset.cnv.split('.');pane(+i).cnv=k;return render()}
  if((el=q('[data-cross]'))){const p=pane(+el.dataset.cross);INST[p.from||'M4'].go(p);S.hlLayer=null;return render()}
  if((el=q('[data-full-close]'))){pane(+el.dataset.fullClose).full=null;return render()}
  if((el=q('[data-layer]'))){const k=+el.dataset.layer;S.layers[k]=!S.layers[k];return render()}
  if((el=q('[data-hide]'))){const k=el.dataset.hide;S.hideTrack.has(k)?S.hideTrack.delete(k):S.hideTrack.add(k);return render()}
  if((el=q('[data-expand]'))){(S.expand||(S.expand=new Set())).add(el.dataset.expand);return render()}
  if((el=q('[data-walk]'))){launchScene(+el.dataset.walk);return}
  if((el=q('[data-room-next]'))){const i=PATH.indexOf(S.room||'tower');S.room=PATH[(i+1)%PATH.length];S.pool={type:'room',id:S.room};return render()}
  if((el=q('[data-room]'))&&!q('[data-enc]')){S.room=el.dataset.room;S.pool={type:'room',id:S.room};return render()}
  if((el=q('[data-enter]'))){encounter('palace','direct',{enter:true,scale:'palace'});S.room='tower';return render()}
  if((el=q('[data-promote]'))){const k=el.dataset.promote;dialog('Promote a relation','Drawn on the Canvas, <b>vessel ECHOES the stone</b> is presentation. Promoting sends a native Action to the relation owner (<b>Wiki · typed relations</b>):<br><br>type <b>ECHOES</b> · standing <b>claim</b> · basis <b>Rosarium pl. 10</b> (Ariadne’s projection)<br><br>Your authority lets it land as a claim; it is never upgraded to fact by promotion.','Send Action',()=>{S.promoted.add(k);toast('Relation Action sent — landed as <b>claim</b> · wiki r42')});return}
  /* worlds in the field */
  if((el=q('[data-world]'))){const w=el.dataset.world;if(dbl('w'+w)&&!WORLDS[w].own){visit(w);return render()}if(WORLDS[w].own&&dbl('w'+w)){goHome();return render()}encounter('w:'+w,'direct');return}
  if((el=q('[data-visit]'))){visit(el.dataset.visit);return render()}
  if((el=q('[data-watch]'))){const w=el.dataset.watch;S.watch.has(w)?S.watch.delete(w):S.watch.add(w);return render()}
  if((el=q('[data-contact]'))){S.contact={t:nowLabel()};if(!S.tiles.includes('contact'))S.tiles.unshift('contact');encounter('parasakti','contact');return}
  if((el=q('[data-admit]'))){dialog('Admit a contribution','<b>Ariadne</b> contributed <b>vessel ECHOES the stone</b> (claim · basis Rosarium pl. 10) into <b>field:jung-circle</b>.<br><br>Admitting brings it into your World as a <b>claim attributed to Ariadne</b>. It does not become a fact, and nothing of yours is projected back by admitting it.','Admit as claim',()=>{S.admitted.add('contrib:vessel');R.push(['vessel','stone1950','ECHOES','claim']);S.trail.push({id:'contrib:vessel',med:'return',t:nowLabel(),w:'ariadne'});S.ti=S.trail.length-1;toast('Admitted — <b>vessel ECHOES the stone</b> is in your World as Ariadne’s claim')});return}
  if((el=q('[data-project]'))){const s=subj();if(!ownE(s))return;const tgt=Math.max(projOf(s)+1,5);dialog('Project into a field',`Project <b>${s.n}</b> into <b>${FIELDS[S.spine.field==='public'?'public':'circle'].ref}</b>?<br><br><b>Crosses:</b> label · place · occasion · basis locator · image ref<br><b>Stays yours:</b> notes, Canvas Views, drafts, the private Annex<br><br>This publishes into a shared carrier (SpaceTimeDB). It can be withdrawn, but participants may already have encountered it.`,'Propose projection',()=>{S.projected[s.id]=Math.min(6,tgt);toast(`<b>${s.n}</b> admitted to the field — visible as “${S.viewAs==='me'?'field':S.viewAs}” now`)});return}
  if((el=q('[data-viewas]'))){S.viewAs=el.dataset.viewas;return render()}
  if((el=q('[data-homego]'))){goHome();return render()}
  if((el=q('[data-widen]'))){S.ap=Math.min(3,S.ap+1);return render()}
  if((el=q('[data-showas]'))){const p=fp();p.proj=el.dataset.showas;p.full=null;if(p.proj==='earth'&&['field','orbit'].includes(p.scale))setScale(p,'surface');return render()}
  if((el=q('[data-placego]'))){const p=panes().find(x=>x.proj==='earth')||fp();if(p.proj!=='earth'){p.proj='earth'}setScale(p,'place');return render()}
  if((el=q('[data-placeit]'))){S.placeMode=true;toast(`Place tool — click the World to place <b>${subj().n}</b>.`);return render()}
  if((el=q('[data-addwalk]'))){WALK.push({e:S.spine.subject,scale:placeOf(subj())?'surface':'orbit',x:'fly',ex:'—',nar:'Added '+nowLabel()});toast(`<b>${subj().n}</b> added to the Mercurius walk as scene ${WALK.length}`);return render()}
  if((el=q('[data-ask]'))){const k=instOf(fp())||'M4';S.trail.push({id:S.spine.subject,med:'direct',t:nowLabel(),w:subj().w});toast(`Asked <b>Technē${SUB[+k[1]]}</b> about ${subj().n} — the answer will arrive in the Trail.`);return render()}
  if((el=q('[data-field]'))){S.spine.field=el.dataset.field;return render()}
  /* rack */
  if((el=q('[data-inst]'))){INST[el.dataset.inst].go(fp());fp().full=null;return render()}
  if((el=q('[data-cut]'))){const p=fp();if(el.dataset.cut==='lived'){p.from=instOf(p)||p.from||'M4';p.proj='expression';S.hlLayer=INST[p.from].conj;S.layers[S.hlLayer]=true}else if(p.proj==='expression'){INST[p.from||'M4'].go(p);S.hlLayer=null}return render()}
  if((el=q('[data-p]'))){const [d,k]=el.dataset.p.split('.');const v=el.dataset.v;
    if(d==='projection'&&k==='aud'){const s=subj();if(!ownE(s))return;const map={private:1,circle:4,field:5,public:6};const nv=map[v];if(nv>projOf(s)){dialog('Raise the audience',`Raise <b>${s.n}</b> to <b>${v}</b>? This publishes into a shared carrier.`,'Raise',()=>{S.projected[s.id]=nv})}else{S.projected[s.id]=nv;toast(`Withdrawn to <b>${v}</b> — participants keep any encounter they already had.`);render()}return}
    if(d==='place'&&k==='rel'){toast(`Proposed <b>${v}</b> for ${subj().n} — the gazetteer owns the relation; this waits for review.`);return}
    setP(d,k,v);return}
  if((el=q('[data-sl]'))){const [d,k]=el.dataset.sl.split('.');const def=DEV[d].params.find(x=>x.k===k);const r=el.getBoundingClientRect();const f=clamp((e.clientX-r.left)/r.width,0,1);setP(d,k,Math.round((def.min+f*(def.max-def.min))/def.step)*def.step);return}
  if((el=q('[data-pw]'))){const d=el.dataset.pw;S.off.has(d)?S.off.delete(d):S.off.add(d);return render()}
  if((el=q('[data-fold]'))){const k=el.dataset.fold;S.folded.has(k)?S.folded.delete(k):S.folded.add(k);return render()}
  if((el=q('[data-devfull]'))){fp().full=el.dataset.devfull;return render()}
  if((el=q('[data-devh]'))){S.devSel=el.dataset.devh;S.pool={type:'dev',id:el.dataset.devh};return render()}
  if((el=q('[data-adddev]'))){const key=chainKey(fp());(S.extra[key]||(S.extra[key]=[])).push(el.dataset.adddev);return render()}
  if((el=q('[data-foldp]'))){S.poolDet=!S.poolDet;return render()}
  /* browser + dock */
  if((el=q('[data-cat]'))){S.cat=el.dataset.cat;return render()}
  if((el=q('[data-tile]'))){const k=el.dataset.tile;S.tiles.includes(k)?S.tiles.splice(S.tiles.indexOf(k),1):S.tiles.unshift(k);return render()}
  if((el=q('[data-trail]'))){goTrail(+el.dataset.trail);return}
  /* the encounter itself — last, so specific controls win */
  if((el=q('[data-enc]'))){const id=el.dataset.enc;const med=el.dataset.med||(q('.blist')&&S.q?'search':q('.palace')?'palace':'direct');
    if(el.closest('.art')){if(!dbl('a'+id)){S.cvSel=id;return}}
    encounter(id,med,{inPalace:!!el.dataset.inpalace});return}
  if(pi!=null)render();
});
function visit(w){const p=panes().find(x=>x.proj==='earth')||fp();p.proj='earth';p.world=w;setScale(p,'surface');const first=Object.values(E).find(e=>e.w===w&&e.place);if(first)flyTo(p,PLACES[first.place].la,PLACES[first.place].lo);
  S.spine.world=w;S.spine.field=WORLDS[w].fields?.[0]||'public';S.trail.push({id:'w:'+w,med:'direct',t:nowLabel(),w});S.ti=S.trail.length-1;S.pool={type:'world',id:'w:'+w};toast(`Visiting <b>${WORLDS[w].n}’s World</b> — only what ${WORLDS[w].n} has projected is visible`)}
function goHome(p){p=p||panes().find(x=>x.proj==='earth')||fp();p.proj='earth';p.world='central';p.selW=null;setScale(p,'orbit');S.spine.world='central';const pl=PLACES.bollingen;flyTo(p,pl.la,pl.lo)}

/* search box */
$('#q').addEventListener('input',e=>{S.q=e.target.value;S.cat='results';renderBrowser()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){const {hits}=search(S.q);if(hits[0])encounter(hits[0].id,'search')}});
$('#lsearch').addEventListener('input',()=>renderDock());
/* hover → status line */
document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-i]');if(!el)return;const [t,p]=el.dataset.i.split('|');$('#info').innerHTML=`<b>${t}</b>${p||''}`});
/* keyboard */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();const map={e:'earth',t:'timeline',c:'constellation',x:'expression'};
  if(map[k]){fp().proj=map[k];fp().full=null;if(k==='e'&&!fp().scale)fp().scale='surface';render()}else if(k===' '){e.preventDefault();$('#play').click()}else if(k==='h'){goHome();render()}else if(/^[1-8]$/.test(k))launchScene(+k-1);else if((e.metaKey||e.ctrlKey)&&k==='f'){e.preventDefault();$('#q').focus()}});

/* drags: knobs, globe, canvas artefacts */
const scaleOf=el=>{const r=el.getBoundingClientRect();return r.width/el.offsetWidth||1};
document.addEventListener('mousedown',e=>{if(e.button!==0)return;const T=e.target;
  const kn=T.closest('[data-knob]');if(kn){const [d,k]=kn.dataset.knob.split('.');const def=DEV[d].params.find(x=>x.k===k);const y0=e.clientY,v0=pv(d,k);
    const mv=ev=>{const steps=Math.round((y0-ev.clientY)/(8*scaleOf(document.body.querySelector('.frame'))));const v=clamp(v0+steps*def.step,def.min,def.max);if(v!==pv(d,k))setP(d,k,+v.toFixed(3))};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault();return}
  const art=T.closest('.art,.note');if(art&&art.closest('.cv')){const id=art.dataset.art,cv=art.closest('.cv'),s=scaleOf(cv),x0=e.clientX,y0=e.clientY,l0=art.offsetLeft,t0=art.offsetTop;let moved=false;
    const mv=ev=>{const dx=(ev.clientX-x0)/s,dy=(ev.clientY-y0)/s;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;S.canvasPos[id]=[l0+dx,t0+dy];art.style.left=l0+dx+'px';art.style.top=t0+dy+'px';cvEdges(cv.closest('.pb'))};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);if(moved){window._dragged=true;setTimeout(()=>window._dragged=false,30)}};addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault();return}
  const cv=T.closest('canvas[data-cv]');if(cv){const p=pane(+cv.dataset.cv);camOf(p);const s=scaleOf(cv),x0=e.clientX,y0=e.clientY,la0=p.tgt.lat,lo0=p.tgt.lon;let moved=false;
    const R=p._geo?p._geo.R:300;
    const mv=ev=>{const dx=(ev.clientX-x0)/s,dy=(ev.clientY-y0)/s;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;const k=180/Math.PI/R;p.tgt.lon=lo0-dx*k;p.tgt.lat=clamp(la0+dy*k,-80,80);p.cam.lon=p.tgt.lon;p.cam.lat=p.tgt.lat};
    const up=ev=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);
      if(!moved&&S.placeMode&&p._geo){const r=cv.getBoundingClientRect();const x=(ev.clientX-r.left)/s,y=(ev.clientY-r.top)/s;const ll=unproject(p,x,y);if(ll){PLACED[S.spine.subject]={la:ll[0],lo:ll[1]};S.placeMode=false;S.trail.push({id:S.spine.subject,med:'place',t:nowLabel(),w:'central'});S.ti=S.trail.length-1;toast(`Placed <b>${subj().n}</b> at ${ll[0].toFixed(1)}°, ${ll[1].toFixed(1)}° — World composition, not a geographic claim`);render()}}};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault()}});
function unproject(p,x,y){const g=p._geo;const X=(x-g.cx)/g.R,Y=-(y-g.cy)/g.R;const r=Math.hypot(X,Y);if(r>1)return null;const c=Math.asin(r),f0=g.cam.lat*D2R,l0=g.cam.lon*D2R;
  const la=Math.asin(Math.cos(c)*Math.sin(f0)+(r?Y*Math.sin(c)*Math.cos(f0)/r:0));const lo=l0+Math.atan2(X*Math.sin(c),r*Math.cos(c)*Math.cos(f0)-Y*Math.sin(c)*Math.sin(f0));return [la/D2R,((lo/D2R+540)%360)-180]}
document.addEventListener('wheel',e=>{const cv=e.target.closest('.earth');if(!cv)return;e.preventDefault();const i=paneIdx(cv);const p=pane(i);const order=['field','orbit','surface','place'];const k=order.indexOf(p.scale);
  if(p._wt&&performance.now()-p._wt<350)return;p._wt=performance.now();const n=clamp(k+(e.deltaY<0?1:-1),0,3);if(n!==k){setScale(p,order[n]);render()}},{passive:false});

/* ============================== loop ============================== */
let lastMin=performance.now();
function loop(){const t=performance.now()/1000;
  panes().forEach((p,i)=>{const pb=document.querySelector(`[data-pb="${i}"]`);if(!pb||p.full)return;
    if(p.proj==='earth'&&p.scale!=='palace'){drawEarth(p,pb,t);earthPins(p,pb)}
    if(p.proj==='constellation'&&p.cn==='field'&&['graph','form'].includes(p.cnv||'graph')){if(p._lwSig!==S.spine.subject+pb.dataset.pb+pb.childElementCount||p._moving||!pb.querySelector('svg.g').childElementCount){p._moving=drawGraph(p,pb);p._lwSig=S.spine.subject+pb.dataset.pb+pb.childElementCount}}});
  stepWalk(t);
  if(performance.now()-lastMin>4000){lastMin=performance.now();CLOCK.nowH+=1/60;$('#posV')&&S.clock==='now'&&($('#posV').textContent=nowLabel()+' · 08 Oct')}
  requestAnimationFrame(loop)}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1200);$('#fit').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);

/* ============================== linkable state ============================== */
(function boot(){const Q=new URLSearchParams(location.search);
  S.trail=[{id:'stone1950',med:'search',t:'14:21',w:'central'},{id:'mercurius',med:'traversal',t:'14:24',w:'central'}];S.ti=1;
  if(Q.get('arr'))S.arr=Q.get('arr');if(Q.get('ap'))S.ap=+Q.get('ap');if(Q.get('as'))S.viewAs=Q.get('as');if(Q.get('clock'))S.clock=Q.get('clock');
  if(Q.get('layout'))L().layout=Q.get('layout');
  if(Q.get('subject')){encounter(Q.get('subject'),Q.get('med')||'search')}
  const p0=L().panes[0];if(Q.get('scale')&&p0.proj==='earth'){p0.scale=Q.get('scale');}if(Q.get('proj')){p0.proj=Q.get('proj')}if(Q.get('cn'))p0.cn=Q.get('cn');if(Q.get('tl'))p0.tl=Q.get('tl');if(Q.get('lens'))p0.lens=Q.get('lens');
  if(Q.get('visit'))visit(Q.get('visit'));if(Q.get('room'))S.room=Q.get('room');if(Q.get('walk')){S.walkI=+Q.get('walk');S.clock='walk';panes().forEach(p=>{if(p.proj==='earth')p.showRoute=true})}
  if(Q.get('tiles'))S.tiles=Q.get('tiles').split(',');if(Q.get('contact'))S.contact={t:'14:39'};if(Q.get('rec')){S.recording=true;S.recWalk=['stone1950','vessel']}
  if(Q.get('dock'))S.dockW=+Q.get('dock');if(Q.get('full'))L().panes[0].full=Q.get('full');if(Q.get('pool'))S.pool={type:'dev',id:Q.get('pool')};
  for(const p of Object.values(S.layouts).flatMap(l=>l.panes))if(p.proj==='earth'||true){p.cam=null;camOf(p);if(p.proj==='earth'){p.cam.k=K[p.scale]||K.orbit;p.tgt.k=p.cam.k;const pl=placeOf(subj())||PLACES.bollingen;p.cam.lat=p.tgt.lat=pl.la-(p.scale==='surface'?6:p.scale==='orbit'?14:0);p.cam.lon=p.tgt.lon=pl.lo}}
  fit();render();requestAnimationFrame(loop)})();
</script>
