<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Shell Mockup</title>
<!--
  WORLD SHELL — reference mockup, revision 2 (8 Oct 2026).
  One World · four projections · one encounter spine · one rack.

  Read this file as a component reference, not a picture:
    §TOKENS      shell tokens copied from packages/live-shell/ui/src/styles.css (env-1, 45e15ed8b)
    §DATA        fixture shaped like the native contracts it stands in for:
                 Explore entry {ref, kind, world_ref, label, revision, provenance, standing, projection, locators}
                 Encounter {subject_ref, world_ref, mediation, occasion, at}
                 Participant / SharedField / Projection / Contribution / FieldNow
    §SPINE       Field › World › Subject › Occasion › Projection — the only selection state
    §PARAMS      one parameter model per device; compact (rack), expanded (pool) and full (pane)
                 are three presentations of the same values (DEVICE-PANEL-BRIEF)
    §PROJECTIONS earth (M4′/M5′), timeline (M2′/M3′), constellation (M0′/M1′), expression (3:3)
  States are linkable: ?arr=techne&layout=quad&scale=surface&subject=mercurius&ap=2

  COMPONENTS (each is a function you can lift):
    encounter(id, mediation, opts)     the spine transition; followPane() makes panes follow
    renderEncbar / renderTransport     the spine bar; Live's transport given World functions
    drawEarth / earthPins / palaceSVG  M4′ globe at field·orbit·surface·place, M5′ palace interior
    tlBody / tlOverlay / scenesBody    M2′ Relation Field (lenses, standing) · M3′ Journey as scene rows
    localWhole / drawGraph / drawForm  M0′ bounded local whole: list · tree · graph · form
    canvasBody / cvEdges               M1′ artefact suite: drag = presentation, promote = native Action
    exBody                             3:3 Expression with M0–M5 conjugate layers
    DEV / devHTML / prow / fullDevice  one param model → rack face · pool (expanded) · full pane
    renderBrowser / search             Explore: results grouped by World, aperture-bounded
    renderDock / tileBody / CTX        context tiles + 2×2 launcher (agent-shell pattern)
-->
<style>
/* ============================== §TOKENS ============================== */
:root{
  --bg-0:#26292d; --bg-1:#33363b; --bg-2:#3f4348; --bg-3:#4a4e54; --surface:#43464c;
  --line:#24262a; --line-strong:#3d4147;
  --text:#d4d7da; --text-dim:#a2a7ad; --text-faint:#71767c;
  --accent:#ffbe00; --accent-soft:rgba(255,190,0,.13); --sel:#7ec3e6; --rec:#e0523f; --green:#8fd0a8; --stall:#ff9b4a;
  --fizz:#5cc6b4; --honey:#e2a35e; --bumble:#d985a6;
  /* world hues — each World keeps one hue everywhere it appears */
  --w-central:#ffbe00; --w-ariadne:#c79ae0; --w-satya:#7fd0a0; --w-kestrel:#e2a35e; --w-field:#7ec3e6; --w-commons:#9aa6d8;
  /* subject hues */
  --mercurius:#c9a0dc; --selfc:#9fc7e8; --tower:#d8c89a;
  /* space */
  --space-0:#15171a; --space-1:#1c1f24; --ocean-0:#44627f; --ocean-1:#2d4659; --ocean-2:#1f2f3a; --land:#55695a; --land-edge:#728874;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1d20;overflow:hidden}
body{font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.fit{position:absolute;left:50%;top:50%;transform-origin:center}
.frame{--dock-w:300px;width:1920px;height:1200px;display:grid;background:var(--bg-1);padding:0 6px;
  grid-template-columns:400px minmax(0,1fr) var(--dock-w);grid-template-rows:64px minmax(0,1fr) 300px 28px;
  grid-template-areas:"tp tp tp" "br ct dk" "ch ch dk" "sb sb sb"}
.frame.no-browser{grid-template-columns:0 minmax(0,1fr) var(--dock-w)}
.frame.no-dock{grid-template-columns:400px minmax(0,1fr) 0}
.frame.no-browser.no-dock{grid-template-columns:0 minmax(0,1fr) 0}
.frame.no-detail{grid-template-rows:64px minmax(0,1fr) 0 28px}
.mono{font-family:var(--mono)} .dim{color:var(--text-dim)} .faint{color:var(--text-faint)}
@keyframes blink{50%{opacity:.25}} @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}

/* ============================== transport ============================== */
.tp{grid-area:tp;margin:0 -6px;padding:3px 10px 8px;border-bottom:3px solid var(--line);display:flex;flex-direction:column}
.title{height:18px;text-align:center;font-size:12px;color:var(--text-dim)} .title b{color:var(--text);font-weight:500}
.ctl{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.g{display:flex;align-items:center;gap:2px;white-space:nowrap}
.gl{font-size:8.5px;color:var(--text-faint);margin-right:3px;text-transform:lowercase}
.nc{height:19px;min-width:17px;padding:1px 4px;background:var(--bg-0);border:1px solid #30343a;line-height:14px;font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:3px}
.nc:hover{color:var(--text)} .nc.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)} .nc.warn{color:var(--stall)} .nc.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.fld{height:19px;padding:2px 6px;font-size:10px;background:var(--bg-0);color:var(--text);display:flex;align-items:center;gap:4px;font-family:var(--mono);white-space:nowrap}
.fld small{font-size:8.5px;color:var(--text-faint)} .fld.act{box-shadow:inset 0 -2px 0 var(--accent)}
.tbtn{width:20px;height:22px;display:grid;place-items:center;color:var(--text-dim)}
.tbtn.play{color:var(--accent)} .tbtn.rec{color:#c9c8ad}
.tbtn.on.play{color:#1d1f22;background:var(--accent)} .tbtn.on.rec{color:var(--rec)}
.sp{flex:1;min-width:4px}
.cpu{width:33px;height:17px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--bg-0) 0,var(--bg-0) 9px,var(--line) 9px,var(--line) 10px);position:relative;overflow:hidden}
.cpu i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--w-field) 0,var(--w-field) 9px,transparent 9px,transparent 10px)}
.surf{display:flex;gap:6px;align-items:center;margin-left:6px}
.surf button{color:var(--text-dim);width:24px;height:22px;display:grid;place-items:center;position:relative} .surf button.on{color:var(--accent)}
.surf button small{position:absolute;bottom:-6px;font-size:7px;color:var(--text-faint);letter-spacing:.2px}
.chrome{width:20px;height:20px;display:grid;place-items:center;color:var(--text-dim)} .chrome.on{color:var(--accent)}
/* aperture ladder */
.ap{display:flex;align-items:center;height:19px;background:var(--bg-0);border:1px solid #30343a}
.ap button{height:17px;padding:0 6px;font-size:10px;color:var(--text-faint);display:flex;align-items:center;gap:4px;border-right:1px solid #30343a}
.ap button:last-child{border-right:none}
.ap button.in{color:var(--text-dim)} .ap button.on{background:var(--w-field);color:#1d1f22}
.ap button i{width:7px;height:7px;border-radius:50%;border:1px solid currentColor;display:block}
/* spine */
.spine{display:flex;align-items:center;gap:0;height:19px;min-width:0}
.spine .sc{height:19px;display:flex;align-items:center;gap:5px;padding:0 7px;background:var(--bg-0);font-size:10.5px;color:var(--text);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.spine .sc:hover{background:var(--bg-3)}
.spine .sc small{font-size:8.5px;color:var(--text-faint);text-transform:lowercase}
.spine .sc .dot{width:7px;height:7px;border-radius:50%;flex:none}
.spine .ch{color:var(--text-faint);font-size:10px;padding:0 3px}
.spine .back{width:19px;height:19px;display:grid;place-items:center;color:var(--text-dim);background:var(--bg-0);margin-right:3px}
.spine .back[disabled]{color:var(--text-faint);opacity:.4}

/* ============================== browser ============================== */
.br{grid-area:br;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg-1);border:1px solid var(--line-strong);border-right:4px solid var(--line);border-radius:3px 0 0 3px;overflow:hidden;margin-top:4px}
.bsearch{display:flex;height:25px;flex:none;padding:2px;gap:1px;border-bottom:1px solid var(--line);align-items:center}
.bsearch span{width:20px;display:grid;place-items:center;color:var(--text-faint)}
.bsearch input{flex:1;background:var(--bg-0);border:none;outline:none;color:var(--text);font-size:11px;padding:2px 6px;height:20px}
.bsearch input::placeholder{color:var(--text-faint)}
.bsearch .scope{font-size:9px;color:var(--w-field);padding:0 6px;white-space:nowrap}
.bcols{display:flex;flex:1;min-height:0}
.bcats{width:116px;flex:none;border-right:1px solid var(--line);padding:0 3px;font-size:11px;overflow:hidden}
.bcats h6{font-weight:400;font-size:10.5px;color:var(--text-faint);padding:6px 3px 2px}
.bcat{display:flex;align-items:center;gap:6px;padding:2px 3px;color:var(--text-dim);cursor:default;border-radius:2px;white-space:nowrap}
.bcat.on{background:var(--bg-3);color:var(--text)} .bcat svg{width:11px;height:11px;flex:none}
.bcat .n{margin-left:auto;font-size:9px;color:var(--text-faint)}
.bres{flex:1;min-width:0;background:var(--bg-2);display:flex;flex-direction:column}
.bfilt{height:21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:2px 5px;color:var(--text-dim);font-size:10px;background:var(--bg-1)}
.bfilt .r{margin-left:auto}
.bhead{display:flex;justify-content:space-between;height:20px;background:var(--bg-0);padding:2px 5px;font-size:10px;color:var(--text-dim)}
.blist{overflow:auto;flex:1}
.bitem{height:23px;display:flex;align-items:center;gap:6px;padding:2px 5px;color:var(--text-dim);font-size:11px;cursor:default;white-space:nowrap}
.bitem:hover{background:var(--bg-3);color:var(--text)} .bitem.on{background:var(--bg-3);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.bitem .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.bitem .st{margin-left:auto;font-size:9.5px;color:var(--text-faint);flex:none}
.bitem .wb{font-size:8.5px;padding:0 4px;height:13px;line-height:12px;border:1px solid currentColor;border-radius:7px;flex:none}
.bsep{font-size:9.5px;color:var(--text-faint);padding:6px 6px 2px;display:flex;justify-content:space-between}
.kg{width:12px;height:12px;flex:none;display:grid;place-items:center}
.pool{height:47%;min-height:85px;display:flex;flex-direction:column;border-top:5px solid var(--line);background:var(--bg-2)}
.poolh{height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px;flex:none;white-space:nowrap}
.poolh .r{margin-left:auto;color:var(--text-faint);font-size:10px}
.poolb{flex:1;overflow:auto;padding:4px 0 8px}
.sec{padding:7px 8px 2px;font-size:10px;color:var(--text-faint);display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:84px minmax(0,1fr);align-items:center;gap:6px;padding:2px 8px;font-size:11px;min-height:22px}
.row .k{color:var(--text-dim)}
.seg{display:flex;border:1px solid var(--line);width:max-content;max-width:100%;flex-wrap:nowrap}
.seg button{padding:1px 7px;font-size:10px;color:var(--text-dim);background:var(--bg-1);border-right:1px solid var(--line);height:17px;white-space:nowrap}
.seg button:last-child{border-right:none} .seg button.on{background:var(--accent);color:#1d1f22}
.slider{height:5px;background:var(--bg-0);position:relative;flex:1;cursor:ew-resize} .slider i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.srow{display:flex;align-items:center;gap:8px}
.srow .v{font-family:var(--mono);font-size:10px;min-width:34px;text-align:right}
.fold{display:flex;align-items:center;gap:5px;padding:6px 8px;font-size:10.5px;color:var(--text-faint);cursor:pointer;border-top:1px solid var(--line);margin-top:8px}
.fold .tri{font-size:8px;width:8px} .foldb{display:none;padding-bottom:4px} .foldb.open{display:block}
.kv{display:grid;grid-template-columns:84px 1fr;padding:1px 8px;font-size:10.5px;color:var(--text-dim)}
.kv span:last-child{font-family:var(--mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px}
.bt{height:20px;padding:0 9px;font-size:10.5px;background:var(--bg-1);border:1px solid var(--line);color:var(--text-dim);white-space:nowrap}
.bt:hover{color:var(--text);border-color:var(--text-faint)}
.bt.pri{background:var(--accent);border-color:var(--accent);color:#1d1f22}
.bt.fld2{background:var(--w-field);border-color:var(--w-field);color:#1d1f22}
.bt[disabled]{opacity:.45;cursor:default}
.lead{padding:6px 8px 2px;font-size:12px;line-height:1.45}
.lead small{display:block;font-size:10px;color:var(--text-faint);margin-top:2px}

/* ============================== centre: panes ============================== */
.ct{grid-area:ct;min-width:0;min-height:0;margin:4px 4px 4px 0;display:grid;gap:4px;position:relative}
.ct.solo{grid-template:1fr/1fr} .ct.duo{grid-template:1fr/1fr 1fr} .ct.quad{grid-template:1fr 1fr/1fr 1fr}
.pane{background:var(--bg-2);border:1px solid var(--line-strong);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.pane.focus{border-color:var(--accent)}
.ph{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 5px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap;min-width:0}
.ph .pv{display:flex;gap:1px}
.ph .pv button{width:22px;height:18px;display:grid;place-items:center;color:var(--text-faint)}
.ph .pv button:hover{color:var(--text)} .ph .pv button.on{color:#1d1f22;background:var(--accent)}
.ph .inst{font-size:10px;color:var(--text-dim);padding:0 6px;border-left:1px solid var(--line);border-right:1px solid var(--line);height:24px;display:flex;align-items:center;gap:5px}
.ph .inst b{color:var(--text);font-weight:500}
.ph .crumb{color:var(--text-dim);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ph .crumb b{color:var(--text);font-weight:500}
.ph .r{margin-left:auto;display:flex;gap:4px;align-items:center}
.ph .x{color:var(--text-faint);font-size:10px;width:16px;text-align:center;cursor:pointer} .ph .x:hover{color:var(--text)}
.pb{flex:1;min-height:0;position:relative;overflow:hidden}
.hud{position:absolute;z-index:4;display:flex;gap:4px;align-items:center;font-size:10px}
.hud.tl{left:8px;top:8px;flex-direction:column;align-items:flex-start} .hud.tr{right:8px;top:8px} .hud.bl{left:8px;bottom:8px;flex-direction:column;align-items:flex-start} .hud.br{right:8px;bottom:8px}
.chip{height:19px;display:flex;align-items:center;gap:5px;padding:0 7px;background:#1d1f22d9;border:1px solid var(--line-strong);color:var(--text-dim);font-size:10px;white-space:nowrap}
.chip b{color:var(--text);font-weight:500} .chip.on{color:#1d1f22;background:var(--accent);border-color:var(--accent)}
button.chip:hover{color:var(--text)} button.chip.on:hover{color:#1d1f22}
.ladder{display:flex;flex-direction:column;background:#1d1f22d9;border:1px solid var(--line-strong)}
.ladder button{height:20px;padding:0 8px 0 6px;font-size:10px;color:var(--text-faint);display:flex;align-items:center;gap:6px;text-align:left;border-bottom:1px solid #ffffff08}
.ladder button:last-child{border-bottom:none}
.ladder button i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5}
.ladder button.on{color:var(--text)} .ladder button.on i{background:var(--accent);opacity:1;box-shadow:0 0 0 2px #ffbe0040}
.ladder button:hover{color:var(--text)}
.legend{background:#1d1f22d9;border:1px solid var(--line-strong);padding:5px 8px;display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--text-dim)}
.legend .li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend .li i{width:8px;height:8px;border-radius:50%;flex:none}

/* earth */
.earth{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#22262c 0,var(--space-0) 75%)}
.earth canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.earth canvas:active{cursor:grabbing}
.mk{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.pin .g{width:16px;height:16px;display:grid;place-items:center;flex:none}
.pin .lab{font-size:10px;color:var(--text-dim);background:#1d1f22b8;padding:0 4px;line-height:14px}
.pin:hover .lab{color:var(--text)}
.pin.sel .lab{color:#1d1f22;background:var(--accent)}
.pin.dim{opacity:.35}
.pin.cl .lab{color:var(--text)}
.pin .ring{position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--accent);animation:pulse 1.8s ease-out infinite}
.pin.world .lab{font-size:10.5px;background:transparent;color:var(--text-dim)}
.pin.world.own .lab{color:var(--accent)}
.pin.world .sub{display:block;font-size:9px;color:var(--text-faint)}
.pin.agentp{flex-direction:column;gap:0}
.pin.agentp .lab{font-size:9px}
.fogmsg{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:4;font-size:10.5px;color:var(--text-dim);background:#1d1f22e0;border:1px solid var(--line-strong);padding:4px 10px;white-space:nowrap}
.fogmsg b{color:var(--w-field);font-weight:500}

/* palace (M5′) */
.palace{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#2d2a24 0,#1b1a17 80%)}
.palace svg{position:absolute;inset:0;width:100%;height:100%}
.room{cursor:pointer} .room:hover path,.room:hover rect,.room:hover circle{fill-opacity:.32}
.pobj{cursor:pointer}
.pobj:hover rect{stroke:var(--accent)}
.epii{position:absolute;right:10px;top:36px;width:300px;background:#1d1f22e6;border:1px solid var(--line-strong);padding:8px 10px;font-size:11px;line-height:1.45;z-index:4}
.epii .w{font-size:10px;color:var(--text-faint);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.epii .w b{color:var(--tower);font-weight:500}

/* timeline */
.tl{position:absolute;inset:0;display:flex;flex-direction:column}
.tl .ov{height:14px;flex:none;border-bottom:1px solid var(--line);background:var(--bg-1);position:relative}
.tl .ov i{position:absolute;top:2px;bottom:2px;border:1px solid var(--text-faint)}
.ruler{height:22px;flex:none;display:grid;grid-template-columns:minmax(0,1fr) var(--hw,190px);border-bottom:1px solid var(--line)}
.ticks{position:relative;font-size:10px;color:var(--text-dim);overflow:hidden}
.ticks span{position:absolute;top:4px;padding-left:3px;border-left:1px solid var(--text-faint);height:14px;line-height:12px;white-space:nowrap}
.ticks span.today{color:var(--accent);border-left-color:var(--accent)}
.rset{display:flex;align-items:center;gap:6px;padding:0 6px;font-size:10px;color:var(--text-faint);border-left:1px solid var(--line)}
.arows{flex:1;overflow:auto;position:relative}
.arow{display:grid;grid-template-columns:minmax(0,1fr) var(--hw,190px);border-bottom:1px solid var(--line);min-height:26px}
.arow.grp{min-height:20px;border-bottom:2px solid var(--line)}
.lane{position:relative;background:var(--bg-2);overflow:hidden}
.arow.grp .lane{background:#383c41}
.lane.sub{background:#3b3f44}
.ac{position:absolute;top:3px;bottom:3px;min-width:4px;background:var(--tc);border:1px solid #0004;color:#22282c;font-size:9.5px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;line-height:17px}
.ac.sel{box-shadow:0 0 0 1px var(--accent),0 0 0 2px #1d1f22}
/* epistemic standing — never upgraded by placement or animation (M2′ #215 §5) */
.ac.claim{background:linear-gradient(90deg,var(--tc),var(--tc)) left/100% 100% no-repeat;box-shadow:inset 3px 0 0 #1d1f2266}
.ac.inferred{background:transparent;border:1px dashed var(--tc);color:var(--tc)}
.ac.hypothesis{background:#00000024;border:1px solid var(--tc);color:var(--tc)}
.ac.disputed{background:repeating-linear-gradient(135deg,var(--tc) 0,var(--tc) 5px,#00000040 5px,#00000040 8px)}
.ac.ghost{background:transparent;border:1px dotted var(--text-faint);color:var(--text-faint)}
.ac.live{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),#0007)}
.ac.pt{width:9px!important;padding:0;border-radius:50%;top:8px;bottom:8px}
.ahead{background:var(--bg-1);border-left:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10px;min-width:0}
.ahead .nmc{flex:1;min-width:0;height:17px;background:var(--tc);color:#21282e;padding:0 5px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;font-weight:500}
.arow.grp .ahead .nmc{background:transparent;color:var(--text-dim);font-weight:400;padding-left:0}
.ahead .wb{font-size:8.5px;border:1px solid currentColor;border-radius:7px;padding:0 4px;line-height:11px}
.ahead .m{width:15px;height:15px;font-size:9px;display:grid;place-items:center;background:var(--bg-0);border:1px solid var(--line);cursor:pointer;color:var(--text-faint)}
.ahead .m.on{background:var(--accent);color:#21282e}
.cursor{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;z-index:3}
.cursor.now{background:#ffffff55}
.cursor.occ{background:var(--accent);width:2px}
.cursor.tr{background:var(--sel);width:1px}
.cursor .rd{position:absolute;top:2px;left:4px;font-size:9px;font-family:var(--mono);white-space:nowrap;background:#1d1f22d8;padding:0 4px;color:var(--text)}
.cursor.occ .rd{border-left:2px solid var(--accent)} .cursor.now .rd{color:var(--text-dim)}
.needle{position:absolute;top:2px;bottom:2px;width:2px;background:var(--tc);z-index:3;pointer-events:none}
.needle::after{content:'';position:absolute;left:-3px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--tc);animation:blink 1.1s infinite}
.rel{position:absolute;inset:0;pointer-events:none;z-index:2}
/* scenes (M3′) */
.scn{position:absolute;inset:0;display:flex}
.scn .cols{display:flex;flex:1;min-width:0;overflow:hidden}
.scol{flex:1;min-width:0;display:flex;flex-direction:column;border-right:2px solid var(--line)}
.scol .thd{height:24px;flex:none;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--tc);color:#21282e;font-size:10px;font-weight:500;border-bottom:2px solid var(--line);white-space:nowrap;overflow:hidden}
.scell{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 5px;font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.scell.f{background:var(--tc);color:#252a2d}
.scell.f .tri{width:0;height:0;border-left:7px solid #252a2dbb;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;flex:none}
.scell.f .n{overflow:hidden;text-overflow:ellipsis}
.scell.e .sg{width:9px;height:9px;border:1px solid var(--line);flex:none}
.scell.playing.f .tri{animation:blink .6s steps(2) infinite}
.scell.cur{box-shadow:inset 0 0 0 1px var(--accent)}
.scell.recs{background:var(--rec);color:#fff}
.smain{width:150px;flex:none;background:var(--bg-2);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.smain .thd{background:var(--bg-1);color:var(--text-dim);font-weight:400}
.smain .scell{color:var(--text-dim)}
.smain .scell .tri{width:0;height:0;border-left:7px solid var(--text-faint);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;flex:none}
.smain .scell.cur{color:var(--text)} .smain .scell.cur .tri{border-left-color:var(--accent)}

/* constellation */
.cn{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#3a3e44 0,#2a2d32 80%)}
.cn svg.g{position:absolute;inset:0;width:100%;height:100%}
.cn.form{background:radial-gradient(ellipse at 50% 50%,#2a2833 0,#141318 85%)}
.cn.form .node text{stroke:#17161c}
.node{cursor:pointer}
.node text{font-size:10px;fill:var(--text-dim);paint-order:stroke;stroke:#2a2d32;stroke-width:3px}
.node.focus text{fill:var(--text);font-size:11.5px;font-weight:500}
.node:hover text{fill:var(--text)}
.node.ghost{opacity:.55}
.edge-l{font-size:8.5px;fill:var(--text-faint);letter-spacing:.3px}
.cnlist{position:absolute;inset:0;overflow:auto;padding:30px 12px 12px;font-size:11px}
.cnlist .li{display:flex;align-items:center;gap:7px;height:24px;padding:0 6px;cursor:pointer;color:var(--text-dim);border-bottom:1px solid #ffffff08}
.cnlist .li:hover{background:var(--bg-3);color:var(--text)}
.cnlist .li .r{margin-left:auto;font-size:9.5px;color:var(--text-faint);font-family:var(--mono)}
/* canvas (M1′) */
.cv{position:absolute;inset:0;background-color:#2c2f34;background-image:radial-gradient(#ffffff12 1px,transparent 1px);background-size:18px 18px}
.cv svg.e{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.art{position:absolute;background:var(--bg-1);border:1px solid var(--line-strong);font-size:10.5px;cursor:move;user-select:none;box-shadow:0 4px 14px #0005}
.art.sel{outline:1px solid var(--accent)}
.art .ah{height:18px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:9.5px;color:var(--text-faint);border-bottom:1px solid var(--line);white-space:nowrap}
.art .ab{padding:6px;color:var(--text-dim);line-height:1.4}
.art .ab b{color:var(--text);font-weight:500}
.frm{position:absolute;border:1px dashed #ffffff30;background:#ffffff06}
.frm span{position:absolute;top:-17px;left:0;font-size:10px;color:var(--text-faint)}
.note{position:absolute;width:150px;background:#e8d48a;color:#3a3420;font-size:10.5px;padding:7px 8px;line-height:1.35;box-shadow:0 4px 12px #0006;transform:rotate(-1.5deg);cursor:move}
.cvbar{position:absolute;left:8px;top:8px;z-index:4;display:flex;flex-direction:column;background:#1d1f22e0;border:1px solid var(--line-strong)}
.cvbar button{width:26px;height:24px;display:grid;place-items:center;color:var(--text-dim);font-size:12px;border-bottom:1px solid #ffffff08}
.cvbar button.on{color:var(--accent)} .cvbar button:hover{color:var(--text)}
.promote{position:absolute;z-index:5;transform:translate(-50%,-50%);height:19px;padding:0 7px;font-size:9.5px;background:#1d1f22f0;border:1px dashed var(--accent);color:var(--accent);white-space:nowrap;cursor:pointer}

/* expression */
.ex{position:absolute;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at 45% 45%,#2a2833 0,#17161c 85%)}
.ex .stage{flex:1;position:relative;min-height:0}
.ex .stage svg{position:absolute;inset:0;width:100%;height:100%}
.ex .film{height:92px;flex:none;display:flex;gap:6px;padding:6px 8px;background:#1d1f22cc;border-top:1px solid var(--line)}
.fcell{width:120px;flex:none;border:1px solid var(--line-strong);background:var(--bg-0);display:flex;flex-direction:column;cursor:pointer;position:relative}
.fcell.on{border-color:var(--accent)}
.fcell .pv{flex:1;position:relative;overflow:hidden}
.fcell .n{height:17px;font-size:9.5px;color:var(--text-dim);padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:17px}
.fcell .tag{position:absolute;top:3px;right:3px;font-size:8px;padding:0 3px;background:var(--accent);color:#1d1f22}
.fcell .tag.d{background:var(--bg-3);color:var(--text-dim)}
.layer-chips{display:flex;gap:2px}
.layer-chips button{height:19px;padding:0 6px;font-size:9.5px;background:#1d1f22d9;border:1px solid var(--line-strong);color:var(--text-faint);display:flex;gap:4px;align-items:center}
.layer-chips button.on{color:var(--text);border-color:#ffffff40}
.layer-chips button.on i{background:var(--accent)}
.layer-chips button i{width:6px;height:6px;border-radius:50%;background:var(--bg-3)}
.caption{position:absolute;left:12px;bottom:12px;max-width:340px;font-size:11px;line-height:1.5;color:var(--text-dim);background:#1d1f22cc;border-left:2px solid var(--mercurius);padding:6px 10px;z-index:3}
.caption b{color:var(--text);font-weight:500;display:block;font-size:12px}
.spinr{transform-box:view-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}} @keyframes rotr{to{transform:rotate(-360deg)}}

/* full device (third tier) */
.full{position:absolute;inset:0;background:var(--bg-1);display:flex;flex-direction:column;z-index:6}
.full .fh{height:28px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11.5px}
.full .fb{flex:1;display:flex;min-height:0;gap:0}
.full .fvis{flex:1;position:relative;display:grid;place-items:center;background:var(--bg-0);border-right:1px solid var(--line)}
.full .fpar{width:360px;flex:none;overflow:auto;padding:6px 0}

/* ============================== rack (detail) ============================== */
.ch{grid-area:ch;min-width:0;min-height:0;display:flex;flex-direction:column;padding-bottom:4px;padding-right:4px}
.rackh{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--bg-1);border:1px solid var(--line);border-bottom:none;font-size:11px;white-space:nowrap}
.rackh .t b{font-weight:500}
.rackh .r{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--text-faint);font-size:10px}
.mi{display:flex;gap:1px}
.mi button{height:18px;padding:0 6px;font-size:10px;background:var(--bg-0);color:var(--text-faint);border:1px solid #30343a;display:flex;align-items:center;gap:4px}
.mi button b{font-weight:500;color:var(--text-dim)}
.mi button.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)} .mi button.on b{color:#1d1f22}
.mi button.x{color:var(--text-dim)}
.cut{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-faint)}
.cut .sw{display:flex;border:1px solid #30343a}
.cut .sw span{padding:0 6px;height:17px;line-height:16px;background:var(--bg-0);cursor:pointer}
.cut .sw span.on{background:var(--mercurius);color:#1d1f22}
.chain{flex:1;min-height:0;display:flex;gap:6px;padding:8px;overflow:hidden;align-items:stretch;background:var(--bg-1);border:1px solid var(--line)}
.dev{background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.dev.sel{outline:1px solid var(--accent);outline-offset:-1px}
.dev.off .db{opacity:.4}
.dh{height:21px;display:flex;align-items:center;gap:5px;padding:0 5px;border-bottom:1px solid var(--line);font-size:11px;cursor:default;white-space:nowrap}
.dh .pw{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);flex:none;cursor:pointer} .dh .pw.off{border-color:var(--text-faint)}
.dh .own{font-size:9px;color:var(--text-faint)}
.dh .x{margin-left:auto;display:flex;gap:7px;color:var(--text-faint);font-size:10px} .dh .x span{cursor:pointer} .dh .x span:hover{color:var(--text)}
.db{flex:1;display:flex;gap:10px;padding:7px;min-height:0}
.dev.folded{width:24px} .dev.folded .db{display:none}
.dev.folded .dh{writing-mode:vertical-rl;height:auto;flex:1;border:none;padding:6px 0;justify-content:flex-start;gap:7px;align-items:center;width:22px}
.vis{background:var(--bg-0);border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.ctrls{display:grid;grid-template-columns:repeat(2,minmax(62px,auto));gap:8px 4px;align-content:start}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;cursor:ns-resize;user-select:none}
.knob .kl,.tog .kl{font-size:9.5px;color:var(--text-dim);white-space:nowrap} .knob .kv{font-size:9.5px;font-family:var(--mono);color:var(--text)}
.knob.mod svg path:nth-child(2){stroke:var(--sel)}
.tog{display:flex;flex-direction:column;align-items:center;gap:3px;grid-column:span 2}
.tog.half{grid-column:span 1}
.tog .tg{display:flex;border:1px solid var(--line)}
.tog .tg span{font-size:9.5px;padding:1px 5px;background:var(--bg-0);color:var(--text-faint);cursor:pointer;white-space:nowrap} .tog .tg span.on{background:var(--accent);color:#1d1f22}
.dropz{width:150px;flex:none;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--text-faint);font-size:11px;padding:10px}
.dlist{display:flex;flex-direction:column;gap:2px;width:150px}
.dli{display:flex;align-items:center;gap:6px;height:20px;padding:0 5px;background:var(--bg-1);border:1px solid var(--line);font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.dli .n{overflow:hidden;text-overflow:ellipsis;flex:1}
.dli.on{border-color:var(--accent);color:var(--text)} .dli .d{width:14px;font-family:var(--mono);color:var(--text-faint);font-size:9px}
.ladder2{display:flex;flex-direction:column-reverse;gap:1px;width:128px}
.ladder2 div{height:15px;font-size:9px;padding:0 5px;display:flex;align-items:center;gap:5px;background:var(--bg-0);color:var(--text-faint);white-space:nowrap;cursor:pointer}
.ladder2 div.on{background:#7ec3e633;color:var(--text)} .ladder2 div.cur{background:var(--w-field);color:#1d1f22}
.ladder2 div i{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ============================== context dock ============================== */
.dk{grid-area:dk;min-height:0;min-width:0;display:flex;flex-direction:column;border-left:4px solid var(--line);margin-top:4px;position:relative;background:var(--bg-1)}
.tilesh{height:24px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:11px}
.tilesh .r{margin-left:auto;display:flex;gap:3px}
.tiles{flex:1;min-height:0;overflow:auto;padding:5px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:5px;align-content:start}
.tile{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;min-width:0}
.tlh{height:24px;display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--bg-2);font-size:11px;border-bottom:1px solid var(--line)}
.tlh .t{flex:1;white-space:nowrap} .tlh .x{color:var(--text-faint);font-size:10px;display:flex;gap:7px} .tlh .x span{cursor:pointer} .tlh .x span:hover{color:var(--text)}
.tlb{position:relative;overflow:hidden}
.launch{height:300px;flex:none;border-top:5px solid var(--line);display:flex;flex-direction:column;background:var(--bg-2);margin-bottom:4px}
.launch.folded{height:30px}
.lh{height:25px;flex:none;display:flex;align-items:center;gap:5px;padding:0 5px;background:var(--bg-1);border-bottom:1px solid var(--line);font-size:11px}
.lh input{flex:1;min-width:0;height:18px;background:var(--bg-0);border:1px solid var(--line);padding:0 6px;font-size:10.5px;color:var(--text);outline:none}
.lh .f{color:var(--text-faint);cursor:pointer;width:16px;text-align:center}
.lgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:126px;gap:5px;padding:5px}
.lcell{border:1px solid var(--line);background:var(--bg-1);display:flex;flex-direction:column;cursor:pointer;position:relative;min-width:0}
.lcell:hover{border-color:var(--text-faint)} .lcell.on{border-color:var(--accent)}
.lcell .pv{flex:1;background:var(--bg-0);margin:4px;position:relative;overflow:hidden}
.lcell .nm{height:20px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10.5px;white-space:nowrap}
.lcell .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
/* trail */
.trl{display:flex;flex-direction:column;max-height:250px;overflow:auto}
.ten{display:grid;grid-template-columns:34px 16px minmax(0,1fr) auto;gap:6px;align-items:center;height:24px;padding:0 6px;font-size:10.5px;color:var(--text-dim);cursor:pointer;border-bottom:1px solid #ffffff06}
.ten:hover{background:var(--bg-2);color:var(--text)} .ten.cur{color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.ten .tm{font-family:var(--mono);font-size:9px;color:var(--text-faint)}
.ten .md{color:var(--text-faint);text-align:center;font-size:11px}
.ten .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ten .wb{font-size:8.5px;border:1px solid currentColor;border-radius:7px;padding:0 4px;line-height:11px}
/* field presence */
.prs{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;padding:5px 7px;border-bottom:1px solid #ffffff06;font-size:10.5px}
.prs .nm{color:var(--text)} .prs .ac2{color:var(--text-faint);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prs .bs{display:flex;gap:3px}
.prs .bs span{height:16px;padding:0 5px;font-size:9px;border:1px solid var(--line);background:var(--bg-0);color:var(--text-faint);cursor:pointer;display:grid;place-items:center}
.prs .bs span.on{color:var(--w-field);border-color:var(--w-field)}
.live-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green);position:relative}
.live-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:pulse 1.8s ease-out infinite}
.hive{position:relative;height:170px;background:radial-gradient(ellipse at 50% 60%,#3b4046 0,#30343a 70%);overflow:hidden}
.hive .bee{position:absolute;text-align:center;font-size:9.5px;color:var(--text-dim);cursor:pointer}
.hl{display:flex;align-items:center;gap:6px;padding:3px 7px;font-size:10.5px;cursor:default}
.hl .d{width:6px;height:6px;border-radius:50%;flex:none}
.hl .r{margin-left:auto;color:var(--text-faint);font-size:9.5px;font-family:var(--mono)}
.ctb{padding:7px 8px;font-size:11px;line-height:1.45;color:var(--text-dim)}
.ctb .who{font-size:10px;color:var(--text-faint);margin-bottom:2px} .ctb .who b{color:var(--text);font-weight:500}
.ctb .bubble{background:var(--bg-0);border:1px solid var(--line);padding:6px 8px;margin-bottom:6px}
.ctb .ret{border:1px dashed var(--w-ariadne);padding:6px 8px;margin-top:4px}
.srcv{padding:8px 10px;font-size:11px;line-height:1.55;color:var(--text-dim);font-family:Georgia,serif}
.srcv mark{background:var(--accent-soft);color:var(--text)}
.srcv .loc{font-family:var(--mono);font-size:9.5px;color:var(--sel);margin-bottom:5px}
.term{font-family:var(--mono);font-size:10px;line-height:1.5;padding:6px;color:var(--text-dim);background:#1f2124;height:150px;overflow:hidden}
.term .p{color:var(--fizz)} .term .o{color:var(--green)}

/* ============================== status ============================== */
.sb{grid-area:sb;margin:0 -6px;border-top:1px solid var(--line);background:var(--bg-1);display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--text-dim);font-size:11px;min-width:0}
.sb .i{width:16px;height:16px;border-radius:50%;background:var(--bg-3);display:grid;place-items:center;font-size:10px;flex:none}
.sb .info{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg-0);padding:2px 8px;height:20px}
.sb .info b{color:var(--text);font-weight:500;margin-right:6px}
.sb .tg{display:flex;gap:2px}
.sb .tg button{padding:1px 8px;color:var(--text-dim);display:flex;gap:4px;align-items:center;height:20px;border:1px solid var(--line)}
.sb .tg button.on{color:var(--accent)}

/* modal confirm (projection is outward-facing: always asks) */
.scrim{position:absolute;inset:0;background:#0008;z-index:50;display:none;place-items:center}
.scrim.on{display:grid}
.dlg{width:460px;background:var(--bg-1);border:1px solid var(--line-strong);box-shadow:0 20px 60px #000a}
.dlg .dh2{height:28px;display:flex;align-items:center;padding:0 10px;background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px}
.dlg .dbody{padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--text-dim)}
.dlg .dbody b{color:var(--text);font-weight:500}
.dlg .df{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}

/* sprites */
.bee-s .wing{transform-box:fill-box;transform-origin:50% 100%}
.bee-s.working .wing{animation:flap .12s infinite alternate}
.bee-s.working .bodyg{animation:bob 1.4s ease-in-out infinite}
.bee-s.idle .bodyg{animation:breathe 3.2s ease-in-out infinite}
@keyframes flap{to{transform:scaleY(.35)}} @keyframes bob{50%{transform:translateY(-1.5px)}} @keyframes breathe{50%{transform:translateY(.6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- ============ TRANSPORT — Live's controls, each given a World function ============ -->
<header class="tp">

  <div class="ctl">

        <text x="${ox+8}" y="${oy+i*26+14.5}" font-size="10.5" fill="${col2}">${KIND[e.kind].g}</text><text x="${ox+22}" y="${oy+i*26+14.5}" font-size="10.5" fill="#d4d7da">${e.n.length>24?e.n.slice(0,23)+'…':e.n}</text></g>`})}
  pathPts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="8" fill="#1d1f22" stroke="var(--tower)"/><text x="${q[0]}" y="${q[1]+3.5}" text-anchor="middle" font-size="9.5" fill="#d8c89a">${i+1}</text>`});
  /* portals */
  const ct=ROOMS.find(r=>r.id==='court');[['Ravenna','pl:ravenna',ct.x+.005,ct.y+ct.h+.035],['Ariadne’s vessel','vessel',ct.x+.09,ct.y+ct.h+.035]].forEach(([n,id,x,y])=>{
    s+=`<g class="pobj" data-enc="${id}" data-i="Portal · ${n}|A portal is an authored link out of the palace; walking through it is an encounter like any other."><path d="M${X(x)} ${Y(y)+16}v-10a7 7 0 0 1 14 0v10" fill="none" stroke="${id==='vessel'?'var(--w-ariadne)':'#d8c89a'}" stroke-width="1.5"/><text x="${X(x)+20}" y="${Y(y)+12}" font-size="10.5" fill="${id==='vessel'?'#c79ae0':'#cfc6a8'}">→ ${n}</text></g>`});
  return s+'</svg>'}
</script>
<script>
/* ============================== encounter bar ============================== */
function renderEncbar(){const e=subj(),oe=occE(),F=FIELDS[S.spine.field],W=WORLDS[S.spine.world]||WORLDS.central,cur=S.trail[S.ti];

   <button class="back" id="eBack" ${S.ti>0?'':'disabled'} data-i="Back|Return to the previous encounter (the trail keeps them all).">‹</button><button class="back" id="eFwd" ${S.ti<S.trail.length-1?'':'disabled'} data-i="Forward|Forward along the trail.">›</button>
   <div class="spine">
    <span class="sc" data-spine="field" data-i="Field|The SharedField the encounter stands in. ${F.n} · ${F.carrier||'federated'}${F.nested?' · nested in the public field':''}."><small>field</small><span class="dot" style="background:var(--w-field)"></span>${F.ref}</span><span class="ch">›</span>

    <span class="sc" data-spine="subject" data-i="Subject|What is encountered — the exact ref every pane and device operates on." style="max-width:300px"><small>subject</small>${kg(e.kind,hueOf(e))}<b style="font-weight:500">${e.n}</b><small>${e.st!=='fact'?e.st:''}</small></span><span class="ch">›</span>
    <span class="sc" data-spine="occ" data-i="Occasion|The time and place the panes stand in. ${S.clock==='now'?'Driven by Now.':'A retained occasion keeps its sky snapshot and separately says what is admitted now.'}"><small>occasion</small>${occTxt}${S.clock==='occasion'&&oe&&oe.y<TODAY0?' <span style="color:var(--green)">✓ retained</span>':''}</span>
   </div>
   ${cur?`<span class="med" data-i="Mediation|How this encounter happened — part of what it records (Encounter contract).">${MED[cur.med][0]} ${MED[cur.med][1]} · ${cur.t}</span>`:''}
   <span class="r"><span class="gl">panes</span>${['solo','duo','quad'].map(l=>`<button class="nc ${L().layout===l?'on':''}" data-layout="${l}" data-i="${l==='solo'?'One pane':l==='duo'?'Two panes':'Four panes'}|${l==='quad'?'All four projections of the one encounter — the vertical proof in one frame.':'Panes are real panes; each holds a projection and its own rack.'}">${l==='solo'?'▢':l==='duo'?'◫':'⊞'}</button>`).join('')}</span>`}

function renderPanes(){const ct=$('#ct');ct.className='ct '+L().layout;const ps=panes();

  ps.forEach((p,i)=>{const pb=ct.querySelector(`[data-pb="${i}"]`);if(p.proj==='timeline'&&p.tl!=='scenes')requestAnimationFrame(()=>tlOverlay(p,pb));if(p.proj==='constellation'&&p.cn==='canvas')requestAnimationFrame(()=>cvEdges(pb))})}
function paneHead(p,i){const ins=instOf(p),I=INST[ins];

  let r='';
  if(p.full)r=`<button class="nc" data-full-close="${i}" data-i="Back|Return to the projection; the device stays on the rack.">← ${PROJ[p.proj].n}</button>`;
  else if(p.proj==='earth'){const vis=p.world&&p.world!=='central';r=vis?`<button class="chip" style="border-color:${WORLDS[p.world].hex};color:${WORLDS[p.world].hex}" data-home="${i}" data-i="Visiting|You are seeing ${WORLDS[p.world].n}’s projection. Click to fly home.">visiting ${WORLDS[p.world].n} · ⌂ home</button>`:'';
    r+=`<button class="nc ${p.showRoute?'on':''}" data-route="${i}" data-i="Walks|Show authored walks (M3′ Journeys) as routes on the World.">⤳</button>`}
  else if(p.proj==='timeline')r=`<div class="seg">${[['arr','Arrangement'],['scenes','Scenes']].map(([k,l])=>`<button class="${p.tl===k?'on':''}" data-tl="${i}.${k}" data-i="${l}|${k==='arr'?'M2′ Relation Field: the World’s material over time — authored history beside the development that made it.':'M3′ Journey: a walk as scene rows. Launch a row and every pane goes there.'}">${l}</button>`).join('')}</div>`+
    (p.tl!=='scenes'?`<div class="seg">${['chronology','causal','recurrence','concurrency'].map(k=>`<button class="${(p.lens||'chronology')===k?'on':''}" data-lens="${i}.${k}" data-i="${k}|${LENSTIP[k]}">${k}</button>`).join('')}</div>`:'');
  else if(p.proj==='constellation')r=`<div class="seg">${[['field','Field'],['canvas','Canvas']].map(([k,l])=>`<button class="${p.cn===k?'on':''}" data-cn="${i}.${k}" data-i="${l}|${k==='field'?'M0′ the field of your World: search leaf → bounded local whole → expand.':'M1′ the artefact suite: arrange, frame, annotate, relate. Drawing is presentation; typed relations go through native Actions.'}">${l}</button>`).join('')}</div>`+
    (p.cn==='field'?`<div class="seg">${['list','tree','graph','form'].map(k=>`<button class="${(p.cnv||'graph')===k?'on':''}" data-cnv="${i}.${k}" data-i="${k}|${k==='form'?'The same bounded whole as a graph-expression — the field of your World given form (the M0 conjugate). Same nodes, same refs.':'LIST ↔ TREE ↔ GRAPH over one selection state (M0′ #213).'}">${k}</button>`).join('')}</div>`:'');
  else if(p.proj==='expression')r=`<button class="nc" data-cross="${i}" data-i="Cross the cut|Open the same subject in its deep 4:2 instrument (${INST[p.from||'M4'].k} ${INST[p.from||'M4'].n}). Disclosure changes; identity does not.">⇄ deep · ${INST[p.from||'M4'].k}</button>`;
  return `${icons}${inst}<span class="crumb">${p.world&&p.world!=='central'&&p.proj==='earth'?WORLDS[p.world].n+' › ':''}<b>${subj().n}</b></span><span class="r">${r}${panes().length>1?`<span class="x" data-solo="${i}" data-i="Solo|Make this the only pane.">◱</span>`:''}</span>`}
const PROJTIP={earth:'Where. The World as a planet among Worlds: field, orbit, surface, place, palace.',timeline:'When. Authored history and live development on one ruler; walks as scene rows.',constellation:'How related. The bounded local whole of the encounter, or the Canvas where artefacts are composed.',expression:'What form. The lived 3:3 reading of the same subject.'};
const LENSTIP={chronology:'Occurrences in time on a non-linear ruler: deep time compressed honestly, today at hour scale.',causal:'Draw the typed relations among clips — CAUSES, INFLUENCES, ECHOES — in their standing. Nothing becomes causal by placement.',recurrence:'The subject’s recurrences across tracks, joined as echoes.',concurrency:'Today at full width: runs, NOWs and Days side by side — the development field.'};

function paneBody(p,i){
  if(p.full)return fullDevice(p.full);
  if(p.proj==='earth'){if(p.scale==='palace')return palaceBody(p,i);
    return `<div class="earth"><canvas data-cv="${i}"></canvas><div class="mk"></div>
     <div class="hud tl"><div class="ladder">${SCALES.map(([k,l,tip])=>`<button class="${p.scale===k?'on':''}" data-scale="${i}.${k}" data-i="${l}|${tip}"><i></i>${l}</button>`).join('')}</div>
      ${p.scale==='orbit'?`<div class="layer-chips" style="margin-top:6px">${[['m1','M1 torus','The harmonic carrier (QL-MEF M1).'],['m2','M2 sky','The planetary field from the kerykeion provider — now or the retained occasion.'],['m3','M3 clock','The world clock: inscription and lens arcs.']].map(([k,l,tt])=>`<button class="${(p.cos||{m1:1,m2:1,m3:1})[k]?'on':''}" data-cos="${i}.${k}" data-i="${l}|${tt} Read-only here: the cosmos is supplied by its native owner, never computed in the renderer."><i></i>${l}</button>`).join('')}</div>`:''}</div>
     <div class="hud bl"><div class="legend">${earthLegend(p)}</div></div>
     <div class="hud br"><span class="chip mono">${earthReadout(p)}</span></div></div>`}
  if(p.proj==='timeline')return p.tl==='scenes'?scenesBody(p,i):tlBody(p,i);
  if(p.proj==='constellation')return p.cn==='canvas'?canvasBody(p,i):cnBody(p,i);
  return exBody(p,i)}
function earthLegend(p){const rows=[];const s=subj();
  rows.push(`<div class="li"><i style="background:var(--mercurius)"></i>Mercurius</div><div class="li"><i style="background:var(--selfc)"></i>the Self</div>`);
  rows.push(`<div class="li"><i style="background:transparent;border:1px solid var(--tower);border-radius:0"></i>palace · special place</div>`);
  if(S.ap>=2)rows.push(`<div class="li"><i style="border:1px dashed var(--w-ariadne);background:transparent"></i>projected from another World</div>`);
  if(Object.keys(PLACED).length)rows.push(`<div class="li"><i style="border:1px dashed var(--accent);background:transparent"></i>placed · presentation</div>`);
  return rows.join('')}
function earthReadout(p){const c=camOf(p);if(p.scale==='field')return `${Object.keys(WORLDS).filter(w=>worldAdmitted(w,S.ap)&&!WORLDS[w].project).length} worlds · aperture ${APERTURE[S.ap].k.toLowerCase()}`;
  const pl=placeOf(subj());if(p.scale==='place'&&pl)return `${pl.la.toFixed(3)}°N ${pl.lo.toFixed(3)}°E · ${pl.n} · ${pl.pr} · ${pl.frame}`;
  return `${Math.abs(c.lat+ (p.scale==='surface'?6:14)).toFixed(1)}°${c.lat>=0?'N':'S'} ${c.lon.toFixed(1)}°E · drag to turn · wheel to zoom`}
function palaceBody(p,i){const r=ROOMS.find(x=>x.id===(S.room||'stone'));
  return `<div class="palace" data-palace="${i}">${palaceSVG(p,1200,780)}
   <div class="hud tl"><div class="ladder">${SCALES.map(([k,l,tip])=>`<button class="${p.scale===k?'on':''}" data-scale="${i}.${k}" data-i="${l}|${tip}"><i></i>${l}</button>`).join('')}</div></div>
   <div class="hud tr"><span class="chip"><b>Bollingen Tower</b> · palace · 5 rooms · 14 native refs</span></div>
   ${S.epii?`<div class="epii"><div class="w"><span style="color:var(--tower)">✦</span><b>Epii · Technē₅</b> · ${r.n}</div>${r.why}<div style="display:flex;gap:5px;margin-top:7px"><button class="bt" data-room-next="1" data-i="Next room|Follow the guided path — never compulsory; any room is one click away.">Next room ›</button><button class="bt" data-i="Propose a room|Epii prepares a proposal: a new room composed from the selection. Proposals return through Recognition, not by writing.">Propose…</button></div></div>`:''}</div>`}

/* ---------- Timeline ---------- */
const AN=[[-600,0],[0,6],[1000,11],[1500,16],[1600,21],[1875,27],[1900,33],[1913,37],[1925,42],[1933,46],[1944,50],[1950,53],[1961,56],[2000,58.5],[2026.6,60]];
function tx(y,lens){const conc=lens==='concurrency';const dEnd=conc?14:60,tS=conc?16:62;
  if(y>=TODAY0){const h=(y-TODAY0)*365*24;return tS+(clamp(h,7,22)-7)/15*(99-tS)}
  let v=AN[AN.length-1][1];for(let k=1;k<AN.length;k++){if(y<=AN[k][0]){const[y0,p0]=AN[k-1],[y1,p1]=AN[k];v=p0+(y-y0)/(y1-y0)*(p1-p0);break}}
  if(y<AN[0][0])v=0;return v/60*dEnd}
function tlClips(t){
  if(t.occ)return Object.values(E).filter(e=>e.kind==='occurrence'&&e.subj===t.occ&&ownE(e)).sort((a,b)=>a.y-b.y).map(e=>({y0:e.y,n:e.n.split(' · ')[1]||e.n,st:e.st,e:e.id,occ:1}));
  if(t.walk)return WALK.map((s,i)=>({y0:E[s.e].y||1955,n:String(i+1),e:s.e,pt:1,walk:i}));
  if(t.shared)return Object.values(E).filter(e=>!ownE(e)&&e.y!=null&&e.kind!=='contribution'&&admitted(e)).map(e=>({y0:e.y,y1:e.y1,n:e.n.split(' · ')[1]||e.n,st:e.st,e:e.id,w:e.w,occ:1}));
  return t.clips.map(c=>({...c,y0:c.y0??ty(c.h0),y1:c.h1==='live'?ty(CLOCK.nowH):c.h1!=null?ty(c.h1):c.y1}))}
function paneW(){const cw=1908-($('#tBrowser').classList.contains('on')?400:0)-($('#tDock').classList.contains('on')?S.dockW+4:0)-4;return L().layout==='solo'?cw:(cw-4)/2}
function tlBody(p,i){const lens=p.lens||'chronology';const rows=[];const pw=paneW(),hw=pw>1000?210:pw>700?168:142,lw=pw-hw;
  for(const t of TRACKS){if(t.ap&&S.ap<t.ap)continue;
    if(t.g){rows.push(`<div class="arow grp"><div class="lane"></div><div class="ahead"><span class="nmc">${t.g}</span></div></div>`)}
    const hid=S.hideTrack.has(t.id);const clips=hid?[]:tlClips(t);
    const cs=clips.map((c,k)=>{const x0=tx(c.y0,lens);let x1=c.y1!=null?tx(c.y1,lens):null;
      if(x1==null||x1-x0<.6){const nx=clips[k+1]?tx(clips[k+1].y0,lens):99;x1=c.pt?null:Math.min(x0+7,nx-.25)}
      const e=c.e&&E[c.e];const sel=c.e&&c.e===S.spine.subject;const inWin=!S.win||c.y0>=TODAY0||(c.y0>=S.winA&&c.y0<=S.winB);
      const col=c.w?hueOfW(c.w):t.c;const st=c.st&&c.st!=='fact'?c.st:'';
      const title=`${e?e.n:c.n}|${fmtY(c.y0)}${c.y1&&c.y1!==c.y0?' → '+fmtY(c.y1):''} · ${c.st||'fact'}${c.w?' · projected by '+WORLDS[c.w].n:''}${c.live?' · live':''}`;
      if(c.pt)return `<div class="ac pt ${sel?'sel':''}" style="--tc:${col};left:calc(${x0}% - 4px);${inWin?'':'opacity:.3'}" ${c.e?`data-enc="${c.e}"`:''} ${c.walk!=null?`data-walk="${c.walk}"`:''} data-i="${title}"></div>`+(c.walk!=null||t.id==='revs'||t.id==='fnow'||t.id==='sky'?`<span style="position:absolute;left:calc(${x0}% + 7px);top:6px;font-size:9px;color:${c.w?hueOfW(c.w):'var(--text-faint)'};white-space:nowrap;pointer-events:none">${c.w?WORLDS[c.w].n:c.n}</span>`:'');
      return `<div class="ac ${st} ${sel?'sel':''} ${c.live?'live':''}" style="--tc:${col};left:${x0}%;width:calc(${Math.max(.4,x1-x0)}% - 1px);${c.sub?'top:14px;':''}${inWin?'':'opacity:.3'}" ${c.e?`data-enc="${c.e}"`:''} data-i="${title}">${c.n}</div>`+(c.live?`<div class="needle" style="--tc:${t.c};left:${x1}%"></div>`:'')}).join('');
    rows.push(`<div class="arow" data-row="${t.id}" style="${t.id==='jung'?'min-height:30px':''}"><div class="lane ${t.sub?'sub':''}">${cs}</div><div class="ahead"><span class="nmc" style="--tc:${t.c};background:${t.c}">${t.agent?bee(t.agent,14):''}${t.n}</span>${t.shared?'<span class="wb" style="color:var(--w-field)">shared</span>':''}<span class="m ${hid?'':'on'}" data-hide="${t.id}" data-i="Activator|Live’s track activator: admit this lane’s material into the projection, or silence it.">${TRACKS.indexOf(t)+1}</span></div></div>`)}
  /* ticks thinned to the measured lane width, by priority */
  const cand=[[ty(14),'14:00',1],[1950,'1950'],[ty(8),'today 08:00'],[1900,'1900'],[ty(18),'18:00'],[ty(11),'11:00'],[1600,'1600'],[0,'1 CE'],[1925,'1925'],[-500,'500 BCE'],[1500,'1500'],[2000,'2000'],[ty(16),'16:00'],[ty(12),'12:00'],[ty(20),'20:00'],[ty(10),'10:00']];
  const kept=[];for(const c of cand){const x=tx(c[0],lens)/100*lw;if(kept.every(k=>Math.abs(k.x-x)>(k.c[1].length*6+12))&&kept.every(k=>Math.abs(k.x-x)>(c[1].length*6+12)))kept.push({x,c})}
  const ticks=kept.map(({c})=>`<span class="${c[2]?'today':''}" style="left:${tx(c[0],lens)}%">${c[1]}</span>`).join('');
  const oe=occE();const nx=tx(ty(CLOCK.nowH),lens);
  const cur=`<div class="cursor now" style="left:${nx}%"><span class="rd">now ${nowLabel()}</span></div>`+(oe&&oe.y!=null&&oe.y<TODAY0?`<div class="cursor occ" style="left:${tx(oe.y,lens)}%"><span class="rd">occasion ${fmtY(oe.y)}</span></div>`:'')+(S.walkI>=0?`<div class="cursor tr" style="left:${tx(E[WALK[S.walkI].e].y||1955,lens)}%"><span class="rd" style="top:16px;color:var(--sel)">walk ${S.walkI+1}/${WALK.length}</span></div>`:'');
  const brk=lens==='concurrency'?15:61;
  return `<div class="tl" data-tl="${i}" style="--hw:${hw}px"><div class="ov"><i style="left:${S.win?tx(S.winA,lens):0}%;width:${S.win?tx(S.winB,lens)-tx(S.winA,lens):99}%"></i></div>
   <div class="ruler"><div class="ticks">${ticks}<span style="left:${brk}%;border-left:1px dashed var(--text-faint);color:var(--text-faint)"> ⟩</span></div><div class="rset">${lens==='concurrency'?'today · hours':'non-linear · deep → today'}</div></div>
   <div class="arows"><div style="position:absolute;left:0;top:0;bottom:0;right:var(--hw,190px);pointer-events:none;z-index:3">${cur}<div style="position:absolute;left:${brk}%;top:0;bottom:0;width:${lens==='concurrency'?1:1}px;border-left:1px dashed #ffffff20"></div></div>${rows.join('')}<svg class="rel" data-rel="${i}"></svg></div></div>`}
/* relation overlay — typed, in standing; drawn after layout from measured clip positions */
function tlOverlay(p,pb){const svg=pb.querySelector('svg.rel');if(!svg)return;const lens=p.lens||'chronology';
  const want=lens==='causal'||lens==='recurrence';if(!want){svg.innerHTML='';return}
  const box=pb.querySelector('.arows').getBoundingClientRect(),s=box.width/pb.querySelector('.arows').clientWidth||1;
  const at=id=>{const el=pb.querySelector(`.lane [data-enc="${CSS.escape(id)}"]`);if(!el)return null;const r=el.getBoundingClientRect();return [(r.left-box.left+Math.min(r.width,40)/2)/s,(r.top-box.top+r.height/2)/s+pb.querySelector('.arows').scrollTop]};
  let h='<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#d4d7da"/></marker></defs>';
  const pairs=[];
  if(lens==='causal'){for(const [a,b,t,st] of R)if(['CAUSES','INFLUENCES','ECHOES','INHERITS','TRANSFORMS_INTO'].includes(t))pairs.push([a,b,t,st]);
    if(S.admitted.has('contrib:vessel'))pairs.push(['vessel','stone1950','ECHOES','claim'])}
  else{const sj=subj().subj||'mercurius';const occs=Object.values(E).filter(e=>e.kind==='occurrence'&&e.subj===sj&&admitted(e)).sort((a,b)=>a.y-b.y);for(let k=0;k<occs.length-1;k++)pairs.push([occs[k].id,occs[k+1].id,'recurs','inferred'])}
  for(const [a,b,t,st] of pairs){const A1=at(a),B1=at(b);if(!A1||!B1)continue;const mx=(A1[0]+B1[0])/2,my=Math.min(A1[1],B1[1])-28;

  else if(C==='journeys')rows=Object.keys(JOURNEYS).map(k=>bitem(E[k])).join('')+`<div class="bitem" style="color:var(--text-faint)" data-i="Record a walk|● in the transport records your encounters as a new Journey.">● record a walk</div>`;

  else if(C==='fields')rows=Object.keys(FIELDS).filter(f=>f!=='commons'||S.ap>=3).map(f=>`<div class="bitem ${S.spine.field===f?'on':''}" data-field="${f}" data-i="${FIELDS[f].n}|${FIELDS[f].ref}${FIELDS[f].nested?' · nested in the public field (contain)':''}${FIELDS[f].federated?' · federated (federate ≠ contain)':''}">${kg('world','#7ec3e6')}<span class="nm">${FIELDS[f].ref}</span><span class="st">${FIELDS[f].members.length} worlds</span></div>`).join('');
  else if(C==='contribs')rows=S.ap>=2?bitem(E['contrib:vessel'])+`<div class="bsep">${S.admitted.has('contrib:vessel')?'admitted 14:41 · in your World as a claim':'awaiting your admission'}</div>`:`<div class="bitem" data-widen="1" style="color:var(--w-field)">＋ widen to the shared field</div>`;

  else if(C==='devices'){const fam={'QL-MEF':['torus','sky','clock'],'Nara':['nara'],'Expressions':['glyph','cym'],'Technē':['explore','relate','arrange','lens','place','journey','palace'],'SharedField':['projection','field','contact'],'Factory · Central':['run','day','techne','source']};

  else if(pl.type==='world'||(pl.type==='enc'&&E[pl.id]?.kind==='world')){const w=E[pl.id].w;const W=WORLDS[w];icon=kg('world',W.hex);name=W.n;kind=W.own?'your World':W.project?'project world':W.federated?'federated field':'participant · projection';
    const n=Object.values(E).filter(e=>e.w===w&&e.kind!=='world').length;
    b=`<div class="lead">${W.own?'Your World: canonical, local, yours. Everything else in the field is a projection of someone’s World.':W.activity}<small>${W.ref}${W.presence?' · '+W.presence:''}</small></div>
     <div class="row"><span class="k">Presence</span><span>${W.presence==='live'?'<span class="live-dot"></span> live':W.presence||'—'}</span></div>
     <div class="row"><span class="k">Fields</span><span>${(W.fields||[]).map(f=>FIELDS[f].ref).join(' · ')||'—'}</span></div>
     <div class="row"><span class="k">${W.own?'Holds':'Projected'}</span><span>${W.own?Object.values(E).filter(e=>e.w==='central').length+' artefacts · '+Math.round(Object.values(E).filter(e=>e.w==='central'&&projOf(e)>=5).length/Object.values(E).filter(e=>e.w==='central').length*100)+'% projected':n+' artefacts visible to you'}</span></div>
     ${W.agents?`<div class="row"><span class="k">Agents</span><span>${bee('parasakti',16)} Parasakti · A2A available</span></div>`:''}
     <div class="acts">${W.own?`<button class="bt pri" data-homego="1">⌂ Orbit</button><button class="bt" data-viewas="field">See as the field sees it</button>`:`<button class="bt pri" data-visit="${w}" data-i="Visit|Land on ${W.n}’s World: only what ${W.n} has projected is visible.">Visit ${W.n}</button><button class="bt ${S.watch.has(w)?'on':''}" data-watch="${w}">${S.watch.has(w)?'◉ Watching':'○ Watch'}</button>${W.agents?`<button class="bt fld2" data-contact="parasakti">Contact Parasakti…</button>`:''}`}</div>`}
  else if(pl.type==='room'){const r=ROOMS.find(x=>x.id===pl.id);icon='⌂';name=r.n;kind='palace room · Bollingen Tower';
    b=`<div class="lead">${r.why}</div><div class="sec">Objects · native refs</div>${r.objs.map(id=>bitem(E[id],'palace')).join('')}`}
  else{const e=E[pl.id]||subj();icon=kg(e.kind,hueOf(e));name=e.n;kind=KIND[e.kind].l+' · '+(ownE(e)?'local':WORLDS[e.w].n);
    const rel=nbrs(e.id).slice(0,8);const p0=placeOf(e);const own=ownE(e);
    b=`<div class="lead">${e.n}<small>${KIND[e.kind].l} · ${e.st}${own?'':' · projected by '+WORLDS[e.w].n}${e.y!=null?' · '+fmtY(e.y):''}${p0?' · '+p0.n:''}</small></div>
     <div class="sec">Show as</div><div class="acts" style="padding-top:2px">${Object.keys(PROJ).map(k=>`<button class="bt" data-showas="${k}" data-i="${PROJ[k].n}|Open the focused pane in this projection — same subject.">${PICON[k].replace('width="13" height="13"','width="11" height="11"')}</button>`).join('')}
      ${e.place?`<button class="bt" data-placego="1" data-i="Place|Land on the place at Place scale.">▲ ${p0.n}</button>`:''}${e.kind==='palace'?`<button class="bt pri" data-enter="palace">⌂ Enter</button>`:''}</div>
     <div class="sec">Act</div><div class="acts" style="padding-top:2px">
      <button class="bt" data-addwalk="1" data-i="Add to walk|Append as a scene to the Mercurius walk (M3′).">＋ walk</button>
      <button class="bt" data-placeit="1" data-i="Place on the World|Arm the Place tool: click the globe to place this artefact (presentation).">✎ place</button>
      ${own?`<button class="bt" data-project="1" data-i="Project…|Propose into a field. Asks first.">◐ project…</button>`:e.kind==='contribution'?`<button class="bt pri" data-admit="contrib:vessel" ${S.admitted.has('contrib:vessel')?'disabled':''}>${S.admitted.has('contrib:vessel')?'admitted':'Admit…'}</button>`:`<button class="bt fld2" data-contact="parasakti" ${e.w==='ariadne'?'':'disabled'}>⇄ contact</button>`}
      <button class="bt" data-ask="1" data-i="Ask Technē|Ask the instrument’s agency about this subject.">✦ ask</button></div>
     <div class="sec"><span>Relations · ${rel.length}</span><span>typed · in standing</span></div>
     ${rel.map(n=>{const x=E[n.id];return `<div class="bitem" data-enc="${n.id}" data-med="traversal" data-i="${n.t} · ${n.st}|${n.dir==='out'?e.n+' → '+x.n:x.n+' → '+e.n}"><span class="faint mono" style="font-size:9px;width:92px;overflow:hidden;text-overflow:ellipsis">${n.dir==='in'?'← ':''}${n.t}</span>${kg(x.kind,hueOf(x))}<span class="nm">${x.n}</span>${ownE(x)?'':wbadge(x.w)}</div>`}).join('')}
     ${own?`<div class="sec"><span>Disclosure</span><span>${LADDER[projOf(e)]}</span></div><div style="padding:2px 8px"><div style="display:flex;gap:2px">${LADDER.map((l,k)=>`<i style="flex:1;height:5px;background:${k<=projOf(e)?'var(--w-field)':'var(--bg-0)'}" title="${l}"></i>`).join('')}</div></div>`:''}

function fullDevice(d){const D=DEV[d];return `<div class="full"><div class="fh">⤢ <b style="font-weight:500">${devName(d,chainKey(fp()))}</b><span class="faint">${D.own} · full · the same values as the rack and the pool</span></div>

const CTX={trail:{n:'Trail',g:'↩',i:'Every encounter with its mediation — search, traversal, journey, palace, contact. Click to return.'},
  field:{n:'Field',g:'◎',i:'Who is present in your fields, what they are doing, and what is waiting for your admission.'},

  nows:{n:'NOWs',g:'◔',i:'Active NOWs on each machine — every agent process is findable in some NOW.'},

function tileBody(k){
  if(k==='trail')return `<div class="trl">${S.trail.map((t,i)=>({t,i})).reverse().map(({t,i})=>{const e=E[t.id];return `<div class="ten ${i===S.ti?'cur':''}" data-trail="${i}" data-i="${MED[t.med][1]} · ${t.t}|${e.n}"><span class="tm">${t.t}</span><span class="md">${MED[t.med][0]}</span><span class="n">${e.n}</span>${ownE(e)?'':wbadge(e.w)}</div>`}).join('')||'<div class="ctb">No encounters yet.</div>'}</div>`;
  if(k==='field'){const ws=['central','ariadne','satya','kestrel'].filter(w=>worldAdmitted(w,S.ap));
    return ws.map(w=>{const W=WORLDS[w];return `<div class="prs"><span>${kg('world',W.hex,18)}</span><div style="min-width:0"><div class="nm">${W.n}${W.own?' · you':''} ${W.presence==='live'?'<span class="live-dot"></span>':''}</div><div class="ac2">${W.own?W.activity:W.activity}</div></div><div class="bs">${W.own?'':`<span class="${S.watch.has(w)?'on':''}" data-watch="${w}" data-i="Watch|Follow ${W.n}’s Activity in the field.">◉</span><span data-visit="${w}" data-i="Visit|Land on ${W.n}’s projected World.">visit</span>`}</div></div>`}).join('')+
    (S.ap>=2&&!S.admitted.has('contrib:vessel')?`<div class="ctb" style="border-top:1px solid var(--line)"><div class="who"><b style="color:var(--w-ariadne)">Ariadne</b> contributed · 14:12</div>vessel <span class="mono" style="font-size:10px">ECHOES</span> the stone · claim · basis Rosarium pl. 10<div style="display:flex;gap:4px;margin-top:6px"><button class="bt pri" data-admit="contrib:vessel" data-i="Admit|Admit as a claim into your World. It keeps Ariadne as its source; nothing becomes a fact by admission.">Admit</button><button class="bt" data-enc="contrib:vessel">Inspect</button><button class="bt">Decline</button></div></div>`:'')+(S.ap<2?`<div class="ctb">Aperture ${APERTURE[S.ap].k}: the shared field is outside it.</div>`:'')}
  if(k==='agents')return `<div class="hive">${[['fizz',38,32,'run #214'],['honey',150,22,'glyphs ✓'],['bumble',96,96,'review next']].concat(S.ap>=2?[['parasakti',210,100,'Ariadne · A2A']]:[]).map(([a,x,y,l])=>`<div class="bee" style="left:${x}px;top:${y}px" data-enc="${a==='parasakti'?'parasakti':a==='honey'?'expr:glyph':'run:214'}" data-i="${A[a].n}|${A[a].doing} · ${A[a].at}">${bee(a,a==='fizz'?44:34)}<div>${A[a].n} · ${l}</div></div>`).join('')}</div>`+
    Object.keys(A).filter(a=>!A[a].other).map(a=>`<div class="hl"><span class="d" style="background:${A[a].hex}"></span>${A[a].n}<span class="faint" style="margin-left:4px">${A[a].doing.slice(0,30)}</span><span class="r">${A[a].at.split(' · ')[0]}</span></div>`).join('');
  if(k==='sky')return `<div style="display:flex;gap:8px;padding:8px;align-items:center"><div>${V.sky(118)}</div><div style="font-size:10px;line-height:1.6">${BODIES.map((b,i)=>`<div><span style="color:${b[2]}">${b[0]}</span> ${b[1]} <span class="mono faint">${(S.clock==='occasion'?SKY.occ:SKY.now)[i]}°</span></div>`).join('')}</div></div>`;
  if(k==='source'){const e=subj();return `<div class="srcv"><div class="loc">${e.prov||'—'}</div>${e.id==='stone1950'||e.id==='palace'||e.id==='tower1923'?'The chapter tells of the tower built in stages from 1923 and of the cube of stone at the water’s edge, carved in 1950 — <mark>a stone that became a place of inscription</mark>, and later a figure for the whole work.':e.subj==='mercurius'?'The essay treats Mercurius as the arcane substance of the alchemists — <mark>both the vessel and what it contains</mark> — and follows the figure through its paradoxes.':'The account places the experience in the year and house it names; the locator opens the exact passage in the vault.'}<div class="faint" style="font-family:var(--mono);font-size:9px;margin-top:6px">paraphrase · open the passage ↗</div></div>`}
  if(k==='nows')return `<div class="hl"><span class="d" style="background:#7f9aa8"></span>mac · env-1<span class="faint" style="margin-left:4px">fizz · seat o-i</span><span class="r">live</span></div><div class="hl"><span class="d" style="background:#7f9aa8"></span>mac · env-2<span class="faint" style="margin-left:4px">bumble · idle</span><span class="r">idle</span></div><div class="hl"><span class="d" style="background:#7f9aa8"></span>omarchy · herdr<span class="faint" style="margin-left:4px">honey · returned</span><span class="r">quiet</span></div><div class="hl"><span class="d" style="background:#a8b0b8"></span>Day 08 Oct<span class="faint" style="margin-left:4px">closes 21:00</span><span class="r">open</span></div>`;
  if(k==='disclosure'){const own=Object.values(E).filter(e=>e.w==='central'&&!['place','world'].includes(e.kind));const c=LADDER.map((_,k2)=>own.filter(e=>projOf(e)===k2).length);const mx=Math.max(...c);
    return `<div style="padding:8px">${LADDER.map((l,k2)=>`<div style="display:grid;grid-template-columns:120px 1fr 20px;gap:6px;align-items:center;font-size:10px;height:17px"><span class="dim">${l}</span><i style="height:7px;width:${c[k2]/mx*100}%;background:${k2>=5?'var(--w-field)':'var(--bg-3)'}"></i><span class="mono faint">${c[k2]}</span></div>`).join('')}</div>`}
  if(k==='contact'){const c=S.contact;return c?`<div class="ctb"><div class="who"><b>You</b> → Parasakti · ${c.t}</div><div class="bubble">Does Ariadne’s vessel reading bear on the Bollingen stone?</div><div class="who">${bee('parasakti',14)} <b style="color:var(--w-ariadne)">Parasakti</b> · Ariadne’s agent</div><div class="bubble">Ariadne’s projection reads the Rudolfine vessel as Mercurius-the-container, from the Rosarium plates. Read against your stone, it echoes rather than causes. I can return that as a claim with its basis.</div>
    <div class="ret"><div class="who">returned difference</div>vessel <span class="mono" style="font-size:10px">ECHOES</span> the stone · claim · basis Rosarium pl. 10<div style="display:flex;gap:4px;margin-top:6px"><button class="bt pri" data-admit="contrib:vessel" ${S.admitted.has('contrib:vessel')?'disabled':''}>${S.admitted.has('contrib:vessel')?'admitted':'Admit as contribution'}</button><button class="bt">Keep private</button><button class="bt">Discard</button></div></div></div>`:`<div class="ctb">No exchange open. Contact an agent from a World card.</div>`}
  if(k==='terminal')return `<div class="term"><span class="p">fizz@env-1 $</span> aikit knowledge search "Mercurius stone"<br>4 subjects · 11 locators<br><span class="p">fizz@env-1 $</span> oi explore localWhole mercurius --depth 2<br><span class="o">17 nodes · 2 shared · budget 24</span><br><span class="p">fizz@env-1 $</span> correlate --run 214 --attempt 2<br>reading CW13 §IV … <span style="animation:blink 1s infinite">▍</span></div>`;
  if(k==='wiki')return `<div class="srcv"><div class="loc">wiki:o-i/mercurius · r41</div><b style="color:var(--text);font-family:-apple-system,sans-serif">Mercurius</b><br>Archetype. Four occurrences in the vault; one essay (CW 13); one palace room. Links: the Self (resonates · inferred), <span style="color:#9aa0a8;border-bottom:1px dashed">lapis philosophorum</span> (unresolved).</div>`;
  return ''}
function preview(k){const map={trail:`<div style="padding:6px;font-size:9px;line-height:1.7;color:var(--text-dim)">${S.trail.slice(-4).reverse().map(t=>`${MED[t.med][0]} ${E[t.id].n.split(' · ')[0]}`).join('<br>')}</div>`,
  field:`<div style="display:grid;place-items:center;height:100%">${V.system(84)}</div>`,agents:`<div style="display:flex;gap:2px;align-items:center;justify-content:center;height:100%">${bee('fizz',30)}${bee('honey',22)}${bee('bumble',22)}</div>`,
  sky:`<div style="display:grid;place-items:center;height:100%">${V.sky(80)}</div>`,source:`<div style="display:grid;place-items:center;height:100%">${V.page(80)}</div>`,nows:`<div style="padding:8px;font-size:9px;line-height:1.8;color:var(--text-dim)">◔ mac · env-1<br>◔ mac · env-2<br>◔ omarchy</div>`,
  disclosure:`<div style="display:grid;place-items:center;height:100%">${V.ladder(80)}</div>`,contact:`<div style="display:grid;place-items:center;height:100%">${V.link(80)}</div>`,terminal:`<div class="term" style="height:100%;font-size:8px">$ correlate --run 214<br>reading CW13…</div>`,wiki:`<div style="padding:8px;font-size:9px;color:var(--text-dim)">▭ Mercurius<br>r41 · 6 links</div>`};return map[k]||''}
function renderDock(){$('#tiles').innerHTML=S.tiles.map(k=>`<div class="tile"><div class="tlh"><span style="color:var(--text-faint)">${CTX[k].g}</span><span class="t">${CTX[k].n}${k==='field'?` <span class="faint" style="font-size:10px">· ${FIELDS[S.spine.field].ref}</span>`:''}</span><span class="x"><span data-tile="${k}" data-i="Close|Close the tile; it stays in the launcher.">✕</span></span></div><div class="tlb">${tileBody(k)}</div></div>`).join('');
  $('#tileCount').textContent=S.tiles.length+' open';$('#launch').classList.toggle('folded',S.lfold);$('#lfold').textContent=S.lfold?'▴':'▾';
  const q=($('#lsearch').value||'').toLowerCase();
  $('#lgrid').innerHTML=Object.keys(CTX).filter(k=>!q||CTX[k].n.toLowerCase().includes(q)).map(k=>`<div class="lcell ${S.tiles.includes(k)?'on':''}" data-tile="${k}" data-i="${CTX[k].n}|${CTX[k].i}">${S.tiles.includes(k)?'<span class="dot"></span>':''}<div class="pv">${preview(k)}</div><div class="nm">${CTX[k].g} ${CTX[k].n}${CTX[k].sdk?'<span style="margin-left:auto;font-size:9px;color:var(--sel)">SDK</span>':''}</div></div>`).join('')}

/* ============================== transport + status ============================== */
const ARRS={base:{n:'Base',i:'Base — the World as home: your planet, its field, its ground.',svg:'<path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/>'},
  factory:{n:'Factory',i:'Factory — work as World activity: runs, NOWs and agents on the Timeline and in the Constellation.',svg:'<path d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5z"/><path d="M12 12v8.5M12 12l7.4-4.25M12 12L4.6 7.75"/>'},
  expressions:{n:'Expressions',sub:'3:3',i:'Expressions — the lived 3:3 reading beside its Earth.',svg:'<path d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM12 10v4M10 12h4"/>'},
  techne:{n:'Technē',sub:'4:2',i:'Technē — the deep 4:2 instruments, four projections of one encounter.',svg:'<path d="M5 5h4v4H5zM15 15h4v4h-4zM15 4h5v5h-5zM4 15h5v5H4zM9 7h6M7 9v6M9 17h6M17 9v6"/>'}};
function renderTransport(){
  $('#ap').innerHTML=APERTURE.map((a,k)=>`<button class="${k===S.ap?'on':k<S.ap?'in':''}" data-ap="${k}" data-i="Aperture · ${a.k}|${a.i} Search, Earth, Constellation and Timeline all admit the same.">${k===0?'<i style="background:currentColor"></i>':''}${a.k}</button>`).join('');
  $('#viewAsV').textContent=S.viewAs;$('#viewAs').classList.toggle('act',S.viewAs!=='me');
  $('#clockSel').innerHTML=[['now','Now','Civil time: the day and NOW, owned by Central. Drives Earth’s night side and the sky.'],['occasion','Occasion','The retained occasion of the subject: its sky snapshot, standing in its year without lying about today.'],['walk','Walk','The playing Journey’s position drives the panes.']].map(([k,l,tt])=>`<button class="${S.clock===k?'on':''}" data-clock="${k}" data-i="${l}|${tt}">${l}</button>`).join('');
  const oe=occE();$('#posV').textContent=S.clock==='now'?nowLabel()+' · 08 Oct':S.clock==='occasion'?(oe?fmtY(oe.y)+(placeOf(oe)?' · '+placeOf(oe).n:''):'—'):(S.walkI>=0?`stop ${S.walkI+1} · ${fmtY(E[WALK[S.walkI].e].y)}`:'walk —');
  $('#paceV').textContent=S.pace;$('#stopV').textContent=S.walkI>=0?`${S.walkI+1} / ${WALK.length}`:`— / ${WALK.length}`;
  $('#play').classList.toggle('on',S.playing);$('#rec').classList.toggle('on',S.recording);$('#od').classList.toggle('on',S.od);$('#win').classList.toggle('on',S.win);
  $('#winA').textContent=S.winA;$('#winB').textContent=S.winB;$('#link').classList.toggle('on',S.link);$('#pulse').classList.toggle('on',S.pulse);$('#follow').classList.toggle('on',S.follow);$('#placeMode').classList.toggle('on',S.placeMode);
  $('#linkN').textContent=S.link?'3':'—';$('#carrier').textContent=S.link?'stdb · 41 ms':'local · 0 ms';
  const own=Object.values(E).filter(e=>e.w==='central'&&!['place','world'].includes(e.kind));$('#projPct').textContent=Math.round(own.filter(e=>projOf(e)>=5).length/own.length*100)+' %';
  $('#surf').innerHTML=Object.keys(ARRS).map(k=>`<button class="${S.arr===k?'on':''}" data-arr="${k}" data-i="${ARRS[k].n} arrangement|${ARRS[k].i} Arrangements keep their own panes; the encounter carries across.">${ARRS[k].sub?`<small>${ARRS[k].sub}</small>`:''}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ARRS[k].svg}</svg></button>`).join('');
  $('#titleArr').textContent=ARRS[S.arr].n+' arrangement';
  $('#frame').style.setProperty('--dock-w',S.dockW+'px')}
function renderStatus(){const n=Object.values(E).filter(e=>admitted(e)&&e.kind!=='place').length;const ws=Object.keys(WORLDS).filter(w=>worldAdmitted(w,S.ap)&&!WORLDS[w].project).length;
  $('#counts').textContent=`aperture ${APERTURE[S.ap].k.toLowerCase()} · ${ws} worlds · ${n} admitted`;$('#sSubj').textContent=subj().n}
</script>
<style>

.encbar .med{font-size:10px;color:var(--text-faint);margin-left:8px;white-space:nowrap}

.toast{position:absolute;left:50%;top:120px;transform:translateX(-50%);z-index:60;background:#1d1f22f0;border:1px solid var(--line-strong);padding:7px 14px;font-size:11.5px;color:var(--text);box-shadow:0 10px 30px #0008;pointer-events:none;opacity:0;transition:opacity .25s}
