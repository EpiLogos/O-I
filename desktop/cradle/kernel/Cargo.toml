[package]
name = "oi-cradle-kernel"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision", "raw_value"] }
sha2 = "0.10"
getrandom = "0.3"
url = "2"
base64 = "0.22"
brotli = "=8.0.4"
jiff = "0.2"
live-set = { path = "../../../packages/live-set" }
live-dynamics = { path = "../../../packages/live-dynamics" }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The journal FSEvents keeps per volume (journal.rs); notify already builds it.
fsevent-sys = "4.1"

# The debug walk-bridge (CI's and the dev stack's) hashes an owner binary
# once per standing (native_expression.rs `Digests`); unoptimised, sha2
# reads 85 MB of ql in about 2 s, optimised in about 0.15 s.
[profile.dev.package.sha2]
opt-level = 3
