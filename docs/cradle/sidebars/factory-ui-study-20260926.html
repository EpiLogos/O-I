function material(t,i){if(!t)return `<div class="empty-material"><span>Open something beside your work.</span><button class="linebtn" data-act="insert" data-pane="${i}">Open…</button></div>`;if(t.kind==='browser')return `<div class="browser-bar">${ib('browser-back','left','Back')}${ib('browser-refresh','refresh','Refresh')}<div class="address">${svg('browser')}<input aria-label="Browser address" value="oi.local/library" data-browser="${i}"></div>${ib('browser-open','external','Open browser page')}</div><div class="browser-home"><span class="oi-mark">O:I</span><h1>A world to act within.<br>A way to read it.</h1><p>Explore the published Expressions and the essay beside your current work.</p><div class="doors"><button data-act="library">Library ${svg('rightArrow')}</button><button data-act="essay">Essay ${svg('rightArrow')}</button></div></div>`;if(t.kind==='terminal')return `<div class="terminal"><div class="term-prompt">~/Central/Work/O-I</div><div><span class="term-prompt">❯ </span><span class="term-command">git status --short</span></div><div class="muted"> M docs/cradle/FACTORY-EXPRESSIONS.md</div><br><div class="term-line"><span class="term-prompt">❯</span><input aria-label="Terminal preview command" data-terminal="${i}" placeholder="help"></div><div class="terminal-output"></div></div>`;if(t.kind==='sidechat')return `<div class="side-chat"><div class="row"><span class="character-mini">◈</span><strong style="font-weight:500">Aletheia</strong><span class="grow"></span><span class="dot idle"></span></div><div class="side-message">Read the scene’s sources with me.</div><p class="muted" style="margin-top:20px">The current goal, character definitions and source document are available here.</p><div class="inline-composer"><textarea aria-label="Side chat message" placeholder="Message Aletheia…"></textarea><div class="row"><button class="model-button" data-act="models">${esc(S.model)}${svg('down')}</button><span class="grow"></span>${ib('side-send','arrow','Send side message')}</div></div></div>`;if(t.kind==='canvas')return `<div class="canvas-surface"><svg class="canvas-line" viewBox="0 0 470 600" preserveAspectRatio="none"><path d="M100 170 C180 170 200 290 260 300 M260 300 C190 350 200 450 110 450" stroke="var(--oi-quiet)" fill="none"/></svg><div class="canvas-node" style="left:9%;top:20%"><strong>Intention</strong><small>Factory as an Expression</small></div><div class="canvas-node" style="left:48%;top:45%"><strong>The scene</strong><small>Agents · goal · artifacts</small></div><div class="canvas-node" style="left:12%;top:70%"><strong>Return</strong><small>Reusable material</small></div><div class="canvas-toolbar">${ib('canvas-add','plus','Add object')}${ib('canvas-reset','refresh','Reset canvas positions')}${ib('canvas-inspect','sliders','Canvas settings')}</div></div>`;if(t.content)return `<article class="doc"><span class="eyebrow">Local file preview</span><h1>${esc(t.title)}</h1><pre style="white-space:pre-wrap;word-break:break-word;font:12px/1.8 var(--oi-mono)">${esc(t.content)}</pre></article>`;return `<article class="doc"><span class="eyebrow">Working specification</span><h1>Factory Live</h1><p>A Run is agents doing tasks towards a goal. Its living presentation is an Expression.</p><div class="doc-rule"></div><h2>The cast</h2><p>Each agent brings its own character: a saved body, a repertoire of morphs, its colour, physics and resonance. The goal and the work have their own forms.</p><h2>The scene</h2><p>The constellation is <strong>who and what is present</strong>. The composition is <strong>how they are organised, and why</strong>.</p><p>A scene is a saved state. The Expression holds the possible scenes and the changes through which the work is performed.</p><blockquote>Choose a scene. Bind the participants. Let the work move through it.</blockquote><h2>From work to performance</h2><p>A skill invocation calls a gesture. An exchange moves between characters. A result changes an object and updates the text.</p><p>The same characters return in the next scene, and the same scene can be reused with another team.</p><h2>Working across modes</h2><p>Factory supplies the undertaking. Expressions supplies the authored performance. Technè opens the constellation for deeper work.</p><p class="doc-note">Scene material remains editable in the existing Expressions application.</p></article>`;}
const events=[['10:42','check','Specification read','Anima · 3 sources','12s'],['10:43','spark','Character definitions selected','Anima · reusable material','4s'],['10:44','chat','Message to Aletheia','Read the working constellation',''],['10:44','canvas','Constellation opened','Aletheia · Technè','8s'],['10:45','file','Scene structure written','Factory Live.md','21s'],['10:46','code','Checking the scene bindings','Factory guardian','Now']];

function resourceList(){const list=resources.filter(r=>(S.filter==='All'||r.kind===S.filter)&&(r.name+' '+r.detail).toLowerCase().includes(S.query.toLowerCase()));return ['Needs attention','Configured'].map(group=>{const items=list.filter(r=>group==='Needs attention'?r.attention:!r.attention);return items.length?`<div class="settings-section-title">${group} <span class="quiet">${items.length}</span></div>${items.map(r=>`<div class="resource-row"><span class="resource-icon">${r.symbol}</span><button class="grow" data-act="resource" data-name="${esc(r.name)}" style="text-align:left;border-radius:5px;padding:3px"><strong>${r.name}</strong><span class="kind">${r.kind}</span><small>${r.detail}</small></button>${r.attention?`<button class="textbtn" data-act="authenticate" data-name="${esc(r.name)}">Connect</button>`:`<button class="toggle ${r.enabled?'on':''}" data-act="toggle-resource" data-name="${esc(r.name)}" role="switch" aria-checked="${r.enabled}" aria-label="Enable ${esc(r.name)}"></button>`}</div>`).join('')}`:'';}).join('')||'<p class="muted" style="padding-top:20px">No matching resources.</p>';}

tton></div>`:''}</div>`).join('')}`;if(S.settings==='models')return `<h1>Providers & models</h1><div class="row"><p class="muted grow" style="font-size:12px">Model access for your configured harnesses.</p><button class="linebtn" data-act="add-provider">Add provider</button></div>${[['Anthropic','Opus · Sonnet'],['Local inference','GLM · Qwen']].map(([n,m])=>`<div class="resource-row"><span class="resource-icon">${svg('spark')}</span><span class="grow"><strong>${n}</strong><small>${m}</small></span><button class="textbtn" data-act="provider" data-name="${n}">Configure</button></div>`).join('')}<h2 style="font-size:14px">Default model</h2><button class="linebtn" data-act="models">${S.model} ${svg('down')}</button>`;if(S.settings==='appearance')return `<h1>Appearance</h1><div class="resource-row"><span class="grow"><strong>Colour scheme</strong><small>Applies to the whole workspace.</small></span><button class="linebtn" data-act="theme">${S.theme==='dark'?'Dark':'Light'} ${svg('sun')}</button></div>`;if(S.settings==='machines')return `<h1>Machines</h1>${[['This Mac','Current workspace'],['Omarchy','Remote workcell']].map(([n,d])=>`<div class="resource-row"><span class="resource-icon">${svg('terminal')}</span><span class="grow"><strong>${n}</strong><small>${d}</small></span><button class="textbtn" data-act="machine" data-name="${n}">Open</button></div>`).join('')}`;return `<h1>General</h1><div class="resource-row"><span class="grow"><strong>Workspace</strong><small>O:I · Factory</small></span><button class="textbtn" data-act="scope">Change</button></div><div class="resource-row"><span class="grow"><strong>Restore open material</strong><small>Keep tabs, splits and drafts when returning.</small></span><button class="toggle on" data-act="setting-toggle" role="switch" aria-checked="true" aria-label="Restore open material"></button></div>`;}

function openPop(anchor,html,type=''){const pop=document.querySelector('#popover');if(popOpen&&popType===type&&anchor===anchorFocus){closePop();return;}anchorFocus=anchor;popType=type;pop.innerHTML=html;pop.classList.add('open');popOpen=true;pop.style.width=type==='context'?'342px':type==='models'?'280px':'auto';pop.style.left='0';pop.style.top='0';const rect=anchor.getBoundingClientRect(),b=pop.getBoundingClientRect();const x=Math.min(Math.max(12,rect.right-b.width),window.innerWidth-b.width-12);const below=rect.bottom+7+b.height<window.innerHeight-10;const y=below?rect.bottom+7:Math.max(36,rect.top-b.height-7);pop.style.left=x+'px';pop.style.top=y+'px';pop.querySelector('input')?.focus();}

function detailAgent(i){selectedAgent=i;const a=actors[i];modal(a.name,`<div class="row"><span class="agent-glyph">${a.glyph}</span><span class="grow"><strong style="font-weight:500">${a.role}</strong><small style="display:block;margin-top:5px">${a.work}</small></span><span class="dot"></span></div><div class="detail-tabs">${['Overview','Skills','Character','Setup'].map(t=>`<button data-act="agent-tab" data-tab="${t}" class="${agentTab===t?'active':''}">${t}</button>`).join('')}</div>${agentTab==='Overview'?`<p>${a.name} participates in the current Factory undertaking. Open its conversation, inspect its assigned work, or ask for a new contribution.</p><dl class="detail-grid"><dt>Current work</dt><dd>${a.work}</dd><dt>Run</dt><dd>Factory Expressions</dd></dl><div class="dialog-actions"><button class="linebtn" data-act="agent-message">Message</button><button class="primary" data-act="agent-work">Open work</button></div>`:agentTab==='Skills'?a.skills.map(s=>`<div class="resource-row"><span class="grow">${s}</span><button class="textbtn" data-act="invoke-skill" data-name="${s}">Invoke</button></div>`).join(''):agentTab==='Character'?`<div class="character-preview"><span class="character-large">${a.glyph}</span><span class="grow"><strong>Reusable character</strong><small style="display:block;margin-top:7px">Rest · Work · Address · Return</small><button class="linebtn" style="margin-top:12px" data-act="character-preview">Preview state</button></span></div><div class="dialog-actions"><button class="primary" data-act="character-edit">Edit in Expressions</button></div>`:`<dl class="detail-grid"><dt>Model</dt><dd>${S.model}</dd><dt>Harness</dt><dd>Pi</dd><dt>Workcell</dt><dd>This Mac</dd></dl><div class="dialog-actions"><button class="linebtn" data-act="agent-settings">Open settings</button></div>`}`);}

ientX-box.left)/box.width*100:(ev.clientY-box.top)/box.height*100));const panes=h.parentElement.querySelectorAll('.material-pane');panes[0].style.flex=`0 0 calc(${S.splitSize}% - 3px)`;panes[1].style.flex=`0 0 calc(${100-S.splitSize}% - 3px)`;};const up=()=>{h.removeEventListener('pointermove',move);persist();};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up,{once:true});}));}

const resize=document.querySelector('#resize');resize.addEventListener('pointerdown',e=>{resize.setPointerCapture(e.pointerId);const move=ev=>{const left=S.left?document.querySelector('#left').offsetWidth:0;const max=Math.max(360,window.innerWidth-left-330);const width=Math.max(320,Math.min(max,window.innerWidth-ev.clientX));document.documentElement.style.setProperty('--right',width+'px');};const up=()=>resize.removeEventListener('pointermove',move);resize.addEventListener('pointermove',move);resize.addEventListener('pointerup',up,{once:true});});resize.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const width=document.querySelector('#right').offsetWidth+(e.key==='ArrowLeft'?20:-20);document.documentElement.style.setProperty('--right',Math.max(320,Math.min(900,width))+'px');});
