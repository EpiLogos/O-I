name: Adaptive Wiki UX verification
on:
  push:
    branches: [agent/adaptive-wiki-ux-20260920]
    paths: [.github/workflows/adaptive-wiki-ux-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/adaptive-wiki-ux-20260920
      - name: Retain original assertions and add the declared extension
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/adaptive-wiki-ux-20260920
          git fetch --depth=1 origin 6927f3c5a7053b9955d95c76ea0e2243679417ac
          python3 - <<'PY'
          from pathlib import Path
          import json, subprocess
          p = Path('tests/experience/test_experience_map.py')
          s = p.read_text()
          old = '        self.assertEqual(set(module["required_obligation_ids"]), expected)'
          assert s.count(old) == 1
          s = s.replace(old, '        adaptive = {f"adaptive65:AP{i:02}" for i in range(1, 9)}\n        self.assertEqual(set(module["required_obligation_ids"]), expected | adaptive)')
          p.write_text(s)
          p = Path('tests/test_adaptive_wiki_ux.py')
          target = Path('tests/experience/test_adaptive_wiki_ux.py')
          target.write_text(p.read_text().replace('parents[1]', 'parents[2]'))
          p.unlink()
          # Preserve the existing hand-formatted source; add only declared fields.
          p = Path('docs/experience/wiki-constellation.json')
          updated = json.loads(p.read_text())
          original = subprocess.check_output(['git','show','6927f3c5a7053b9955d95c76ea0e2243679417ac:'+str(p)], text=True)
          old = json.loads(original)
          original_line = next(l for l in original.splitlines() if l.startswith('  "required_obligation_ids":'))
          original = original.replace(original_line, '  "required_obligation_ids": '+json.dumps(updated['required_obligation_ids'])+',')
          boundary = original.index('  "required_obligation_ids":')
          close = original.rfind('\n  },', 0, boundary)
          basis = json.dumps(updated['obligation_sources']['adaptive65'], ensure_ascii=False, indent=2)
          original = original[:close] + ',\n    "adaptive65": '+basis.replace('\n', '\n    ') + original[close:]
          additions = [o for o in updated['obligations'] if o['id'].startswith('adaptive65:')]
          encoded = ',\n'.join('    '+json.dumps(o, ensure_ascii=False, indent=2).replace('\n','\n    ') for o in additions)
          anchor = '\n  ],\n  "delegated_ql_stories"'
          assert original.count(anchor) == 1
          original = original.replace(anchor, ',\n'+encoded+anchor)
          assert json.loads(original) == updated
          assert json.loads(original)['obligations'][:15] == old['obligations']
          p.write_text(original)
          PY
          rm .github/workflows/adaptive-wiki-ux-verify.yml
          git add tests/experience/test_experience_map.py tests/experience/test_adaptive_wiki_ux.py tests/test_adaptive_wiki_ux.py docs/experience/wiki-constellation.json .github
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test: retain exact original Wiki obligations alongside adaptive extension'
          git rev-parse HEAD > /tmp/adaptive-ux-revision.txt
          git push origin HEAD:refs/heads/agent/adaptive-wiki-ux-20260920
      - name: Run existing source compiler and all experience regressions
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/experience -v 2>&1 | tee /tmp/adaptive-ux-verified.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-ux-verified-${{ github.run_id }}
          path: /tmp/adaptive-ux-*
          retention-days: 7
