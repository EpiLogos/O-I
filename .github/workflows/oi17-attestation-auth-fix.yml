name: OI17 attestation auth fix

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - scripts/oi17_attestation_auth_fix.py
      - .github/workflows/oi17-attestation-auth-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python scripts/oi17_attestation_auth_fix.py
      - run: cargo fmt --manifest-path cli/Cargo.toml
      - run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - name: Commit repair
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add cli/src/suite_v2.rs
          git diff --cached --check
          git commit -m 'fix(install): distinguish unavailable provenance auth from failed verification'
          git push origin HEAD:converge/oi-017-first-suite
