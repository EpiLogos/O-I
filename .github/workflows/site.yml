name: O:I site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
      - 'desktop/cradle/expressions-app/collections/return-of-zero/**'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
      - 'desktop/cradle/expressions-app/collections/return-of-zero/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned native Expression corpus
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Point-Cloud-Demo
          ref: e875344c04c14228840665a91823edc42b078fb2
          path: .publication-sources/Point-Cloud-Demo
          persist-credentials: false
      - name: Check out the pinned Return-of-Zero source revision
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Antykathera-Essay-Work
          ref: dbf3b1771724bd56663e4e3410df13e9d3ae681b
          path: .publication-sources/Antykathera-Essay-Work
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify shared-field contracts, public content and browser adapters
        run: |
          node --test \
            ../shared-field/shared-field.test.mjs \
            ../shared-field/social.test.mjs \
            ../shared-field/presentation.test.mjs \
            ../shared-field/expression-presentation.test.mjs \
            ../shared-field/presentation-projection.test.mjs \
            ../shared-field/presentation-authoring.test.mjs \
            ../shared-field/account-projection.test.mjs \
            ../shared-field/explore-surface.test.mjs \
            ../shared-field/spacetimedb-explore-surface.test.mjs \
            ../shared-field/central-wiki-projection.test.mjs \
            ../shared-field/aikit-contribution-field.test.mjs \
            ../shared-field/native-action-binding.test.mjs \
            public-content.test.mjs \
            library.test.mjs \
            publication.test.mjs \
            projection-renderer.test.mjs \
            self-other-read-model.test.mjs \
            field-proof-read-model.test.mjs \
            explore-read-model.test.mjs \
            explore-provider.test.mjs \
            explore-public-seed.test.mjs \
            src/explore/relation-layout.test.mjs
      - name: Install SpaceTimeDB module dependencies
        run: npm install --prefix ../shared-field/spacetimedb --no-audit --no-fund
      - name: Install pinned SpaceTimeDB CLI 2.8.1
        shell: bash
        run: |
          curl -sSf https://install.spacetimedb.com | \
            SPACETIME_DOWNLOAD_ROOT="https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.8.1" \
            sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version | tee /tmp/spacetimedb-version.txt
          grep -q '2.8.1' /tmp/spacetimedb-version.txt
      - run: npm install --no-audit --no-fund
      - name: Verify the full live Explore client build separately
        env:
          VITE_OI_SPACETIMEDB_URI: ${{ vars.OI_SPACETIMEDB_URI }}
          VITE_OI_SPACETIMEDB_DATABASE: ${{ vars.OI_SPACETIMEDB_DATABASE }}
        run: npm run build
      - name: Assemble the curated authored Expression publication
        env:
          OI_PUBLICATION_ENVELOPE: ${{ github.workspace }}/desktop/cradle/expressions-app/collections/return-of-zero/PUBLICATION-CURATED.json
          OI_PCD_S_PRODUCTS_ROOT: ${{ github.workspace }}/.publication-sources/Point-Cloud-Demo/production/s-products
          OI_ESSAY_REPO: ${{ github.workspace }}/.publication-sources/Antykathera-Essay-Work
        run: |
          node build-return-of-zero-publications.mjs
          printf 'OI_LIBRARY_PUBLICATIONS=%s\n' "$(node -e "const fs=require('fs');process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync('publications/return-of-zero-curated/inputs.json','utf8'))))")" >> "$GITHUB_ENV"
      - name: Build the admitted public reading edition for deployment
        # The deployment consumes only the curated revision-pinned native
        # producer outputs assembled above. The old demo/starter collection is
        # not a member of this edition.
        run: npm run build:public
      - name: Verify the public receiving route before publication
        run: |
          python -m pip install playwright==1.51.0 pillow
          python -m playwright install --with-deps chromium
          mkdir -p evidence/library
          git rev-parse HEAD > evidence/library/commit.txt
          node tests/publication-fixtures.mjs > evidence/library/publication-test-fixture.json
          npm run preview -- --host 127.0.0.1 --port 4173 > evidence/library/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          result=0
          python tests/library-acceptance.py || result=1
          python tests/library-regressions.py || result=1
          python tests/publication-acceptance.py || result=1
          exit "$result"
      - name: Retain publication verification separately from deployable files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reading-verification-${{ github.sha }}
          path: site/evidence/library/
          if-no-files-found: ignore
          retention-days: 14
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
