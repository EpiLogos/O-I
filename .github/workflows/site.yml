name: O:I site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
      - 'desktop/cradle/expressions-app/collections/return-of-zero/**'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
      - 'desktop/cradle/expressions-app/collections/return-of-zero/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned native Expression corpus
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Point-Cloud-Demo
          ref: e875344c04c14228840665a91823edc42b078fb2
          path: .publication-sources/Point-Cloud-Demo
          persist-credentials: false
      - name: Check out the exact current essay reading snapshot
        uses: actions/checkout@v4
        with:
          repository: EpiLogos/Antykathera-Essay-Work
          ref: c39ac80ae816f1b29595d825c2b39bab1c1ec97f
          path: .publication-sources/essay-reading
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Install the expression engine's own deps (headless admission imports it by real path)
        run: npm install --prefix ../packages/oi-design-system --no-audit --no-fund
      - name: Verify shared-field contracts, public content and browser adapters
        run: |
          node --test \
            ../shared-field/shared-field.test.mjs \
            ../shared-field/social.test.mjs \
            ../shared-field/presentation.test.mjs \
            ../shared-field/expression-presentation.test.mjs \
            ../shared-field/presentation-projection.test.mjs \
            ../shared-field/presentation-authoring.test.mjs \
            ../shared-field/account-projection.test.mjs \
            ../shared-field/explore-surface.test.mjs \
            ../shared-field/spacetimedb-explore-surface.test.mjs \
            ../shared-field/central-wiki-projection.test.mjs \
            ../shared-field/aikit-contribution-field.test.mjs \
            ../shared-field/native-action-binding.test.mjs \
            public-content.test.mjs \
            library.test.mjs \
            tests/native-player-lifecycle.test.mjs \
            projection-renderer.test.mjs \
            self-other-read-model.test.mjs \
            field-proof-read-model.test.mjs \
            explore-read-model.test.mjs \
            explore-provider.test.mjs \
            explore-public-seed.test.mjs \
            src/explore/relation-layout.test.mjs
      - name: Install SpaceTimeDB module dependencies
        run: npm install --prefix ../shared-field/spacetimedb --no-audit --no-fund
      - name: Install pinned SpaceTimeDB CLI 2.8.1
        shell: bash
        run: |
          curl -sSf https://install.spacetimedb.com | \
            SPACETIME_DOWNLOAD_ROOT="https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.8.1" \
            sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version | tee /tmp/spacetimedb-version.txt
          grep -q '2.8.1' /tmp/spacetimedb-version.txt
      - name: Install the vendored Quartz
        run: npm ci --prefix vendor/quartz --no-audit --no-fund
      - name: Verify the essay publication builders and host contract
        run: node --experimental-strip-types --test essay-source.test.mjs essay-browser.test.mjs essay-host.test.mjs quartz-staged-input.test.mjs essay-field.test.mjs essay-expressions.test.mjs cut-reading-edition.test.mjs
      - name: Verify the full live Explore client build separately
        env:
          VITE_OI_SPACETIMEDB_URI: ${{ vars.OI_SPACETIMEDB_URI }}
          VITE_OI_SPACETIMEDB_DATABASE: ${{ vars.OI_SPACETIMEDB_DATABASE }}
        run: npm run build
      - name: Build the admitted public reading edition for deployment
        # The deployment is the essay field (Quartz) with its Expression layer
        # and Library view, plus the O:I site pages. The retired Return-of-Zero
        # publication shelf (curated native publications, byte receipt) is no
        # longer built or gated; its old addresses continue into the essay field.
        env:
          OI_ESSAY_BROWSER_REPO: ${{ github.workspace }}/.publication-sources/essay-reading/published-reading/2026-10-06
          # the S0–S5 product Expressions (lifted into the essay field's Library) come from this pinned checkout
          OI_PCD_S_PRODUCTS_ROOT: ${{ github.workspace }}/.publication-sources/Point-Cloud-Demo/production/s-products
        run: npm run build:public
      - name: Verify the public site and essay field in Chromium before publication
        run: |
          python -m pip install playwright==1.51.0 pillow
          python -m playwright install --with-deps chromium
          mkdir -p evidence/library
          git rev-parse HEAD > evidence/library/commit.txt
          npm run preview -- --host 127.0.0.1 --port 4173 > evidence/library/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          result=0
          python tests/library-acceptance.py || result=1
          python tests/library-regressions.py || result=1
          python tests/essay-host-smoke.py || result=1
          python tests/essay-reader-controls.py || result=1
          python tests/expression-render.py || result=1
          exit "$result"
      - name: Retain publication verification separately from deployable files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reading-verification-${{ github.sha }}
          path: site/evidence/library/
          if-no-files-found: ignore
          retention-days: 14
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
