name: O:I site

on:
  pull_request:
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'shared-field/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify shared-field contracts and browser adapters
        run: |
          node --test \
            ../shared-field/shared-field.test.mjs \
            ../shared-field/social.test.mjs \
            ../shared-field/presentation.test.mjs \
            ../shared-field/presentation-projection.test.mjs \
            projection-renderer.test.mjs \
            self-other-read-model.test.mjs \
            field-proof-read-model.test.mjs \
            explore-read-model.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
