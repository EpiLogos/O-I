name: Mainline snapshot truth

on:
  pull_request:
    paths:
      - 'surfaces.json'
      - 'suite/mainline.json'
      - 'suite/manifest.json'
      - 'scripts/verify-mainline-snapshot.py'
      - 'scripts/pre97-release-standing-migrate.py'
      - '.github/workflows/mainline-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'surfaces.json'
      - 'suite/mainline.json'
      - 'suite/manifest.json'
      - 'scripts/verify-mainline-snapshot.py'
      - '.github/workflows/mainline-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in mainline/source relation
        run: python3 scripts/verify-mainline-snapshot.py
      - name: Verify recorded revisions equal live native mains
        run: python3 scripts/verify-mainline-snapshot.py --live

  migrate-pre97-standing:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/oi97-six-product-command-field'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oi97-six-product-command-field
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded standing correction
        run: python3 scripts/pre97-release-standing-migrate.py
      - name: Validate corrected records and Rust
        run: |
          python3 -m json.tool suite/manifest.json >/dev/null
          python3 -m json.tool suite/mainline.json >/dev/null
          cargo fmt --manifest-path cli/Cargo.toml
          cargo test --manifest-path cli/Cargo.toml --locked
          python3 scripts/verify-mainline-snapshot.py
      - name: Prove publication authority is absent
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'gh release create' .github/workflows/prelocal-release.yml
          ! grep -q 'contents: write' .github/workflows/prelocal-release.yml
          grep -q 'historical-unratified-prelocal-build-record' suite/manifest.json
          grep -q 'historical-build-evidence-not-current-main-authority' suite/mainline.json
      - name: Remove migration scaffolding and commit verified semantic delta
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git checkout "$BASE_SHA" -- .github/workflows/mainline-snapshot.yml
          rm -f scripts/pre97-release-standing-migrate.py .github/workflows/pre97-release-standing-migration.yml
          git add -A \
            suite/manifest.json \
            suite/mainline.json \
            cli/src/suite_v2.rs \
            cli/src/main.rs \
            scripts/verify-mainline-snapshot.py \
            .github/workflows/prelocal-release.yml \
            .github/workflows/full-suite-preflight.yml \
            .github/workflows/mainline-snapshot.yml \
            scripts/pre97-release-standing-migrate.py \
            .github/workflows/pre97-release-standing-migration.yml
          git commit -m '[PRE97] Make pre-local build evidence explicitly unratified'
          git push origin HEAD:feat/oi97-six-product-command-field
