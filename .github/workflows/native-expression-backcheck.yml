name: Native Expression backcheck
on:
  pull_request:
    paths:
      - 'desktop/cradle/expressions-app/**'
      - 'desktop/cradle/kernel/**'
      - 'desktop/cradle/src/expressions/**'
      - 'desktop/cradle/src/kernel/types.ts'
      - 'desktop/cradle/tests/native-expression*'
      - 'packages/oi-design-system/expressions-engine/oi/**'
      - '.github/workflows/native-expression-backcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-expression-backcheck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: 56921a5e70b1385dbc7afe159a1d1fad4c9798fe
          path: .native-owner/QL-MEF
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            desktop/cradle/kernel -> target
            .native-owner/QL-MEF -> target
      - name: Locked dependencies and actual embedded application build
        run: |
          mkdir -p /tmp/w5-checks
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
          cd desktop/cradle
          npm run build
          npm run build:journeys --prefix expressions-app
          expressions-app/node_modules/.bin/tsc --noEmit -p expressions-app/field-studies-journeys/tsconfig.json
          npx playwright install --with-deps chromium
      - name: Complete retained React shell lint
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          npm run lint --prefix desktop/cradle/expressions-app 2>&1 | tee /tmp/w5-checks/complete-embedded-lint.log
      - name: Meaningful effect and existing regressions
        if: always()
        env:
          QL_SOURCE: ${{ github.workspace }}/.native-owner/QL-MEF
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          (cd desktop/cradle && python3 tests/native-expression-local.test.py) 2>&1 | tee /tmp/w5-checks/local-packet.log
          (cd desktop/cradle && python3 tests/native-expression-receipt.test.py) 2>&1 | tee /tmp/w5-checks/local-receipt-admission.log
          (cd desktop/cradle && node --test tests/native-expression.test.mjs) 2>&1 | tee /tmp/w5-checks/native-expression.log
          npm test --prefix desktop/cradle/expressions-app 2>&1 | tee /tmp/w5-checks/embedded.log
          node --test .native-owner/QL-MEF/adapters/retained-field/native-audio.test.mjs .native-owner/QL-MEF/adapters/retained-field/instrument-session.test.mjs 2>&1 | tee /tmp/w5-checks/native-clients.log
      - name: Actual embedded WebGL browser and relay
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/browser
        run: |
          set -o pipefail
          cd desktop/cradle
          node tests/native-expression-browser.mjs 2>&1 | tee /tmp/w5-checks/browser.log
      - name: Real GPU effect and deliberately disconnected consumer
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/gpu-effect
        run: |
          set -o pipefail
          cd desktop/cradle
          node tests/native-expression-gpu.mjs 2>&1 | tee /tmp/w5-checks/gpu-effect.log
      - name: Retained shell controls and exact native CSP
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/legacy-browser
        run: |
          set -o pipefail
          cd desktop/cradle
          node --test tests/native-expression-final.test.mjs 2>&1 | tee /tmp/w5-checks/csp-hash.log
          node tests/theme-prepaint-csp.mjs 2>&1 | tee /tmp/w5-checks/csp-browser.log
          node tests/native-expression-legacy-browser.mjs 2>&1 | tee /tmp/w5-checks/legacy-browser.log
      - name: Native kernel regressions
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          cargo build --manifest-path desktop/cradle/kernel/Cargo.toml --bin walk-bridge
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml 2>&1 | tee /tmp/w5-checks/kernel.log
      - name: Build the exact real QL host and C++ material owner
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/w5-checks/native
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
          make -C .native-owner/QL-MEF/cpp test 2>&1 | tee /tmp/w5-checks/native/cpp.log
          cargo build --locked --release --manifest-path .native-owner/QL-MEF/Cargo.toml -p ql-mef --bin ql-field-host 2>&1 | tee /tmp/w5-checks/native/build.log
          cp .native-owner/QL-MEF/cpp/build/ql-field-worker /tmp/w5-checks/native/
          cp .native-owner/QL-MEF/target/release/ql-field-host /tmp/w5-checks/native/
          sha256sum /tmp/w5-checks/native/ql-field-* > /tmp/w5-checks/native/binaries.sha256
      - name: Real native effects through the production process manager
        if: always()
        env:
          OI_QL_FIELD_HOST_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql-field-host
          OI_QL_FIELD_WORKER_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/cpp/build/ql-field-worker
          NATIVE_EXPRESSION_INPUT: ${{ github.workspace }}/desktop/cradle/walk/artifacts/ui-convergence/owner-verification/ql-coupled/input.json
          NATIVE_EXPRESSION_NATIVE_RECEIPT: /tmp/w5-checks/native/acceptance.json
        run: |
          set -o pipefail
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --test native_expression_owner -- --ignored --nocapture 2>&1 | tee /tmp/w5-checks/native/manager.log
      - name: Complete real native producer through the shipped local acceptance packet
        if: always()
        env:
          NATIVE_EXPRESSION_BRIDGE: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_QL_FIELD_HOST_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql-field-host
          OI_QL_FIELD_WORKER_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/cpp/build/ql-field-worker
          NATIVE_EXPRESSION_INPUT: ${{ github.workspace }}/desktop/cradle/walk/artifacts/ui-convergence/owner-verification/ql-coupled/input.json
        run: |
          set -o pipefail
          cd desktop/cradle
          python3 tests/native-expression-local.py \
            --expected-head "$(git rev-parse HEAD)" \
            --host "$OI_QL_FIELD_HOST_BIN" --worker "$OI_QL_FIELD_WORKER_BIN" \
            --bridge "$NATIVE_EXPRESSION_BRIDGE" --input "$NATIVE_EXPRESSION_INPUT" \
            --output /tmp/w5-checks/local-join --run-browser-join \
            2>&1 | tee /tmp/w5-checks/native-browser.log
      - name: Exact source and toolchain receipt
        if: always()
        run: |
          mkdir -p /tmp/w5-checks
          git rev-parse HEAD > /tmp/w5-checks/source-head.txt
          git -C .native-owner/QL-MEF rev-parse HEAD > /tmp/w5-checks/native-source-head.txt
          { uname -a; node --version; rustc --version; } > /tmp/w5-checks/toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-native-expression-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/w5-checks
          retention-days: 14
          if-no-files-found: error
