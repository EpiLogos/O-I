name: Native Expression backcheck
on:
  pull_request:
    paths:
      - '.github/actions/native-dense-field-source/**'
      - 'gates/prepare-native-dense-field-source.py'
      - 'desktop/cradle/tests/native-expression-local.py'
      - 'desktop/cradle/expressions-app/**'
      - 'desktop/cradle/kernel/**'
      - 'desktop/cradle/src/expressions/**'
      - 'desktop/cradle/src/kernel/types.ts'
      - 'desktop/cradle/src/files/resources.ts'
      - 'desktop/cradle/tests/retained-files-native.test.mjs'
      - 'desktop/cradle/tests/draft-owner-native.test.mjs'
      - 'desktop/cradle/src/workspace/drafts.ts'
      - 'desktop/cradle/src/document/hostSave.ts'
      - 'desktop/cradle/material/shared-field/**'
      - 'desktop/cradle/material/expressive-material/**'
      - 'desktop/cradle/src/contributions/factory/live/**'
      - 'desktop/cradle/src/expression/**'
      - 'desktop/cradle/src/stage/**'
      - 'desktop/cradle/tests/shared-direct*'
      - 'desktop/cradle/tests/factory-live-producer.test.mjs'
      - 'desktop/cradle/tests/factory-live-native-path.mjs'
      - 'desktop/cradle/tests/fixtures/shared-direct-journal/**'
      - 'desktop/cradle/tests/fixtures/shared-native-expression/**'
      - 'desktop/cradle/tests/shared-expression-resource-native.mjs'
      - 'shared-field/expression-projection.mjs'
      - 'shared-field/expression-material.mjs'
      - 'shared-field/expression-material.test.mjs'
      - 'shared-field/scripts/direct-expression-activity-producer.mts'
      - 'desktop/cradle/tests/native-expression*'
      - 'desktop/cradle/tests/*formation*'
      - 'desktop/cradle/tests/candidate-cache-native.mjs'
      - 'desktop/cradle/tests/native-capture-compiler.py'
      - 'desktop/cradle/tests/native-text-authoring.test.mjs'
      - 'desktop/cradle/tests/wiki-native-binaries.py'
      - 'packages/oi-design-system/expressions-engine/engine/**'
      - 'packages/oi-design-system/expressions-engine/shell/**'
      - 'packages/oi-design-system/expressions-engine/PROVENANCE.json'
      - 'scripts/vendor-expressions-engine.mjs'
      - 'packages/oi-design-system/expressions-engine/oi/**'
      - '.github/workflows/native-expression-backcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-expression-backcheck-${{ github.ref }}
  cancel-in-progress: false
jobs:
  embedded:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # The vendored clients name the exact QL cut they were copied from; the
      # owner is checked out there, so identity and behaviour have one pin.
      - id: ql
        run: echo "revision=$(jq -r .revision desktop/cradle/expressions-app/field-studies-journeys/src/native-field/ql/PROVENANCE.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: ${{ steps.ql.outputs.revision }}
          path: .native-owner/QL-MEF
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 2a604574774c41921003ed99a2eed73b4c9f4266
          path: .native-owner/Central
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            desktop/cradle/kernel -> target
            .native-owner/QL-MEF -> target
            .native-owner/Central -> target
            cli -> target
      - name: Locked dependencies and actual embedded application build
        run: |
          mkdir -p /tmp/w5-checks
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
          cd desktop/cradle
          npm run build
          npm run build:journeys --prefix expressions-app
          expressions-app/node_modules/.bin/tsc --noEmit -p expressions-app/field-studies-journeys/tsconfig.json
          npx playwright install --with-deps chromium
      - name: Build the exact native Central owner and suite route
        run: |
          set -euo pipefail
          mkdir -p /tmp/w5-checks/native
          git -C .native-owner/Central rev-parse HEAD > /tmp/w5-checks/native/Central.revision
          test "$(cat /tmp/w5-checks/native/Central.revision)" = 2a604574774c41921003ed99a2eed73b4c9f4266
          python3 desktop/cradle/tests/wiki-native-binaries.py \
            --target OI_BIN cli/Cargo.toml oi \
            --target OI_CENTRAL_CTRL_BIN .native-owner/Central/ctrl/Cargo.toml ctrl \
            --receipt /tmp/w5-checks/native/central-binaries.json \
            2>&1 | tee /tmp/w5-checks/native/central-build.log
      - name: Complete retained React shell lint
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          npm run lint --prefix desktop/cradle/expressions-app 2>&1 | tee /tmp/w5-checks/complete-embedded-lint.log
      - name: Meaningful effect and existing regressions
        if: always()
        env:
          QL_SOURCE: ${{ github.workspace }}/.native-owner/QL-MEF
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          (cd desktop/cradle && python3 tests/native-expression-local.test.py) 2>&1 | tee /tmp/w5-checks/local-packet.log
          (cd desktop/cradle && python3 tests/native-expression-receipt.test.py) 2>&1 | tee /tmp/w5-checks/local-receipt-admission.log
          (cd desktop/cradle && node --test tests/native-expression.test.mjs) 2>&1 | tee /tmp/w5-checks/native-expression.log
          (cd desktop/cradle && node --test tests/native-expression-central.test.mjs) 2>&1 | tee /tmp/w5-checks/native-owner-cleanup.log
          npm test --prefix desktop/cradle/expressions-app 2>&1 | tee /tmp/w5-checks/embedded.log
          node --test .native-owner/QL-MEF/adapters/retained-field/native-audio.test.mjs .native-owner/QL-MEF/adapters/retained-field/instrument-session.test.mjs 2>&1 | tee /tmp/w5-checks/native-clients.log
      - name: Native formation authoring, emitted modules and bounded candidate retention
        if: always()
        run: |
          set -o pipefail
          cd desktop/cradle
          node --test tests/emitted-formation-modules.test.mjs 2>&1 | tee /tmp/w5-checks/emitted-formation.log
          node tests/formation-native-regressions.mjs 2>&1 | tee /tmp/w5-checks/formation-native.log
      - name: Compile the actual native text painter and require its exact shipped companion
        id: native_capture
        if: always()
        env:
          OI_CAPTURE_COMPILE_OUT: /tmp/w5-checks/native-capture-compiler
        run: python3 desktop/cradle/tests/native-capture-compiler.py
      - name: Authored native text sizing, legacy imports and malformed-size refusal
        if: ${{ !cancelled() && steps.native_capture.outcome == 'success' }}
        run: |
          set -o pipefail
          cd desktop/cradle
          node --test tests/native-text-authoring.test.mjs 2>&1 | tee /tmp/w5-checks/native-text-authoring.log
      - name: Actual embedded WebGL browser and relay
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/browser
        run: |
          set -o pipefail
          cd desktop/cradle
          node tests/native-expression-browser.mjs 2>&1 | tee /tmp/w5-checks/browser.log
      - name: Real GPU effect and deliberately disconnected consumer
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/gpu-effect
        run: |
          set -o pipefail
          cd desktop/cradle
          node tests/native-expression-gpu.mjs 2>&1 | tee /tmp/w5-checks/gpu-effect.log
      - name: Retained shell controls and exact native CSP
        if: always()
        env:
          NATIVE_EXPRESSION_OUT: /tmp/w5-checks/legacy-browser
        run: |
          set -o pipefail
          cd desktop/cradle
          node --test tests/native-expression-final.test.mjs 2>&1 | tee /tmp/w5-checks/csp-hash.log
          node tests/theme-prepaint-csp.mjs 2>&1 | tee /tmp/w5-checks/csp-browser.log
          node tests/native-expression-legacy-browser.mjs 2>&1 | tee /tmp/w5-checks/legacy-browser.log
      - name: Produce the genuine native FIELD input for kernel codecs
        if: always()
        uses: ./.github/actions/native-dense-field-source
      - name: Native kernel regressions
        if: always()
        run: |
          set -o pipefail
          mkdir -p /tmp/w5-checks
          cargo build --manifest-path desktop/cradle/kernel/Cargo.toml --bin walk-bridge
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml 2>&1 | tee /tmp/w5-checks/kernel.log
      - name: Actual Central retained-file authority and foreign-root cache refusal
        if: ${{ !cancelled() }}
        env:
          OI_NATIVE_RETAINED_FILES: '1'
          OI_KERNEL_BIN: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_NATIVE_TEST_ROOT: /tmp/w5-checks/native-fixtures
        run: |
          set -o pipefail
          cd desktop/cradle
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/retained-files-native.test.mjs 2>&1 | tee /tmp/w5-checks/retained-files-native.log
          node --experimental-webstorage --localstorage-file=/tmp/w5-checks/draft-native.bin --experimental-strip-types --import ./tests/ts-register.mjs --test tests/draft-owner-native.test.mjs 2>&1 | tee /tmp/w5-checks/draft-owner-native.log
      - name: Retained Direct speech through real native Factory material and Act acceptance
        if: ${{ !cancelled() }}
        env:
          NATIVE_EXPRESSION_BRIDGE: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_SHARED_TEXT_OUT: /tmp/w5-checks/shared-native-text
        run: |
          set -o pipefail
          cd desktop/cradle
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/shared-direct-journal.test.mjs tests/factory-live-producer.test.mjs 2>&1 | tee /tmp/w5-checks/shared-consumer-regressions.log
          node --test ../../shared-field/expression-material.test.mjs 2>&1 | tee /tmp/w5-checks/shared-material-admission.log
          node tests/shared-direct-native-owner.mjs 2>&1 | tee /tmp/w5-checks/shared-native-text.log
      - name: Actually rendered native proposal, required-body failure and bounded live resources
        if: ${{ !cancelled() }}
        env:
          OI_SHARED_NATIVE_DOCUMENT: /tmp/w5-checks/shared-native-text/document.json
          OI_SHARED_NATIVE_ACT: /tmp/w5-checks/shared-native-text/act.json
          OI_SHARED_NATIVE_OWNER_RECEIPT: /tmp/w5-checks/shared-native-text/native-owner.json
          OI_SHARED_REQUIRED_RETURN_TEXT: '1'
          OI_SHARED_RESOURCE_OUT: /tmp/w5-checks/shared-native-text-render
        run: |
          set -o pipefail
          cd desktop/cradle
          node tests/shared-expression-resource-native.mjs 2>&1 | tee /tmp/w5-checks/shared-native-text-render.log
      - name: Build the exact real QL host and C++ material owner
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/w5-checks/native
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
          make -C .native-owner/QL-MEF/cpp test 2>&1 | tee /tmp/w5-checks/native/cpp.log
          cargo build --locked --release --manifest-path .native-owner/QL-MEF/Cargo.toml -p ql-mef --bin ql-field-host -p ql-cli --bin ql 2>&1 | tee /tmp/w5-checks/native/build.log
          cp .native-owner/QL-MEF/cpp/build/ql-field-worker /tmp/w5-checks/native/
          cp .native-owner/QL-MEF/target/release/ql-field-host /tmp/w5-checks/native/
          sha256sum /tmp/w5-checks/native/ql-field-* > /tmp/w5-checks/native/binaries.sha256
      - name: Real native effects through the production process manager
        if: always()
        env:
          OI_QL_FIELD_HOST_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql-field-host
          OI_QL_FIELD_WORKER_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/cpp/build/ql-field-worker
          NATIVE_EXPRESSION_INPUT: ${{ github.workspace }}/desktop/cradle/walk/artifacts/ui-convergence/owner-verification/ql-coupled/input.json
          NATIVE_EXPRESSION_NATIVE_RECEIPT: /tmp/w5-checks/native/acceptance.json
        run: |
          set -o pipefail
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --test native_expression_owner -- --ignored --nocapture 2>&1 | tee /tmp/w5-checks/native/manager.log
      - name: Complete real native producer through the shipped local acceptance packet
        if: always()
        env:
          NATIVE_EXPRESSION_BRIDGE: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_QL_FIELD_HOST_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql-field-host
          OI_QL_FIELD_WORKER_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/cpp/build/ql-field-worker
          NATIVE_EXPRESSION_INPUT: ${{ github.workspace }}/desktop/cradle/walk/artifacts/ui-convergence/owner-verification/ql-coupled/input.json
        run: |
          set -o pipefail
          cd desktop/cradle
          python3 tests/native-expression-local.py \
            --expected-head "$(git rev-parse HEAD)" \
            --host "$OI_QL_FIELD_HOST_BIN" --worker "$OI_QL_FIELD_WORKER_BIN" \
            --bridge "$NATIVE_EXPRESSION_BRIDGE" --input "$NATIVE_EXPRESSION_INPUT" \
            --output /tmp/w5-checks/local-join --run-browser-join \
            2>&1 | tee /tmp/w5-checks/native-browser.log
      - name: Admit the exact real producer receipt and reject native identity drift
        if: ${{ !cancelled() }}
        env:
          REQUIRE_NATIVE_RECEIPT: '1'
          NATIVE_LOCAL_RECEIPT: /tmp/w5-checks/local-join/local-receipt.json
        run: |
          set -o pipefail
          cd desktop/cradle
          python3 tests/native-expression-receipt.test.py 2>&1 | tee /tmp/w5-checks/actual-native-receipt-admission.log
      - name: Scene causal trace and deliberately disconnected consumer
        if: always()
        env:
          NATIVE_EXPRESSION_BRIDGE: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_QL_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql
          OI_QL_FIELD_HOST_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/target/release/ql-field-host
          OI_QL_FIELD_WORKER_BIN: ${{ github.workspace }}/.native-owner/QL-MEF/cpp/build/ql-field-worker
        run: |
          set -o pipefail
          cd desktop/cradle
          NATIVE_EXPRESSION_OUT=/tmp/w5-checks/scene node tests/native-expression-scene-browser.mjs 2>&1 | tee /tmp/w5-checks/scene.log
          # A consumer that receives no targets must fail the same trace.
          if K2_DISCONNECT_TARGETS=1 NATIVE_EXPRESSION_OUT=/tmp/w5-checks/scene-disconnected \
            node tests/native-expression-scene-browser.mjs > /tmp/w5-checks/scene-disconnected.log 2>&1; then
            echo "disconnected consumer passed the causal trace" >&2; exit 1
          fi
          # A crash or failed teardown is not the required visual failure.
          python3 - <<'PY_ACCEPT'
          import json
          from pathlib import Path
          reading = json.loads(Path('/tmp/w5-checks/scene-disconnected/scene-trace-disconnected.json').read_text())
          assert reading['schema'] == 'oi.native-expression-scene-trace/v1'
          assert reading['mode'] == 'negative: GPU target delivery disconnected before the determinant'
          assert reading['pass'] is False
          assert 'cleanup_failure' not in reading
          assert all(value['ok'] is True for value in reading['owner_cleanup'].values())
          assert reading['requests'] == {'opens': 3, 'closes': 3}
          failures = {value['check'] if isinstance(value, dict) else value for value in reading['failures']}
          assert 'delivery: the GPU-bound target textures carry the changed frame' in failures
          assert 'GPU: particle positions after N fixed steps differ from control beyond the determinism baseline' in failures
          assert reading['transfer']['after_step_admitted_max_abs_difference_m'] > 0
          assert reading['delivery']['after_step_gpu_target_max_abs_difference'] == 0
          assert reading['gpu']['effect_mean_abs_difference'] <= reading['gpu']['tolerance']
          PY_ACCEPT
      - name: Exact source and toolchain receipt
        if: always()
        run: |
          mkdir -p /tmp/w5-checks
          git rev-parse HEAD > /tmp/w5-checks/source-head.txt
          git -C .native-owner/QL-MEF rev-parse HEAD > /tmp/w5-checks/native-source-head.txt
          { uname -a; node --version; rustc --version; } > /tmp/w5-checks/toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-native-expression-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/w5-checks
          retention-days: 14
          if-no-files-found: error
