name: Fix Phase 3 finite authority fixture

on:
  push:
    branches:
      - agent/oi-017-exchange-authority
    paths:
      - '.github/workflows/phase3-fix-finite-fixture.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-017-exchange-authority
          fetch-depth: 0
      - name: Make finite actor authority expire during its dedicated case
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shared-field/spacetimedb/security-live-acceptance-v6.ts')
          s = p.read_text()
          old = "{ fieldRef: FIELD, participantRef: pFinite.participant_ref, targetIdentity: finiteActor.identity, role: 'contributor', contactable: true, ttlSeconds: 1 },"
          new = "{ fieldRef: FIELD, participantRef: pFinite.participant_ref, targetIdentity: finiteActor.identity, role: 'contributor', contactable: true, ttlSeconds: 0 },"
          if s.count(old) != 1: raise SystemExit(f'finite setup anchor count {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = """  const finiteRequest = 'exchange-request:phase3:finite';\n  const finiteGrant = 'exchange-grant:phase3:finite';\n  await finiteActor.conn.reducers.requestExchange"""
          new2 = """  const finiteRequest = 'exchange-request:phase3:finite';\n  const finiteGrant = 'exchange-grant:phase3:finite';\n  await owner.conn.reducers.grantParticipantAuthority({ fieldRef: FIELD, participantRef: pFinite.participant_ref, targetIdentity: finiteActor.identity, role: 'contributor', contactable: true, ttlSeconds: 1 });\n  await finiteActor.conn.reducers.requestExchange"""
          if s.count(old2) != 1: raise SystemExit(f'finite case anchor count {s.count(old2)}')
          p.write_text(s.replace(old2, new2, 1))
          PY
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git add shared-field/spacetimedb/security-live-acceptance-v6.ts
          git diff --cached --check
          git commit -m 'Bound finite authority expiry to its Phase 3 test case'
          git push origin HEAD:agent/oi-017-exchange-authority
