name: TEMP format SkillSet

on:
  push:
    branches:
      - agent/suite-operator-skillset
    paths:
      - cli/src/skillset.rs
      - cli/tests/suite_skillset.rs
      - .github/workflows/_temp-format-skillset.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/suite-operator-skillset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet -- cli/src/skillset.rs cli/tests/suite_skillset.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/skillset.rs cli/tests/suite_skillset.rs
          git commit -m "style(oi): rustfmt suite SkillSet implementation"
          git push origin HEAD:agent/suite-operator-skillset
