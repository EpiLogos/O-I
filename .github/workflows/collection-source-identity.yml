name: Collection source identity
on:
  push:
    branches: [fix/collection-source-identity-20260920]
  pull_request:
    paths:
      - 'desktop/cradle/src/expressions/collectionReadings.ts'
      - 'desktop/cradle/src/library/**'
      - 'desktop/cradle/tests/collection-*'
      - '.github/workflows/collection-source-identity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collection-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/cradle/package-lock.json
            desktop/cradle/expressions-app/package-lock.json
      - name: Install exact locked dependencies
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
      - name: Build the existing application and Cradle
        run: |
          npm --prefix desktop/cradle/expressions-app run build:journeys
          npm --prefix desktop/cradle run build
      - name: Run source identity and native-protocol consumer regressions
        working-directory: desktop/cradle
        run: |
          mkdir -p tests/artifacts/collection-source
          set -o pipefail
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/collection-source-identity.test.mjs tests/collection-consumers.test.mjs | tee tests/artifacts/collection-source/controlled.log
      - name: Install test browser
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Interact with the production Library
        working-directory: desktop/cradle
        run: node tests/collection-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-consumer-evidence-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/collection-source/
          if-no-files-found: error
          retention-days: 7
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 12ee31313e710378845baae190efc1a4b3e7ebdb
          path: native-central
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual Central and kernel; preserve native regression suite
        run: |
          cargo build --locked --manifest-path native-central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path desktop/cradle/kernel/Cargo.toml --bin walk-bridge
          cargo build --locked --manifest-path cli/Cargo.toml --bin oi
          cargo test --locked --manifest-path desktop/cradle/kernel/Cargo.toml --test expression --test expression_substrate --test expression_world
      - name: Real native source, collection CAS, saved Expression and restart
        working-directory: desktop/cradle
        env:
          CENTRAL_SOURCE_SHA: 12ee31313e710378845baae190efc1a4b3e7ebdb
        run: |
          export OI_BIN="$GITHUB_WORKSPACE/cli/target/debug/oi"
          export OI_CENTRAL_CTRL_BIN="$GITHUB_WORKSPACE/native-central/target/debug/ctrl"
          export OI_COLLECTION_BRIDGE_BIN="$GITHUB_WORKSPACE/desktop/cradle/kernel/target/debug/walk-bridge"
          export OI_SOURCE_SHA="$(git rev-parse HEAD)"
          node --experimental-strip-types --import ./tests/ts-register.mjs tests/collection-native-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-native-evidence-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/collection-source/
          if-no-files-found: warn
          retention-days: 7
