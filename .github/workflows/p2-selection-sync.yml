name: P2 canonical selection sync

on:
  pull_request:
    branches:
      - agent/oi-desktop-p1-host-105
    paths:
      - '.github/workflows/p2-selection-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/oi-desktop-p2-project-field-106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Project P2 directly from the P1 canonical selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('desktop/ui/src/main.tsx')
          text = main.read_text()
          text = text.replace(
              '''          factoryBuild={factoryBuild}\n          onSelect={selectWorkbenchRef}\n          onRefreshFactory={refreshFactoryBuild}''',
              '''          factoryBuild={factoryBuild}\n          selection={snapshot.selection}\n          onSelect={selectWorkbenchRef}\n          onRefreshFactory={refreshFactoryBuild}''',
              1,
          )
          text = text.replace(
              '''  factoryBuild,\n  onSelect,\n  onRefreshFactory,''',
              '''  factoryBuild,\n  selection,\n  onSelect,\n  onRefreshFactory,''',
              1,
          )
          text = text.replace(
              '''  factoryBuild: FactoryBuildSnapshot | null;\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;''',
              '''  factoryBuild: FactoryBuildSnapshot | null;\n  selection?: WorkbenchSemanticRef;\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;''',
              1,
          )
          text = text.replace(
              '<WorkbenchSurface onSelect={onSelect} />',
              '<WorkbenchSurface selection={selection} onSelect={onSelect} />',
              1,
          )
          main.write_text(text)

          wrapper = Path('desktop/ui/src/workbench.tsx')
          text = wrapper.read_text()
          text = text.replace("import React, { useEffect, useState } from 'react';", "import React, { useEffect, useState } from 'react';")
          text = text.replace(
              '''export function WorkbenchSurface({\n  onSelect,\n  onAgentSessionChange,\n}: {\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;\n  onAgentSessionChange?: (agentSessionRef: string | null) => void;\n}) {\n  const [selection, setSelection] = useState<WorkbenchSemanticRef | undefined>();''',
              '''export function WorkbenchSurface({\n  selection,\n  onSelect,\n  onAgentSessionChange,\n}: {\n  selection?: WorkbenchSemanticRef;\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;\n  onAgentSessionChange?: (agentSessionRef: string | null) => void;\n}) {''',
              1,
          )
          text = text.replace(
              '''  async function select(subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) {\n    setSelection(subject);\n    await onSelect(subject, evidence);\n  }''',
              '''  async function select(subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) {\n    await onSelect(subject, evidence);\n  }''',
              1,
          )
          wrapper.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/p2-selection-sync.yml
      - name: Commit canonical selection wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/ui/src/main.tsx desktop/ui/src/workbench.tsx .github/workflows/p2-selection-sync.yml
          git diff --cached --check
          git commit -m 'Use P1 canonical selection in P2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
