name: OI17 dev patch

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - scripts/oi17_dev_patch.py
      - .github/workflows/oi17-dev-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: python scripts/oi17_dev_patch.py
      - run: cargo check --manifest-path cli/Cargo.toml --locked
      - name: Commit
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add cli/src/suite_v2.rs
          git diff --cached --check
          git commit -m 'feat(dev): complete umbrella operations and canonical remote adoption'
          git push origin HEAD:converge/oi-017-first-suite
