name: W1 bounded successor delivery
on:
  push:
    branches: ['agent/w1-shell-layout-recovery-20260920']
    paths: ['.github/workflows/w1-delivery.yml']
permissions:
  contents: write
jobs:
  deliver:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/agent/w1-shell-layout-recovery-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET: agent/w1-shell-layout-finish-20260920
      EXPECTED: b5711b0a82144cbf0b108e47f2793761663c35ab
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5711b0a82144cbf0b108e47f2793761663c35ab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Apply only exact declared source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED"
          git fetch origin 874cf7610a8f42ef74b59ffeff8134bff54f028e
          gh api repos/EpiLogos/O-I/git/blobs/7eb294b00fa97a3d0365b539079d5a4af953cee2 --jq .content | base64 --decode > /tmp/w1-manifest.gz
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,os
          # Four transport transcription corrections, determined by comparing the
          # returned artifact with the sandbox bytes. Verify BOTH exact hashes
          # before parsing or modifying any source. No code is executed from it.
          encoded=base64.b64encode(pathlib.Path('/tmp/w1-manifest.gz').read_bytes()).decode()
          for start,end,text in reversed([[6839,6840,''],[14028,14029,''],[17313,17313,'/'],[18064,18064,'/']]):
              encoded=encoded[:start]+text+encoded[end:]
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha1(b'blob '+str(len(packed)).encode()+b'\0'+packed).hexdigest()=='feed01199f9df824261f62a5b0f5e94b131cb5ad'
          raw=gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='753a18b88874b8bd61637c934e0abdb68d27ead94cede6ea5b48b53e674d3a7d'
          manifest=json.loads(raw)
          assert manifest['base']==os.environ['EXPECTED'] and manifest['branch']==os.environ['TARGET']
          assert manifest['version']==1 and len(manifest['files'])==35
          root=pathlib.Path.cwd(); pending=[]; paths=set()
          for entry in manifest['files']:
              name=entry['path']; path=root/name
              assert name.startswith('desktop/cradle/') and '..' not in pathlib.PurePosixPath(name).parts
              assert path.resolve().is_relative_to(root) and not path.is_symlink() and name not in paths
              paths.add(name)
              old=subprocess.run(['git','rev-parse','HEAD:'+name],capture_output=True,text=True)
              assert (old.stdout.strip() if old.returncode==0 else None)==entry['before'],name
              if entry['before'] is None: assert not path.exists(),name
              source=subprocess.check_output(['git','cat-file','blob',entry['source']]).decode() if entry['source'] else ''
              lines=source.splitlines(keepends=True); previous=0
              for start,end,text in entry['edits']:
                  assert previous<=start<=end<=len(lines); previous=end
              for start,end,text in reversed(entry['edits']): lines[start:end]=text.splitlines(keepends=True)
              result=''.join(lines).encode()
              assert hashlib.sha256(result).hexdigest()==entry['sha256'],name
              pending.append((path,result))
          for path,result in pending:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(result)
          pathlib.Path('/tmp/w1-paths.json').write_text(json.dumps(sorted(paths)))
          pathlib.Path('/tmp/w1-source-manifest.json').write_bytes(raw)
          PY
          git diff --check
      - name: Locked dependencies, build and scoped executable regressions
        working-directory: desktop/cradle
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/shell-recovery.test.mjs tests/mode-workspaces.test.mjs tests/configuration-setup.test.mjs tests/local-shell-acceptance.test.mjs tests/verify-shell-evidence.test.mjs tests/workspace-continuity.test.mjs tests/configuration-live-source.test.mjs tests/configuration-composition.test.mjs
      - name: Commit and normal-push only the isolated successor
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)" = "$EXPECTED"
          python3 - <<'PY'
          import json,subprocess
          paths=json.load(open('/tmp/w1-paths.json'))
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert sorted(actual)==paths
          PY
          git diff --cached --check
          git config user.name 'W1 shell implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(shell): reconcile geometry, recovery and appearance with persistent mode stages'
          git push origin "HEAD:refs/heads/$TARGET"
          git rev-parse HEAD > /tmp/w1-delivery-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-successor-delivery-${{ github.run_id }}
          path: |
            /tmp/w1-source-manifest.json
            /tmp/w1-delivery-head.txt
          if-no-files-found: error
          retention-days: 7
