name: W1 reconciliation source recovery
on:
  push:
    branches: ['agent/w1-shell-layout-recovery-20260920']
    paths: ['.github/workflows/w1-delivery.yml']
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/agent/w1-shell-layout-recovery-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export only tracked sources and exact public revision objects
        run: |
          set -euo pipefail
          mkdir -p /tmp/w1-reconcile
          git rev-parse HEAD > /tmp/w1-reconcile/source-revision.txt
          git archive HEAD | gzip > /tmp/w1-reconcile/lane.tar.gz
          git archive b72d763ce026efebe3fac67655749ac0909ea130 | gzip > /tmp/w1-reconcile/main.tar.gz
          git archive a222c8bdf46a7b2146084770b704dfbe83ce5027 | gzip > /tmp/w1-reconcile/base.tar.gz
          git bundle create /tmp/w1-reconcile/history.bundle HEAD refs/remotes/origin/main ^a222c8bdf46a7b2146084770b704dfbe83ce5027
          sha256sum /tmp/w1-reconcile/* > /tmp/w1-reconcile/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w1-reconciliation-sources-${{ github.run_id }}
          path: /tmp/w1-reconcile
          retention-days: 3
          compression-level: 0
