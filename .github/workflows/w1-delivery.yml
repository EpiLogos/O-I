name: W1 bounded successor delivery
on:
  push:
    branches: ['agent/w1-shell-layout-recovery-20260920']
    paths: ['.github/workflows/w1-delivery.yml']
permissions:
  contents: read
jobs:
  verify-transport:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/agent/w1-shell-layout-recovery-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve and verify bounded manifest, without executing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/w1-transport
          gh api repos/EpiLogos/O-I/git/blobs/7eb294b00fa97a3d0365b539079d5a4af953cee2 --jq .content | base64 --decode > /tmp/w1-transport/manifest.gz
          python3 - <<'PY'
          import gzip,hashlib,pathlib
          raw=gzip.decompress(pathlib.Path('/tmp/w1-transport/manifest.gz').read_bytes())
          assert hashlib.sha256(raw).hexdigest()=='753a18b88874b8bd61637c934e0abdb68d27ead94cede6ea5b48b53e674d3a7d'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-transport-check
          path: /tmp/w1-transport/
          retention-days: 1
