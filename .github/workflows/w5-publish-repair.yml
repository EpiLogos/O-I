name: W5 scoped repair blobs
on:
  pull_request:
    paths: ['.github/workflows/w5-publish-repair.yml']
permissions:
  contents: write
jobs:
  object:
    if: github.event.pull_request.head.repo.full_name == 'EpiLogos/O-I' && github.event.pull_request.head.ref == 'agent/w5-native-expression-backcheck-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and create file blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,urllib.request,os
          def api(path,body=None):
              request=urllib.request.Request('https://api.github.com/repos/EpiLogos/O-I/'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='GET' if body is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          chunks=['5a0af3a796a79c0b11edac16eeb5e9c9db6530e4','473833fd4b13023004516e81e91dcf6e7358160c','741d336233f86699b2b56c1463e8daa10fbc16c5','db86c35b462855a02530213dd92da1208e606425','381fef40c4cdf88aca8437cd0394d70709f95b52','a766f7dd9d86e89f113dacb67976a210780b2a87','c08d21ba1a2c28d6a2731f7f9d8712b7500ceefe']
          raw=b''.join(base64.b64decode(api('git/blobs/'+sha)['content']) for sha in chunks)
          assert hashlib.sha256(raw).hexdigest()=='98812312e2268de4e70fee4d93922f7ba9a871c97ea3bf5c81c2a8169c202b1f'
          packet=json.loads(gzip.decompress(raw));helper='.github/workflows/w5-publish-repair.yml'
          assert packet['base']=='6dbb2d5248a59c7b8ed30686423e8658698d72e2'
          assert git('rev-parse','HEAD^')==packet['base']
          assert git('diff','--name-only','HEAD^','HEAD')==helper
          allowed=set(packet['before']);assert len(allowed)==13
          for path,before in packet['before'].items():
              assert '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
              entry=git('ls-tree','HEAD','--',path)
              assert (entry.split()[2] if entry else None)==before,path
          patch=pathlib.Path('/tmp/w5-repair.patch');patch.write_text(packet['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          changed=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==allowed,(changed,allowed)
          after={}
          for path in sorted(allowed):
              data=pathlib.Path(path).read_bytes()
              sha=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              after[path]=sha
          out=pathlib.Path('/tmp/w5-object');out.mkdir()
          receipt={'parent':git('rev-parse','HEAD'),'base_tree':git('rev-parse','HEAD^{tree}'),'changed':after,'remove':helper,'message':packet['message'],'ref_updated':False}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w5-repair-blobs
          path: /tmp/w5-object
          retention-days: 3
          if-no-files-found: error
