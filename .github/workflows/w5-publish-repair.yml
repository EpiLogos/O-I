name: W5 exact repair blobs
on:
  pull_request:
    paths: ['.github/workflows/w5-publish-repair.yml']
permissions:
  contents: write
jobs:
  object:
    if: github.event.pull_request.head.repo.full_name == 'EpiLogos/O-I' && github.event.pull_request.head.ref == 'agent/w5-native-expression-backcheck-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact patch and create file objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,urllib.request,os
          def api(path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/EpiLogos/O-I/'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='GET' if body is None else 'POST')
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          raw=base64.b64decode(api('git/blobs/4fa8c5b129aa626996989976d2c2ad90e7f3adfc')['content'])
          assert hashlib.sha256(raw).hexdigest()=='6f696cee8ff45450e7c0500fe9b98ffdfe81591cb4b2813514b171ee830d1964'
          packet=json.loads(gzip.decompress(raw));helper='.github/workflows/w5-publish-repair.yml'
          assert packet['base']=='6c9872e7d0bb6aeebb19d6431390a20f2cd29df8'
          assert git('rev-parse','HEAD^')==packet['base']
          assert git('diff','--name-only','HEAD^','HEAD')==helper
          for path,sha in packet['before'].items():
              assert '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
              assert git('rev-parse','HEAD:'+path)==sha
          patch=pathlib.Path('/tmp/repair.patch');patch.write_text(packet['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          assert set(git('diff','--name-only').splitlines())==set(packet['before'])
          after={}
          for path in packet['before']:
              data=pathlib.Path(path).read_bytes()
              sha=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              after[path]=sha
          print(json.dumps({'parent':git('rev-parse','HEAD'),'base_tree':git('rev-parse','HEAD^{tree}'),'changed':after,'remove':helper,'ref_updated':False},indent=2))
          PY
