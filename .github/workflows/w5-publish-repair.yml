name: W5 scoped repair object
on:
  pull_request:
    paths: ['.github/workflows/w5-publish-repair.yml']
permissions:
  contents: write
jobs:
  object:
    if: github.event.pull_request.head.repo.full_name == 'EpiLogos/O-I' && github.event.pull_request.head.ref == 'agent/w5-native-expression-backcheck-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify immutable repair and create Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,urllib.request,os
          repo='EpiLogos/O-I'
          helper='.github/workflows/w5-publish-repair.yml'
          recovery='.github/workflows/w5-recovery-transfer.yml'
          def api(path,body=None):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},method='GET' if body is None else 'POST')
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          chunks=['2c55ef2420940ea91f309aa9f9509598692cfa21','b43b3caae6bf2005313536ca951eee6c3186e231','ced3afb955b2050cf05be96f2137c3a1c69d3a7c','7855bab00d30af1e0b931c3bd47275ac95878648']
          raw=b''.join(base64.b64decode(api('git/blobs/'+sha)['content']) for sha in chunks)
          assert hashlib.sha256(raw).hexdigest()=='7bb771957817f25402692149e948f882b2fab589fdb752cf2a5686083d2cc17f','packet hash mismatch'
          packet=json.loads(gzip.decompress(raw))
          assert packet['base']=='a8e36916c232ae7751e5a6a1f91c7e0ea87c8194'
          assert git('rev-parse','HEAD^')==packet['base'],'new shared work requires reconciliation'
          assert git('diff','--name-only','HEAD^','HEAD')==helper
          allowed=set(packet['before'])
          assert len(allowed)==14
          for path,before in packet['before'].items():
              assert '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
              entry=git('ls-tree','HEAD','--',path)
              observed=entry.split()[2] if entry else None
              assert observed==before,(path,before,observed)
          patch=pathlib.Path('/tmp/w5-repair.patch');patch.write_text(packet['patch'])
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          changed=set(git('diff','--name-only').splitlines())|set(git('ls-files','--others','--exclude-standard').splitlines())
          assert changed==allowed,(changed,allowed)
          tree=[];after={}
          for path in sorted(allowed):
              data=pathlib.Path(path).read_bytes()
              sha=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert sha==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              after[path]=sha;tree.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          for path in [helper,recovery]:tree.append({'path':path,'mode':'100644','type':'blob','sha':None})
          head=git('rev-parse','HEAD')
          tree_sha=api('git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':tree})['sha']
          commit=api('git/commits',{'message':packet['message'],'tree':tree_sha,'parents':[head]})['sha']
          out=pathlib.Path('/tmp/w5-object');out.mkdir()
          (out/'receipt.json').write_text(json.dumps({'parent':head,'tree':tree_sha,'commit':commit,'changed':after,'removed':[helper,recovery],'packet_sha256':hashlib.sha256(raw).hexdigest(),'ref_updated':False},indent=2))
          print('Created immutable repair commit',commit,'; no ref updated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: w5-repair-object
          path: /tmp/w5-object
          retention-days: 3
          if-no-files-found: error
