name: Wiki relations dependency repair

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply bounded source repairs
        shell: python
        run: |
          from pathlib import Path

          knowledge = Path('desktop/core/src/project_knowledge.rs')
          text = knowledge.read_text()
          text = text.replace(
              '    Source(ProjectSourceRelations),',
              '    Source(Box<ProjectSourceRelations>),',
          )
          old = '''            return Ok(ProjectRelations::Source(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n            }));'''
          new = '''            return Ok(ProjectRelations::Source(Box::new(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n            })));'''
          if old not in text:
              raise SystemExit('expected ProjectRelations source construction not found')
          knowledge.write_text(text.replace(old, new))

          presentation = Path('desktop/ui/src/project-field-presentation.test.mjs')
          text = presentation.read_text()
          old = "  assert.match(knowledge, /ProjectRelations::Reflection/);"
          new = "  assert.match(knowledge, /ProjectReflectionReadModel/);\n  assert.match(knowledge, /ProjectRelations::Source/);"
          if old not in text:
              raise SystemExit('expected ProjectRelations presentation assertion not found')
          presentation.write_text(text.replace(old, new))
      - name: Regenerate exact committed native dependency graph
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Prove repaired graph
        run: |
          cargo metadata --manifest-path desktop/src-tauri/Cargo.toml --locked --no-deps >/dev/null
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          node --test desktop/ui/src/project-field-presentation.test.mjs
          git diff --check
      - name: Commit exact non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git add desktop/core/src/project_knowledge.rs desktop/src-tauri/Cargo.lock desktop/ui/src/project-field-presentation.test.mjs
          git config user.name 'EpiLogos automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[WIKI-RELATIONS] Commit accepted owner graph repair'
          git push origin HEAD:feat/authored-wiki-relations-150
