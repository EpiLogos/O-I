name: Personal Web source intake
on:
  push:
    branches: ['agent/personal-web-279']
    paths: ['.github/workflows/personal-web-intake.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture tracked source at this exact revision
        run: |
          mkdir -p /tmp/personal-web-source
          git rev-parse HEAD > /tmp/personal-web-source/COMMIT
          git rev-parse HEAD^{tree} > /tmp/personal-web-source/TREE
          git archive --format=tar.gz --output=/tmp/personal-web-source/source.tar.gz HEAD desktop packages docs shared-field scripts tests skills schemas suite surfaces.json .github
          sha256sum /tmp/personal-web-source/source.tar.gz > /tmp/personal-web-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: personal-web-source-${{ github.sha }}
          path: /tmp/personal-web-source/
          retention-days: 3
