name: Build Phase 3 downstream conformance stack

on:
  push:
    branches:
      - agent/oi-017-exchange-authority-conformance
    paths:
      - '.github/workflows/phase3-conformance-stack.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-017-exchange-authority-conformance
          fetch-depth: 0
      - name: Overlay canonical Phase 3 onto proven Phase 2 + A2A + notification stack
        shell: bash
        run: |
          git fetch origin agent/oi-017-exchange-authority
          for path in \
            shared-field/A2A-CONFORMANCE.md \
            shared-field/a2a.mjs \
            shared-field/a2a.test.mjs \
            shared-field/exchange-authority.test.mjs \
            shared-field/spacetimedb/src/index.ts \
            shared-field/spacetimedb/security-live-acceptance-v4-bootstrap.ts \
            shared-field/spacetimedb/security-live-acceptance-v6.ts \
            shared-field/spacetimedb/a2a-phase2-ingress-live-acceptance.ts
          do
            mkdir -p "$(dirname "$path")"
            git show origin/agent/oi-017-exchange-authority:"$path" > "$path"
          done

          python - <<'PY'
          from pathlib import Path
          import json

          # Keep the #42 full-stack acceptance scripts and add the isolated Phase-3 A2A proof.
          p = Path('shared-field/spacetimedb/package.json')
          data = json.loads(p.read_text())
          data['scripts']['acceptance:a2a-phase3'] = 'tsx a2a-phase2-ingress-live-acceptance.ts'
          p.write_text(json.dumps(data, indent=2) + '\n')

          # Adapt the source-faithful #37 live fixture to consume real Phase-3 grants before each network exchange.
          p = Path('shared-field/spacetimedb/a2a-live-acceptance.ts')
          s = p.read_text()
          anchor = "const RETURNED_CONTRIBUTION_REF = 'contribution:a2a:return:1';\n"
          insert = anchor + """const FIRST_EXCHANGE_REQUEST_REF = 'exchange-request:a2a:full-stack:1';\nconst FIRST_EXCHANGE_GRANT_REF = 'exchange-grant:a2a:full-stack:1';\nconst FIRST_EXCHANGE_OPERATION_ID = 'exchange-operation:a2a:full-stack:1';\nconst REPLACEMENT_EXCHANGE_REQUEST_REF = 'exchange-request:a2a:full-stack:2';\nconst REPLACEMENT_EXCHANGE_GRANT_REF = 'exchange-grant:a2a:full-stack:2';\nconst REPLACEMENT_EXCHANGE_OPERATION_ID = 'exchange-operation:a2a:full-stack:2';\n"""
          if s.count(anchor) != 1: raise SystemExit('constant anchor mismatch')
          s = s.replace(anchor, insert, 1)

          first_anchor = """  const difference = await performA2aExchange({\n    binding: found[0].participation.binding,\n"""
          first_setup = """  await owner.conn.reducers.requestExchange({\n    requestRef: FIRST_EXCHANGE_REQUEST_REF,\n    fieldRef: FIELD_REF,\n    initiatorParticipantRef: OWNER_PARTICIPANT_REF,\n    counterpartyParticipantRef: AGENT_PARTICIPANT_REF,\n    purpose: 'a2a-message-exchange',\n    scopeJson: JSON.stringify({ kind: 'message' }),\n    protocol: 'a2a',\n    bindingRef: BINDING_REF,\n    bindingRevision: 1,\n    modesJson: JSON.stringify(['message:send']),\n    maxUses: 1,\n    ttlSeconds: 300,\n  });\n  await owner.conn.reducers.grantExchange({\n    requestRef: FIRST_EXCHANGE_REQUEST_REF,\n    grantRef: FIRST_EXCHANGE_GRANT_REF,\n    reason: 'Full-stack A2A exchange authority for binding revision 1',\n    evidenceJson: JSON.stringify({ fixture: 'a2a-full-stack', binding_revision: 1 }),\n  });\n\n  const difference = await performA2aExchange({\n    binding: found[0].participation.binding,\n"""
          if s.count(first_anchor) != 1: raise SystemExit('first exchange anchor mismatch')
          s = s.replace(first_anchor, first_setup, 1)
          old = """    presence: found[0].participation.presence,\n    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    message: {\n      exchange_ref: 'a2a-exchange:live:1',\n      message_id: 'a2a-message:live:1',\n      text: 'Return a bounded difference for generic Contribution ingress.',\n    },\n  });\n"""
          new = """    presence: found[0].participation.presence,\n    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    authorize_exchange: async (demand: any) => {\n      await owner.conn.reducers.consumeExchange({\n        grantRef: FIRST_EXCHANGE_GRANT_REF, operationId: demand.operation_id, fieldRef: demand.field_ref,\n        initiatorParticipantRef: demand.initiator_participant_ref, counterpartyParticipantRef: demand.counterparty_participant_ref,\n        protocol: demand.protocol, bindingRef: demand.binding_ref, bindingRevision: demand.binding_revision,\n        mode: demand.mode, purpose: demand.purpose, scopeJson: demand.scope_json,\n      });\n      return { allowed: true, grant_ref: FIRST_EXCHANGE_GRANT_REF };\n    },\n    message: {\n      exchange_ref: 'a2a-exchange:live:1',\n      exchange_operation_id: FIRST_EXCHANGE_OPERATION_ID,\n      message_id: 'a2a-message:live:1',\n      text: 'Return a bounded difference for generic Contribution ingress.',\n    },\n  });\n"""
          if s.count(old) != 1: raise SystemExit('first exchange body mismatch')
          s = s.replace(old, new, 1)

          old = """  await owner.conn.reducers.ingestTransportedContribution({\n    fieldRef: ingress.field_ref,\n    contributorParticipantRef: ingress.contributor_participant_ref,\n    sourceKind: ingress.source_kind,\n    transportProvider: ingress.transport_provider,\n    transportMessageId: ingress.transport_message_id,\n    contractJson: JSON.stringify(ingress.contribution),\n  });\n"""
          new = """  await owner.conn.reducers.ingestAuthorizedExchangeContribution({\n    grantRef: FIRST_EXCHANGE_GRANT_REF,\n    operationId: FIRST_EXCHANGE_OPERATION_ID,\n    fieldRef: ingress.field_ref,\n    contributorParticipantRef: ingress.contributor_participant_ref,\n    sourceKind: ingress.source_kind,\n    transportProvider: ingress.transport_provider,\n    transportMessageId: ingress.transport_message_id,\n    contractJson: JSON.stringify(ingress.contribution),\n  });\n"""
          if s.count(old) != 1: raise SystemExit('ingress anchor mismatch')
          s = s.replace(old, new, 1)

          replacement_anchor = """  const replacementDifference = await performA2aExchange({\n    binding: replacementSnapshot.bindings[0],\n"""
          replacement_setup = """  await owner.conn.reducers.requestExchange({\n    requestRef: REPLACEMENT_EXCHANGE_REQUEST_REF,\n    fieldRef: FIELD_REF,\n    initiatorParticipantRef: OWNER_PARTICIPANT_REF,\n    counterpartyParticipantRef: AGENT_PARTICIPANT_REF,\n    purpose: 'a2a-message-exchange',\n    scopeJson: JSON.stringify({ kind: 'message' }),\n    protocol: 'a2a',\n    bindingRef: BINDING_REF,\n    bindingRevision: 2,\n    modesJson: JSON.stringify(['message:send']),\n    maxUses: 1,\n    ttlSeconds: 300,\n  });\n  await owner.conn.reducers.grantExchange({\n    requestRef: REPLACEMENT_EXCHANGE_REQUEST_REF,\n    grantRef: REPLACEMENT_EXCHANGE_GRANT_REF,\n    reason: 'Fresh Exchange authority for replacement binding revision 2',\n    evidenceJson: JSON.stringify({ fixture: 'a2a-full-stack', binding_revision: 2 }),\n  });\n\n  const replacementDifference = await performA2aExchange({\n    binding: replacementSnapshot.bindings[0],\n"""
          if s.count(replacement_anchor) != 1: raise SystemExit('replacement anchor mismatch')
          s = s.replace(replacement_anchor, replacement_setup, 1)
          old = """    presence: replacementSnapshot.presence[0],\n    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    message: { message_id: 'a2a-message:live:replacement', text: 'Use replacement endpoint.' },\n  });\n"""
          new = """    presence: replacementSnapshot.presence[0],\n    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    authorize_exchange: async (demand: any) => {\n      await owner.conn.reducers.consumeExchange({\n        grantRef: REPLACEMENT_EXCHANGE_GRANT_REF, operationId: demand.operation_id, fieldRef: demand.field_ref,\n        initiatorParticipantRef: demand.initiator_participant_ref, counterpartyParticipantRef: demand.counterparty_participant_ref,\n        protocol: demand.protocol, bindingRef: demand.binding_ref, bindingRevision: demand.binding_revision,\n        mode: demand.mode, purpose: demand.purpose, scopeJson: demand.scope_json,\n      });\n      return { allowed: true, grant_ref: REPLACEMENT_EXCHANGE_GRANT_REF };\n    },\n    message: { exchange_operation_id: REPLACEMENT_EXCHANGE_OPERATION_ID, message_id: 'a2a-message:live:replacement', text: 'Use replacement endpoint.' },\n  });\n"""
          if s.count(old) != 1: raise SystemExit('replacement body mismatch')
          s = s.replace(old, new, 1)

          old = """    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    message: { message_id: 'a2a-message:after-withdrawal', text: 'must not send' },\n    fetch_impl: async () => { attemptedFetch = true; throw new Error('must not fetch'); },\n"""
          new = """    initiator_participant_ref: OWNER_PARTICIPANT_REF,\n    authorize_exchange: async () => { throw new Error('withdrawn binding must fail before authority consumption'); },\n    message: { message_id: 'a2a-message:after-withdrawal', text: 'must not send' },\n    fetch_impl: async () => { attemptedFetch = true; throw new Error('must not fetch'); },\n"""
          if s.count(old) != 1: raise SystemExit('withdrawal body mismatch')
          s = s.replace(old, new, 1)
          s = s.replace("proof: 'oi-a2a-sharedfield-live/v2-generic-contribution-ingress'", "proof: 'oi-a2a-sharedfield-live/v3-exchange-authority'")
          p.write_text(s)
          PY

          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git add shared-field
          git diff --cached --check
          git commit -m 'Converge Phase 3 over A2A and notification evidence stack'
          git push origin HEAD:agent/oi-017-exchange-authority-conformance
