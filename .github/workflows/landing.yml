name: Exact source landing

on:
  push:
    branches: [main]
    # Prose no test or gate reads: a change touching only these skips the tier.
    paths-ignore: ['ProjectCentral/docs/1-vision/dlw/**', 'ProjectCentral/docs/5-evidence/research/glass-bead-game/**']
  pull_request:
    paths-ignore: ['ProjectCentral/docs/1-vision/dlw/**', 'ProjectCentral/docs/5-evidence/research/glass-bead-game/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-landing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-24.04
    # 90 until 10 Nov 2026. At cf160d12 (O-I #956) the job took 80 min: 6.5 of setup and 71 of gates (their measured sum, 4268 s), with
    # kernel-test stopped at its 900 s and candidate-suite failing at 1364 s of its 25 min. The 120 is margin, not a need of the kernel
    # gates' split, which lengthens nothing: on the runner at 78b11cea (desktop.yml's kernel job, the same two commands) the unit half
    # took 314 s and the integration half 370 s, 684 s against the one gate's 785 s at 0c385e26.
    timeout-minutes: 120
    steps:
      # The tier builds the kernel, the CLI and four live crates, each in its own target, beside two browser installs; the runner's
      # preinstalled toolchains this job never uses leave too little disk for that (3 Nov 2026: "No space left on device").
      - name: Free the runner's disk of toolchains the tier does not use
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # One exact Node: the invisible set's pin reads Node's own Unicode, which moves with it (be2i ruling 3; DLW build ruling 2026-11-09).
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            desktop/cradle/package-lock.json
            desktop/cradle/expressions-app/package-lock.json
            packages/live-shell/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            cli
            desktop/cradle/kernel
            packages/live-dynamics
            packages/live-set
            packages/live-engine
            packages/live-shell
      # Their Ubuntu packages are kept between runs, as .github/actions/playwright-debs keeps them for the candidate job: the mirror has
      # stalled such an install 16 minutes. The steps are written here, not taken from that action, because this job checks out the
      # candidate's own commit, which may predate the action (O-I #961, on 4305e902: "Can't find 'action.yml' … playwright-debs").
      - name: Restore the Ubuntu packages kept from the last landing run
        id: kept-debs
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/playwright-debs
          key: playwright-debs-landing-${{ runner.os }}-${{ hashFiles('desktop/cradle/package-lock.json', 'desktop/cradle/expressions-app/field-studies-journeys/tests/requirements.txt') }}
          # As the local action does: a run with no set of its own starts from the newest one kept that it can read.
          restore-keys: |
            playwright-debs-landing-${{ runner.os }}-
            playwright-debs-
      - name: Install the browser engines used by the declared landing gates
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-playwright-debs >/dev/null
          shopt -s nullglob
          kept=("$HOME"/.cache/playwright-debs/*.deb)
          echo "kept from the last run: ${#kept[@]} packages"
          if ((${#kept[@]})); then sudo cp "${kept[@]}" /var/cache/apt/archives/; fi
          python -m pip install -r desktop/cradle/expressions-app/field-studies-journeys/tests/requirements.txt
          python -m playwright install --with-deps chromium
          npm ci --prefix desktop/cradle --no-audit --no-fund
          (cd desktop/cradle && npx playwright install --with-deps chromium webkit)
          mkdir -p "$HOME/.cache/playwright-debs"
          debs=(/var/cache/apt/archives/*.deb)
          if ((${#debs[@]})); then cp "${debs[@]}" "$HOME/.cache/playwright-debs/"; fi
          echo "kept for the next run: ${#debs[@]} packages"
          echo "count=${#debs[@]}" >> "$GITHUB_OUTPUT"
        id: install-engines
      - name: Keep the Ubuntu packages for the next landing run
        if: steps.kept-debs.outputs.cache-hit != 'true' && steps.install-engines.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.kept-debs.outputs.cache-primary-key }}
      - name: Run the complete native landing tier at the exact candidate
        run: node gates/run.mjs landing --keep-going --json
      - name: Confirm the receipt covers the complete clean candidate
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const receipt = JSON.parse(readFileSync('gates/receipts/latest-landing.json'));
          const manifest = JSON.parse(readFileSync('gates/manifest.json'));
          assert.equal(receipt.head, execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim());
          assert.equal(receipt.dirty, false);
          assert.equal(receipt.scope, 'full');
          assert.equal(receipt.tier, 'landing');
          assert.equal(receipt.pass, true);
          assert.deepEqual(receipt.selected, manifest.gates.filter(g => g.tier === 'landing').map(g => g.name));
          assert.ok(receipt.gates.every(g => g.ok));
          JS
      - name: Retain the native receipt and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-landing-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            gates/receipts/
            desktop/cradle/tests/artifacts/
          retention-days: 14
          if-no-files-found: error
