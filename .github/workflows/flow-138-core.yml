name: Flow 138 core integration

on:
  push:
    branches:
      - feat/flow-desktop-138

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/apply-flow-138-core.py
      - name: Commit Flow application composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[FLOW] Compose Flow with Living Knowledge and praxis"
          git push origin HEAD:feat/flow-desktop-138
