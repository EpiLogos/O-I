name: OI17 Clippy cleanup

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - .github/workflows/oi17-clippy-fix.yml

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Elide needless lifetime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cli/src/suite_v2.rs')
          text = path.read_text()
          old = "fn selected_asset<'a>(product: &'a SuiteProduct) -> Result<&'a SuiteAsset, String> {"
          new = "fn selected_asset(product: &SuiteProduct) -> Result<&SuiteAsset, String> {"
          if old not in text:
              raise SystemExit('expected selected_asset signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt --manifest-path cli/Cargo.toml
      - run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Commit cleanup
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add cli/src/suite_v2.rs
          git diff --cached --check
          git commit -m 'style(suite): elide needless selected-asset lifetime'
          git push origin HEAD:converge/oi-017-first-suite
