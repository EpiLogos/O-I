name: Verify Nara identity implementation transfer
on:
  push:
    branches: ['agent/nara-identity-inhabitation-20260921']
    paths: ['.github/workflows/nara-identity-intake.yml', '.github/nara-identity-intake/repairs.json']
permissions:
  contents: write
concurrency:
  group: nara-identity-intake
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Retain exact transferred bytes even on failure
        run: |
          mkdir -p /tmp/nara-intake
          cp .github/nara-identity-intake/* /tmp/nara-intake/
          git rev-parse HEAD > /tmp/nara-intake/source-head.txt
      - name: Verify digest, ownership and patch before staging code
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/nara-identity-inhabitation-20260921
          git merge-base --is-ancestor 0cd377905efe55ba7b677ced223aeee6fa5eb722 HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          root=pathlib.Path('.github/nara-identity-intake')
          parts=[(root/f'part-{i}.b64').read_text().strip() for i in range(4)]
          repair=root/'repairs.json'
          if repair.exists():
              for fix in json.loads(repair.read_text()):
                  p,start,end,before,after=fix
                  assert parts[p][start:end]==before,'repair basis changed'
                  parts[p]=parts[p][:start]+after+parts[p][end:]
          expected=['0a9a0160922319523d43b0c22dcc555f863094500675625c78281da0f9680104','c6e28f78ff2cda66332bd92dffcda1bbf36884650689d9dae05a5372dc32ddac','24780a146d241010671d8dfb5222296631a940c4ff312a676d736cfb3cf6623d','afd92014331961fa826d3d39ca6ff9940c184e6e096402592035e722501dbc48']
          for i,p in enumerate(parts):
              digest=hashlib.sha256(p.encode()).hexdigest()
              print(i,len(p),digest,flush=True)
              assert digest==expected[i],f'part {i} transfer integrity failure; original bytes retained'
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ded200ffbd51de3c4127758a862aa2178af1563577e41187e16373f6b5f11703'
          pathlib.Path('/tmp/nara-intake/implementation.patch').write_bytes(patch)
          allowed=['.github/workflows/nara-identity-inhabitation.yml','desktop/cradle/expressions-app/field-studies-journeys/src/app.ts','desktop/cradle/expressions-app/field-studies-journeys/src/privateIdentity.ts','desktop/cradle/kernel/src/action.rs','desktop/cradle/kernel/src/action/nara.rs','desktop/cradle/src/expressions/hostedApp.ts','desktop/cradle/src/nara/NaraSurface.tsx','desktop/cradle/src/nara/identityPresentation.ts','desktop/cradle/src/nara/personal/OwnWords.tsx','desktop/cradle/src/nara/personal/PersonalWorkbench.tsx','desktop/cradle/src/nara/personal/SourcePicker.tsx','desktop/cradle/src/nara/personal/client.ts','desktop/cradle/src/nara/personal/flowReturn.ts','desktop/cradle/src/nara/personal/ground.ts','desktop/cradle/src/nara/personal/identityHosts.ts','desktop/cradle/src/nara/personal/operations.ts','desktop/cradle/src/nara/personal/personal.css','desktop/cradle/tests/nara-personal-browser.mjs','desktop/cradle/tests/nara-personal-contracts.test.mjs','desktop/cradle/tests/nara-personal-fixtures.mjs','desktop/cradle/tests/nara-personal-modules.mjs','desktop/cradle/tests/nara-personal-native.mjs','desktop/cradle/tests/nara-personal-page.tsx','docs/contracts/NARA-SPEECH-EXPERIENCE-V1.md']
          stats=subprocess.check_output(['git','apply','--numstat','/tmp/nara-intake/implementation.patch'],text=True)
          names=[line.split('\t',2)[2] for line in stats.splitlines()]
          assert sorted(names)==sorted(allowed),'unexpected patch write surface'
          # The Actions token cannot publish workflow changes. The connected
          # GitHub API publishes that exact file with its separate permission.
          args=['--exclude=.github/workflows/nara-identity-inhabitation.yml']
          subprocess.run(['git','apply','--check','--index',*args,'/tmp/nara-intake/implementation.patch'],check=True)
          subprocess.run(['git','apply','--index',*args,'/tmp/nara-intake/implementation.patch'],check=True)
          print('Exact implementation patch applied to claimed production paths')
          PY
      - name: Publish checked non-workflow implementation to its own branch
        run: |
          set -euo pipefail
          rustfmt --edition 2021 desktop/cradle/kernel/src/action/nara.rs
          git add desktop/cradle/kernel/src/action/nara.rs
          git rm -r .github/nara-identity-intake
          git diff --cached --stat
          git config user.name Epii
          git config user.email noreply@openai.com
          git commit -m 'feat(nara): inhabit Central sources and Flow with reviewed personal identity and private Expressions'
          test "$(git ls-remote origin refs/heads/agent/nara-identity-inhabitation-20260921 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/agent/nara-identity-inhabitation-20260921
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nara-intake-${{ github.sha }}
          path: /tmp/nara-intake
          if-no-files-found: error
          retention-days: 3
