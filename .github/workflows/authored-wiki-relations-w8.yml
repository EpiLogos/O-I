name: Authored Wiki relations W8 conformance

on:
  pull_request:
    paths:
      - 'suite/authored-wiki-relations-w8.json'
      - '.github/workflows/authored-wiki-relations-w8.yml'
      - 'desktop/**'
      - 'shared-field/**'
      - 'site/**'

permissions:
  contents: read

env:
  CENTRAL_SHA: 31d54eb4a6202c89c7f60ec004654916133dea94
  AIKIT_SHA: 6b2517862faccc7787b36ef45ef8d19186fe8128
  FACTORY_SHA: 0731d654eab9357323f603f306332d3b7e0e71cb
  OI_CONSUMER_BASE_MAIN: 907f6d21ea917b7ce8de34b3ca4592b16ece696b

jobs:
  native-source-recovery:
    name: W8 native source/rebuild contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: ${{ env.CENTRAL_SHA }}
          path: owners/central
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: ${{ env.AIKIT_SHA }}
          path: owners/ai-kit
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/agent-system-design
          ref: ${{ env.FACTORY_SHA }}
          path: owners/factory
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove exact native owner revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owners/central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C owners/ai-kit rev-parse HEAD)" = "$AIKIT_SHA"
          test "$(git -C owners/factory rev-parse HEAD)" = "$FACTORY_SHA"
      - name: Central — stable Flow/source identity, retained placement and revision authority
        run: cargo test --manifest-path owners/central/Cargo.toml -p ctrl
      - name: A/D — plain Markdown plus OKF Properties remain one open authored source field
        run: |
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters plain_markdown_and_optional_okf_properties_join_one_authored_relation_field
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters non_okf_frontmatter_does_not_capture_other_tools_metadata
      - name: A — fresh SemanticWiki reconstruction returns authored backlink truth
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters compilation_resolves_to_existing_wiki_and_rebuild_produces_backlink
      - name: A — source revision advances derived revision without changing stable relation identity
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters source_revision_changes_edge_revision_but_not_stable_identity
      - name: A — unresolved evidence remains addressable without synthetic graph targets
        run: |
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters unresolved_relation_survives_without_synthetic_graph_target
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters unresolved_only_source_is_still_a_valid_relation_focus
      - name: A — consumer read model carries backlink-capable and pending state together
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters consumer_gets_resolved_backlink_capable_view_and_pending_links_together
      - name: B — Flow participates as stable external endpoint, not WikiNode replacement
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters flow_subject_can_be_external_endpoint_without_becoming_wiki_node
      - name: B — source authority remains distinct from explicit authored relation origin
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters explicit_relation_origin_does_not_overwrite_agent_source_authority
      - name: B — authored source change feeds Living Knowledge with no model path
        run: |
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters authored_relations_feed_existing_living_knowledge_dependency_path
          cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters authored_properties_revision_change_enters_existing_changed_affected_metabolism
      - name: D — retained ProjectCentral Markdown rebuilds in place with backlink/pending state
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters projectcentral_retained_markdown_rebuilds_into_existing_wiki_and_backlinks
      - name: D — retained source revision rebuild performs zero model work
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters source_revision_change_rebuilds_relation_revision_without_model_work
      - name: Factory — current Project/Run cognition and opaque evidence owner remains green
        run: cargo test --manifest-path owners/factory/Cargo.toml -p epilogos-factory

  oi-consumption:
    name: W8 O:I multi-world consumption and Projection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate exact-main reroot, authored worlds and owner pins
        shell: python
        run: |
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('suite/authored-wiki-relations-w8.json').read_text())
          assert manifest['schema'] == 'oi.authored-wiki-relations-w8/v1'
          assert manifest['physical_evidence_claimed'] is False
          assert manifest['consumer_base_main'] == '${{ env.OI_CONSUMER_BASE_MAIN }}'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          assert parent == '${{ env.OI_CONSUMER_BASE_MAIN }}', (parent, '${{ env.OI_CONSUMER_BASE_MAIN }}')
          assert [(world['id'], world['name']) for world in manifest['worlds']] == [
              ('A', 'ordinary-markdown-wiki'),
              ('B', 'flow'),
              ('C', 'deep-structured-knowledge'),
              ('D', 'heterogeneous-retained-source'),
          ]
          assert manifest['owners']['central']['revision'] == '${{ env.CENTRAL_SHA }}'
          assert manifest['owners']['ai-kit']['revision'] == '${{ env.AIKIT_SHA }}'
          assert manifest['owners']['software-factory']['revision'] == '${{ env.FACTORY_SHA }}'
          cargo = Path('desktop/core/Cargo.toml').read_text()
          assert '${{ env.AIKIT_SHA }}' in cargo
          assert 'aikit-adapters' in cargo
          assert all(not world['requires_ql'] for world in manifest['worlds'])
          assert any('deleting derived SemanticWiki' in p for p in manifest['worlds'][0]['proves'])
          assert any('public Projection' in p for p in manifest['cross_world_acceptance'])
          assert any('O:I owns no Markdown/OKF parser' in p for p in manifest['cross_world_acceptance'])
      - name: Build rendered workbench from its committed UI graph
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
      - name: O:I core — owner read-model consumption and Living/Flow regressions
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - name: A/B/C/D — workbench keeps language primary over one stable Project field
        run: |
          node --test desktop/ui/src/flow-workbench.test.mjs
          node --test desktop/ui/src/living-wiki-model.test.mjs
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/workbench-presentation.test.mjs
      - name: Cross-world Projection — authored relation eligibility/privacy authority remains canonical
        run: |
          node --test shared-field/authored-relation-projection.test.mjs
          node --test shared-field/presentation-projection.test.mjs
          node --test shared-field/projection-refinement.test.mjs
          node --test site/explore-read-model.test.mjs
          node --test site/projection-renderer.test.mjs
          node --test site/public-content.test.mjs
      - name: Source-before-index, no second parser/index and explicit Contemplate boundary
        shell: python
        run: |
          from pathlib import Path
          core = Path('desktop/core/src/project_knowledge.rs').read_text()
          assert 'projectcentral_authored_wiki' in core
          assert 'compile_authored_wiki_relations' in core
          assert 'rebuild_semantic_wiki_with_authored_relations' in core
          assert 'automatic_agent_or_model_invocation: false' in core
          assert 'authored_relation_dependencies' in core
          for root in [Path('desktop/ui/src'), Path('site')]:
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.ts', '.tsx', '.js', '.mjs'}:
                      continue
                  text = path.read_text(errors='ignore')
                  assert 'parse_authored_wiki_source' not in text, f'renderer parser leakage: {path}'
                  assert 'compile_authored_wiki_relations' not in text, f'renderer compiler leakage: {path}'
                  assert 'SemanticWikiIndex::rebuild' not in text, f'renderer index leakage: {path}'
      - name: Preserve source hygiene
        run: git diff --check
