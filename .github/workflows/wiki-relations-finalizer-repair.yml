name: Wiki relations finalizer repair

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair canonical finalizer and extract its bounded implementation
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/wiki-relations-product-finalize.yml')
          text = workflow.read_text()
          needle = "text += r'''"
          count = text.count(needle)
          if count != 4:
              raise SystemExit(f'expected exactly four raw append blocks, found {count}')
          text = text.replace(needle, "text += '''")
          workflow.write_text(text)

          lines = text.splitlines()
          step = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply bounded #150 consumer closure')
          run = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
          script = []
          for line in lines[run + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  script.append(line[10:])
              elif not line.strip():
                  script.append('')
              else:
                  raise SystemExit(f'unexpected indentation while extracting finalizer: {line!r}')
          if not script or script[0] != 'from pathlib import Path':
              raise SystemExit('could not recover canonical bounded implementation')
          Path('/tmp/wiki-relations-finalize.py').write_text('\n'.join(script) + '\n')
      - name: Apply canonical bounded #150 consumer closure
        run: python /tmp/wiki-relations-finalize.py
      - name: Format and prove #150 consumer closure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/core/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          node --test desktop/ui/src/workbench-presentation.test.mjs
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/flow-workbench.test.mjs
          node --test shared-field/*.test.mjs
          git diff --check
      - name: Commit accepted product state and retire finalizers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wiki-relations-product-finalize.yml .github/workflows/wiki-relations-finalizer-repair.yml
          git add desktop/core/src/project_knowledge.rs desktop/core/src/lib.rs desktop/src-tauri/src/flow.rs desktop/src-tauri/src/main.rs desktop/ui/src/authored-relations.tsx desktop/ui/src/workbench-native.tsx desktop/ui/src/flow-workbench.tsx desktop/ui/src/workbench-presentation.test.mjs desktop/ui/src/flow-workbench.test.mjs shared-field/projection-reading.mjs shared-field/authored-relation-projection.test.mjs
          git config user.name 'EpiLogos automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[OI-WIKI-RELATIONS] Complete desktop Flow and public Projection consumption'
          git push origin HEAD:feat/authored-wiki-relations-150
