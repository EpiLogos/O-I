name: OI172 repin QL command owner

on:
  push:
    branches:
      - feat/oi172-six-product-native-command-field

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repin exact accepted QL owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = 'da19d60e3e81473d354e71d5ec13a2582cff95e5'
          new = 'db2b15987c9d99b2a0008cfe75c95f9df1c44715'
          for name in ('surfaces.json', 'suite/mainline.json'):
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              assert count >= 1, f'{name}: expected stale QL pin not found'
              path.write_text(text.replace(old, new))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/oi172-repin-ql.yml
      - name: Commit durable repin only
        run: |
          git config user.name Epii
          git config user.email frank.g.taylor97@gmail.com
          git add surfaces.json suite/mainline.json .github/workflows/oi172-repin-ql.yml
          git diff --cached --check
          git commit -m '[OI172] Repin QL command relation to accepted main'
          git push origin HEAD:feat/oi172-six-product-native-command-field
