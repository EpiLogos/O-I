name: Rustfmt Patch

on:
  push:
    branches: ["agent/prelocal-verification"]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format working tree
        run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Capture patch
        run: git diff --binary > "$RUNNER_TEMP/rustfmt.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch
