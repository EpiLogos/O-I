name: Pre-local Test Diagnostics

on:
  push:
    branches: ["agent/prelocal-verification"]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture tests
        shell: bash
        run: |
          set +e
          cargo test --manifest-path cli/Cargo.toml --all-targets -- --nocapture > "$RUNNER_TEMP/test.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/test.status"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: prelocal-test-diagnostics
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/test.status
