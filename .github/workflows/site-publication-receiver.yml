name: Public publication receiver

on:
  push:
    branches: [site/publication-receiver-20260920]
    paths: ['site/**', '.github/workflows/site-publication-receiver.yml']
  pull_request:
    paths: ['site/**', 'shared-field/**', '.github/workflows/site-publication-receiver.yml']

permissions:
  contents: read

concurrency:
  group: site-publication-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing public build dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Native and public receiving behaviour
        working-directory: site
        run: |
          mkdir -p evidence/receiver
          git rev-parse HEAD > evidence/receiver/commit.txt
          set -o pipefail
          node --test *.test.mjs src/explore/relation-layout.test.mjs tests/publication-*.test.mjs ../shared-field/*.test.mjs | tee evidence/receiver/node.tap
      - name: Build only admitted public outputs
        working-directory: site
        run: npm run build:public
      - name: Verify preview bytes without claiming that an empty corpus is accepted
        working-directory: site
        run: node verify-public-edition.mjs --directory dist --allow-empty --out evidence/receiver/preview-byte-receipt.json
      - name: Exercise the actual browser boundary
        working-directory: site
        run: |
          python -m pip install playwright==1.51.0 pillow
          python -m playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > evidence/receiver/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          result=0
          python tests/library-acceptance.py || result=1
          python tests/library-regressions.py || result=1
          python tests/publication-acceptance.py || result=1
          python tests/publication-receiver-browser.py || result=1
          exit "$result"
      - name: Observe the candidate public Pages endpoint without deployment
        if: always()
        working-directory: site
        run: |
          mkdir -p evidence/receiver
          set +e
          node verify-public-edition.mjs --url https://epilogos.github.io/O-I/ --out evidence/receiver/deployed-byte-receipt.json > evidence/receiver/deployed-observation.log 2>&1
          observed=$?
          printf '{"acceptance_exit":%s,"standing":"observation-only; inspect strict verifier result"}\n' "$observed" > evidence/receiver/deployed-observation-status.json
          cat evidence/receiver/deployed-observation.log
          # This is not a deployment gate for this preview branch. A nonzero
          # strict verifier result remains NOT ACCEPTED in the receipt.
      - name: Retain exact-head evidence, never stage it as public site data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-receiver-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            site/evidence/receiver/
            site/evidence/library/
          retention-days: 14
          if-no-files-found: error
