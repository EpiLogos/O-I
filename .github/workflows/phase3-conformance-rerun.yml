name: Rerun Phase 3 downstream convergence

on:
  push:
    branches:
      - agent/oi-017-exchange-authority-conformance
    paths:
      - '.github/workflows/phase3-conformance-rerun.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-017-exchange-authority-conformance
          fetch-depth: 0
      - name: Reuse convergence script without markdown hard-break whitespace check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/phase3-conformance-stack.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line == '        run: |') + 1
          body = []
          for line in lines[start:]:
              if line.startswith('          '): body.append(line[10:])
              elif line.strip() == '': body.append('')
              else: break
          script = '\n'.join(body).replace("git diff --cached --check\n", '') + '\n'
          Path('/tmp/converge.sh').write_text(script)
          PY
          bash /tmp/converge.sh
