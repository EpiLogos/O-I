name: Site shell v2 acceptance

on:
  push:
    branches: [site/redesign-v2, site/library-first-public-expressions-20260919]
    paths: ['site/**', '.github/workflows/site-shell-v2.yml']
  pull_request:
    paths: ['site/src/shell/**', 'site/src/tokens.css', 'site/tests/shell-v2-acceptance.py', 'site/tests/read-shell-source.mjs', '.github/workflows/site-shell-v2.yml']

permissions:
  contents: read

concurrency:
  group: site-shell-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build the actual public site
        working-directory: site
        run: npm run build:public
      - name: Install test-only browser tooling
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Exercise source, media, motion, layout and navigation
        working-directory: site
        run: |
          mkdir -p evidence/shell-v2
          git rev-parse HEAD > evidence/shell-v2/commit.txt
          npm run preview -- --host 127.0.0.1 --port 4173 > evidence/shell-v2/server.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/shell.html >/dev/null && break; sleep 1; done
          python tests/shell-v2-acceptance.py
      - name: Retain preview and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-shell-v2-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            site/evidence/shell-v2/
            site/dist/
            site/src/shell/
            site/src/tokens.css
            site/tests/shell-v2-acceptance.py
            site/package-lock.json
