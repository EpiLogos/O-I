name: Fix Phase 3 live fixture

on:
  push:
    branches:
      - agent/oi-017-exchange-authority
    paths:
      - '.github/workflows/phase3-fix-fixture.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-017-exchange-authority
          fetch-depth: 0
      - name: Correct exact Exchange scope in live use helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shared-field/spacetimedb/security-live-acceptance-v6.ts')
          s = p.read_text()
          old = """  protocol?: string; bindingRef?: string; bindingRevision?: number; mode?: string; purpose?: string;\n}) {\n  return {\n"""
          new = """  protocol?: string; bindingRef?: string; bindingRevision?: number; mode?: string; purpose?: string;\n  scope?: Record<string, unknown>;\n}) {\n  return {\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one useArgs type anchor, found {s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = """    mode: input.mode ?? 'message:send',\n    purpose: input.purpose ?? 'phase3-authorised-exchange',\n  };\n}\n"""
          new2 = """    mode: input.mode ?? 'message:send',\n    purpose: input.purpose ?? 'phase3-authorised-exchange',\n    scopeJson: JSON.stringify(input.scope ?? { kind: 'message', topic: 'phase3-fixture' }),\n  };\n}\n"""
          if s.count(old2) != 1:
              raise SystemExit(f'expected one useArgs return anchor, found {s.count(old2)}')
          p.write_text(s.replace(old2, new2, 1))
          PY
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git add shared-field/spacetimedb/security-live-acceptance-v6.ts
          git diff --cached --check
          git commit -m 'Fix exact scope in Phase 3 live exchange fixture'
          git push origin HEAD:agent/oi-017-exchange-authority
