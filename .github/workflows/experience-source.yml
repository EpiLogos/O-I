name: Experience story source (not product acceptance)
on:
  pull_request:
    paths:
      - 'docs/experience/**'
      - 'skills/experience-campaign/**'
      - 'scripts/experience_map.py'
      - 'scripts/shell_matrix_views.py'
      - 'tests/experience/**'
      - 'ProjectCentral/user/capability-matrix.*'
      - 'ProjectCentral/docs/1-vision/dlw/DLW.md'
      - 'packages/live-shell/ui/src/inhabitants/capabilityHomes.ts'
      - '.github/workflows/experience-source.yml'
  push:
    branches: [main, agent/paired-experience-campaign]
    paths:
      - 'docs/experience/**'
      - 'skills/experience-campaign/**'
      - 'scripts/experience_map.py'
      - 'scripts/shell_matrix_views.py'
      - 'tests/experience/**'
      - 'ProjectCentral/user/capability-matrix.*'
      - 'ProjectCentral/docs/1-vision/dlw/DLW.md'
      - 'packages/live-shell/ui/src/inhabitants/capabilityHomes.ts'
      - '.github/workflows/experience-source.yml'
permissions:
  contents: read
jobs:
  source:
    name: Source integrity and planning projection only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and negative cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests/experience -p 'test_*.py' -v
      - name: The S-whole matrix's story view and capability homes equal their derivation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/shell_matrix_views.py --check
      - name: Compile source to UX and capability-matrix readings
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/experience_map.py --output-dir "$RUNNER_TEMP/experience-planning-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
