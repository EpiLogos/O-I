name: Wiki relations bounded closure executor

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the already-authored bounded consumer patch with proven repairs
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/wiki-relations-consumer-close.yml')
          lines = source.read_text().splitlines()
          step = next(i for i, line in enumerate(lines) if line.strip() == '- name: Apply only missing #150 joins')
          run = next(i for i in range(step + 1, len(lines)) if lines[i].strip() == 'run: |')
          script = []
          for line in lines[run + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  script.append(line[10:])
              elif not line.strip():
                  script.append('')
              else:
                  raise SystemExit(f'unexpected consumer patch indentation: {line!r}')
          patch = '\n'.join(script) + '\n'
          old = 'raw_target: string; raw_token: string; channel: string; source_ref: string; source_revision?: string; anchor: { field_path?: string; start_byte?: number; end_byte?: number }; resolution:'
          new = 'raw_target: string; raw_token: string; relation?: string; channel: string; source_ref: string; source_revision?: string; anchor: { field_path?: string; start_byte?: number; end_byte?: number }; resolution:'
          if old not in patch:
              raise SystemExit('pending authored-relation evidence type repair anchor absent')
          patch = patch.replace(old, new, 1)
          exec(compile(patch, '<bounded-150-consumer>', 'exec'), {'__name__': '__main__'})

          fixture = Path('shared-field/authored-relation-projection.test.mjs')
          text = fixture.read_text()
          empty_count = text.count('provenance: []')
          if empty_count != 4:
              raise SystemExit(f'expected four legacy empty provenance arrays, found {empty_count}')
          provenance = "provenance: [{ kind: 'closure-fixture', ref: 'fixture:authored-relations', source_system: 'oi-test', revision: 'fixture@1' }]"
          fixture.write_text(text.replace('provenance: []', provenance))
      - name: Prove desktop authored relations, Flow integration, and public privacy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/core/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          node --test desktop/ui/src/project-field-presentation.test.mjs desktop/ui/src/flow-workbench.test.mjs desktop/ui/src/living-wiki-model.test.mjs
          node --test shared-field/authored-relation-projection.test.mjs shared-field/account-projection.test.mjs shared-field/presentation-projection.test.mjs shared-field/projection-refinement.test.mjs
          git diff --check
      - name: Commit product state and retire temporary closure machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wiki-relations-consumer-close.yml
          rm -f .github/workflows/wiki-relations-finalizer-repair.yml
          rm -f .github/workflows/wiki-relations-closure-executor.yml
          git add \
            desktop/core/src/project_knowledge.rs \
            desktop/core/src/lib.rs \
            desktop/src-tauri/src/flow.rs \
            desktop/src-tauri/src/main.rs \
            desktop/ui/src/project-field.tsx \
            desktop/ui/src/flow-workbench.tsx \
            desktop/ui/src/project-field-presentation.test.mjs \
            desktop/ui/src/flow-workbench.test.mjs \
            shared-field/projection-reading.mjs \
            shared-field/authored-relation-projection.test.mjs \
            .github/workflows/wiki-relations-consumer-close.yml \
            .github/workflows/wiki-relations-finalizer-repair.yml \
            .github/workflows/wiki-relations-closure-executor.yml
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m '[OI-WIKI-RELATIONS] Close Flow and public authored relation consumer'
          git push origin HEAD:feat/authored-wiki-relations-150
