name: Development Field exact owner-native D
on:
  pull_request:
    paths: ['scripts/development-field-ci.py', 'tests/development-field/cut.json', '.github/workflows/development-field-native.yml']
  push:
    branches: [main]
    paths: ['scripts/development-field-ci.py', 'tests/development-field/cut.json', '.github/workflows/development-field-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    name: D / ${{ matrix.owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        owner: [oi, central, actuation, ai-kit, software-factory, workcell, quaternal-logic]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Factory native validator dependency
        if: matrix.owner == 'software-factory'
        run: python3 -m pip install 'jsonschema==4.25.1'
      - name: Check out exact native owner and record live-main observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/development-field-ci.py prepare
          --owner '${{ matrix.owner }}'
          --source '${{ runner.temp }}/owner-source'
          --out '${{ runner.temp }}/evidence'
      - name: Publish exact native source and workflow context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-field-source-${{ matrix.owner }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: development-field-${{ matrix.owner }}
          cache-on-failure: true
          # O:I's standalone workspace is cli/; every other owner's is root.
          workspaces: ${{ runner.temp }}/owner-source${{ matrix.owner == 'oi' && '/cli' || '' }} -> target
      - name: Run the tested owner's native deterministic contract
        run: >-
          python3 scripts/development-field-ci.py native
          --owner '${{ matrix.owner }}'
          --source '${{ runner.temp }}/owner-source'
          --out '${{ runner.temp }}/evidence'
      - name: Publish owner D receipt and complete command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-field-D-${{ matrix.owner }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.log
          if-no-files-found: error
