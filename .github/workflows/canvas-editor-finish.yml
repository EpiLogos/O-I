name: Final canvas continuation
on:
  push:
    branches: [agent/canvas-editor-context-20260920]
    paths: [.github/workflows/canvas-editor-finish.yml]
permissions:
  contents: write
jobs:
  finish:
    if: github.ref == 'refs/heads/agent/canvas-editor-context-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source return
        shell: python
        run: |
          import subprocess, pathlib, hashlib, lzma, base64
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          assert parent=='6c7422fea4a42856c62e37db776e9e2209811c17', parent
          assert subprocess.check_output(['git','diff','--name-only','a3a1cc86eafd147923c01aeedcf27b2b6492789b','HEAD'],text=True).strip()=='.github/workflows/canvas-editor-finish.yml'
          payload=''
          patch=lzma.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest()=='ed24f2c0fed122e062cf6e6e81016cc268174d00c34244016906777d28695374'
          file=pathlib.Path('/tmp/canvas.patch');file.write_bytes(patch)
          stats=subprocess.check_output(['git','apply','--numstat',str(file)],text=True)
          assert all(line.split('\t')[-1].startswith('desktop/cradle/') for line in stats.splitlines())
          subprocess.run(['git','apply','--unidiff-zero','--check',str(file)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(file)],check=True)
          subprocess.run(['git','rm','.github/workflows/canvas-editor-finish.yml'],check=True)
          subprocess.run(['git','add','desktop/cradle'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(canvas): scope-safe preparation, natural Flow selection and native Resolve'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/canvas-editor-context-20260920'],check=True)
          pathlib.Path('source-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - name: Install locked dependencies
        working-directory: desktop/cradle
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types and contract tests
        working-directory: desktop/cradle
        run: |
          set -o pipefail
          npx tsc --noEmit
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/canvas-editor-contract.test.mjs tests/material-html-lifecycle.test.mjs | tee ../../canvas-contracts.log
      - name: Browser dependencies
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Production component interactions
        working-directory: desktop/cradle
        run: set -o pipefail; node tests/canvas-editor-browser.mjs 2>&1 | tee ../../canvas-browser.log
      - name: Production bundle
        working-directory: desktop/cradle
        run: set -o pipefail; npx vite build 2>&1 | tee ../../canvas-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-final-proof
          path: |
            source-head.txt
            desktop/canvas-*.log
            desktop/cradle/tests/artifacts/canvas-editor
          retention-days: 7
