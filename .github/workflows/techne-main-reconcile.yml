name: Technē pinned main reconciliation
on:
  push:
    branches: ['codex/techne-constructive-field-20260920']
    paths: ['.github/workflows/techne-main-reconcile.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/codex/techne-constructive-field-20260920'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - name: Merge pinned main and the one inspected retained-field conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main=fe93a3907c8c18170db096e19d467ada74adebb0
          git fetch --depth=100 origin "$main"
          if git merge-base --is-ancestor "$main" HEAD; then exit 0; fi
          git merge --no-commit --no-ff "$main" || {
            test "$(git diff --name-only --diff-filter=U)" = 'packages/oi-design-system/expressions-engine/oi/retained.mjs'
          }
          cat > packages/oi-design-system/expressions-engine/oi/retained.mjs <<'SOURCE'
          /** O:I host bindings over the shared retained-field capability. */
          import { ProductionAdapter as NativeProductionAdapter } from "../shell/production.mjs";
          import { WORLD_SCALE } from "../shell/nativeParameters.mjs";
          import { withRetainedField } from "./retained-capability.mjs";
          import { ExpressionConnectionLayer } from "./expressionBindings.mjs";

          const RetainedBase = withRetainedField(NativeProductionAdapter, WORLD_SCALE);
          export class RetainedProductionAdapter extends RetainedBase {
            expressionBindings = [];
            connectionLayer = null;
            setExpressionBindings(bindings = []) {
              this.expressionBindings = bindings;
              this.dirty = true;
            }
            render(frame) {
              // Install on the actual field, never another renderer. onBeforeRender
              // sees the current evaluated 3D poses after the native simulation step.
              if (this.connectionLayer && this.connectionLayer.engine !== this.engine) {
                this.connectionLayer.dispose(); this.connectionLayer = null;
              }
              this.connectionLayer?.configure(this.expressionBindings, frame.selectedIds);
              super.render(frame);
              if (this.expressionBindings.length && !this.connectionLayer && this.engine) {
                this.connectionLayer = new ExpressionConnectionLayer(this.engine);
                this.connectionLayer.configure(this.expressionBindings, frame.selectedIds);
                // First attachment paints once without advancing/reseeding the clock.
                this.engine.renderer.render(this.engine.scene, this.engine.camera);
              }
            }
            hitTestExpression(x, y) {
              if (!this.engine || this.contextLost) return null;
              const relation = this.connectionLayer?.hitTest(x, y);
              // Prefer an actual member centre within 12px; connections retain their
              // own independently selectable midpoints, including parallel records.
              let member = null, distance = 12;
              for (const pose of this.engine.lastPoses ?? []) {
                const p = this.engine.projectWorldToScreen(pose.x, pose.y, pose.z ?? 0);
                if (!p.visible) continue;
                const d = Math.hypot(x-p.x,y-p.y);
                if (d <= distance) {distance=d;member={kind:"entity",entity_ref:pose.entityId,distance:d};}
              }
              return member ?? relation ?? null;
            }
            expressionBindingSnapshot() {
              return this.connectionLayer?.inspect() ?? {rendered:[],unavailable:this.expressionBindings.map(b=>b.binding_ref)};
            }
            dispose() {
              this.connectionLayer?.dispose();
              this.connectionLayer = null;
              super.dispose();
            }
          }
          export { RetainedProductionAdapter as ProductionAdapter };
          SOURCE
          git add packages/oi-design-system/expressions-engine/oi/retained.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          # Main already contains conflict markers in historical evidence files.
          # Preserve those exact bytes, disclose them, and check this lane's delta
          # against main. Never rewrite an inherited execution receipt into a pass.
          git diff --cached --exit-code "$main" -- desktop/cradle/docs/experience/MODE-ENGINE-STATE-PERSISTENCE.md desktop/cradle/walk/artifacts desktop/cradle/tests/evidence
          git diff --cached --check "$main"
          echo 'Pinned main retains existing markers in historical mode/corpus evidence. Those bytes were preserved; they are not new passing evidence.' >> "$GITHUB_STEP_SUMMARY"
          git commit -m 'merge: current main into Technē constructive field; preserve native retained capability'
          git push origin HEAD:refs/heads/codex/techne-constructive-field-20260920
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'No main write, no forced update. Ordinary PR gates still apply to resulting source.' >> "$GITHUB_STEP_SUMMARY"
