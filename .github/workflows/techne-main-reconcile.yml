name: Technē pinned main reconciliation
# Temporary transport of the merge already reviewed in the disposable checkout.
# Writes only this integration branch. No force, main mutation or gate bypass.
on:
  push:
    branches: ['codex/techne-constructive-field-20260920']
    paths: ['.github/workflows/techne-main-reconcile.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/codex/techne-constructive-field-20260920'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve merged Wiki ownership and apply the verified Scene source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          main=c91d25b0d6a7b55acea0cb954f1245803c691174
          git fetch origin "$main"
          if ! git merge-base --is-ancestor "$main" HEAD; then
            git merge --no-commit --no-ff "$main" || {
              python3 - <<'PY'
          import pathlib, subprocess
          ours = {'.github/workflows/techne-source-recovery.yml', '.github/workflows/techne-remote-edit.yml', '.github/workflows/techne-main-reconcile.yml'}
          theirs = {'.github/workflows/wiki-constellation.yml',
            'desktop/cradle/src/knowledge/GraphViewDetails.tsx',
            'desktop/cradle/src/knowledge/WikiConstructionPanel.tsx',
            'desktop/cradle/src/knowledge/artifactRecovery.ts',
            'desktop/cradle/src/knowledge/construction.ts',
            'desktop/cradle/src/knowledge/constructionProjection.ts',
            'desktop/cradle/src/knowledge/expressionOutcome.ts',
            'desktop/cradle/src/knowledge/filters.css',
            'desktop/cradle/src/knowledge/graphEmphasis.ts',
            'desktop/cradle/src/knowledge/selection.ts',
            'desktop/cradle/src/knowledge/wikiConstruction.css',
            'desktop/cradle/tests/wiki-constructive-browser.mjs',
            'desktop/cradle/tests/wiki-constructive.html',
            'desktop/cradle/tests/wiki-native-binaries.test.mjs',
            'docs/cradle/WIKI-CONSTELLATION-OPERATIONS.md'}
          native = 'desktop/cradle/kernel/src/expression.rs'
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert set(paths) <= ours | theirs | {native}, 'Unexpected merge conflict; no automatic resolution'
          for path in paths:
              if path == native:
                  text = pathlib.Path(path).read_text()
                  assert text.count('<<<<<<< HEAD\n') == 1, 'Unexpected native conflict'
                  before, rest = text.split('<<<<<<< HEAD\n',1)
                  own, rest = rest.split('=======\n',1)
                  other, after = rest.split('>>>>>>> ',1)
                  _, after = after.split('\n',1)
                  assert '"changes"' in own and '"scene_presentation"' in own and '"changes"' in other
                  assert 'pub fn' not in own + other and '=>' not in own + other
                  pathlib.Path(path).write_text(before + own + after)
              else:
                  subprocess.run(['git','checkout','--ours' if path in ours else '--theirs','--',path],check=True)
              subprocess.run(['git','add',path],check=True)
          PY
            }
            test -z "$(git diff --name-only --diff-filter=U)"
            git diff --cached --check
            git commit -m 'merge: preserve merged Wiki native recovery and Technē Scene ownership'
          fi
          python3 - <<'PY'
          import hashlib, pathlib
          header, patch = pathlib.Path('tests/techne-remote-edit.patch').read_bytes().split(b'\n',1)
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == 'b9e594321cd23d03a29b4689e4933938a11355d69f44ef37ff460eb8d67477b7'
          assert header.decode() == 'sha256 ' + digest
          pathlib.Path('/tmp/techne-scene.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/techne-scene.patch
          git apply --index /tmp/techne-scene.patch
          git rm tests/techne-remote-edit.patch
          git diff --cached --check
          git commit -m 'feat(techne): retain complete native Scene material and composition properties'
          git push origin HEAD:refs/heads/codex/techne-constructive-field-20260920
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Source delivery only; the resulting revision requires normal PR verification.' >> "$GITHUB_STEP_SUMMARY"
