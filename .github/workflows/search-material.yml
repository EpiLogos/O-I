name: Search material rendering

# The legacy everyday desktop is frozen while its replacement (the candidate
# shell, packages/live-shell) is built, so this workflow no longer runs on pull
# requests or pushes. desktop.yml gates the replacement; any of these tests
# that reaches a file the candidate imports runs there in the shared engine
# suite (packages/live-shell/ui/scripts/test-engine.mjs). Dispatch to run it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - run: npm ci --prefix desktop/cradle --no-audit --no-fund
      - working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium webkit
      - name: Inspect rendered pixels, not just a supported CSS declaration
        working-directory: desktop/cradle
        run: node tests/search-material.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-material-${{ matrix.os }}-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/material
          if-no-files-found: error
