name: Canvas source and evidence closeout
on:
  push:
    branches: [agent/canvas-editor-context-20260920]
    paths: [.github/workflows/canvas-editor-closeout.yml]
permissions:
  contents: write
jobs:
  closeout:
    if: github.ref == 'refs/heads/agent/canvas-editor-context-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the bounded reviewed source change
        shell: python
        run: |
          import subprocess,pathlib,hashlib,lzma,base64
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='77c2c3935a10aa2ea1d728fc602a74ccd413c87c'
          assert subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).strip()=='.github/workflows/canvas-editor-closeout.yml'
          payload=''
          patch=lzma.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest()=='3aaf7d681caf3918a74e02b4e48d17ef0b0c68e7f81994dd496897b2d19508ea'
          file=pathlib.Path('/tmp/rich-flow.patch');file.write_bytes(patch)
          stats=subprocess.check_output(['git','apply','--numstat',str(file)],text=True)
          assert all(line.split('\t')[-1].startswith('desktop/cradle/') for line in stats.splitlines())
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply',str(file)],check=True)
          subprocess.run(['git','rm','.github/workflows/canvas-editor-closeout.yml'],check=True)
          subprocess.run(['git','add','desktop/cradle'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(canvas): recover passive rich Flow readings and house Context controls'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/canvas-editor-context-20260920'],check=True)
          pathlib.Path('source-head.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
      - name: Install locked dependencies
        working-directory: desktop/cradle
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Types and source contracts
        working-directory: desktop/cradle
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee ../../canvas-types.log
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/canvas-editor-contract.test.mjs tests/material-html-lifecycle.test.mjs 2>&1 | tee ../../canvas-contracts.log
      - name: Browser dependencies
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Rich Flow and prepared-context interactions
        working-directory: desktop/cradle
        run: set -o pipefail; node tests/canvas-editor-browser.mjs 2>&1 | tee ../../canvas-browser.log
      - name: Production bundle
        working-directory: desktop/cradle
        run: set -o pipefail; npx vite build 2>&1 | tee ../../canvas-build.log
      - name: Record verified scope in the existing map and ledger
        shell: python
        run: |
          import pathlib,json,os,subprocess,hashlib
          head=pathlib.Path('source-head.txt').read_text().strip()
          result=json.loads(pathlib.Path('desktop/cradle/tests/artifacts/canvas-editor/receipt.json').read_text())
          assert not result['errors']
          run='https://github.com/EpiLogos/O-I/actions/runs/'+os.environ['GITHUB_RUN_ID']
          checks='\n'.join('- '+item for item in result['checks'])
          receipt=f'''# Canvas editor / context — implementation receipt, 20 September 2026

          ## Exact returned source

          Runtime O:I `{head}`; native AIKit `0ff20e936a3baaa4fe39f655891985a94bd07535`.
          Review PRs: [O:I #441](https://github.com/EpiLogos/O-I/pull/441) and [AIKit #363](https://github.com/EpiLogos/ai-kit/pull/363).
          Original basis: O:I `a222c8bdf46a7b2146084770b704dfbe83ce5027`, AIKit `99306d858c255fa258d8cc419b314a433d3f92a4`.
          Implementation follows [the existing feature map](../../../../../.wayfinder/maps/canvas-editor-context.md), D20/W1.7, U1.2/U1.3/U1.4, U3.1/U3.2 and FND-04. No machine connection, reset, installation, deployment or parent-issue closure.

          ## Executed evidence

          [Current CI source-and-browser run]({run}) tests the exact runtime SHA above, not its earlier source-transport commit. The self-removing transport is not a retained product workflow.
          - TypeScript `tsc --noEmit`: pass.
          - `node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/canvas-editor-contract.test.mjs tests/material-html-lifecycle.test.mjs`: 31 passed, 0 failed.
          - `node tests/canvas-editor-browser.mjs`: {len(result['checks'])} passing production-component/handler checks, 0 page errors.
          - `npx vite build`: pass.
          - Native [AIKit context run](https://github.com/EpiLogos/ai-kit/actions/runs/35522747624): 12 actual EncounterStore SQLite/Vak/CAS/dispatch regression tests pass; `cargo check --locked -p aikit-cli` passes.
          - Native [AIKit normal PR suite](https://github.com/EpiLogos/ai-kit/actions/runs/35522750598): all five crate jobs, real integration suite, bkmr SourcePool and GitNexus ProjectMap conformance pass.
          - Prior [O:I kernel/experience run](https://github.com/EpiLogos/O-I/actions/runs/35522709614) on unchanged kernel source: 95 passed, 51 existing native-environment-gated ignores; experience source tests/compiler pass. Ignored tests are not passing proof.

          Screenshots, receipt JSON, tested source SHA and command output are retained in this run's `canvas-editor-closeout-proof` artifact. The component fixture now imports the actual shell/reset/house CSS; it is not an installed native-window screenshot.

          ## Connected interactions proved in the controlled browser

          {checks}

          ## Implementation and recovery

          CodeMirror remains the editor. Formatting acts on precise ranges and does not reserialize unrelated source. Source/rendered/split share one draft/editor. Native AIKit, not a desktop store, owns prepared selections, IDs, digests, canonical Vāk AST/text, CAS and dispatch expectations. The existing Context panel contains transient and prepared material; ordinary addition has no distribution modal. Resolve/Explain use the existing knowledge service without broadening the prepared payload or executing an Action. Send rechecks the exact native expectation; failed/stale sends retain the instruction and preparation.

          Scope-switch guards prevent an asynchronous Add from being retargeted to a different companion; late readings cannot regress current preparation. Flow draft coordinates are revision-carrying observations, never fabricated raw-HTML offsets. Rendered Flow selections retain actual entry/document identities. Rich entry/note/reply/media/Journal reading is recovered from #411 (`5325400d5a5a55f4fee6449aa222afd218ecfc83`) while keeping this lane's selection path. Passive React reconstruction replaces the donor's arbitrary HTML insertion; no scripts, custom elements, source event handlers, SVG, external media or forged source-ref attributes receive host authority. Ambiguous note/reply anchors remain explicitly ambiguous. The original document collections and unknown media bytes survive Save.

          ## Limits and integration order

          These are deterministic native-owner and controlled production-component results. Browser `/op` responses are controlled, not a running AIKit service, physical Workcell or model. Install/merge AIKit #363 before O:I #441; verify the public owner operation and the returned executable revision, rather than substituting the old quote-only attachment path.

          Remaining existing acceptance gates: the same path against installed Central/AIKit/Actuation and a real model; actual provider Return and source-bound inclusion under concurrent edits; native Tauri browser/window detach/redock and browser navigation/security; complete Day/Flow standalone export/reopen and mapped editable HTML; physical resource measurements and human experience. Root-Central/no-Project dispatch is not added here and must not be approximated by inventing a child Project. Non-text formats expose their real preview/open-with capabilities, not fictional universal editing. Source preview is not lossless arbitrary HTML WYSIWYG. No P/M/H or whole-programme acceptance is claimed.
          '''
          # Normalize the Python block's indentation, not Markdown source semantics.
          receipt='\n'.join(line[10:] if line.startswith('          ') else line for line in receipt.splitlines())+'\n'
          path=pathlib.Path('desktop/cradle/walk/artifacts/CANVAS-EDITOR-CONTEXT-2026-09-20.md');path.write_text(receipt)
          ledger=pathlib.Path('.superpowers/sdd/cradle-rebuild/progress.md')
          assert hashlib.sha256(ledger.read_bytes()).hexdigest()=='228be8f028f2337b7f6f8a9db9e8a9d00b0fc501ebaa9461e93d588b898242cd'
          ledger.write_text(ledger.read_text()+f'\n\n### 2026-09-20 — Canvas continuation executed; native and browser proof returned\n\nO:I runtime `{head}`; AIKit `0ff20e936a3baaa4fe39f655891985a94bd07535`. PRs #441 / ai-kit #363. This supersedes the earlier “browser pending” row: 31 JS contracts, {len(result["checks"])} controlled production-component checks, 12 native SQLite/Vak/dispatch regressions, types and production bundle pass. Normal AIKit crate/integration/conformance jobs pass; prior unchanged kernel source has 95 passed / 51 existing environment-gated ignores. The existing Context panel is primary, no selection modal; async scope isolation and monotonic readbacks are proved. Rich Flow entries/notes/Journal are recovered without importing the donor\'s old context path. Full command/source/standing receipt: `desktop/cradle/walk/artifacts/CANVAS-EDITOR-CONTEXT-2026-09-20.md`. Native producer merges before its consumer. Installed provider/Return, native window/browser, full Day/export and H gates remain explicitly unclaimed; no owner machine changed.\n')
          m=pathlib.Path('.wayfinder/maps/canvas-editor-context.md')
          m.write_text(m.read_text()+f'\n\n### Returned implementation and proof\n\nRuntime O:I `{head}` / AIKit `0ff20e936a3baaa4fe39f655891985a94bd07535`; review [O:I #441](https://github.com/EpiLogos/O-I/pull/441) after [AIKit #363](https://github.com/EpiLogos/ai-kit/pull/363). [Exact receipt](../../desktop/cradle/walk/artifacts/CANVAS-EDITOR-CONTEXT-2026-09-20.md): 31 JS contracts, {len(result["checks"])} controlled production-component checks, 12 native context regressions, types/build and ordinary AIKit conformance pass. CE1–CE5 now have implementation and bounded evidence; installed/provider/Return/Day-window/H obligations above remain open. The existing progress ledger records this continuation without replacing its historical receipts.\n')
          subprocess.run(['git','add',str(path),str(ledger),str(m)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','docs(canvas): bind executed proof to the existing Wayfinder and ledger'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/agent/canvas-editor-context-20260920'],check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-editor-closeout-proof
          path: |
            source-head.txt
            canvas-*.log
            desktop/cradle/tests/artifacts/canvas-editor
          retention-days: 7
