name: Wiki relations consumer close

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply only missing #150 joins
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'patch anchor absent in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Rust consumer: expose exact AIKit-authored edge evidence beside the
          # already accepted resolved/pending relation read, and provide a Flow
          # relation projection from Central owner identity/revision/body.
          path = Path('desktop/core/src/project_knowledge.rs')
          text = path.read_text()
          text = text.replace(
              '    compile_authored_wiki_relations, projectcentral_authored_wiki,\n',
              '    compile_authored_wiki_relations, parse_authored_wiki_source_with_authority,\n    projectcentral_authored_wiki,\n',
              1,
          )
          text = text.replace(
              'use aikit_core::model_runtime::ModelRuntimeReadModel;\n',
              'use aikit_core::knowledge_wiki::WikiEdge;\nuse aikit_core::model_runtime::ModelRuntimeReadModel;\n',
              1,
          )
          text = text.replace(
              '    ProjectCentralBinding, ProjectReflectionReadModel, QlRefractionRequest, ResourceRef,\n    Result as AikitResult, SemanticWikiIndex, SemanticWikiProvider, WikiObject,\n',
              '    ProjectCentralBinding, ProjectReflectionReadModel, QlRefractionRequest, ResourceRef,\n    Result as AikitResult, SemanticWikiIndex, SemanticWikiProvider, SourceAuthority, SourceRef,\n    SourceRevision, WikiObject,\n',
              1,
          )
          old_struct = '''#[derive(Debug, Serialize)]\npub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredWikiSubjectRelations>,\n}\n'''
          new_struct = '''#[derive(Debug, Serialize)]\npub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredWikiSubjectRelations>,\n    #[serde(default, skip_serializing_if = "Vec::is_empty")]\n    pub authored_edges: Vec<WikiEdge>,\n}\n\n#[derive(Debug, Serialize)]\npub struct FlowAuthoredRelationsReading {\n    pub authored: AuthoredWikiSubjectRelations,\n    #[serde(default, skip_serializing_if = "Vec::is_empty")]\n    pub authored_edges: Vec<WikiEdge>,\n}\n'''
          if new_struct not in text:
              if old_struct not in text:
                  raise SystemExit('ProjectSourceRelations anchor absent')
              text = text.replace(old_struct, new_struct, 1)
          old_rel = '''            return Ok(ProjectRelations::Source(Box::new(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n            })));'''
          new_rel = '''            return Ok(ProjectRelations::Source(Box::new(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n                authored_edges: self.authored_edges(raw_resource),\n            })));'''
          if new_rel not in text:
              if old_rel not in text:
                  raise SystemExit('ProjectRelations source construction anchor absent')
              text = text.replace(old_rel, new_rel, 1)
          method_anchor = '''    pub fn explain(&self, raw_resource: &str) -> AikitResult<ProjectExplanation> {'''
          additions = '''    fn authored_edges(&self, raw_resource: &str) -> Vec<WikiEdge> {\n        let Some(source) = self.authored_sources.iter().find(|source| {\n            source.source_ref.as_str() == raw_resource || source.subject_ref.as_str() == raw_resource\n        }) else {\n            return Vec::new();\n        };\n        let mut edges = self\n            .authored_compilation\n            .edges\n            .iter()\n            .filter(|edge| edge.from_ref == source.subject_ref || edge.to_ref == source.subject_ref)\n            .cloned()\n            .collect::<Vec<_>>();\n        edges.sort_by(|left, right| left.ref_id.cmp(&right.ref_id));\n        edges\n    }\n\n    /// Read source-authored topology from the exact Central-owned Flow source.\n    /// This is deterministic source interpretation: it does not bind an\n    /// AgentSession, resolve a model runtime or enter Contemplate.\n    pub fn flow_authored_relations(\n        &self,\n        flow_ref: &str,\n        source_ref: &str,\n        source_revision: &str,\n        source_locator: &str,\n        source_authority: SourceAuthority,\n        body: &str,\n    ) -> AikitResult<FlowAuthoredRelationsReading> {\n        let subject_ref = ResourceRef::parse(flow_ref)?;\n        let source = parse_authored_wiki_source_with_authority(\n            subject_ref.clone(),\n            SourceRef::parse(source_ref)?,\n            source_authority,\n            Some(SourceRevision::parse(source_revision)?),\n            vec![source_locator.to_owned()],\n            body,\n        )?;\n        let base_objects = self.wiki_objects();\n        let compilation = compile_authored_wiki_relations(&[source], &base_objects, &[])?;\n        let index = rebuild_semantic_wiki_with_authored_relations(&base_objects, &compilation)?;\n        let authored = authored_wiki_subject_relations(\n            &index,\n            &compilation,\n            subject_ref.clone(),\n            ResourceKind::KnowledgeSource,\n            source_locator,\n        )?;\n        let mut authored_edges = compilation\n            .edges\n            .into_iter()\n            .filter(|edge| edge.from_ref == subject_ref || edge.to_ref == subject_ref)\n            .collect::<Vec<_>>();\n        authored_edges.sort_by(|left, right| left.ref_id.cmp(&right.ref_id));\n        Ok(FlowAuthoredRelationsReading { authored, authored_edges })\n    }\n\n'''
          if 'pub fn flow_authored_relations(' not in text:
              if method_anchor not in text:
                  raise SystemExit('explain method anchor absent')
              text = text.replace(method_anchor, additions + method_anchor, 1)
          path.write_text(text)

          replace_once(
              'desktop/core/src/lib.rs',
              '    FlowWriteResult, ResourceRef,\n',
              '    FlowWriteResult, ResourceRef, SourceAuthority,\n',
          )
          replace_once(
              'desktop/core/src/lib.rs',
              'pub use project_knowledge::LocalProjectKnowledge;\n',
              'pub use project_knowledge::{FlowAuthoredRelationsReading, LocalProjectKnowledge};\n',
          )

          # Native shell: pure ObserveFlow relation read.
          replace_once(
              'desktop/src-tauri/src/flow.rs',
              '    BridgePolicy, CentralFlowClient, FlowAuthorityRef, FlowContextAuthority, FlowStandingContext,\n    ResourceRef, FLOW_CONTEMPLATE_TRANSPORT_VERSION,\n',
              '    BridgePolicy, CentralFlowClient, CentralFlowRecord, FlowAuthorityRef, FlowContextAuthority,\n    FlowStandingContext, ResourceRef, SourceAuthority, FLOW_CONTEMPLATE_TRANSPORT_VERSION,\n',
          )
          replace_once(
              'desktop/src-tauri/src/flow.rs',
              '#[tauri::command]\npub(crate) fn flow_history(flow_ref: String) -> Result<Value, String> {',
              '''#[tauri::command]\npub(crate) fn flow_relations(state: State<'_, AppState>, flow_ref: String) -> Result<Value, String> {\n    BridgePolicy\n        .authorize(BridgeCaller::ShellUi, BridgeCallClass::ObserveFlow)\n        .map_err(|error| error.to_string())?;\n    let document = current_client()?.open(&flow_ref)?;\n    let knowledge = state\n        .knowledge\n        .lock()\n        .map_err(|_| "Knowledge workbench lock poisoned".to_owned())?;\n    let knowledge = knowledge\n        .as_ref()\n        .ok_or_else(|| "no local ProjectCentral Knowledge world is configured".to_owned())?;\n    serde_json::to_value(\n        knowledge\n            .flow_authored_relations(\n                &document.flow.flow_ref,\n                &document.flow.source_ref,\n                &document.flow.current_revision,\n                &document.flow.path,\n                flow_source_authority(&document.flow),\n                &document.content,\n            )\n            .map_err(|error| error.to_string())?,\n    )\n    .map_err(|error| format!("serialize Flow authored relations: {error}"))\n}\n\n#[tauri::command]\npub(crate) fn flow_history(flow_ref: String) -> Result<Value, String> {''',
          )
          path = Path('desktop/src-tauri/src/flow.rs')
          text = path.read_text()
          if 'fn flow_source_authority(' not in text:
              anchor = '\nfn current_client() -> Result<CentralFlowClient, String> {'
              helper = '''\nfn flow_source_authority(flow: &CentralFlowRecord) -> SourceAuthority {\n    match flow.revisions.last().map(|revision| revision.actor_kind.as_str()) {\n        Some("human") => SourceAuthority::Authored,\n        Some("agent") => SourceAuthority::Generated,\n        _ => SourceAuthority::Observed,\n    }\n}\n'''
              if anchor not in text:
                  raise SystemExit('current_client anchor absent')
              text = text.replace(anchor, helper + anchor, 1)
              path.write_text(text)
          replace_once(
              'desktop/src-tauri/src/main.rs',
              '            flow::flow_open,\n            flow::flow_save,\n            flow::flow_history,\n',
              '            flow::flow_open,\n            flow::flow_save,\n            flow::flow_relations,\n            flow::flow_history,\n',
          )

          # Mount the already-authored relation workbench in the existing Project
          # canvas so stable selection remains the one navigation state.
          replace_once(
              'desktop/ui/src/project-field.tsx',
              "import { FlowNavigator, FlowWorkbench } from './flow-workbench';\n",
              "import { AuthoredRelationsWorkbench } from './authored-relations';\nimport { FlowNavigator, FlowWorkbench } from './flow-workbench';\n",
          )
          replace_once(
              'desktop/ui/src/project-field.tsx',
              '    <LivingWikiWorkbench selection={props.selection} />\n',
              '    <LivingWikiWorkbench selection={props.selection} />\n    <AuthoredRelationsWorkbench selection={props.selection} onSelect={props.onSelect} />\n',
          )

          # Flow reads the same owner-backed relation surface on open/save/return,
          # and follows a resolved stable ref through the existing onSelect path.
          replace_once(
              'desktop/ui/src/flow-workbench.tsx',
              "import { NativeDocumentEditor } from './native-document-editor';\n",
              "import { AuthoredRelationsWorkbench } from './authored-relations';\nimport { NativeDocumentEditor } from './native-document-editor';\n",
          )
          path = Path('desktop/ui/src/flow-workbench.tsx')
          text = path.read_text()
          # A Flow-specific relation panel uses a lightweight semantic selection
          # whose ref remains the native FlowRef; the shared component then calls
          # knowledge_relations for Project sources, so Flow instead receives a
          # dedicated read below and renders its exact serialized evidence.
          # Keep Flow display inline to avoid teaching the shared Project component
          # a second transport contract.
          if 'type FlowAuthoredRelations =' not in text:
              type_anchor = 'type StandingContext = {\n'
              flow_type = '''type FlowAuthoredRelations = {\n  authored: {\n    version: string;\n    subject_ref: string;\n    resolved: {\n      nodes: Array<{ resource: string; kind: string; label: string }>;\n      edges: Array<{ from: string; to: string; relation: string; direction: string; origin: unknown }>;\n      truncated: boolean;\n      warnings: string[];\n    };\n    pending: Array<{ source_authority: string; evidence: { raw_target: string; raw_token: string; channel: string; source_ref: string; source_revision?: string; anchor: { field_path?: string; start_byte?: number; end_byte?: number }; resolution: { state: string; candidate_refs?: string[] } } }>;\n    automatic_agent_or_model_invocation: boolean;\n  };\n  authored_edges: Array<{ ref: string; from_ref: string; to_ref: string; relation: string; origin: string; provenance: Array<{ source_ref: string; source_revision?: unknown; channel?: string; anchor?: { field_path?: string; start_byte?: number; end_byte?: number }; raw_target?: string }>; authored_relation?: { raw_target: string; raw_token: string; channel: string; source_ref: string; source_revision?: string; anchor: { field_path?: string; start_byte?: number; end_byte?: number } } }>;\n};\n\n'''
              if type_anchor not in text:
                  raise SystemExit('Flow StandingContext type anchor absent')
              text = text.replace(type_anchor, flow_type + type_anchor, 1)
          text = text.replace(
              "  const [history, setHistory] = useState<unknown>(null);\n  const [error, setError] = useState('');\n",
              "  const [history, setHistory] = useState<unknown>(null);\n  const [relations, setRelations] = useState<FlowAuthoredRelations | null>(null);\n  const [relationError, setRelationError] = useState('');\n  const [error, setError] = useState('');\n",
              1,
          )
          if 'async function refreshRelations(' not in text:
              anchor = '  async function open(ref: string) {\n'
              helper = '''  async function refreshRelations(ref: string) {\n    try {\n      setRelations(await invoke<FlowAuthoredRelations>('flow_relations', { flowRef: ref }));\n      setRelationError('');\n    } catch (reason) {\n      setRelations(null);\n      setRelationError(messageFrom(reason));\n    }\n  }\n\n  async function followFlowRelation(target: string, label?: string) {\n    await onSelect({\n      ref: target,\n      kind: 'knowledge-relation',\n      native_owner: 'ai-kit',\n      provenance: { source: 'AIKit authored Flow relation' },\n    }, {\n      title: label ?? target,\n      summary: 'Resolved stable ref from Central-owned Flow source through AIKit relation compilation',\n    });\n  }\n\n'''
              if anchor not in text:
                  raise SystemExit('Flow open function anchor absent')
              text = text.replace(anchor, helper + anchor, 1)
          # Refresh on the three explicit material changes/reads.
          open_reset = "      setHistory(null);\n      setError('');\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n"
          if open_reset in text:
              text = text.replace(open_reset, "      setHistory(null);\n      setError('');\n      await refreshRelations(next.flow.flow_ref);\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n", 1)
          save_reset = "      setResult(null);\n      setError('');\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n"
          if save_reset in text:
              text = text.replace(save_reset, "      setResult(null);\n      setError('');\n      await refreshRelations(next.flow.flow_ref);\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n", 1)
          return_reset = "      setDocument(current);\n      setBuffer(current.content);\n      await onSelect(semanticFlow(current.flow), flowEvidence(current.flow));\n"
          if return_reset in text:
              text = text.replace(return_reset, "      setDocument(current);\n      setBuffer(current.content);\n      await refreshRelations(current.flow.flow_ref);\n      await onSelect(semanticFlow(current.flow), flowEvidence(current.flow));\n", 1)
          clear_anchor = "      setHistory(null);\n      setError('');\n    }\n"
          if clear_anchor in text and 'setRelations(null);' not in text[text.find('useEffect(() => {'):text.find('async function save()')]:
              text = text.replace(clear_anchor, "      setHistory(null);\n      setRelations(null);\n      setRelationError('');\n      setError('');\n    }\n", 1)
          if 'aria-label="Flow authored relations"' not in text:
              render_anchor = '      <NativeDocumentEditor\n'
              render = '''      <FlowRelationReading reading={relations} error={relationError} onFollow={followFlowRelation} />\n'''
              if render_anchor not in text:
                  raise SystemExit('Flow editor render anchor absent')
              text = text.replace(render_anchor, render + render_anchor, 1)
          if 'function FlowRelationReading(' not in text:
              helper_anchor = '\nfunction ReturnCard('
              helper = '''\nfunction FlowRelationReading({ reading, error, onFollow }: { reading: FlowAuthoredRelations | null; error: string; onFollow: (target: string, label?: string) => Promise<void> }) {\n  if (!reading && !error) return null;\n  const authored = reading?.authored;\n  const focus = authored?.subject_ref;\n  const nodes = new Map((authored?.resolved.nodes ?? []).map((node) => [node.resource, node]));\n  const outgoing = (reading?.authored_edges ?? []).filter((edge) => edge.from_ref === focus);\n  const incoming = (reading?.authored_edges ?? []).filter((edge) => edge.to_ref === focus);\n  return <section className="oi-authored-relations" aria-label="Flow authored relations">\n    <header className="oi-authored-relations__header"><div><p className="oi-eyebrow">Flow · authored topology</p><h3>Relations in this thread</h3></div>{authored && <small>automatic Agent/model = {String(authored.automatic_agent_or_model_invocation)}</small>}</header>\n    {error && <p className="oi-workbench__error">Relations: {error}</p>}\n    {authored && <div className="oi-authored-relations__grid">\n      <article className="oi-authored-relations__group"><header><strong>Outgoing</strong><small>{outgoing.length}</small></header>{outgoing.map((edge) => { const target = edge.to_ref; const evidence = edge.authored_relation; return <details className="oi-authored-relation" key={edge.ref}><summary><strong>{edge.relation}</strong><button type="button" onClick={(event) => { event.preventDefault(); void onFollow(target, nodes.get(target)?.label ?? evidence?.raw_target); }}>{nodes.get(target)?.label ?? evidence?.raw_target ?? target}</button></summary><p><code>{evidence?.raw_token ?? target}</code> · {evidence?.channel ?? 'source'} · {flowAnchor(evidence?.anchor)}</p></details>; })}</article>\n      <article className="oi-authored-relations__group"><header><strong>Backlinks</strong><small>{incoming.length}</small></header>{incoming.map((edge) => { const target = edge.from_ref; const evidence = edge.authored_relation; return <details className="oi-authored-relation" key={edge.ref}><summary><strong>{edge.relation}</strong><button type="button" onClick={(event) => { event.preventDefault(); void onFollow(target, nodes.get(target)?.label ?? evidence?.raw_target); }}>{nodes.get(target)?.label ?? target}</button></summary><p><code>{evidence?.source_ref ?? edge.provenance[0]?.source_ref}</code> · {flowAnchor(evidence?.anchor ?? edge.provenance[0]?.anchor)}</p></details>; })}</article>\n      <article className="oi-authored-relations__group"><header><strong>Unresolved</strong><small>{authored.pending.length}</small></header>{authored.pending.map((pending, index) => <details className="oi-authored-relation oi-authored-relation--pending" key={`${pending.evidence.raw_target}:${index}`}><summary><strong>{pending.evidence.relation ?? 'references'}</strong><code>{pending.evidence.raw_target}</code></summary><p><code>{pending.evidence.raw_token}</code> · {pending.evidence.channel} · {flowAnchor(pending.evidence.anchor)} · {pending.evidence.resolution.state}</p></details>)}</article>\n    </div>}\n  </section>;\n}\n\nfunction flowAnchor(anchor?: { field_path?: string; start_byte?: number; end_byte?: number }) {\n  if (!anchor) return 'owner provenance';\n  if (anchor.field_path) return anchor.field_path;\n  if (anchor.start_byte != null && anchor.end_byte != null) return `bytes ${anchor.start_byte}–${anchor.end_byte}`;\n  return 'owner provenance';\n}\n'''
              if helper_anchor not in text:
                  raise SystemExit('ReturnCard helper anchor absent')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          path.write_text(text)

          # Public representation stays in Projection reading: only public
          # Presentation-selected endpoints with explicit public routes survive.
          path = Path('shared-field/projection-reading.mjs')
          text = path.read_text()
          if 'export function projectedAuthoredRelationRoutes(' not in text:
              text += '''\n\nexport function projectedAuthoredRelationRoutes(value, relationReading, routeBySubjectRef = {}) {\n  const projection = validateProjection(value);\n  if (projection.audience?.visibility !== 'public') return [];\n  const presentation = worldPresentationFromProjection(projection);\n  const projectedSubjects = new Set([projection.subject.ref]);\n  for (const region of presentation.regions) {\n    for (const binding of region.bindings) {\n      if (binding.subject_ref) projectedSubjects.add(binding.subject_ref);\n    }\n  }\n\n  const edges = relationReading?.resolved?.edges;\n  if (!Array.isArray(edges)) return [];\n  const authoredEdges = Array.isArray(relationReading?.authored_edges) ? relationReading.authored_edges : [];\n  return edges.flatMap((edge) => {\n    if (!projectedSubjects.has(edge.from) || !projectedSubjects.has(edge.to)) return [];\n    const fromRoute = routeBySubjectRef[edge.from];\n    const toRoute = routeBySubjectRef[edge.to];\n    if (typeof fromRoute !== 'string' || typeof toRoute !== 'string') return [];\n    const evidence = authoredEdges.find((candidate) => candidate.from_ref === edge.from && candidate.to_ref === edge.to && candidate.relation === edge.relation);\n    return [{\n      relation: edge.relation,\n      from_ref: edge.from,\n      to_ref: edge.to,\n      from_route: fromRoute,\n      to_route: toRoute,\n      origin: clone(edge.origin),\n      ...(evidence ? { edge_ref: evidence.ref, provenance: clone(evidence.provenance ?? []) } : {}),\n    }];\n  });\n}\n'''
              path.write_text(text)

          # Focused public privacy fixture.
          Path('shared-field/authored-relation-projection.test.mjs').write_text('''import assert from 'node:assert/strict';\nimport test from 'node:test';\nimport { createWorldPresentationProjection } from './presentation-projection.mjs';\nimport { projectedAuthoredRelationRoutes } from './projection-reading.mjs';\n\nfunction publicProjection() {\n  return createWorldPresentationProjection({\n    projection: { schema: 'oi.projection/v1', projection_ref: 'projection:relations', projection_revision: 1, state: 'published', subject: { ref: 'project:public', kind: 'project' }, source: { system: 'filesystem', ref: 'Work/public', revision: 'tree@1' }, publisher_participant_ref: 'participant:test', published_at: '2026-08-25T00:00:00Z', audience: { visibility: 'public' }, provenance: [] },\n    presentation: { schema: 'oi.world-presentation/v1', presentation_ref: 'presentation:relations', world_ref: 'project:public', revision: 1, title: 'Public', theme: { tokens: {} }, provenance: [], regions: [{ region_ref: 'wiki', role: 'relation', bindings: [\n      { schema: 'oi.presentation-binding/v1', binding_ref: 'source', component_ref: 'component:source', subject_ref: 'source:public', props: {}, fallback: { title: 'Source', text: 'Source' }, provenance: [] },\n      { schema: 'oi.presentation-binding/v1', binding_ref: 'target', component_ref: 'component:target', subject_ref: 'wiki:public', props: {}, fallback: { title: 'Target', text: 'Target' }, provenance: [] },\n    ] }] },\n  });\n}\n\nconst localRelations = { subject_ref: 'source:public', resolved: { edges: [\n  { from: 'source:public', to: 'wiki:public', relation: 'references', origin: { authority: 'authored' } },\n  { from: 'source:public', to: 'wiki:private', relation: 'references', origin: { authority: 'authored' } },\n] }, pending: [{ evidence: { raw_target: 'Unpublished Future' } }], authored_edges: [\n  { ref: 'edge:public', from_ref: 'source:public', to_ref: 'wiki:public', relation: 'references', provenance: [{ source_ref: 'source:public', source_revision: 'rev-1' }] },\n  { ref: 'edge:private', from_ref: 'source:public', to_ref: 'wiki:private', relation: 'references', provenance: [{ source_ref: 'source:public', source_revision: 'rev-1' }] },\n] };\n\ntest('public authored routes include only explicitly projected endpoints and preserve local input', () => {\n  const before = JSON.stringify(localRelations);\n  const routes = projectedAuthoredRelationRoutes(publicProjection(), localRelations, { 'source:public': '/p/source', 'wiki:public': '/p/target', 'wiki:private': '/private/secret' });\n  assert.equal(routes.length, 1);\n  assert.equal(routes[0].edge_ref, 'edge:public');\n  assert.equal(routes[0].to_route, '/p/target');\n  assert.ok(!JSON.stringify(routes).includes('wiki:private'));\n  assert.ok(!JSON.stringify(routes).includes('Unpublished Future'));\n  assert.equal(JSON.stringify(localRelations), before);\n});\n\ntest('non-public Projection emits no authored public routes', () => {\n  const projection = publicProjection();\n  projection.audience.visibility = 'private';\n  assert.deepEqual(projectedAuthoredRelationRoutes(projection, localRelations, { 'source:public': '/p/source', 'wiki:public': '/p/target' }), []);\n});\n''')

          # Static surface tests pin the human-facing composition law.
          path = Path('desktop/ui/src/project-field-presentation.test.mjs')
          text = path.read_text()
          if 'authored relation workbench is mounted' not in text:
              text += '''\n\ntest('authored relation workbench is mounted in the existing Project field and reuses canonical selection', () => {\n  assert.match(projectField, /AuthoredRelationsWorkbench/);\n  assert.match(projectField, /selection=\\{props\\.selection\\}/);\n  assert.match(projectField, /onSelect=\\{props\\.onSelect\\}/);\n});\n'''
              path.write_text(text)
          path = Path('desktop/ui/src/flow-workbench.test.mjs')
          text = path.read_text()
          if 'Flow relation visibility is deterministic' not in text:
              text += '''\n\ntest('Flow relation visibility is deterministic and independent of AgentSession binding', () => {\n  assert.match(flow, /flow_relations/);\n  assert.match(flow, /refreshRelations/);\n  const relationRead = flow.match(/async function refreshRelations[\\s\\S]*?\\n  }/);\n  assert.ok(relationRead);\n  assert.doesNotMatch(relationRead[0], /flow_bind|flow_contemplate|agent_surface/);\n  assert.match(flow, /Flow authored relations/);\n});\n'''
              path.write_text(text)
      - name: Format and prove focused closure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/core/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          node --test desktop/ui/src/project-field-presentation.test.mjs desktop/ui/src/flow-workbench.test.mjs
          node --test shared-field/authored-relation-projection.test.mjs shared-field/account-projection.test.mjs
