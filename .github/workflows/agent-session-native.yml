name: Agent session native
on:
  push:
    branches: [agent/native-agent-session-20260920]
  pull_request:
    paths:
      - 'desktop/cradle/src/agency/**'
      - 'desktop/cradle/src/encounter/**'
      - 'desktop/cradle/src/agent/chat/**'
      - 'desktop/cradle/kernel/src/agency.rs'
      - 'desktop/cradle/kernel/tests/agent_native_gate.rs'
      - 'desktop/cradle/tests/agent-native-*'
      - '.github/workflows/agent-session-native.yml'
permissions:
  contents: read
jobs:
  native-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop/cradle
        run: npm ci
      - name: Local packet validation (no live credentials or model)
        id: packet
        continue-on-error: true
        working-directory: desktop/cradle
        run: |
          python3 tests/agent-native-live.test.py
          python3 tests/agent-native-live.py --help
      - name: Controller fault regressions
        id: controller
        continue-on-error: true
        working-directory: desktop/cradle
        run: node --experimental-strip-types --test tests/agent-native-model.test.mjs
      - name: Browser runtime
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Actual composer browser regressions
        id: browser
        continue-on-error: true
        working-directory: desktop/cradle
        run: node tests/agent-native-browser.mjs
      - name: Full desktop production build
        id: build
        continue-on-error: true
        working-directory: desktop/cradle
        run: npm run build
      - name: Kernel project/session gate regressions
        id: kernel
        continue-on-error: true
        working-directory: desktop/cradle/kernel
        run: cargo test --locked --test agent_native_gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-session-consumer-evidence
          path: desktop/cradle/tests/agent-native-results/
          retention-days: 7
      - name: Preserve all original failing gates
        if: steps.packet.outcome != 'success' || steps.controller.outcome != 'success' || steps.browser.outcome != 'success' || steps.build.outcome != 'success' || steps.kernel.outcome != 'success'
        run: exit 1
