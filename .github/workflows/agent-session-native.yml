name: Agent session native
on:
  push:
    branches: [agent/native-agent-session-20260920]
  pull_request:
    paths: ['desktop/cradle/src/agency/**', 'desktop/cradle/src/encounter/**', 'desktop/cradle/src/agent/**', 'desktop/cradle/kernel/**', 'desktop/cradle/tests/agent-native-*', '.github/workflows/agent-session-native.yml']
permissions:
  contents: read
jobs:
  native-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install formatter and lint for repository toolchain
        working-directory: desktop/cradle/kernel
        run: rustup component add rustfmt clippy
      - name: Publish bounded source on the owned branch only
        id: publish
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = agent/native-agent-session-20260920
          mkdir -p /tmp/agent-publication
          git rev-parse HEAD > /tmp/agent-publication/before-head.txt
          if test -f .github/finish-agent-consumer.py; then
            python3 .github/finish-agent-consumer.py
            python3 .github/finish-agent-consumer-tests.py
            rustfmt --edition 2021 --config skip_children=true desktop/cradle/kernel/src/agent_definition.rs desktop/cradle/kernel/tests/agent_definition_gate.rs
            python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          allowed={'desktop/cradle/kernel/src/agency.rs','desktop/cradle/kernel/src/agent_definition.rs','desktop/cradle/kernel/tests/agent_definition_gate.rs','desktop/cradle/src/agency/nativeAgent.ts','desktop/cradle/src/agency/NativeAgentLauncher.tsx','desktop/cradle/src/agency/agentSetup.ts','desktop/cradle/src/agency/AgentSetupReturn.tsx','desktop/cradle/src/agent/chat/AgentChat.tsx','desktop/cradle/src/workspace/settings/v2/SettingsHome.tsx','desktop/cradle/src/workspace/settings/v2/SettingsPageV2.tsx','desktop/cradle/tests/agent-native-creation-browser.tsx','desktop/cradle/tests/agent-native-creation-browser.mjs'}
          assert paths<=allowed, paths-allowed
          subprocess.run(['git','add',*sorted(paths),'desktop/cradle/src/agency/nativeAgentReadiness.ts','desktop/cradle/tests/agent-native-readiness.test.mjs'],check=True)
          PY
            git rm .github/finish-agent-consumer.py .github/finish-agent-consumer-tests.py
            git config user.name Epii
            git config user.email agent-session@users.noreply.github.com
            git commit -m 'feat(agent): connect effective native Skills, explicit World readiness and targeted setup return'
            git push origin HEAD:refs/heads/agent/native-agent-session-20260920
          fi
      - name: Retain actual source and any interrupted patch
        if: always()
        run: |
          mkdir -p desktop/cradle/tests/agent-native-results /tmp/agent-publication
          git rev-parse HEAD > desktop/cradle/tests/agent-native-results/source-revision.txt
          git diff > desktop/cradle/tests/agent-native-results/uncommitted.patch
          git archive --format=tar.gz HEAD > /tmp/agent-publication/source.tar.gz
      - name: Locked desktop dependencies
        working-directory: desktop/cradle
        run: npm ci
      - name: All production controller regressions
        id: controller
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: node --experimental-strip-types --test tests/agent-native-model.test.mjs tests/agent-native-creation.test.mjs tests/agent-native-delivery.test.mjs tests/agent-native-readiness.test.mjs 2>&1 | tee tests/agent-native-results/controllers.log
      - name: Local acceptance packet checks (not live models)
        id: packet
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: |
          python3 tests/agent-native-live.test.py 2>&1 | tee tests/agent-native-results/packet.log
          python3 tests/agent-native-local.test.py 2>&1 | tee tests/agent-native-results/creation-packet.log
          python3 tests/agent-native-live.py --help
          python3 tests/agent-native-local.py --help
      - name: Browser runtime
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Actual composer and creation controls in Chromium
        id: browser
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: |
          node tests/agent-native-browser.mjs 2>&1 | tee tests/agent-native-results/model-browser.log
          node tests/agent-native-creation-browser.mjs 2>&1 | tee tests/agent-native-results/creation-browser.log
      - name: Full desktop production build
        id: build
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: npm run build 2>&1 | tee tests/agent-native-results/build.log
      - name: Production kernel gates
        id: kernel
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle/kernel
        run: cargo test --locked --test agent_native_gate --test agent_definition_gate 2>&1 | tee ../tests/agent-native-results/kernel.log
      - name: Full kernel regressions without early target termination
        id: allkernel
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle/kernel
        run: cargo test --locked --all-targets --no-fail-fast 2>&1 | tee ../tests/agent-native-results/kernel-all.log
      - name: Strict kernel lint independently of test outcome
        id: lint
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle/kernel
        run: cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee ../tests/agent-native-results/kernel-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-creation-source-and-evidence
          path: |
            desktop/cradle/tests/agent-native-results/
            /tmp/agent-publication/
          retention-days: 7
      - name: Preserve failed and skipped gates
        if: always()
        env:
          OUTCOMES: ${{ steps.publish.outcome }},${{ steps.controller.outcome }},${{ steps.packet.outcome }},${{ steps.browser.outcome }},${{ steps.build.outcome }},${{ steps.kernel.outcome }},${{ steps.allkernel.outcome }},${{ steps.lint.outcome }}
        run: |
          case "$OUTCOMES" in
            success,success,success,success,success,success,success,success|skipped,success,success,success,success,success,success,success) exit 0 ;;
            *) exit 1 ;;
          esac
