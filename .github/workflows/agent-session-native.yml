name: Agent session native
on:
  push:
    branches: [agent/native-agent-session-20260920]
  pull_request:
    paths: ['desktop/cradle/src/agency/**', 'desktop/cradle/src/encounter/**', 'desktop/cradle/src/agent/**', 'desktop/cradle/kernel/**', 'desktop/cradle/tests/agent-native-*', '.github/workflows/agent-session-native.yml']
permissions:
  contents: read
jobs:
  native-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install formatter and lint for repository toolchain
        working-directory: desktop/cradle/kernel
        run: rustup component add rustfmt clippy
      - name: Publish bounded source on the owned branch only
        id: publish
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = agent/native-agent-session-20260920
          mkdir -p /tmp/agent-publication
          git rev-parse HEAD > /tmp/agent-publication/before-head.txt
          python3 - <<'PY'
          import base64,hashlib,lzma,pathlib,re,subprocess
          part=pathlib.Path('.github/agent-creation.part1')
          if part.exists():
              encoded=part.read_text()+pathlib.Path('.github/agent-creation.part2').read_text()
              patch=lzma.decompress(base64.b64decode(encoded))
              assert hashlib.sha256(patch).hexdigest()=='e34e6f9ca67fc79b7142fa0c392bc6c13a00bc593193813b23ccabd3f62c29a2'
              paths=re.findall(rb'^diff --git a/(.*?) b/(.*?)$',patch,re.M)
              assert len(paths)==28 and all(a==b for a,b in paths)
              assert all(a.startswith(b'desktop/cradle/') and b'..' not in a for a,b in paths)
              target=pathlib.Path('desktop/cradle/kernel/src/agent_definition.rs')
              assert subprocess.check_output(['git','hash-object',str(target)]).decode().strip()=='e9937e82fd93d8ac6233061bbfa600fcf01ec0b9'
              pathlib.Path('/tmp/agent-publication/previous-agent-definition.rs').write_bytes(target.read_bytes())
              target.unlink()
              p=pathlib.Path('/tmp/agent-publication/creation.patch');p.write_bytes(patch)
              subprocess.run(['git','apply','--check',str(p)],check=True)
              subprocess.run(['git','apply',str(p)],check=True)
              subprocess.run(['rustfmt','--edition','2021','--config','skip_children=true',str(target),'desktop/cradle/kernel/tests/agent_definition_gate.rs'],check=True)
              subprocess.run(['git','add',*[a.decode() for a,b in paths]],check=True)
              subprocess.run(['git','rm','.github/agent-creation.part1','.github/agent-creation.part2'],check=True)
              subprocess.run(['git','config','user.name','Epii'],check=True)
              subprocess.run(['git','config','user.email','agent-session@users.noreply.github.com'],check=True)
              subprocess.run(['git','commit','-m','feat(agent): connect native definition acceptance and Direct-session composer with recovery'],check=True)
              subprocess.run(['git','push','origin','HEAD:refs/heads/agent/native-agent-session-20260920'],check=True)
          PY
      - name: Retain actual source and any interrupted patch
        if: always()
        run: |
          mkdir -p desktop/cradle/tests/agent-native-results
          git rev-parse HEAD > desktop/cradle/tests/agent-native-results/source-revision.txt
          git diff > desktop/cradle/tests/agent-native-results/uncommitted.patch
          git archive --format=tar.gz HEAD > /tmp/agent-publication/source.tar.gz
      - name: Locked desktop dependencies
        working-directory: desktop/cradle
        run: npm ci
      - name: All production controller regressions
        id: controller
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: node --experimental-strip-types --test tests/agent-native-model.test.mjs tests/agent-native-creation.test.mjs tests/agent-native-delivery.test.mjs 2>&1 | tee tests/agent-native-results/controllers.log
      - name: Local acceptance packet checks (not live models)
        id: packet
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: |
          python3 tests/agent-native-live.test.py 2>&1 | tee tests/agent-native-results/packet.log
          python3 tests/agent-native-live.py --help
      - name: Browser runtime
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Actual composer and creation controls in Chromium
        id: browser
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: |
          node tests/agent-native-browser.mjs 2>&1 | tee tests/agent-native-results/model-browser.log
          node tests/agent-native-creation-browser.mjs 2>&1 | tee tests/agent-native-results/creation-browser.log
      - name: Full desktop production build
        id: build
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle
        run: npm run build 2>&1 | tee tests/agent-native-results/build.log
      - name: Production kernel gates
        id: kernel
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle/kernel
        run: cargo test --locked --test agent_native_gate --test agent_definition_gate 2>&1 | tee ../tests/agent-native-results/kernel.log
      - name: Full kernel regressions and strict lint
        id: allkernel
        continue-on-error: true
        shell: bash
        working-directory: desktop/cradle/kernel
        run: |
          cargo test --locked 2>&1 | tee ../tests/agent-native-results/kernel-all.log
          cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee ../tests/agent-native-results/kernel-clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-creation-source-and-evidence
          path: |
            desktop/cradle/tests/agent-native-results/
            /tmp/agent-publication/
          retention-days: 7
      - name: Preserve failed and skipped gates
        if: always()
        env:
          OUTCOMES: ${{ steps.controller.outcome }},${{ steps.packet.outcome }},${{ steps.browser.outcome }},${{ steps.build.outcome }},${{ steps.kernel.outcome }},${{ steps.allkernel.outcome }}
        run: test "$OUTCOMES" = 'success,success,success,success,success,success'
