name: Run Phase 3 implementation patch

on:
  push:
    branches:
      - agent/oi-017-exchange-authority
    paths:
      - '.github/workflows/phase3-run-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-017-exchange-authority
          fetch-depth: 0
      - name: Extract and run implementation script
        shell: bash
        run: |
          awk 'BEGIN{f=0} /python - <<.PY./{f=1;next} f && /^          PY$/{exit} f {sub(/^          /, ""); print}' .github/workflows/phase3-implementation-patch.yml > /tmp/phase3_patch.py
          python /tmp/phase3_patch.py
      - name: Validate and commit
        shell: bash
        run: |
          node --check shared-field/a2a.mjs
          node --check shared-field/a2a.test.mjs
          node --check shared-field/exchange-authority.test.mjs
          rm -f .github/workflows/phase3-run-patch.yml
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Enforce explicit bounded Exchange authority'
          git push origin HEAD:agent/oi-017-exchange-authority
