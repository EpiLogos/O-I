name: W2 source recovery
on:
  push:
    branches: [agent/w2-central-day-source-20260920]
    paths: ['.github/workflows/w2-source-recovery.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: c4bb3605d233426600bdb462832e8ed55ac712b4
          path: native-central
          persist-credentials: false
      - name: Retain exact tracked source, not private or installed state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/w2-recovery"
          git archive HEAD | gzip > "$RUNNER_TEMP/w2-recovery/oi-source.tar.gz"
          git -C native-central archive HEAD | gzip > "$RUNNER_TEMP/w2-recovery/central-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/w2-recovery/oi-revision.txt"
          git -C native-central rev-parse HEAD > "$RUNNER_TEMP/w2-recovery/central-revision.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: w2-source-recovery
          path: ${{ runner.temp }}/w2-recovery
          retention-days: 3
