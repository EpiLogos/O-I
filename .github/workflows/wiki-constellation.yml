name: Wiki constellation integration

on:
  pull_request:
    paths:
      - 'desktop/cradle/src/knowledge/**'
      - 'desktop/cradle/src/techne/**'
      - 'desktop/cradle/kernel/src/graph.rs'
      - 'desktop/cradle/kernel/src/knowledge.rs'
      - 'desktop/cradle/tests/wiki-*'
      - '.github/workflows/wiki-constellation.yml'

permissions:
  contents: read

concurrency:
  group: wiki-constellation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install the declared Cradle dependencies
        working-directory: desktop/cradle
        run: npm ci
      - name: Check the complete Cradle TypeScript graph
        working-directory: desktop/cradle
        run: npx tsc --noEmit
      - name: Preserve exact public source and test dependencies for reproducible review
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/wiki-evidence
          git rev-parse HEAD > /tmp/wiki-evidence/source-revision.txt
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          suffixes = {'.ts', '.tsx', '.js', '.mjs', '.cjs', '.rs', '.toml', '.lock', '.json', '.css', '.html', '.md', '.yml', '.yaml', '.py', '.glsl', '.vert', '.frag', '.wgsl', '.svg'}
          with tarfile.open('/tmp/wiki-evidence/source.tar.gz', 'w:gz') as out:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and not p.is_symlink() and (p.suffix in suffixes or p.name.startswith('.gitignore')):
                      out.add(p, arcname=name, recursive=False)
          PY
          if [ -d desktop/cradle/node_modules ]; then
            tar -czf /tmp/wiki-evidence/cradle-dependencies.tar.gz desktop/cradle/node_modules
          fi
          sha256sum /tmp/wiki-evidence/*.tar.gz > /tmp/wiki-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-exact-cut-${{ github.run_id }}
          path: /tmp/wiki-evidence/
          retention-days: 7
  native-contract-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: ai-kit
            revision: 99306d858c255fa258d8cc419b314a433d3f92a4
          - repository: Central
            revision: 12ee31313e710378845baae190efc1a4b3e7ebdb
          - repository: QL-MEF
            revision: 5970757e25532c7329f07f4819273155c4f3f135
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - name: Record pinned public contract source, not installed state
        env:
          OWNER_REPOSITORY: ${{ matrix.repository }}
          OWNER_REVISION: ${{ matrix.revision }}
        run: |
          mkdir -p /tmp/native-wiki-source
          test "$(git rev-parse HEAD)" = "$OWNER_REVISION"
          git rev-parse HEAD > /tmp/native-wiki-source/source-revision.txt
          python3 - <<'PY'
          import os, pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          suffixes = {'.rs', '.toml', '.lock', '.json', '.csv', '.md', '.py', '.ts', '.tsx', '.js', '.mjs', '.css', '.html', '.yml', '.yaml', '.txt'}
          with tarfile.open('/tmp/native-wiki-source/source.tar.gz', 'w:gz') as out:
              for name in paths:
                  p = pathlib.Path(name)
                  if p.is_file() and not p.is_symlink() and (p.suffix in suffixes or p.name == 'AGENTS.md'):
                      out.add(p, arcname=name, recursive=False)
          PY
          cd /tmp/native-wiki-source && sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-contract-${{ matrix.repository }}-${{ matrix.revision }}
          path: /tmp/native-wiki-source/
          retention-days: 7
