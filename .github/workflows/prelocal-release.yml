name: Pre-local O:I release

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'suite/**'
      - 'surfaces.json'
      - '.github/workflows/prelocal-release.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'suite/**'
      - 'surfaces.json'
      - '.github/workflows/prelocal-release.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path cli/Cargo.toml --locked

  artifact:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build locked O:I bootstrap
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target '${{ matrix.target }}' --bin oi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="oi-0.1.0-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "cli/target/${{ matrix.target }}/release/oi" "dist/$name/oi"
          cp suite/manifest.json "dist/$name/suite-manifest.json"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: oi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: github.event_name == 'push'
    needs: artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oi-*
          path: dist
          merge-multiple: true
      - name: Publish immutable O:I bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='oi-v0.1.0-prelocal.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to mutate an accepted release" >&2
            exit 1
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'O:I 0.1.0 pre-local.2' \
            --notes 'Prebuilt O:I bootstrap for the accepted six-product suite manifest. Physical workstation/provider acceptance is explicitly not claimed.'
