name: Pre-local O:I release

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'suite/**'
      - 'surfaces.json'
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - '.github/workflows/prelocal-release.yml'
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'suite/**'
      - 'surfaces.json'
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - '.github/workflows/prelocal-release.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path cli/Cargo.toml --locked

  desktop-bundle:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Install locked desktop UI graph
        run: npm ci --prefix desktop/ui --no-audit --no-fund
      - name: Prove locked native-shell graph
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Build Apple Silicon Tauri app bundle
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/src-tauri
          ../ui/node_modules/.bin/tauri build --bundles app --target aarch64-apple-darwin
      - name: Prove build did not rewrite locks
        run: git diff --exit-code -- desktop/src-tauri/Cargo.lock desktop/ui/package-lock.json
      - name: Package desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir='desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos'
          app="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p dist
          archive='dist/oi-desktop-0.1.0-aarch64-apple-darwin.app.tar.gz'
          tar -C "$(dirname "$app")" -czf "$archive" "$(basename "$app")"
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/attest@v4
        if: github.event_name == 'push'
        with:
          subject-path: dist/oi-desktop-0.1.0-aarch64-apple-darwin.app.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: oi-desktop-aarch64-apple-darwin
          path: |
            dist/*.tar.gz
            dist/*.sha256

  artifact:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build locked O:I bootstrap
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target '${{ matrix.target }}' --bin oi
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="oi-0.1.0-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "cli/target/${{ matrix.target }}/release/oi" "dist/$name/oi"
          cp suite/manifest.json "dist/$name/suite-manifest.json"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: oi-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    if: github.event_name == 'push'
    needs: [artifact, desktop-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oi-*
          path: dist
          merge-multiple: true
      - name: Publish immutable O:I bootstrap release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='oi-v0.1.0-prelocal.2'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; refusing to mutate an accepted release" >&2
            exit 1
          fi
          gh release create "$tag" dist/*.tar.gz dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'O:I 0.1.0 pre-local.2' \
            --notes 'Prebuilt O:I bootstrap and locked Apple Silicon Tauri app bundle for the accepted six-product suite manifest. Physical workstation/provider acceptance is explicitly not claimed.'
