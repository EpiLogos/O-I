name: W5 final repair objects
on:
  pull_request:
    paths: ['.github/workflows/w5-final-source.yml']
permissions:
  contents: write
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == 'EpiLogos/O-I' && github.event.pull_request.head.ref == 'agent/w5-native-expression-backcheck-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Run the immutable reviewed builder with exact whitespace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,textwrap
          parent='cba859e8bc6ccdf800f09968a0f5596102542373'
          helper='.github/workflows/w5-final-source.yml'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')==parent
          assert git('rev-parse',parent+':'+helper)=='0d26ec49d46502d6b8df6a0346efbbbb2e07c1ba'
          raw=subprocess.check_output(['git','show',parent+':'+helper],text=True)
          code=textwrap.dedent(raw.split("          python3 - <<'PY'\n",1)[1].rsplit('          PY\n',1)[0])
          before="git('rev-parse','HEAD^')=='3559077f879d53595d3a58697a16b2749ceffc67'"
          assert code.count(before)==1
          code=code.replace(before,"git('rev-parse','HEAD^^')=='3559077f879d53595d3a58697a16b2749ceffc67'")
          before="s+='''\n\n\n### Final repository-side repair before local integration"
          assert code.count(before)==1
          code=code.replace(before,"s+='''\n\n### Final repository-side repair before local integration")
          exec(compile(code,'verified-w5-builder','exec'))
          PY
