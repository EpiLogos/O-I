name: Canvas editor and context
on:
  push:
    branches: [agent/canvas-editor-context-20260920]
  pull_request:
    paths:
      - 'desktop/cradle/src/editor/**'
      - 'desktop/cradle/src/context/**'
      - 'desktop/cradle/tests/canvas-editor*'
      - '.github/workflows/canvas-editor-context.yml'
permissions:
  contents: read
concurrency:
  group: canvas-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          path: _review/ai-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          path: _review/QL-MEF
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/kernel-rebuild/UX-SPINE-RECONCILIATION.md
            /docs/integrations/epi-logos/EPI-VAK-OPERATIVE-SYNTAX-ARCHITECTURE.md
      - name: Native review basis
        run: |
          mkdir -p /tmp/editor-owners/ai-kit /tmp/editor-owners/QL-MEF
          git -C _review/ai-kit rev-parse HEAD > /tmp/editor-owners/ai-kit/source-head.txt
          git -C _review/ai-kit archive HEAD | tar -x -C /tmp/editor-owners/ai-kit
          git -C _review/QL-MEF rev-parse HEAD > /tmp/editor-owners/QL-MEF/source-head.txt
          cp -a _review/QL-MEF/docs /tmp/editor-owners/QL-MEF/
          tar -czf native-editor-owners.tar.gz -C /tmp/editor-owners .
      - uses: actions/upload-artifact@v4
        with:
          name: native-editor-owners
          path: native-editor-owners.tar.gz
          retention-days: 1
          compression-level: 0
