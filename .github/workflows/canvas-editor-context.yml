name: Canvas editor and context
on:
  push:
    branches: [agent/canvas-editor-context-20260920]
  pull_request:
    paths:
      - 'desktop/cradle/src/**'
      - 'desktop/cradle/tests/canvas-editor*'
      - 'desktop/cradle/tests/situation-frame.test.mjs'
      - 'desktop/cradle/kernel/**'
      - 'desktop/cradle/package*.json'
      - 'scripts/prepare-retained-performance-fixture.py'
      - 'scripts/retained-performance-ci-environment.py'
      - 'scripts/retained-performance-environment-regressions.py'
      - 'desktop/cradle/tests/fixtures/retained-performance/source-owner.json'
      - '.github/workflows/canvas-editor-context.yml'
permissions:
  contents: read
concurrency:
  group: canvas-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read the separately qualified retained performance test source
        id: retained-performance-source
        run: |
          python3 - <<'PY_SOURCE'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('desktop/cradle/tests/fixtures/retained-performance/source-owner.json').read_text())
          assert value['schema'] == 'oi.retained-performance-test-source-owner/v1'
          assert value['repository'] == 'EpiLogos/QL-MEF'
          assert value['consumer'] == 'retained-performance-native-kernel-tests'
          assert re.fullmatch(r'[0-9a-f]{40}', value['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + value['revision'] + '\n')
          PY_SOURCE
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: ${{ steps.retained-performance-source.outputs.revision }}
          path: .native-owner/retained-performance/QL-MEF
          persist-credentials: false
      - name: Native retained performance codec dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tested source identity
        run: git rev-parse HEAD | tee source-head.txt
      - name: Install locked dependencies
        working-directory: desktop/cradle
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Export bounded review inputs
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/canvas-review
          git diff --binary bfc674c529029b77036092891c5f1f52e6d389dd HEAD > /tmp/canvas-review/oi.patch
          cp source-head.txt /tmp/canvas-review/
          tar -czf canvas-review.tar.gz -C /tmp/canvas-review .
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: canvas-review-inputs
          path: canvas-review.tar.gz
          retention-days: 1
      - name: Type and range/lifecycle contracts
        working-directory: desktop/cradle
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee ../../canvas-types.log
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/canvas-editor-contract.test.mjs tests/material-html-lifecycle.test.mjs 2>&1 | tee ../../canvas-contracts.log
          npm run test:situation 2>&1 | tee ../../situation-frame.log
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Build the exact native replay owner
        run: cargo build --manifest-path desktop/cradle/kernel/Cargo.toml --target-dir desktop/cradle/kernel/target --locked --bin walk-bridge
      - name: Install browser
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium
      - name: Production editor selection and send interaction
        working-directory: desktop/cradle
        env:
          OI_KERNEL_BIN: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
        run: set -o pipefail; node tests/canvas-editor-browser.mjs 2>&1 | tee ../../canvas-browser.log
      - name: Production bundle
        working-directory: desktop/cradle
        run: set -o pipefail; npx vite build 2>&1 | tee ../../canvas-build.log
      - name: Produce the actual retained source, Manager, full workload and native checkpoints
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retained-performance"
          python3 scripts/prepare-retained-performance-fixture.py \
            --ql-source "$GITHUB_WORKSPACE/.native-owner/retained-performance/QL-MEF" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output "$RUNNER_TEMP/retained-performance" --timeout-seconds 900 \
            > "$RUNNER_TEMP/retained-performance/result.json"
          python3 scripts/retained-performance-environment-regressions.py \
            --result "$RUNNER_TEMP/retained-performance/result.json" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output-root "$RUNNER_TEMP/retained-performance" \
            > "$RUNNER_TEMP/retained-performance/publication-counterproof.json" \
            2> "$RUNNER_TEMP/retained-performance/publication-counterproof.log"
          python3 scripts/retained-performance-ci-environment.py \
            --result "$RUNNER_TEMP/retained-performance/result.json" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output-root "$RUNNER_TEMP/retained-performance" --github-env "$GITHUB_ENV"
      - name: Kernel adapter compatibility
        timeout-minutes: 35
        run: set -o pipefail; cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked --all-targets --no-fail-fast -- --nocapture 2>&1 | tee canvas-kernel.log
      - name: Existing experience-source integrity
        run: |
          python3 -m unittest discover -s tests/experience -p 'test_*.py'
          python3 scripts/experience_map.py --output-dir "$RUNNER_TEMP/canvas-experience"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-editor-context-proof
          path: |
            source-head.txt
            ${{ runner.temp }}/retained-performance
            canvas-*.log
            desktop/canvas-*.log
            desktop/cradle/tests/artifacts/canvas-editor
          retention-days: 7
