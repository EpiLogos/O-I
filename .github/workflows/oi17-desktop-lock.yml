name: OI17 desktop lock

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - .github/workflows/oi17-desktop-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Generate native-shell lock from accepted suite revisions
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Prove locked native shell graph resolves on accepted target
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Commit lock
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add desktop/src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m 'build(desktop): lock accepted Tauri dependency graph'
          git push origin HEAD:converge/oi-017-first-suite
