name: Cross-product (weekly)

# Everything that checks out, builds or tests a sibling repository runs here
# on a weekly schedule and on demand. Each sibling already gates its own main; O:I's per-push gate is
# verify.yml. A red job here is a pin that rotted or a seam that moved, and
# is repaired in its own change, not by re-running it on every pull request.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      focused-development:
        description: Run the exact repertoire, collaboration and delivery owner cut
        type: boolean
        default: false
      ai-kit-revision:
        description: Exact 40-character AIKit commit for the focused development cut
        type: string
      factory-revision:
        description: Exact 40-character Factory commit for the focused development cut
        type: string
      workcell-revision:
        description: Optional exact Workcell commit when material execution is selected
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never

jobs:
  exact-development-cut:
    name: Exact development cut / repertoire, collaboration and delivery
    if: ${{ inputs.focused-development == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AIKIT_REVISION: ${{ inputs.ai-kit-revision }}
      FACTORY_REVISION: ${{ inputs.factory-revision }}
      WORKCELL_REVISION: ${{ inputs.workcell-revision }}
      AIKIT_BUILD_SOURCE_REVISION: ${{ inputs.ai-kit-revision }}
      AIKIT_BUILD_SOURCE_DIRTY: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Admit exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AIKIT_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FACTORY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$WORKCELL_REVISION" || "$WORKCELL_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: ${{ inputs.ai-kit-revision }}
          path: development-ai-kit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Factory
          ref: ${{ inputs.factory-revision }}
          path: development-factory
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ inputs.workcell-revision != '' }}
        with:
          repository: EpiLogos/Workcell
          ref: ${{ inputs.workcell-revision }}
          path: development-workcell
          persist-credentials: false
      - name: Confirm the requested material before execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C development-ai-kit rev-parse HEAD)" = "$AIKIT_REVISION"
          test "$(git -C development-factory rev-parse HEAD)" = "$FACTORY_REVISION"
          test -z "$(git -C development-ai-kit status --porcelain)"
          test -z "$(git -C development-factory status --porcelain)"
          if [[ -n "$WORKCELL_REVISION" ]]; then
            test "$(git -C development-workcell rev-parse HEAD)" = "$WORKCELL_REVISION"
            test -z "$(git -C development-workcell status --porcelain)"
          fi
          mkdir -p "$RUNNER_TEMP/exact-development-cut"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: exact-development-cut
          cache-on-failure: true
          workspaces: |
            development-ai-kit
            development-factory
      - uses: Swatinem/rust-cache@v2.9.2
        if: ${{ inputs.workcell-revision != '' }}
        with:
          shared-key: exact-development-cut-workcell
          cache-on-failure: true
          workspaces: development-workcell
      - name: Repertoire, generation and harness projection owner checks
        working-directory: development-ai-kit
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --test repertoire_composition 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/repertoire.log"
          cargo test --locked -p aikit-adapters --test agent_skills --test claude --test pi 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/projections.log"
          cargo test --locked -p aikit-store --test generation --test generation_history_v2 --test procedure 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/generations.log"
      - name: Existing TUI composition and application owner checks
        working-directory: development-ai-kit
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-tui --test application_v2 --test application_service_v2 --test application_service_backend_v2 --test profile_composition_stale_v2 --test scope_guard_v2 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/tui-application.log"
      - name: Bounded native handoff, team and child identity owner checks
        working-directory: development-ai-kit
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p aikit-cli --lib communique_turn::tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/handoff.log"
          cargo test --locked -p aikit-cli --lib encounter_service::agency::task::task_identity_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/child-identity.log"
          cargo test --locked -p aikit-cli --lib encounter_service::agency::task::task_pi_repertoire_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/child-repertoire.log"
          cargo test --locked -p aikit-cli --lib encounter_service::agency::native_preflight_bounds_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/model-preflight.log"
          cargo test --locked -p aikit-cli --lib encounter_service::agency::task::startup_deadline_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/task-startup-budget.log"
          cargo test --locked -p aikit-cli --lib gateway_contact::forwarded_readback_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/remote-readback.log"
          cargo test --locked -p aikit-cli --lib inhabit_team::native::child_binding_revision_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/child-agency.log"
          cargo test --locked -p aikit-cli --lib inhabit_team::native::retained_repertoire_tests 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/child-recovery.log"
          cargo test --locked -p aikit-cli --test inhabit_team_projection 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/team.log"
          cargo test --locked -p aikit-cli --test hook_stdout_inject -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/hooks.log"
          cargo test --locked -p aikit-adapters --lib runner::tests::actual_completed_eof_preserves_a_background_child_with_closed_streams -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/hook-runner-compatibility.log"
          cargo test --locked -p aikit-adapters --lib runner::tests::actual_leader_exit_does_not_wait_for_descendant_held_pipes -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/runner-held-pipes.log"
          cargo test --locked -p aikit-adapters --lib runner::tests::actual_strict_decoding_waits_for_the_same_held_descendant_pipe_retirement -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/runner-strict-retirement.log"
          cargo test --locked -p aikit-adapters --lib runner::tests::a_wall_clock_budget_kills_a_runaway_child_as_a_runner_error -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/runner-timeout.log"
          cargo build --locked -p aikit-cli --bin aikit
      - name: Peer acknowledgement against the actual Pi session implementation
        working-directory: development-ai-kit
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pi-session-owner" --no-audit --no-fund @earendil-works/pi-coding-agent@0.84.4
          export PI_AGENT_PACKAGE_ROOT="$RUNNER_TEMP/pi-session-owner/node_modules/@earendil-works/pi-coding-agent"
          node scripts/verify-pi-peer-retention.mjs 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/pi-retention.log"
          node scripts/verify-pi-repertoire-selection.mjs 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/pi-repertoire.log"
          cp "$RUNNER_TEMP/pi-session-owner/package-lock.json" "$RUNNER_TEMP/exact-development-cut/pi-package-lock.json"
      - name: Delivery, repair, review and exact-revision owner checks
        working-directory: development-factory
        shell: bash
        env:
          SUITE_BUILD_REVISION: ${{ inputs.factory-revision }}
        run: |
          set -euo pipefail
          # The native Factory stamp probes package files rather than this env.
          # Refresh its build script mtime so a restored cache records this cut.
          touch factory/build.rs
          cargo test --locked -p epilogos-factory --test attempt_public_regressions -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/delivery.log"
          cargo test --locked -p epilogos-factory --test attempt_owner_delivery -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/owner-delivery.log"
          cargo test --locked -p epilogos-factory --lib native_owner:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/native-owner.log"
          cargo test --locked -p epilogos-factory --lib attempt_owner_dispatch:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/owner-dispatch.log"
          cargo test --locked -p epilogos-factory --lib native_process:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/process-lifecycle.log"
          cargo build --locked -p epilogos-factory --bin factory
      - name: Qualified native private failure-capture regressions
        working-directory: development-factory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, subprocess, sys
          root = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'exact-development-cut' / 'native-os').resolve()
          root.mkdir(mode=0o700)
          executable = pathlib.Path(sys.executable).resolve()
          env = dict(os.environ, FACTORY_NATIVE_EVIDENCE_DIR=str(root), TMPDIR=str(root),
                     FACTORY_NATIVE_PYTHON_BIN=str(executable),
                     FACTORY_NATIVE_PYTHON_SHA256=hashlib.sha256(executable.read_bytes()).hexdigest())
          (root.parent / 'native-os-qualification.json').write_text(__import__('json').dumps({
              'python': str(executable), 'sha256': env['FACTORY_NATIVE_PYTHON_SHA256'],
              'scope': 'controlled native owner failure capture; no provider or publication'}, indent=2) + '\n')
          with (root.parent / 'native-os.log').open('wb') as log:
              result = subprocess.run(['cargo', 'test', '--locked', '-p', 'epilogos-factory', '--lib',
                  'attempt_owner_dispatch::native_failure_tests::', '--', '--ignored', '--test-threads=1'],
                  env=env, stdout=log, stderr=subprocess.STDOUT, timeout=180)
          print((root.parent / 'native-os.log').read_text())
          raise SystemExit(result.returncode)
          PYTHON
      - name: Bounded material execution and native recovery owner checks
        if: ${{ inputs.workcell-revision != '' }}
        working-directory: development-workcell
        shell: bash
        env:
          SUITE_BUILD_REVISION: ${{ inputs.workcell-revision }}
        run: |
          set -euo pipefail
          # Component staging is source-pinned to this actual hosted checkout.
          # It does not establish a Central Project, NOW or provider observation.
          export GITHUB_WORKSPACE="$PWD"
          export WORKCELL_TEST_ARTIFACT_ROOT="$PWD/evidence/native-processes"
          export WORKCELL_TEST_ARTIFACT_ADMISSION=hosted-runner
          export WORKCELL_TEST_ARTIFACT_OWNER_SOURCE="$PWD/evidence/source-commit.txt"
          export WORKCELL_TEST_ARTIFACT_OWNER_REF="$(git rev-parse HEAD)"
          test "$WORKCELL_TEST_ARTIFACT_OWNER_REF" = "$WORKCELL_REVISION"
          mkdir -p "$WORKCELL_TEST_ARTIFACT_ROOT"
          printf '%s\n' "$WORKCELL_TEST_ARTIFACT_OWNER_REF" > "$WORKCELL_TEST_ARTIFACT_OWNER_SOURCE"
          # Preserve the final source-clean check while excluding only these
          # two exact job-owned evidence coordinates from local Git bookkeeping.
          printf '/evidence/native-processes/\n/evidence/source-commit.txt\n' >> "$(git rev-parse --git-path info/exclude)"
          touch crates/workcell-cli/build.rs
          cargo build --locked -p epilogos-workcell-cli --bin workcell --bin workcell-control-service
          export WORKCELL_TEST_NATIVE_EXECUTABLE="$PWD/target/debug/workcell"
          cargo test --locked -p epilogos-workcell-cli --test local_material_operation -- --list 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-cli-list.log"
          test "$(grep -c ': test$' "$RUNNER_TEMP/exact-development-cut/material-cli-list.log")" -eq 3
          cargo test --locked -p epilogos-workcell-cli --test local_material_operation -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-cli.log"
          cargo test --locked -p epilogos-workcell-cli --lib durable::tests::material_ -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-journal.log"
          cargo test --locked -p epilogos-workcell-runtime --lib material_process::tests:: -- --list 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-process-list.log"
          test "$(grep -c ': test$' "$RUNNER_TEMP/exact-development-cut/material-process-list.log")" -eq 6
          cargo test --locked -p epilogos-workcell-runtime --lib material_process::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-process.log"
          cargo test --locked -p epilogos-workcell-runtime --lib bounded_process::owned_operation_tests:: -- --list 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-owned-list.log"
          test "$(grep -c ': test$' "$RUNNER_TEMP/exact-development-cut/material-owned-list.log")" -eq 3
          cargo test --locked -p epilogos-workcell-runtime --lib bounded_process::owned_operation_tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-owned.log"
          cargo test --locked -p epilogos-workcell-runtime --lib bounded_process::tests:: -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-capture.log"
          cargo test --locked -p epilogos-workcell-opensandbox --lib tests::actual_ -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-http.log"
          cargo test --locked -p epilogos-workcell-control --test connections -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/exact-development-cut/material-connections.log"
      - name: Verify the compiled revision identities
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'exact-development-cut'
          # A successful Cargo filter with zero tests is not owner evidence.
          expected_rust_results = {
              'repertoire.log': 1, 'projections.log': 3, 'generations.log': 3,
              'tui-application.log': 5, 'handoff.log': 1, 'child-identity.log': 1,
              'child-repertoire.log': 1, 'remote-readback.log': 1, 'child-agency.log': 1,
              'model-preflight.log': 1, 'task-startup-budget.log': 1,
              'child-recovery.log': 1, 'team.log': 1, 'hooks.log': 1,
              'hook-runner-compatibility.log': 1, 'runner-held-pipes.log': 1,
              'runner-strict-retirement.log': 1, 'runner-timeout.log': 1,
              'delivery.log': 1, 'process-lifecycle.log': 1,
              'owner-delivery.log': 1, 'native-owner.log': 1, 'owner-dispatch.log': 1, 'native-os.log': 1,
          }
          if os.environ.get('WORKCELL_REVISION'):
              expected_rust_results.update({name: 1 for name in ['material-cli.log', 'material-journal.log', 'material-process.log', 'material-owned.log', 'material-capture.log', 'material-http.log', 'material-connections.log']})
          for name, expected_count in expected_rust_results.items():
              results = re.findall(r'^test result: ok\. ([0-9]+) passed;', (output / name).read_text(), re.MULTILINE)
              if len(results) != expected_count or any(int(count) == 0 for count in results):
                  raise SystemExit(f'{name}: missing or empty owner test execution: {results}')
          if os.environ.get('WORKCELL_REVISION'):
              for name, count in [('material-cli.log', 3), ('material-process.log', 6), ('material-owned.log', 3), ('material-capture.log', 4)]:
                  required = f'test result: ok. {count} passed; 0 failed; 0 ignored;'
                  if required not in (output / name).read_text():
                      raise SystemExit(f'{name}: required native group did not execute in full')
          versions = {}
          selected = [
              ('ai-kit', pathlib.Path('development-ai-kit'), 'aikit', os.environ['AIKIT_REVISION'], os.environ['AIKIT_REVISION'][:12]),
              ('factory', pathlib.Path('development-factory'), 'factory', os.environ['FACTORY_REVISION'], os.environ['FACTORY_REVISION']),
          ]
          if os.environ.get('WORKCELL_REVISION'):
              selected.append(('workcell', pathlib.Path('development-workcell'), 'workcell', os.environ['WORKCELL_REVISION'], os.environ['WORKCELL_REVISION']))
          for owner, path, binary, expected, stamp in selected:
              result = subprocess.run([str(path / 'target/debug' / binary), '--version'], text=True, capture_output=True, timeout=15, check=True)
              version = result.stdout.strip()
              matched = re.fullmatch(re.escape(binary) + r' \S+ \(([0-9a-f]+)\)', version)
              if matched is None or matched.group(1) != stamp:
                  raise SystemExit(f'{owner}: compiled version does not match the requested cut: {version!r}')
              versions[owner] = {'binary_version': version, 'binary_stamp_revision': matched.group(1), 'source_revision': expected}
              print(f'{owner}: {version}')
          (output / 'build-versions.json').write_text(json.dumps(versions, indent=2) + '\n')
          PY
      - name: Confirm source material after execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C development-ai-kit rev-parse HEAD)" = "$AIKIT_REVISION"
          test "$(git -C development-factory rev-parse HEAD)" = "$FACTORY_REVISION"
          test -z "$(git -C development-ai-kit status --porcelain)"
          test -z "$(git -C development-factory status --porcelain)"
          if [[ -n "$WORKCELL_REVISION" ]]; then
            test "$(git -C development-workcell rev-parse HEAD)" = "$WORKCELL_REVISION"
            test -z "$(git -C development-workcell status --porcelain)"
          fi
      - name: Record executed source and build cuts
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'exact-development-cut'
          output.mkdir(parents=True, exist_ok=True)
          def observed(path, *args):
              result = subprocess.run(['git', '-C', str(path), *args], text=True, capture_output=True)
              return result.stdout.strip() if result.returncode == 0 else None
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          version_path = output / 'build-versions.json'
          versions = json.loads(version_path.read_text()) if version_path.is_file() else {}
          owners = {}
          selected = [
              ('ai-kit', pathlib.Path('development-ai-kit'), os.environ['AIKIT_REVISION'], 'aikit'),
              ('factory', pathlib.Path('development-factory'), os.environ['FACTORY_REVISION'], 'factory'),
          ]
          if os.environ.get('WORKCELL_REVISION'):
              selected.append(('workcell', pathlib.Path('development-workcell'), os.environ['WORKCELL_REVISION'], 'workcell'))
          for owner, path, expected, binary in selected:
              owners[owner] = {'requested_revision': expected, 'observed_revision': observed(path, 'rev-parse', 'HEAD'),
                  'tree': observed(path, 'rev-parse', 'HEAD^{tree}'), 'lock_sha256': digest(path / 'Cargo.lock'),
                  'binary_sha256': digest(path / 'target/debug' / binary), **versions.get(owner, {})}
          reading = {'schema': 'oi.development-field-cut-execution/v1', 'owners': owners,
              'oi_revision': observed(pathlib.Path('.'), 'rev-parse', 'HEAD'), 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'provider_inference_observed': False,
              'physical_acceptance': False, 'logs': sorted(p.name for p in output.glob('*.log'))}
          (output / 'source-build-cut.json').write_text(json.dumps(reading, indent=2) + '\n')
          print('OI_DEVELOPMENT_FIELD_CUT_JSON=' + json.dumps(reading, separators=(',', ':')))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: exact-development-cut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exact-development-cut
          if-no-files-found: error

  # -------------------------------------------------------- installed suite
  installed-suite:
    if: ${{ inputs.focused-development != true }}
    name: Installed six-product suite from the recorded pre-local build set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build locked O:I CLI
        run: cargo build --manifest-path cli/Cargo.toml --bin oi --locked
      - name: Install recorded six-product pre-local build set twice
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          ROOT="$RUNNER_TEMP/oi-personal-ground"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"

          mkdir -p "$ROOT/Control" "$ROOT/Work"
          printf '%s\n' 'human-control-sentinel' > "$ROOT/Control/HUMAN-SENTINEL.txt"
          printf '%s\n' 'ordinary-work-sentinel' > "$ROOT/Work/WORK-SENTINEL.txt"

          python3 scripts/ci_install_retry.py --oi "$OI" --personal-ground "$ROOT" --out "$RUNNER_TEMP/preflight-install-first"
          cp "$OI_HOME/composition.json" "$RUNNER_TEMP/composition-first.json"
          cp "$OI_DATA_HOME/receipts/installed-suite.json" "$RUNNER_TEMP/installed-first.json"

          python3 scripts/ci_install_retry.py --oi "$OI" --out "$RUNNER_TEMP/preflight-install-second"
          cp "$OI_HOME/composition.json" "$RUNNER_TEMP/composition-second.json"
          cmp "$RUNNER_TEMP/composition-first.json" "$RUNNER_TEMP/composition-second.json"

          test -d "$OI_DATA_HOME/bin"
          test -d "$OI_DATA_HOME/products"
          test -d "$OI_DATA_HOME/receipts"
          test -d "$OI_DATA_HOME/cache"
          test ! -e "$ROOT/.central/oi/managed"
          test "$(cat "$ROOT/Control/HUMAN-SENTINEL.txt")" = "human-control-sentinel"
          test "$(cat "$ROOT/Work/WORK-SENTINEL.txt")" = "ordinary-work-sentinel"
          jq -e '.products | to_entries | all(.value.attestation_locally_verified == true)' "$RUNNER_TEMP/installed-first.json"
      - name: Status and doctor match recorded pre-local build manifest
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"
          "$OI" manifest --json > "$RUNNER_TEMP/manifest.json"
          "$OI" status --json > "$RUNNER_TEMP/status.json"
          "$OI" doctor --json > "$RUNNER_TEMP/doctor.json"
          "$OI" verify --json > "$RUNNER_TEMP/verify.json"

          jq -e '.schema == "oi.suite-manifest/v1" and .suite_version == "0.1.0-prelocal.6" and .standing == "historical-unratified-prelocal-build-record" and (.products | length == 6)' "$RUNNER_TEMP/manifest.json"
          jq -e '.schema == "oi.suite-status/v1" and .suite_version == "0.1.0-prelocal.6" and (.installed.products | length == 6) and .physical_acceptance == false' "$RUNNER_TEMP/status.json"
          jq -e '.schema == "oi.suite-doctor/v1" and .ok == true and (.checks | length == 6) and .physical_acceptance == false' "$RUNNER_TEMP/doctor.json"
          cmp "$RUNNER_TEMP/doctor.json" "$RUNNER_TEMP/verify.json"

          for id in central actuation ai-kit software-factory workcell quaternal-logic; do
            expected="$(jq -r --arg id "$id" '.products[] | select(.id == $id) | .revision' "$RUNNER_TEMP/manifest.json")"
            actual="$(jq -r --arg id "$id" '.installed.products[$id].revision' "$RUNNER_TEMP/status.json")"
            test "$actual" = "$expected"
          done
      - name: Development launch affordances resolve
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"
          "$OI" web --check
          "$OI" app --check
      - name: Developer federation reports current-main truth and fails closed on unsafe state
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          ROOT="$RUNNER_TEMP/oi-personal-ground"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"

          ln -s "$GITHUB_WORKSPACE" "$ROOT/Work/O-I"
          "$OI" dev status --json > "$RUNNER_TEMP/dev-status.json"
          jq -e '.schema == "oi.current-main-dev-status/v1" and (.repos | length == 7) and any(.repos[]; .id == "oi") and any(.repos[]; .id == "central")' "$RUNNER_TEMP/dev-status.json"

          "$OI" dev build oi
          "$OI" dev test oi

          DETACHED="$RUNNER_TEMP/oi-detached-source"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$DETACHED"
          git -C "$DETACHED" checkout --quiet --detach HEAD
          ln -sfn "$DETACHED" "$ROOT/Work/O-I"
          if "$OI" dev install oi > "$RUNNER_TEMP/detached-install.log" 2>&1; then
            echo 'detached checkout was incorrectly accepted as current-main installation' >&2
            exit 1
          fi
          grep -F 'refusing current-main install from branch DETACHED' "$RUNNER_TEMP/detached-install.log"

          if "$OI" dev adopt central "$ROOT"; then
            echo 'Central self-nesting adoption unexpectedly succeeded' >&2
            exit 1
          fi

          BAD="$RUNNER_TEMP/adopt-no-origin"
          git init -q "$BAD"
          git -C "$BAD" config user.name preflight
          git -C "$BAD" config user.email preflight@example.invalid
          printf 'sentinel\n' > "$BAD/README.md"
          git -C "$BAD" add README.md
          git -C "$BAD" commit -qm init
          if "$OI" dev adopt ai-kit "$BAD"; then
            echo 'origin-less adoption unexpectedly succeeded' >&2
            exit 1
          fi
          test -d "$BAD/.git"
          test ! -e "$ROOT/Work/ai-kit"

          LINKED="$RUNNER_TEMP/adopt-linked"
          git init -q "$LINKED"
          git -C "$LINKED" config user.name preflight
          git -C "$LINKED" config user.email preflight@example.invalid
          printf 'sentinel\n' > "$LINKED/README.md"
          git -C "$LINKED" add README.md
          git -C "$LINKED" commit -qm init
          git -C "$LINKED" worktree add -q "$RUNNER_TEMP/adopt-linked-secondary" -b secondary
          if "$OI" dev adopt workcell "$LINKED"; then
            echo 'linked-worktree adoption unexpectedly succeeded' >&2
            exit 1
          fi
          test -d "$LINKED/.git"
          test ! -e "$ROOT/Work/Workcell"
      - name: Bounded cleanup preserves human ground
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          ROOT="$RUNNER_TEMP/oi-personal-ground"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"
          "$OI" cleanup --managed
          test "$(cat "$ROOT/Control/HUMAN-SENTINEL.txt")" = "human-control-sentinel"
          test "$(cat "$ROOT/Work/WORK-SENTINEL.txt")" = "ordinary-work-sentinel"
          test -e "$OI_HOME/composition.json"
          test ! -e "$OI_DATA_HOME/bin"
          test ! -e "$OI_DATA_HOME/products"
          test ! -e "$OI_DATA_HOME/receipts"
          test ! -e "$OI_DATA_HOME/cache"
          test ! -e "$ROOT/.central/oi/managed"

  # ---------------------------------------------------- current-main source
  current-main-source:
    if: ${{ inputs.focused-development != true }}
    name: current-source / ${{ matrix.product }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: [central, actuation, ai-kit, software-factory, workcell, quaternal-logic]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test exact current native-owner source contract
        run: >-
          python3 scripts/verify-current-main-source.py
          --product '${{ matrix.product }}'
          --receipt '${{ runner.temp }}/current-main-${{ matrix.product }}.json'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-main-${{ matrix.product }}
          path: ${{ runner.temp }}/current-main-${{ matrix.product }}.json
          if-no-files-found: warn

  owner-seams:
    if: ${{ inputs.focused-development != true }}
    name: seam / ${{ matrix.seam }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        seam: [project-context-handoff, native-action-parity, journey-routine-handoff]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tests/${{ matrix.seam }}
      - name: Exercise the pinned owner seam (git dependencies on sibling revisions)
        run: cargo test --manifest-path tests/${{ matrix.seam }}/Cargo.toml

  # -------------------------------------------------------- factory proving
  factory-proving:
    if: ${{ inputs.focused-development != true }}
    name: Factory proving floor against exact owner sources
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/agent-system-design
          ref: 12a721dbbb51e3c70d52ef00220efa859ef930fd
          path: .factory-owner
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Actuation
          ref: 5eec4639f1c8727865373b27fdcde09fdcca2d53
          path: .actuation-owner
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            .factory-owner
            .actuation-owner
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema>=4.18,<5'
      - name: Exercise exact Factory owner CLI
        run: |
          python3 scripts/validate_factory_proving.py \
            --factory-source .factory-owner \
            --actuation-source .actuation-owner \
            --actuation-usage suite/factory-proving-actuation-usage.json \
            --actuation-usage-replay suite/factory-proving-actuation-usage-replay.json

  # ------------------------------------------------------- wiki owner pins
  living-wiki-w7:
    if: ${{ inputs.focused-development != true }}
    name: Living Wiki W7 pinned owner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CENTRAL_SHA: 31d54eb4a6202c89c7f60ec004654916133dea94
      AIKIT_SHA: 6b2517862faccc7787b36ef45ef8d19186fe8128
      FACTORY_SHA: ec08c99a55a6320c6f59d3c73024b5d48063a989
      QL_SHA: 9429a9fb5173f32138799046e8e2a4d7a2d86968
      QL_LIVING_ANCESTOR: 30171fb9f3646a1ef6e306357503d8a9df4a8a1c
    steps:
      - uses: actions/checkout@v4
      - name: W7 manifest names exactly these owner pins
        shell: python
        run: |
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('suite/living-wiki-w7.json').read_text())
          assert manifest['schema'] == 'oi.living-wiki-w7/v1'
          assert manifest['physical_evidence_claimed'] is False
          assert [world['id'] for world in manifest['worlds']] == ['A', 'B', 'C']
          expected = {
              'central': os.environ['CENTRAL_SHA'],
              'ai-kit': os.environ['AIKIT_SHA'],
              'software-factory': os.environ['FACTORY_SHA'],
              'quaternal-logic': os.environ['QL_SHA'],
          }
          for owner, revision in expected.items():
              assert manifest['owners'][owner]['revision'] == revision, owner
          minimal = next(world for world in manifest['worlds'] if world['id'] == 'A')
          assert any('zero automatic Agent/model invocation' in p for p in minimal['proves'])
          assert any('Contemplate implicitly' in i for i in manifest['global_invariants'])
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: ${{ env.CENTRAL_SHA }}
          path: owners/central
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: ${{ env.AIKIT_SHA }}
          path: owners/ai-kit
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/agent-system-design
          ref: ${{ env.FACTORY_SHA }}
          path: owners/factory
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: ${{ env.QL_SHA }}
          path: owners/ql
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            owners/central
            owners/ai-kit
            owners/factory
            owners/ql
      - name: Prove exact owner revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owners/central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C owners/ai-kit rev-parse HEAD)" = "$AIKIT_SHA"
          test "$(git -C owners/factory rev-parse HEAD)" = "$FACTORY_SHA"
          test "$(git -C owners/ql rev-parse HEAD)" = "$QL_SHA"
          git -C owners/ql merge-base --is-ancestor "$QL_LIVING_ANCESTOR" "$QL_SHA"
      - name: W7 A — Central source truth and deterministic horizon
        run: cargo test --manifest-path owners/central/Cargo.toml -p ctrl
      - name: W7 A/C — AIKit impact freshness, integrative reading, authored relations
        run: cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-core
      - name: W7 B — Factory software Project orientation and returned evidence
        run: cargo test --manifest-path owners/factory/Cargo.toml -p epilogos-factory
      - name: W7 C — QL Wiki refraction, Context Frame and Return preservation
        run: cargo test --manifest-path owners/ql/Cargo.toml -p ql-wiki

  authored-wiki-w8:
    if: ${{ inputs.focused-development != true }}
    name: Authored Wiki relations W8 pinned owner contracts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CENTRAL_SHA: 31d54eb4a6202c89c7f60ec004654916133dea94
      AIKIT_SHA: 6b2517862faccc7787b36ef45ef8d19186fe8128
      FACTORY_SHA: 0731d654eab9357323f603f306332d3b7e0e71cb
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: ${{ env.CENTRAL_SHA }}
          path: owners/central
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: ${{ env.AIKIT_SHA }}
          path: owners/ai-kit
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/agent-system-design
          ref: ${{ env.FACTORY_SHA }}
          path: owners/factory
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            owners/central
            owners/ai-kit
            owners/factory
      - name: Prove exact native owner revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C owners/central rev-parse HEAD)" = "$CENTRAL_SHA"
          test "$(git -C owners/ai-kit rev-parse HEAD)" = "$AIKIT_SHA"
          test "$(git -C owners/factory rev-parse HEAD)" = "$FACTORY_SHA"
      - name: Central — stable Flow/source identity, retained placement and revision authority
        run: cargo test --manifest-path owners/central/Cargo.toml -p ctrl
      - name: AIKit — authored relation and property adapters
        shell: bash
        run: |
          set -euo pipefail
          for case in \
            plain_markdown_and_optional_okf_properties_join_on \
            non_okf_frontmatter_does_not_capture_other_tools_m \
            compilation_resolves_to_existing_wiki_and_rebuild_ \
            source_revision_changes_edge_revision_but_not_stab \
            unresolved_relation_survives_without_synthetic_gra \
            unresolved_only_source_is_still_a_valid_relation_f \
            consumer_gets_resolved_backlink_capable_view_and_p \
            flow_subject_can_be_external_endpoint_without_beco \
            explicit_relation_origin_does_not_overwrite_agent_ \
            authored_relations_feed_existing_living_knowledge_ \
            authored_properties_revision_change_enters_existin \
            projectcentral_retained_markdown_rebuilds_into_exi \
            source_revision_change_rebuilds_relation_revision_; do
            cargo test --manifest-path owners/ai-kit/Cargo.toml -p aikit-adapters "$case"
          done
      - name: Factory — software Project orientation with authored relations
        run: cargo test --manifest-path owners/factory/Cargo.toml -p epilogos-factory

  # --------------------------------------------------- development field
  development-field-native:
    if: ${{ inputs.focused-development != true }}
    name: D / ${{ matrix.owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        owner: [oi, central, actuation, ai-kit, software-factory, workcell, quaternal-logic]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Factory native validator dependency
        if: matrix.owner == 'software-factory'
        run: python3 -m pip install 'jsonschema==4.25.1'
      - name: Check out exact native owner and record live-main observation
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/development-field-ci.py prepare
          --owner '${{ matrix.owner }}'
          --source '${{ runner.temp }}/owner-source'
          --out '${{ runner.temp }}/evidence'
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: development-field-${{ matrix.owner }}
          cache-on-failure: true
          # O:I's standalone workspace is cli/; every other owner's is root.
          workspaces: ${{ runner.temp }}/owner-source${{ matrix.owner == 'oi' && '/cli' || '' }} -> target
      - name: Run the tested owner's native deterministic contract
        run: >-
          python3 scripts/development-field-ci.py native
          --owner '${{ matrix.owner }}'
          --source '${{ runner.temp }}/owner-source'
          --out '${{ runner.temp }}/evidence'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-field-D-${{ matrix.owner }}
          path: |
            ${{ runner.temp }}/evidence/*.json
            ${{ runner.temp }}/evidence/*.log
          if-no-files-found: error

  development-field-conformance:
    if: ${{ inputs.focused-development != true }}
    name: Development Field native-owner conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One exact source cut for every participating owner
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/development-field-conformance.py prepare --out "$RUNNER_TEMP/development-field"
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: development-field-conformance
          cache-on-failure: true
          workspaces: |
            tests/development-field/probe
            .development-field-owners/oi/cli
            .development-field-owners/central
            .development-field-owners/ai-kit
            .development-field-owners/software-factory
            .development-field-owners/workcell
            .development-field-owners/quaternal-logic
      - name: Native authored provenance and once-observed source snapshot conformance
        id: source_snapshot
        shell: bash
        run: |
          set -euo pipefail
          export DF_SNAPSHOT_EVIDENCE="$RUNNER_TEMP/development-field/source-snapshot.json"
          export DF_CUT_SHA256="$(sha256sum tests/development-field/cut.json | cut -d' ' -f1)"
          cargo test --manifest-path tests/development-field/probe/Cargo.toml --locked --test source_snapshot -- --nocapture 2>&1 | tee "$RUNNER_TEMP/development-field/source-snapshot.log"
      - name: Bounded Central → QL carrier → AIKit → Workcell → Actuation → Factory specimen
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: probe
        run: python3 scripts/development-field-conformance.py probe --out "$RUNNER_TEMP/development-field"
      - name: Exact source-built six-product O:I dispatch with poisoned PATH
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: dispatch
        run: python3 scripts/development-field-conformance.py dispatch --out "$RUNNER_TEMP/development-field"
      - name: Accepted S3 same-specimen native Central, QL carrier, packet and CLI parity
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' && steps.probe.outcome == 'success' }}
        id: s3
        run: python3 scripts/development-field-s3.py --out "$RUNNER_TEMP/development-field"
      - name: Native S0 exact-source catalogue adoption and suite activation
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' }}
        id: activation
        run: python3 scripts/development-field-activation.py --out "$RUNNER_TEMP/development-field"
      - name: Native S0 whole-suite lifecycle (repair and rollback)
        if: ${{ !cancelled() && steps.activation.outcome == 'success' }}
        id: lifecycle
        run: python3 scripts/development-field-lifecycle.py --out "$RUNNER_TEMP/development-field"
      - name: Execute native integrations excluded from owner unit lanes
        if: ${{ !cancelled() && steps.dispatch.outcome == 'success' }}
        id: bridges
        run: python3 scripts/development-field-native-bridges.py --out "$RUNNER_TEMP/development-field"
      - name: Whole Development Field completion gate
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        id: whole_gate
        run: python3 scripts/development-field-whole-gate.py --out "$RUNNER_TEMP/development-field"
      - name: Explain actual failure versus blocked downstream proof
        if: ${{ !cancelled() }}
        env:
          DF_STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 scripts/development-field-ci-status.py --out "$RUNNER_TEMP/development-field"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: development-field-conformance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/development-field
            tests/development-field/probe/Cargo.lock
          if-no-files-found: error

  # ------------------------------------------- collection native source proof
  # Folded here from the retired collection-source-identity.yml: it checks out
  # and builds a pinned sibling (Central), so it belongs on the weekly
  # sibling-backed path, not a per-PR surface workflow. The consumer half of
  # that workflow moved into desktop.yml; this half keeps the exact-cut native
  # source, collection CAS/restart and saved-Expression proof.
  collection-native:
    if: ${{ inputs.focused-development != true }}
    name: Collection native source identity, CAS and restart against exact Central
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: 12ee31313e710378845baae190efc1a4b3e7ebdb
          path: native-central
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build actual Central and kernel; preserve native regression suite
        run: |
          cargo build --locked --manifest-path native-central/Cargo.toml -p ctrl
          cargo build --locked --manifest-path desktop/cradle/kernel/Cargo.toml --bin walk-bridge
          cargo build --locked --manifest-path cli/Cargo.toml --bin oi
          cargo test --locked --manifest-path desktop/cradle/kernel/Cargo.toml --test expression --test expression_substrate --test expression_world
      - name: Real native source, collection CAS, saved Expression and restart
        working-directory: desktop/cradle
        env:
          CENTRAL_SOURCE_SHA: 12ee31313e710378845baae190efc1a4b3e7ebdb
        run: |
          export OI_BIN="$GITHUB_WORKSPACE/cli/target/debug/oi"
          export OI_CENTRAL_CTRL_BIN="$GITHUB_WORKSPACE/native-central/target/debug/ctrl"
          export OI_COLLECTION_BRIDGE_BIN="$GITHUB_WORKSPACE/desktop/cradle/kernel/target/debug/walk-bridge"
          export OI_SOURCE_SHA="$(git rev-parse HEAD)"
          node --experimental-strip-types --import ./tests/ts-register.mjs tests/collection-native-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-native-evidence-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/collection-source/
          if-no-files-found: warn
