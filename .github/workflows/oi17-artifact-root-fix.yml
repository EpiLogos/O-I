name: OI17 artifact-root fix

on:
  push:
    branches: [converge/oi-017-first-suite]
    paths:
      - '.github/workflows/oi17-artifact-root-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - name: Align registrations with extracted artifact roots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('cli/src/suite_v2.rs')
          text = path.read_text()
          replacements = [
              (
                  '    let attestation_locally_verified = verify_github_attestation_if_available(&archive, product)?;',
                  '''    let attestation_locally_verified = match receipt.products.get(&product.id) {\n        Some(previous)\n            if previous.revision == product.revision\n                && previous.sha256 == asset.sha256\n                && previous.attestation_locally_verified => true,\n        _ => verify_github_attestation_if_available(&archive, product)?,\n    };'''
              ),
              (
                  '''    let executable = if let Some(entry) = product.artifact.entry.as_deref() {''',
                  '''    let material_root = {\n        let mut roots = fs::read_dir(&product_root)\n            .map_err(|error| format!("cannot inspect managed product root {}: {error}", product_root.display()))?\n            .filter_map(Result::ok)\n            .map(|entry| entry.path())\n            .filter(|path| path.is_dir());\n        let root = roots.next().ok_or_else(|| format!("{} artifact did not unpack to a material root", product.id))?;\n        if roots.next().is_some() {\n            return Err(format!("{} artifact unpacked to multiple material roots; refusing ambiguous registration", product.id));\n        }\n        root\n    };\n\n    let executable = if let Some(entry) = product.artifact.entry.as_deref() {'''
              ),
              (
                  '    let registration = registration_for(surface, executable.clone(), Some(product_root.clone()), Some(product.revision.clone()))?;',
                  '    let registration = registration_for(surface, executable.clone(), Some(material_root.clone()), Some(product.revision.clone()))?;'
              ),
              (
                  '        root: product_root.display().to_string(),',
                  '        root: material_root.display().to_string(),'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected suite_v2.rs fragment missing:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'oi17-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cli/src/suite_v2.rs
          git diff --cached --check
          git commit -m 'fix(suite): register extracted material roots and reuse provenance proof'
          git push origin HEAD:converge/oi-017-first-suite
