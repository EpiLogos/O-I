name: P2 Project field bootstrap

on:
  push:
    branches:
      - agent/oi-desktop-p2-project-field-106

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/oi-desktop-p2-project-field-106
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind Project field into native host
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('desktop/src-tauri/src/main.rs')
          text = main.read_text()
          if not text.startswith('mod project_field;\n'):
              text = 'mod project_field;\n\n' + text
          tauri_use = 'use tauri::State;\n'
          project_use = '''use project_field::{\n    project_field_snapshot, project_owner_action, project_reflection, project_source_explain,\n    project_source_read, project_source_search, ProjectFieldState,\n};\n'''
          if project_use not in text:
              text = text.replace(tauri_use, tauri_use + project_use, 1)
          manage_anchor = '        })\n        .invoke_handler(tauri::generate_handler!['
          manage_replacement = '        })\n        .manage(ProjectFieldState::load())\n        .invoke_handler(tauri::generate_handler!['
          if manage_replacement not in text:
              if manage_anchor not in text:
                  raise SystemExit('native host manage anchor missing')
              text = text.replace(manage_anchor, manage_replacement, 1)
          handler_anchor = '            knowledge_history,\n            select_semantic_ref,'
          handler_replacement = '''            knowledge_history,\n            project_field_snapshot,\n            project_source_search,\n            project_source_read,\n            project_source_explain,\n            project_reflection,\n            project_owner_action,\n            select_semantic_ref,'''
          if handler_replacement not in text:
              if handler_anchor not in text:
                  raise SystemExit('native host handler anchor missing')
              text = text.replace(handler_anchor, handler_replacement, 1)
          main.write_text(text)

          ui = Path('desktop/ui/src/main.tsx')
          text = ui.read_text()
          workbench_import = "import { WorkbenchEvidence, WorkbenchSemanticRef, WorkbenchSurface } from './workbench';\n"
          project_import = "import { ProjectFieldCanvas, ProjectNavigator } from './project-field';\n"
          if project_import not in text:
              text = text.replace(workbench_import, workbench_import + project_import, 1)

          old_nav_call = '<NavigatorHost surfaces={surfaces} snapshot={snapshot} contributions={contributions} />'
          new_nav_call = '<NavigatorHost surfaces={surfaces} snapshot={snapshot} contributions={contributions} onSelect={selectWorkbenchRef} />'
          text = text.replace(old_nav_call, new_nav_call, 1)

          old_surface_props = '''          factoryBuild={factoryBuild}\n          onSelect={selectWorkbenchRef}'''
          new_surface_props = '''          factoryBuild={factoryBuild}\n          selection={snapshot.selection}\n          onSelect={selectWorkbenchRef}'''
          text = text.replace(old_surface_props, new_surface_props, 1)

          old_nav_sig = '''function NavigatorHost({\n  surfaces,\n  snapshot,\n  contributions,\n}: {\n  surfaces: HostSurfaceDescriptor[];\n  snapshot: Snapshot;\n  contributions: Contribution[];\n}) {\n  return (\n    <div className="oi-p1-navigator">\n      <p className="oi-eyebrow">Host contract</p>\n      <p className="oi-muted">P1 exposes placement and shared focus only. Project/files/Ground/Knowledge navigation belongs to #106.</p>'''
          new_nav_sig = '''function NavigatorHost({\n  surfaces,\n  snapshot,\n  contributions,\n  onSelect,\n}: {\n  surfaces: HostSurfaceDescriptor[];\n  snapshot: Snapshot;\n  contributions: Contribution[];\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;\n}) {\n  return (\n    <div className="oi-p1-navigator">\n      <ProjectNavigator selection={snapshot.selection} onSelect={onSelect} />\n      <details>\n        <summary>Host contract</summary>\n        <p className="oi-muted">The Navigator composes native Project refs/readings; placement and shared semantic selection remain O:I host state.</p>'''
          if new_nav_sig not in text:
              if old_nav_sig not in text:
                  raise SystemExit('NavigatorHost anchor missing')
              text = text.replace(old_nav_sig, new_nav_sig, 1)
              contribution_block = '''      <div className="oi-workbench__relations">\n        <strong>Native contributions</strong>\n        {contributions.map((entry) => (\n          <span key={entry.contribution.contribution_ref}>\n            {entry.contribution.native_owner} · {entry.contribution.availability}\n          </span>\n        ))}\n      </div>\n    </div>'''
              replacement_block = contribution_block.replace('    </div>', '      </details>\n    </div>', 1)
              if contribution_block not in text:
                  raise SystemExit('NavigatorHost close anchor missing')
              text = text.replace(contribution_block, replacement_block, 1)

          old_root_sig = '''  contributions,\n  factoryBuild,\n  onSelect,'''
          new_root_sig = '''  contributions,\n  factoryBuild,\n  selection,\n  onSelect,'''
          text = text.replace(old_root_sig, new_root_sig, 1)
          old_root_type = '''  contributions: Contribution[];\n  factoryBuild: FactoryBuildSnapshot | null;\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;'''
          new_root_type = '''  contributions: Contribution[];\n  factoryBuild: FactoryBuildSnapshot | null;\n  selection?: WorkbenchSemanticRef;\n  onSelect: (subject: WorkbenchSemanticRef, evidence: WorkbenchEvidence) => Promise<void>;'''
          text = text.replace(old_root_type, new_root_type, 1)
          home_anchor = '        <WorkbenchSurface onSelect={onSelect} />'
          home_replacement = '''        <ProjectFieldCanvas selection={selection} onSelect={onSelect} />\n        <WorkbenchSurface onSelect={onSelect} />'''
          if home_replacement not in text:
              if home_anchor not in text:
                  raise SystemExit('home Canvas anchor missing')
              text = text.replace(home_anchor, home_replacement, 1)
          ui.write_text(text)
          PY

      - name: Refresh native shell lock against accepted AIKit
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

      - name: Format Rust changes
        run: |
          cargo fmt --manifest-path desktop/core/Cargo.toml
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml

      - name: Remove one-shot bootstrap workflow
        run: rm .github/workflows/p2-project-field-bootstrap.yml

      - name: Commit generated host integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/src/main.rs desktop/src-tauri/Cargo.lock desktop/src-tauri/src/project_field.rs desktop/core desktop/ui/src/main.tsx .github/workflows/p2-project-field-bootstrap.yml
          git diff --cached --check
          git commit -m 'Integrate P2 Project field host'
          git push origin HEAD:agent/oi-desktop-p2-project-field-106
