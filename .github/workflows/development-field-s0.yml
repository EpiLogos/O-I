name: Development Field S0

on:
  pull_request:
    paths:
      - "cli/**"
      - "suite/channels.json"
      - "suite/native-protocol.json"
      - "suite/development-field-s0-impact.json"
      - "suite/mainline.json"
      - "suite/manifest.json"
      - "surfaces.json"
      - "packages/**"
      - "schemas/**"
      - "scripts/verify-development-field-s0.py"
      - ".github/workflows/development-field-s0.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "suite/channels.json"
      - "suite/native-protocol.json"
      - "suite/development-field-s0-impact.json"
      - "suite/mainline.json"
      - "suite/manifest.json"
      - "surfaces.json"
      - "packages/**"
      - "schemas/**"
      - "scripts/verify-development-field-s0.py"
      - ".github/workflows/development-field-s0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli

      - name: Static protocol/package/suite conformance
        run: python3 scripts/verify-development-field-s0.py

      - name: Rust format
        run: cargo fmt --manifest-path cli/Cargo.toml --all -- --check

      - name: Rust tests
        run: cargo test --manifest-path cli/Cargo.toml --locked

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings

      - name: S0 command surface fails closed before activation
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"

          "$OI" protocol --json | jq -e '.protocol == "1.0"'
          "$OI" suite status --json | jq -e '.selected_channel == "mainline" and .active == null and .historical_manifest_authority == false'
          "$OI" suite check --json | jq -e '.ok == true and .active_receipt == null'
          "$OI" suite channel source
          "$OI" suite channel --json | jq -e '.channel == "source"'

          if "$OI" suite update >"$RUNNER_TEMP/source-update.log" 2>&1; then
            echo "source update unexpectedly activated without six developer-source registrations" >&2
            exit 1
          fi
          grep -F "source suite requires all six current developer registrations" "$RUNNER_TEMP/source-update.log"

          "$OI" suite channel mainline
          if "$OI" suite update >"$RUNNER_TEMP/mainline-update.log" 2>&1; then
            echo "mainline update unexpectedly borrowed an unmaterialised or historical candidate" >&2
            exit 1
          fi
          grep -F "Historical suite/manifest.json is evidence-only" "$RUNNER_TEMP/mainline-update.log"

          "$OI" where central --json | jq -e '.product == "central" and .authority == "legacy-fallback-no-active-receipt"'
