name: OI173 branch formatter

on:
  push:
    branches:
      - feat/oi173-adapter-driven-world-recognition

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oi173-adapter-driven-world-recognition
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source and return it to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path cli/Cargo.toml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cli/src
          git commit -m "[OI173] Apply cargo fmt"
          git push origin HEAD:feat/oi173-adapter-driven-world-recognition
