name: Wiki source reconciliation
on:
  push:
    branches: ['agent/wiki-constellation-loop-20260920']
    paths: ['.github/workflows/wiki-source-reconcile.yml', 'scripts/wiki-constructive-*.json', 'scripts/wiki-constructive-*.py']
permissions:
  contents: write
concurrency:
  group: wiki-source-reconcile
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/agent/wiki-constellation-loop-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply the independently tested, content-addressed source edits
        run: python3 scripts/wiki-constructive-apply.py
      - name: Verify the real TypeScript application and focused regression tests
        working-directory: desktop/cradle
        run: |
          npm ci
          npx tsc --noEmit
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/wiki-*.test.mjs
      - name: Commit reviewed source and retire this one-time transport
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/wiki-constellation-loop-20260920 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/cradle/src/knowledge desktop/cradle/kernel/src/construction.rs desktop/cradle/kernel/src/graph.rs desktop/cradle/tests/wiki-graph-filters.test.mjs
          git rm .github/workflows/wiki-source-reconcile.yml scripts/wiki-constructive-apply.py scripts/wiki-constructive-edits.json
          git commit -m 'feat(wiki): connect exact passage authoring, native formations and recoverable Expression Return'
          git push origin HEAD:refs/heads/agent/wiki-constellation-loop-20260920
          git rev-parse HEAD
