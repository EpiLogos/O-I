name: Wiki source reconciliation
on:
  push:
    branches: ['agent/wiki-constellation-loop-20260920']
    paths: ['.github/workflows/wiki-source-reconcile.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the exact published integration inputs
        env:
          WIKI_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/wiki-source
          git cat-file -e 178e135025c726cb4fa0b26eef93a5ed2affb741^{commit}
          git cat-file -e da78da7a98b17e5f0f82f50d44c538650ebc88fc^{commit}
          git branch wiki-source "$WIKI_HEAD"
          git branch published-main 178e135025c726cb4fa0b26eef93a5ed2affb741
          git branch techne-source da78da7a98b17e5f0f82f50d44c538650ebc88fc
          git bundle create /tmp/wiki-source/oi.bundle wiki-source published-main techne-source
          git rev-parse wiki-source published-main techne-source > /tmp/wiki-source/revisions.txt
          sha256sum /tmp/wiki-source/oi.bundle > /tmp/wiki-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wiki-source-${{ github.run_id }}
          path: /tmp/wiki-source/
          retention-days: 7
