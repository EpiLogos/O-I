name: O:I release artifacts

# Builds and attests the pre-local artifacts from main after verify.yml has
# gated the merge: the `oi` bootstrap binary per target, the npm package and
# the Apple Silicon desktop bundle. Nothing here re-runs the gate.

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'suite/manifest.json'
      - 'packages/oi-cli/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Build locked O:I bootstrap
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target '${{ matrix.target }}' --bin oi
      - name: Package exact-SHA pre-local artifact
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          name="oi-prelocal-${short_sha}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "cli/target/${{ matrix.target }}/release/oi" "dist/$name/oi"
          cp suite/manifest.json "dist/$name/suite-build-record.json"
          echo "$GITHUB_SHA" > "dist/$name/COMMIT"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: oi-prelocal-${{ github.sha }}-${{ matrix.target }}
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.sha256

  npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify npm distribution package
        working-directory: packages/oi-cli
        run: npm test
      - name: Pack npm distribution artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack ./packages/oi-cli --pack-destination dist
          for archive in dist/*.tgz; do
            sha256sum "$archive" > "$archive.sha256"
          done
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: oi-npm-prelocal-${{ github.sha }}
          retention-days: 14
          path: |
            dist/*.tgz
            dist/*.sha256

  desktop-bundle:
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Install locked cradle graph
        run: npm ci --prefix desktop/cradle --no-audit --no-fund
      - name: Build Apple Silicon Tauri app bundle
        shell: bash
        run: |
          set -euo pipefail
          cd desktop/cradle/src-tauri
          ../node_modules/.bin/tauri build --bundles app --target aarch64-apple-darwin
      - name: Prove build did not rewrite locks
        run: git diff --exit-code -- desktop/cradle/src-tauri/Cargo.lock desktop/cradle/package-lock.json
      - name: Package exact-SHA desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir='desktop/cradle/src-tauri/target/aarch64-apple-darwin/release/bundle/macos'
          app="$(find "$bundle_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          short_sha="${GITHUB_SHA:0:12}"
          mkdir -p dist
          archive="dist/oi-desktop-prelocal-${short_sha}-aarch64-apple-darwin.app.tar.gz"
          tar -C "$(dirname "$app")" -czf "$archive" "$(basename "$app")"
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: oi-desktop-prelocal-${{ github.sha }}-aarch64-apple-darwin
          retention-days: 14
          path: |
            dist/*.tar.gz
            dist/*.sha256
