name: Configuration setup and recovery
# The legacy everyday desktop is frozen while its replacement (the candidate
# shell, packages/live-shell) is built, so this workflow no longer runs on pull
# requests or pushes. desktop.yml gates the replacement; any of these tests
# that reaches a file the candidate imports runs there in the shared engine
# suite (packages/live-shell/ui/scripts/test-engine.mjs). Dispatch to run it.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: configuration-setup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controlled-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/cradle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-setup.test.mjs
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium webkit
      - run: node walk/configuration-setup.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configuration-setup-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/configuration-setup
          if-no-files-found: warn
