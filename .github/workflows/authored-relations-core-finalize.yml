name: Authored relations core finalize

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expose owner-native authored edge evidence beside the shared read model
        shell: python
        run: |
          from pathlib import Path
          path = Path('desktop/core/src/project_knowledge.rs')
          text = path.read_text()
          old = '''pub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredWikiSubjectRelations>,\n}'''
          new = '''pub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredWikiSubjectRelations>,\n    /// Exact AIKit-owned authored WikiEdges incident on this source subject.\n    /// These retain source/revision/token/channel/anchor provenance for Explain\n    /// without creating a desktop relation or provenance schema.\n    #[serde(default, skip_serializing_if = "Vec::is_empty")]\n    pub authored_edges: Vec<aikit_core::WikiEdge>,\n}'''
          if old not in text:
              raise SystemExit('ProjectSourceRelations shape not found')
          text = text.replace(old, new)
          old = '''            return Ok(ProjectRelations::Source(Box::new(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n            })));'''
          new = '''            return Ok(ProjectRelations::Source(Box::new(ProjectSourceRelations {\n                reflection,\n                authored: self.authored_relations(raw_resource)?,\n                authored_edges: self.authored_edges(raw_resource),\n            })));'''
          if old not in text:
              raise SystemExit('ProjectSourceRelations construction not found')
          text = text.replace(old, new)
          marker = '''    /// Shared authored relation/backlink/pending read over AIKit-owned state. The\n    /// renderer never sees source bytes and never reparses Markdown/OKF.\n    pub fn authored_relations('''
          method = '''    /// Exact provenance-bearing authored edges for the selected source subject.\n    /// The compilation remains AIKit-owned and rebuildable; O:I only returns the\n    /// already-materialised owner objects needed by presentation/Explain.\n    fn authored_edges(&self, raw_resource: &str) -> Vec<aikit_core::WikiEdge> {\n        let Some(source) = self.authored_sources.iter().find(|source| {\n            source.source_ref.as_str() == raw_resource || source.subject_ref.as_str() == raw_resource\n        }) else {\n            return Vec::new();\n        };\n        self.authored_compilation\n            .edges\n            .iter()\n            .filter(|edge| edge.from_ref == source.subject_ref || edge.to_ref == source.subject_ref)\n            .cloned()\n            .collect()\n    }\n\n'''
          if marker not in text:
              raise SystemExit('authored_relations marker not found')
          text = text.replace(marker, method + marker)
          path.write_text(text)
      - name: Prove core and authored consumer surface
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          node --test desktop/ui/src/authored-relations.test.mjs
          node --test site/authored-relation-projection.test.mjs
          git diff --check
      - name: Commit only product state
        shell: bash
        run: |
          set -euo pipefail
          git add desktop/core/src/project_knowledge.rs
          if git diff --cached --quiet; then
            echo 'Authored edge evidence transport already committed.'
            exit 0
          fi
          git config user.name 'EpiLogos automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[OI-WIKI-RELATIONS] Expose exact authored edge evidence'
          git push origin HEAD:feat/authored-wiki-relations-150
