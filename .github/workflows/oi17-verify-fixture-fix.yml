name: OI17 verify fixture fix

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - scripts/oi17_verify_fixture_fix.py
      - .github/workflows/oi17-verify-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - run: python scripts/oi17_verify_fixture_fix.py
      - name: Commit repair
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/verify.yml
          git diff --cached --check
          git commit -m 'test(verify): assert accepted Central lifecycle revision'
          git push origin HEAD:converge/oi-017-first-suite
