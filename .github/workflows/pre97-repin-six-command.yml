name: PRE97 exact six-owner command repin

on:
  push:
    branches:
      - converge/pre97-six-product-command-current-main

permissions:
  contents: write

jobs:
  repin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repin accepted owner mains
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pins = {
              "central": "0b636d1fa52f625451fb94a1dc86d589117b76bd",
              "actuation": "7895fa05d87cb1f1ba121ba4f91b64a52484d212",
              "ai-kit": "81ab25ce319453d3549a4e37280ba1ddd38613dd",
              "software-factory": "7e8fadea5156d75eb872f55f4fd4938d47fb0648",
              "workcell": "25792dc3aa8e4c54088c0696cee00f8efefe03ad",
              "quaternal-logic": "db2b15987c9d99b2a0008cfe75c95f9df1c44715",
          }

          surfaces_path = Path("surfaces.json")
          surfaces = json.loads(surfaces_path.read_text())
          assert {x["id"] for x in surfaces["surfaces"]} == set(pins)
          for surface in surfaces["surfaces"]:
              rev = pins[surface["id"]]
              surface["docs_ref"] = rev
              surface["native"]["command_revision"] = rev
              surface["native"]["command_standing"] = "accepted-main"
              surface["install"]["ref"] = rev
              surface["install"]["revision"] = rev
          surfaces["verified_at"] = "2026-09-03"
          surfaces_path.write_text(json.dumps(surfaces, indent=2) + "\n")

          mainline_path = Path("suite/mainline.json")
          mainline = json.loads(mainline_path.read_text())
          assert {x["id"] for x in mainline["products"]} == set(pins)
          for product in mainline["products"]:
              product["revision"] = pins[product["id"]]
          mainline["observed_at"] = "2026-09-03"
          ql = next(x for x in mainline["products"] if x["id"] == "quaternal-logic")
          assert ql["state"] == "parallel-native-owner-exception"
          ql["note"] = (
              "This deterministic command cut records the current accepted Quaternal Logic native owner main so the six-product command field is exact. "
              "QL-MEF remains the separately owned moving research field: later QL/Epi movement does not become a primary #97 convergence gate unless an accepted O:I consumer explicitly requires it."
          )
          mainline_path.write_text(json.dumps(mainline, indent=2) + "\n")

          surface_revs = {x["id"]: x["native"]["command_revision"] for x in surfaces["surfaces"]}
          mainline_revs = {x["id"]: x["revision"] for x in mainline["products"]}
          assert surface_revs == pins == mainline_revs
          PY
      - name: Remove temporary repin workflow
        run: rm .github/workflows/pre97-repin-six-command.yml
      - name: Commit durable catalogue
        run: |
          git config user.name Epii
          git config user.email frank.g.taylor97@gmail.com
          git add surfaces.json suite/mainline.json .github/workflows/pre97-repin-six-command.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/pre97-repin-six-command.yml suite/mainline.json surfaces.json "
          git commit -m "[PRE97] Pin six-product command field to accepted owner mains"
          git push origin HEAD:converge/pre97-six-product-command-current-main
