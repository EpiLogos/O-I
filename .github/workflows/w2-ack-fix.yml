name: W2 native acknowledgement repair
on:
  push:
    branches: [agent/w2-central-day-source-20260920]
    paths: ['.github/workflows/w2-ack-fix.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        working-directory: desktop/cradle
        run: npm ci
      - name: Preserve pre-repair failing ordering cases
        continue-on-error: true
        working-directory: desktop/cradle
        run: |
          mkdir -p "$RUNNER_TEMP/w2-ack"
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/central-save-order.test.mjs 2>&1 | tee "$RUNNER_TEMP/w2-ack/before.log"
      - name: Apply exact scoped source repair and remove temporary publishers
        run: |
          test "$GITHUB_REF" = refs/heads/agent/w2-central-day-source-20260920
          python3 .github/w2-ack-fix.py
          git diff --check
          git add desktop/cradle/src/central/dayForm.ts desktop/cradle/kernel/src/flow.rs
          git rm .github/w2-ack-fix.py .github/workflows/w2-ack-fix.yml .github/workflows/w2-source-recovery.yml
          git -c user.name='EpiLogos W2' -c user.email='186434782+EpiLogos@users.noreply.github.com' commit -m 'fix(central): compare native JSON values rather than serializer order on Day Save'
          git push origin HEAD:refs/heads/agent/w2-central-day-source-20260920
          git rev-parse HEAD > "$RUNNER_TEMP/w2-ack/source-revision.txt"
      - name: Same unchanged regressions after repair
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/central-ground.test.mjs tests/central-save-order.test.mjs 2>&1 | tee "$RUNNER_TEMP/w2-ack/after.log"
      - name: All repository Node behaviour
        if: always()
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/w2-ack/all-node.log"
      - name: Production build
        if: always()
        working-directory: desktop/cradle
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/w2-ack/build.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-ack-repair
          path: ${{ runner.temp }}/w2-ack
          retention-days: 7
