name: Wiki relations product finalize

on:
  push:
    branches:
      - feat/authored-wiki-relations-150

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/authored-wiki-relations-150
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded #150 consumer closure
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Core: wrap accepted AIKit relation state with exact owner edge evidence,
          # and compile ephemeral Flow body relations from Central owner identity.
          p = Path('desktop/core/src/project_knowledge.rs')
          text = p.read_text()
          text = text.replace('use std::path::Path;\n', 'use std::collections::BTreeSet;\nuse std::path::Path;\n', 1)
          text = text.replace(
              '    compile_authored_wiki_relations, projectcentral_authored_wiki,\n    rebuild_semantic_wiki_with_authored_relations, AuthoredWikiRelationCompilation,\n',
              '    compile_authored_wiki_relations, parse_authored_wiki_source_with_authority,\n    projectcentral_authored_wiki, rebuild_semantic_wiki_with_authored_relations,\n    AuthoredWikiRelationCompilation,\n',
              1,
          )
          text = text.replace(
              'use aikit_core::model_runtime::ModelRuntimeReadModel;\n',
              'use aikit_core::knowledge_wiki::{WikiEdge, WikiEdgeOrigin};\nuse aikit_core::model_runtime::ModelRuntimeReadModel;\n',
              1,
          )
          text = text.replace(
              '    ProjectCentralBinding, ProjectReflectionReadModel, QlRefractionRequest, ResourceRef,\n    Result as AikitResult, SemanticWikiIndex, SemanticWikiProvider, WikiObject,\n',
              '    ProjectCentralBinding, ProjectReflectionReadModel, QlRefractionRequest, ResourceRef,\n    Result as AikitResult, SemanticWikiIndex, SemanticWikiProvider, SourceAuthority, SourceRef,\n    SourceRevision, WikiObject,\n',
              1,
          )
          text = text.replace(
              '#[derive(Debug, Serialize)]\npub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredWikiSubjectRelations>,\n}\n',
              '#[derive(Debug, Clone, Serialize)]\npub struct AuthoredRelationsDesktopReading {\n    #[serde(flatten)]\n    pub relations: AuthoredWikiSubjectRelations,\n    #[serde(default)]\n    pub resolved_evidence: Vec<WikiEdge>,\n}\n\n#[derive(Debug, Serialize)]\npub struct ProjectSourceRelations {\n    #[serde(flatten)]\n    pub reflection: ProjectReflectionReadModel,\n    #[serde(skip_serializing_if = "Option::is_none")]\n    pub authored: Option<AuthoredRelationsDesktopReading>,\n}\n',
              1,
          )
          old = '''    pub fn authored_relations(\n        &self,\n        raw_resource: &str,\n    ) -> AikitResult<Option<AuthoredWikiSubjectRelations>> {\n        let Some(source) = self.authored_sources.iter().find(|source| {\n            source.source_ref.as_str() == raw_resource || source.subject_ref.as_str() == raw_resource\n        }) else {\n            return Ok(None);\n        };\n        let label = source\n            .title\n            .clone()\n            .or_else(|| source.locators.first().cloned())\n            .unwrap_or_else(|| source.subject_ref.to_string());\n        authored_wiki_subject_relations(\n            &self.index,\n            &self.authored_compilation,\n            source.subject_ref.clone(),\n            ResourceKind::KnowledgeSource,\n            label,\n        )\n        .map(Some)\n    }\n'''
          new = '''    pub fn authored_relations(\n        &self,\n        raw_resource: &str,\n    ) -> AikitResult<Option<AuthoredRelationsDesktopReading>> {\n        let Some(source) = self.authored_sources.iter().find(|source| {\n            source.source_ref.as_str() == raw_resource || source.subject_ref.as_str() == raw_resource\n        }) else {\n            return Ok(None);\n        };\n        let label = source\n            .title\n            .clone()\n            .or_else(|| source.locators.first().cloned())\n            .unwrap_or_else(|| source.subject_ref.to_string());\n        authored_relation_desktop_read(\n            &self.index,\n            &self.authored_compilation,\n            source.subject_ref.clone(),\n            ResourceKind::KnowledgeSource,\n            label,\n        )\n        .map(Some)\n    }\n\n    /// Deterministic relation reading for a Central-owned Flow source. The Flow\n    /// stays a FlowRef/SourceRef; O:I supplies owner identity/revision/body to the\n    /// accepted AIKit source interpreter and returns its shared relation state.\n    /// No AgentSession, model runtime or Contemplate path is touched here.\n    pub fn flow_authored_relations(\n        &self,\n        flow_ref: &str,\n        source_ref: &str,\n        source_revision: &str,\n        source_locator: &str,\n        source_authority: SourceAuthority,\n        body: &str,\n    ) -> AikitResult<AuthoredRelationsDesktopReading> {\n        let subject_ref = ResourceRef::parse(flow_ref)?;\n        let source = parse_authored_wiki_source_with_authority(\n            subject_ref.clone(),\n            SourceRef::parse(source_ref)?,\n            source_authority,\n            Some(SourceRevision::parse(source_revision)?),\n            vec![source_locator.to_owned()],\n            body,\n        )?;\n\n        // Rebuild from the same canonical/adopted Wiki objects plus source\n        // projections. Remove only the already-derived authored edges first so\n        // this ephemeral read proves source-before-index recovery rather than\n        // layering a second backlink graph over the current one.\n        let authored_edge_refs = self\n            .authored_compilation\n            .edges\n            .iter()\n            .map(|edge| edge.ref_id.clone())\n            .collect::<BTreeSet<_>>();\n        let base_objects = self\n            .wiki_objects()\n            .into_iter()\n            .filter(|object| !authored_edge_refs.contains(object.ref_id()))\n            .collect::<Vec<_>>();\n        let mut sources = self.authored_sources.clone();\n        sources.push(source);\n        let compilation = compile_authored_wiki_relations(&sources, &base_objects, &[])?;\n        let index = rebuild_semantic_wiki_with_authored_relations(&base_objects, &compilation)?;\n        authored_relation_desktop_read(\n            &index,\n            &compilation,\n            subject_ref,\n            ResourceKind::KnowledgeSource,\n            source_locator,\n        )\n    }\n'''
          if old not in text:
              raise SystemExit('authored_relations method anchor missing')
          text = text.replace(old, new, 1)
          marker = '\nfn parse_resource_refs(raw: Vec<String>) -> AikitResult<Vec<ResourceRef>> {'
          helper = '''\nfn authored_relation_desktop_read(\n    index: &SemanticWikiIndex,\n    compilation: &AuthoredWikiRelationCompilation,\n    subject_ref: ResourceRef,\n    subject_kind: ResourceKind,\n    label: impl Into<String>,\n) -> AikitResult<AuthoredRelationsDesktopReading> {\n    let relations = authored_wiki_subject_relations(\n        index,\n        compilation,\n        subject_ref.clone(),\n        subject_kind,\n        label,\n    )?;\n    let mut resolved_evidence = compilation\n        .edges\n        .iter()\n        .filter(|edge| edge.from_ref == subject_ref || edge.to_ref == subject_ref)\n        .cloned()\n        .collect::<Vec<_>>();\n    resolved_evidence.sort_by(|left, right| left.ref_id.cmp(&right.ref_id));\n    Ok(AuthoredRelationsDesktopReading {\n        relations,\n        resolved_evidence,\n    })\n}\n'''
          if marker not in text:
              raise SystemExit('parse_resource_refs marker missing')
          text = text.replace(marker, helper + marker, 1)
          # Add focused O:I-side owner-consumer fixtures.
          text += r'''\n\n#[cfg(test)]\nmod authored_relation_consumer_tests {\n    use std::collections::BTreeMap;\n\n    use aikit_core::knowledge_wiki::{WikiNode, OKF_WIKI_PROFILE};\n\n    use super::*;\n\n    fn node(id: &str, title: &str) -> WikiObject {\n        WikiObject::Node(WikiNode {\n            profile: OKF_WIKI_PROFILE.into(),\n            ref_id: ResourceRef::parse(id).unwrap(),\n            revision: 1,\n            provenance: Vec::new(),\n            node_type: "Concept".into(),\n            title: Some(title.into()),\n            space_refs: Vec::new(),\n            source_refs: Vec::new(),\n            local_space_ref: None,\n            extensions: BTreeMap::new(),\n        })\n    }\n\n    #[test]\n    fn flow_body_without_frontmatter_projects_resolved_and_pending_owner_state_without_model_work() {\n        let objects = vec![node("wiki:node:beta", "Beta")];\n        let source = parse_authored_wiki_source_with_authority(\n            ResourceRef::parse("flow:thread:one").unwrap(),\n            SourceRef::parse("source:flow:one").unwrap(),\n            SourceAuthority::Authored,\n            Some(SourceRevision::parse("flow-revision-1").unwrap()),\n            vec!["ProjectCentral/flow/one.md".into()],\n            "Thinking with [[Beta]] and [[Future Concept]].",\n        )\n        .unwrap();\n        let compilation = compile_authored_wiki_relations(&[source], &objects, &[]).unwrap();\n        let index = rebuild_semantic_wiki_with_authored_relations(&objects, &compilation).unwrap();\n        let reading = authored_relation_desktop_read(\n            &index,\n            &compilation,\n            ResourceRef::parse("flow:thread:one").unwrap(),\n            ResourceKind::KnowledgeSource,\n            "one.md",\n        )\n        .unwrap();\n        assert_eq!(reading.relations.resolved.edges.len(), 1);\n        assert_eq!(reading.relations.pending.len(), 1);\n        assert_eq!(reading.relations.pending[0].evidence.raw_target, "Future Concept");\n        assert!(!reading.relations.automatic_agent_or_model_invocation);\n        assert_eq!(reading.resolved_evidence[0].origin, WikiEdgeOrigin::Authored);\n        assert_eq!(\n            reading.resolved_evidence[0].provenance[0]\n                .extensions\n                .get("source_authority"),\n            Some(&serde_json::json!("authored"))\n        );\n    }\n\n    #[test]\n    fn typed_metadata_relation_keeps_authored_channel_and_exact_field_anchor() {\n        let objects = vec![node("wiki:node:beta", "Beta")];\n        let source = parse_authored_wiki_source_with_authority(\n            ResourceRef::parse("source:concept:flow").unwrap(),\n            SourceRef::parse("source:concept:flow").unwrap(),\n            SourceAuthority::Authored,\n            Some(SourceRevision::parse("source-revision-2").unwrap()),\n            vec!["knowledge/Flow.md".into()],\n            "---\\ntype: Concept\\nresource: wiki:concept:flow\\ntitle: Flow\\nrelations:\\n  develops:\\n    - Beta\\n---\\nFlow body.",\n        )\n        .unwrap();\n        let subject = source.subject_ref.clone();\n        let compilation = compile_authored_wiki_relations(&[source], &objects, &[]).unwrap();\n        let index = rebuild_semantic_wiki_with_authored_relations(&objects, &compilation).unwrap();\n        let reading = authored_relation_desktop_read(\n            &index,\n            &compilation,\n            subject,\n            ResourceKind::KnowledgeSource,\n            "Flow",\n        )\n        .unwrap();\n        let evidence = reading.resolved_evidence[0]\n            .extensions\n            .get("authored_relation")\n            .unwrap();\n        assert_eq!(evidence["channel"], "metadata");\n        assert_eq!(evidence["anchor"]["field_path"], "relations.develops[0]");\n        assert_eq!(evidence["raw_target"], "Beta");\n    }\n}\n'''
          p.write_text(text)

          # Re-export SourceAuthority + the desktop authored reading for native shell consumers.
          replace(
              'desktop/core/src/lib.rs',
              '    FlowWriteResult, ResourceRef,\n',
              '    FlowWriteResult, ResourceRef, SourceAuthority,\n',
          )
          replace(
              'desktop/core/src/lib.rs',
              'pub use project_knowledge::LocalProjectKnowledge;\n',
              'pub use project_knowledge::{AuthoredRelationsDesktopReading, LocalProjectKnowledge};\n',
          )

          # Native read-only Flow relation command: Central owner source -> AIKit compiler -> O:I projection.
          replace(
              'desktop/src-tauri/src/flow.rs',
              '    BridgePolicy, CentralFlowClient, FlowAuthorityRef, FlowContextAuthority, FlowStandingContext,\n    ResourceRef, FLOW_CONTEMPLATE_TRANSPORT_VERSION,\n',
              '    BridgePolicy, CentralFlowClient, CentralFlowRecord, FlowAuthorityRef, FlowContextAuthority,\n    FlowStandingContext, ResourceRef, SourceAuthority, FLOW_CONTEMPLATE_TRANSPORT_VERSION,\n',
          )
          replace(
              'desktop/src-tauri/src/flow.rs',
              '#[tauri::command]\npub(crate) fn flow_history(flow_ref: String) -> Result<Value, String> {',
              '''#[tauri::command]\npub(crate) fn flow_relations(state: State<'_, AppState>, flow_ref: String) -> Result<Value, String> {\n    BridgePolicy\n        .authorize(BridgeCaller::ShellUi, BridgeCallClass::ObserveFlow)\n        .map_err(|error| error.to_string())?;\n    let document = current_client()?.open(&flow_ref)?;\n    let knowledge = state\n        .knowledge\n        .lock()\n        .map_err(|_| "Knowledge workbench lock poisoned".to_owned())?;\n    let knowledge = knowledge\n        .as_ref()\n        .ok_or_else(|| "no local ProjectCentral Knowledge world is configured".to_owned())?;\n    let reading = knowledge\n        .flow_authored_relations(\n            &document.flow.flow_ref,\n            &document.flow.source_ref,\n            &document.flow.current_revision,\n            &document.flow.path,\n            flow_source_authority(&document.flow),\n            &document.content,\n        )\n        .map_err(|error| error.to_string())?;\n    serde_json::to_value(reading).map_err(|error| format!("serialize Flow relations: {error}"))\n}\n\n#[tauri::command]\npub(crate) fn flow_history(flow_ref: String) -> Result<Value, String> {''',
          )
          marker = '\nfn current_client() -> Result<CentralFlowClient, String> {'
          authority_fn = '''\nfn flow_source_authority(flow: &CentralFlowRecord) -> SourceAuthority {\n    match flow.revisions.last().map(|revision| revision.actor_kind.as_str()) {\n        Some("human") => SourceAuthority::Authored,\n        Some("agent") => SourceAuthority::Generated,\n        _ => SourceAuthority::Observed,\n    }\n}\n'''
          p = Path('desktop/src-tauri/src/flow.rs')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('flow current_client marker missing')
          p.write_text(text.replace(marker, authority_fn + marker, 1))
          replace(
              'desktop/src-tauri/src/main.rs',
              '            flow::flow_open,\n            flow::flow_save,\n            flow::flow_history,\n',
              '            flow::flow_open,\n            flow::flow_save,\n            flow::flow_relations,\n            flow::flow_history,\n',
          )

          # Shared renderer for owner-supplied relation state. It never parses Markdown.
          Path('desktop/ui/src/authored-relations.tsx').write_text(r'''import React from 'react';\n\nexport type AuthoredRelationNode = {\n  resource: string;\n  kind: string;\n  label: string;\n  state?: string;\n};\n\ntype RelationEdge = {\n  from: string;\n  to: string;\n  relation: string;\n  direction: string;\n  origin: { provider?: string; lens?: string; authority: string; revision?: string };\n};\n\ntype ResolvedRelationView = {\n  query: { focus: string };\n  nodes: AuthoredRelationNode[];\n  edges: RelationEdge[];\n  truncated: boolean;\n  warnings: string[];\n};\n\ntype AuthoredAnchor = { start_byte?: number; end_byte?: number; field_path?: string };\n\ntype AuthoredEvidence = {\n  source_ref: string;\n  source_revision?: string;\n  relation: string;\n  raw_target: string;\n  raw_token: string;\n  display?: string;\n  fragment?: string;\n  channel: string;\n  anchor: AuthoredAnchor;\n  resolution: { state: string; candidate_refs?: string[]; target_ref?: string };\n};\n\ntype PendingRelation = {\n  subject_ref: string;\n  source_authority: string;\n  evidence: AuthoredEvidence;\n};\n\ntype ResolvedEvidence = {\n  ref: string;\n  from_ref: string;\n  to_ref: string;\n  relation: string;\n  origin: string;\n  provenance: Array<{\n    source_ref: string;\n    source_revision?: string | number;\n    channel?: string;\n    anchor?: AuthoredAnchor;\n    raw_target?: string;\n    source_authority?: string;\n  }>;\n  authored_relation?: AuthoredEvidence;\n};\n\nexport type AuthoredRelationsDesktopReading = {\n  version: string;\n  subject_ref: string;\n  resolved: ResolvedRelationView;\n  pending: PendingRelation[];\n  automatic_agent_or_model_invocation: boolean;\n  resolved_evidence: ResolvedEvidence[];\n};\n\nexport function AuthoredRelationPresentation({\n  reading,\n  onOpenRef,\n}: {\n  reading: AuthoredRelationsDesktopReading;\n  onOpenRef: (resource: string, node?: AuthoredRelationNode) => void | Promise<void>;\n}) {\n  const nodes = new Map(reading.resolved.nodes.map((node) => [node.resource, node]));\n  const outgoing = reading.resolved.edges.filter((edge) => edge.from === reading.subject_ref);\n  const incoming = reading.resolved.edges.filter((edge) => edge.to === reading.subject_ref);\n  const exact = (edge: RelationEdge) => reading.resolved_evidence.find((candidate) =>\n    candidate.from_ref === edge.from && candidate.to_ref === edge.to && candidate.relation === edge.relation,\n  );\n\n  return <section className="oi-authored-relations" aria-label="Authored relations">\n    <header>\n      <div><p className="oi-eyebrow">Source-authored relations</p><strong>{reading.subject_ref}</strong></div>\n      <small>automatic Agent/model = {String(reading.automatic_agent_or_model_invocation)}</small>\n    </header>\n    <RelationGroup label="Outgoing" edges={outgoing} endpoint="to" nodes={nodes} exact={exact} onOpenRef={onOpenRef} />\n    <RelationGroup label="Backlinks" edges={incoming} endpoint="from" nodes={nodes} exact={exact} onOpenRef={onOpenRef} />\n    <div className="oi-authored-relations__pending">\n      <strong>Unresolved / ambiguous</strong>\n      {reading.pending.map((pending, index) => <details key={`${pending.evidence.raw_token}:${index}`}>\n        <summary>{pending.evidence.relation} · {pending.evidence.raw_target} · {pending.evidence.resolution.state}</summary>\n        <dl>\n          <dt>Source</dt><dd>{pending.evidence.source_ref}</dd>\n          <dt>Revision</dt><dd>{pending.evidence.source_revision ?? '—'}</dd>\n          <dt>Channel</dt><dd>{pending.evidence.channel}</dd>\n          <dt>Anchor</dt><dd>{anchorLabel(pending.evidence.anchor)}</dd>\n          <dt>Raw token</dt><dd><code>{pending.evidence.raw_token}</code></dd>\n          <dt>Standing</dt><dd>{pending.source_authority}</dd>\n        </dl>\n        {pending.evidence.resolution.candidate_refs?.length ? <p>candidates · {pending.evidence.resolution.candidate_refs.join(' · ')}</p> : null}\n      </details>)}\n      {!reading.pending.length && <span className="oi-muted">No pending authored targets in this bounded read.</span>}\n    </div>\n  </section>;\n}\n\nfunction RelationGroup({\n  label, edges, endpoint, nodes, exact, onOpenRef,\n}: {\n  label: string;\n  edges: RelationEdge[];\n  endpoint: 'from' | 'to';\n  nodes: Map<string, AuthoredRelationNode>;\n  exact: (edge: RelationEdge) => ResolvedEvidence | undefined;\n  onOpenRef: (resource: string, node?: AuthoredRelationNode) => void | Promise<void>;\n}) {\n  return <div className="oi-authored-relations__group">\n    <strong>{label}</strong>\n    {edges.map((edge, index) => {\n      const resource = edge[endpoint];\n      const node = nodes.get(resource);\n      const evidence = exact(edge);\n      const provenance = evidence?.provenance[0];\n      const authored = evidence?.authored_relation;\n      return <article key={`${edge.from}:${edge.relation}:${edge.to}:${index}`}>\n        <button type="button" className="oi-workbench__ref-button" onClick={() => void onOpenRef(resource, node)}>\n          <strong>{edge.relation}</strong> · {node?.label ?? resource}\n        </button>\n        <small>{edge.origin.authority}{edge.origin.provider ? ` · ${edge.origin.provider}` : ''}</small>\n        {evidence && <details>\n          <summary>Explain relation</summary>\n          <dl>\n            <dt>Origin</dt><dd>{evidence.origin}</dd>\n            <dt>Source</dt><dd>{provenance?.source_ref ?? authored?.source_ref ?? '—'}</dd>\n            <dt>Revision</dt><dd>{String(provenance?.source_revision ?? authored?.source_revision ?? '—')}</dd>\n            <dt>Channel</dt><dd>{provenance?.channel ?? authored?.channel ?? '—'}</dd>\n            <dt>Anchor</dt><dd>{anchorLabel(provenance?.anchor ?? authored?.anchor)}</dd>\n            <dt>Raw target</dt><dd>{authored?.raw_target ?? provenance?.raw_target ?? '—'}</dd>\n            <dt>Raw token</dt><dd><code>{authored?.raw_token ?? '—'}</code></dd>\n          </dl>\n        </details>}\n      </article>;\n    })}\n    {!edges.length && <span className="oi-muted">No {label.toLowerCase()} in this bounded authored read.</span>}\n  </div>;\n}\n\nfunction anchorLabel(anchor?: AuthoredAnchor) {\n  if (!anchor) return '—';\n  if (anchor.field_path) return anchor.field_path;\n  if (anchor.start_byte != null || anchor.end_byte != null) return `bytes ${anchor.start_byte ?? '?'}–${anchor.end_byte ?? '?'}`;\n  return '—';\n}\n'''.replace('\\n', '\n'))

          # Project Knowledge workbench consumes the union shape and navigates stable refs.
          p = Path('desktop/ui/src/workbench-native.tsx')
          text = p.read_text()
          text = text.replace(
              "import { invoke } from '@tauri-apps/api/core';\n",
              "import { invoke } from '@tauri-apps/api/core';\nimport { AuthoredRelationPresentation, type AuthoredRelationNode, type AuthoredRelationsDesktopReading } from './authored-relations';\n",
              1,
          )
          text = text.replace(
              "type KnowledgeReading = {\n",
              "type ProjectRelations = KnowledgeRelationView | (Record<string, unknown> & { authored?: AuthoredRelationsDesktopReading });\n\ntype KnowledgeReading = {\n",
              1,
          )
          text = text.replace(
              "        detail = await invoke<KnowledgeRelationView>('knowledge_relations', {\n",
              "        detail = await invoke<ProjectRelations>('knowledge_relations', {\n",
              1,
          )
          anchor = "  const agentRefs = useMemo(() => Object.keys(space?.state.agent_sessions ?? {}), [space]);\n"
          open_fn = '''  async function openRelationRef(resource: string, node?: AuthoredRelationNode) {\n    await selectKnowledge({\n      resource,\n      kind: node?.kind ?? 'knowledge-node',\n      label: node?.label ?? resource,\n      score: 1,\n      snippet: '',\n      provider: 'semantic-wiki',\n      authority: 'authored',\n    }, 'reading');\n  }\n\n'''
          if anchor not in text:
              raise SystemExit('workbench useMemo anchor missing')
          text = text.replace(anchor, open_fn + anchor, 1)
          text = text.replace(
              "              <RelationPresentation mode={mode} view={knowledgeDetail as KnowledgeRelationView} />\n",
              "              <ProjectRelationPresentation mode={mode} detail={knowledgeDetail as ProjectRelations} onOpenRef={openRelationRef} />\n",
              1,
          )
          component_anchor = "function RelationPresentation({ mode, view }: { mode: 'tree' | 'graph'; view: KnowledgeRelationView }) {\n"
          wrapper = '''function ProjectRelationPresentation({\n  mode, detail, onOpenRef,\n}: {\n  mode: 'tree' | 'graph';\n  detail: ProjectRelations;\n  onOpenRef: (resource: string, node?: AuthoredRelationNode) => Promise<void>;\n}) {\n  const authored = 'authored' in detail ? detail.authored : undefined;\n  const view = authored?.resolved ?? (isKnowledgeRelationView(detail) ? detail : null);\n  return <>\n    {view ? <RelationPresentation mode={mode} view={view} /> : <p className="oi-muted">No bounded relation view is available for this subject.</p>}\n    {authored ? <AuthoredRelationPresentation reading={authored} onOpenRef={onOpenRef} /> : null}\n  </>;\n}\n\nfunction isKnowledgeRelationView(value: ProjectRelations): value is KnowledgeRelationView {\n  return 'query' in value && Array.isArray((value as KnowledgeRelationView).nodes) && Array.isArray((value as KnowledgeRelationView).edges);\n}\n\n'''
          if component_anchor not in text:
              raise SystemExit('RelationPresentation anchor missing')
          p.write_text(text.replace(component_anchor, wrapper + component_anchor, 1))

          # Flow workbench reads the same relation state independently of AgentSession binding.
          p = Path('desktop/ui/src/flow-workbench.tsx')
          text = p.read_text()
          text = text.replace(
              "import { NativeDocumentEditor } from './native-document-editor';\n",
              "import { AuthoredRelationPresentation, type AuthoredRelationNode, type AuthoredRelationsDesktopReading } from './authored-relations';\nimport { NativeDocumentEditor } from './native-document-editor';\n",
              1,
          )
          text = text.replace(
              "  const [history, setHistory] = useState<unknown>(null);\n  const [error, setError] = useState('');\n",
              "  const [history, setHistory] = useState<unknown>(null);\n  const [relations, setRelations] = useState<AuthoredRelationsDesktopReading | null>(null);\n  const [relationError, setRelationError] = useState('');\n  const [error, setError] = useState('');\n",
              1,
          )
          open_anchor = "  async function open(ref: string) {\n"
          relation_helpers = '''  async function refreshRelations(ref: string) {\n    try {\n      setRelations(await invoke<AuthoredRelationsDesktopReading>('flow_relations', { flowRef: ref }));\n      setRelationError('');\n    } catch (reason) {\n      setRelations(null);\n      setRelationError(messageFrom(reason));\n    }\n  }\n\n  async function openRelationRef(resource: string, node?: AuthoredRelationNode) {\n    await onSelect({\n      ref: resource,\n      kind: node?.kind ?? 'knowledge-node',\n      native_owner: 'ai-kit',\n      provenance: { source: 'AIKit authored relation read' },\n    }, {\n      title: node?.label ?? resource,\n      summary: 'Stable relation target · selected from owner-supplied authored relation state',\n    });\n  }\n\n'''
          if open_anchor not in text:
              raise SystemExit('flow open anchor missing')
          text = text.replace(open_anchor, relation_helpers + open_anchor, 1)
          text = text.replace(
              "      setError('');\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n",
              "      setError('');\n      await refreshRelations(next.flow.flow_ref);\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n",
              1,
          )
          text = text.replace(
              "      setHistory(null);\n      setError('');\n",
              "      setHistory(null);\n      setRelations(null);\n      setRelationError('');\n      setError('');\n",
              1,
          )
          # save path: first matching post-save selection after open was already replaced; target the exact save block reset.
          old_save = "      setResult(null);\n      setError('');\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n"
          new_save = "      setResult(null);\n      setError('');\n      await refreshRelations(next.flow.flow_ref);\n      await onSelect(semanticFlow(next.flow), flowEvidence(next.flow));\n"
          if old_save not in text:
              raise SystemExit('flow save relation refresh anchor missing')
          text = text.replace(old_save, new_save, 1)
          old_return = "      setDocument(current);\n      setBuffer(current.content);\n      await onSelect(semanticFlow(current.flow), flowEvidence(current.flow));\n"
          new_return = "      setDocument(current);\n      setBuffer(current.content);\n      await refreshRelations(current.flow.flow_ref);\n      await onSelect(semanticFlow(current.flow), flowEvidence(current.flow));\n"
          if old_return not in text:
              raise SystemExit('flow contemplate return anchor missing')
          text = text.replace(old_return, new_return, 1)
          render_anchor = "      <NativeDocumentEditor\n"
          relation_render = '''      {relations && <AuthoredRelationPresentation reading={relations} onOpenRef={openRelationRef} />}\n      {relationError && <p className="oi-workbench__error">Relations: {relationError}</p>}\n'''
          if render_anchor not in text:
              raise SystemExit('flow editor render anchor missing')
          p.write_text(text.replace(render_anchor, relation_render + render_anchor, 1))

          # Presentation conformance: shared owner state, stable navigation, no renderer parser.
          p = Path('desktop/ui/src/workbench-presentation.test.mjs')
          text = p.read_text()
          text = text.replace(
              "const runtime = readFileSync(new URL('./runtime-observation.tsx', import.meta.url), 'utf8');\n",
              "const authoredRelations = readFileSync(new URL('./authored-relations.tsx', import.meta.url), 'utf8');\nconst runtime = readFileSync(new URL('./runtime-observation.tsx', import.meta.url), 'utf8');\n",
              1,
          )
          text += r'''\n\ntest('authored relation presentation consumes owner read state and navigates only stable resolved refs', () => {\n  assert.match(workbench, /AuthoredRelationPresentation/);\n  assert.match(workbench, /openRelationRef/);\n  assert.match(authoredRelations, /resolved_evidence/);\n  assert.match(authoredRelations, /Backlinks/);\n  assert.match(authoredRelations, /Unresolved \/ ambiguous/);\n  assert.match(authoredRelations, /Explain relation/);\n  assert.match(authoredRelations, /raw_token/);\n  assert.match(authoredRelations, /field_path/);\n  assert.doesNotMatch(authoredRelations, /parse.*markdown/i);\n  assert.doesNotMatch(authoredRelations, /DesktopWiki|backlink store/i);\n});\n'''
          p.write_text(text)

          p = Path('desktop/ui/src/flow-workbench.test.mjs')
          text = p.read_text()
          text += r'''\n\ntest('Flow relation visibility is a read-only owner path independent of AgentSession binding', () => {\n  assert.match(flow, /invoke<AuthoredRelationsDesktopReading>\('flow_relations'/);\n  assert.match(flow, /AuthoredRelationPresentation/);\n  assert.match(flow, /refreshRelations/);\n  const relationFunction = flow.match(/async function refreshRelations\([\s\S]*?\n  }/);\n  assert.ok(relationFunction);\n  assert.doesNotMatch(relationFunction[0], /flow_bind|flow_contemplate|agent_surface/);\n});\n'''
          p.write_text(text)

          # Public Projection: rewrite only relations whose endpoints are already
          # selected in this exact public Presentation and have explicit routes.
          p = Path('shared-field/projection-reading.mjs')
          text = p.read_text()
          text += r'''\n\nexport function projectedAuthoredRelationRoutes(value, relationReading, routeBySubjectRef = {}) {\n  const projection = validateProjection(value);\n  if (projection.audience?.visibility !== 'public') return [];\n  const presentation = worldPresentationFromProjection(projection);\n  const selected = new Set([projection.subject.ref]);\n  for (const region of presentation.regions) {\n    for (const binding of region.bindings) {\n      if (binding.subject_ref) selected.add(binding.subject_ref);\n    }\n  }\n\n  const resolved = relationReading?.resolved;\n  if (!resolved || !Array.isArray(resolved.edges)) return [];\n  const evidence = Array.isArray(relationReading.resolved_evidence)\n    ? relationReading.resolved_evidence\n    : [];\n\n  return resolved.edges.flatMap((edge) => {\n    if (!selected.has(edge.from) || !selected.has(edge.to)) return [];\n    const fromRoute = routeBySubjectRef[edge.from];\n    const toRoute = routeBySubjectRef[edge.to];\n    if (typeof fromRoute !== 'string' || typeof toRoute !== 'string') return [];\n    const exact = evidence.find((candidate) =>\n      candidate.from_ref === edge.from && candidate.to_ref === edge.to && candidate.relation === edge.relation,\n    );\n    return [{\n      relation: edge.relation,\n      from_ref: edge.from,\n      to_ref: edge.to,\n      from_route: fromRoute,\n      to_route: toRoute,\n      origin: clone(edge.origin),\n      ...(exact ? { provenance: clone(exact.provenance ?? []), edge_ref: exact.ref } : {}),\n    }];\n  });\n}\n'''
          p.write_text(text)

          Path('shared-field/authored-relation-projection.test.mjs').write_text(r'''import assert from 'node:assert/strict';\nimport test from 'node:test';\n\nimport { createWorldPresentationProjection } from './presentation-projection.mjs';\nimport { projectedAuthoredRelationRoutes } from './projection-reading.mjs';\n\nfunction projection() {\n  return createWorldPresentationProjection({\n    projection: {\n      schema: 'oi.projection/v1',\n      projection_ref: 'projection:test:relations:1',\n      projection_revision: 1,\n      state: 'published',\n      subject: { ref: 'project:public', kind: 'project' },\n      source: { system: 'filesystem', ref: 'Work/public', revision: 'tree@1' },\n      publisher_participant_ref: 'participant:test',\n      published_at: '2026-08-25T00:00:00Z',\n      audience: { visibility: 'public' },\n      provenance: [],\n    },\n    presentation: {\n      schema: 'oi.world-presentation/v1',\n      presentation_ref: 'presentation:test:relations',\n      world_ref: 'project:public',\n      revision: 1,\n      title: 'Public Project',\n      theme: { tokens: {} },\n      provenance: [],\n      regions: [{\n        region_ref: 'knowledge',\n        role: 'relation',\n        bindings: [\n          { schema: 'oi.presentation-binding/v1', binding_ref: 'source', component_ref: 'component:test:source', subject_ref: 'source:public-page', props: {}, fallback: { title: 'Page', text: 'Page' }, provenance: [] },\n          { schema: 'oi.presentation-binding/v1', binding_ref: 'target', component_ref: 'component:test:target', subject_ref: 'wiki:node:public-target', props: {}, fallback: { title: 'Target', text: 'Target' }, provenance: [] },\n        ],\n      }],\n    },\n  });\n}\n\nfunction localRelations() {\n  return {\n    version: 'aikit.authored-wiki-read/v1',\n    subject_ref: 'source:public-page',\n    automatic_agent_or_model_invocation: false,\n    resolved: {\n      query: { focus: 'source:public-page' },\n      nodes: [],\n      truncated: false,\n      warnings: [],\n      edges: [\n        { from: 'source:public-page', to: 'wiki:node:public-target', relation: 'references', direction: 'outgoing', origin: { authority: 'authored', provider: 'provider/semantic-wiki/native' } },\n        { from: 'source:public-page', to: 'wiki:node:private-target', relation: 'references', direction: 'outgoing', origin: { authority: 'authored', provider: 'provider/semantic-wiki/native' } },\n      ],\n    },\n    pending: [{ evidence: { raw_target: 'Future Secret' } }],\n    resolved_evidence: [\n      { ref: 'wiki:edge:public', from_ref: 'source:public-page', to_ref: 'wiki:node:public-target', relation: 'references', provenance: [{ source_ref: 'source:public-page', source_revision: 'rev-1' }] },\n      { ref: 'wiki:edge:private', from_ref: 'source:public-page', to_ref: 'wiki:node:private-target', relation: 'references', provenance: [{ source_ref: 'source:public-page', source_revision: 'rev-1' }] },\n    ],\n  };\n}\n\ntest('public route compilation exposes only explicitly projected relation endpoints', () => {\n  const local = localRelations();\n  const before = JSON.stringify(local);\n  const routes = projectedAuthoredRelationRoutes(projection(), local, {\n    'source:public-page': '/p/public/page',\n    'wiki:node:public-target': '/p/public/target',\n    'wiki:node:private-target': '/p/private/secret',\n  });\n  assert.deepEqual(routes, [{\n    relation: 'references',\n    from_ref: 'source:public-page',\n    to_ref: 'wiki:node:public-target',\n    from_route: '/p/public/page',\n    to_route: '/p/public/target',\n    origin: { authority: 'authored', provider: 'provider/semantic-wiki/native' },\n    provenance: [{ source_ref: 'source:public-page', source_revision: 'rev-1' }],\n    edge_ref: 'wiki:edge:public',\n  }]);\n  assert.equal(JSON.stringify(local), before, 'public representation must not mutate canonical/local relation state');\n  assert.ok(!JSON.stringify(routes).includes('private-target'));\n  assert.ok(!JSON.stringify(routes).includes('Future Secret'));\n});\n\ntest('non-public Projection emits no public authored routes', () => {\n  const value = projection();\n  value.audience.visibility = 'private';\n  assert.deepEqual(projectedAuthoredRelationRoutes(value, localRelations(), {\n    'source:public-page': '/p/public/page',\n    'wiki:node:public-target': '/p/public/target',\n  }), []);\n});\n'''.replace('\\n', '\n'))
      - name: Format and prove #150 consumer closure
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path desktop/core/Cargo.toml --all
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --all
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          node --test desktop/ui/src/workbench-presentation.test.mjs
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/flow-workbench.test.mjs
          node --test shared-field/*.test.mjs
          git diff --check
      - name: Commit only #150 product state
        shell: bash
        run: |
          set -euo pipefail
          git add desktop/core/src/project_knowledge.rs desktop/core/src/lib.rs desktop/src-tauri/src/flow.rs desktop/src-tauri/src/main.rs desktop/ui/src/authored-relations.tsx desktop/ui/src/workbench-native.tsx desktop/ui/src/flow-workbench.tsx desktop/ui/src/workbench-presentation.test.mjs desktop/ui/src/flow-workbench.test.mjs shared-field/projection-reading.mjs shared-field/authored-relation-projection.test.mjs
          git config user.name 'EpiLogos automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[OI-WIKI-RELATIONS] Complete desktop Flow and public Projection consumption'
          git push origin HEAD:feat/authored-wiki-relations-150
