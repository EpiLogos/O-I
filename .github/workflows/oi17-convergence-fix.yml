name: OI17 convergence fix

on:
  push:
    branches: [converge/oi-017-first-suite]
    paths:
      - '.github/workflows/oi17-convergence-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply exact compiler fixes and accepted AIKit pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('cli/src/suite_v2.rs')
          text = path.read_text()
          replacements = [
              (
                  '#[derive(Debug, Clone, Deserialize)]\nstruct SuiteGate {',
                  '#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct SuiteGate {'
              ),
              (
                  '''fn command_suite_manifest(args: &[OsString]) -> Result<i32, String> {\n    match args {\n        [] | [one] if args.is_empty() || one == "--json" => {\n            println!("{}", SUITE_MANIFEST_JSON.trim());\n            Ok(0)\n        }\n        _ => Err("usage: oi manifest [--json]".to_owned()),\n    }\n}''',
                  '''fn command_suite_manifest(args: &[OsString]) -> Result<i32, String> {\n    if args.is_empty() || (args.len() == 1 && args[0].to_str() == Some("--json")) {\n        println!("{}", SUITE_MANIFEST_JSON.trim());\n        Ok(0)\n    } else {\n        Err("usage: oi manifest [--json]".to_owned())\n    }\n}'''
              ),
              (
                  'if args != [OsString::from("--managed")] { return Err("usage: oi cleanup --managed".to_owned()); }',
                  'if args.len() != 1 || args[0].to_str() != Some("--managed") { return Err("usage: oi cleanup --managed".to_owned()); }'
              ),
              (
                  '''    if state.remote.as_deref().map(normalize_git_remote).as_deref() != Some(normalize_git_remote(&expected_repo).as_str()) {\n        return Err(format!("origin mismatch: found {:?}, expected canonical {}; no files changed", state.remote, expected_repo));\n    }''',
                  '''    let actual_remote = state.remote.as_deref().map(normalize_git_remote);\n    let expected_remote = normalize_git_remote(&expected_repo);\n    if actual_remote.as_deref() != Some(expected_remote.as_str()) {\n        return Err(format!("origin mismatch: found {:?}, expected canonical {}; no files changed", state.remote, expected_repo));\n    }'''
              ),
              (
                  '''    if product.id == "central" {\n        if let Some(ground) = personal_ground {\n            command.arg("--root").arg(ground).args(["doctor", "--json"]);\n        } else {\n            command.arg("--version");\n        }\n    } else {''',
                  '''    if product.id == "central" {\n        let _ = personal_ground;\n        command.arg("--version");\n    } else {'''
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected suite_v2.rs fragment missing:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          cargo = Path('cli/Cargo.toml')
          cargo_text = cargo.read_text()
          old_rev = 'b7843b437a8d4edd364b22aec9d7625bc8124915'
          new_rev = '9ff28ca31c723b314ddf62b7f85b6e2611d53d66'
          if old_rev not in cargo_text:
              raise SystemExit('expected historical AIKit pin missing from cli/Cargo.toml')
          cargo.write_text(cargo_text.replace(old_rev, new_rev, 1))
          PY
      - name: Generate locked O:I CLI dependency graph
        working-directory: cli
        run: cargo generate-lockfile
      - name: Commit one-shot repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'oi17-convergence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cli/src/suite_v2.rs cli/Cargo.toml cli/Cargo.lock
          git diff --cached --check
          git commit -m 'fix(suite): compile manifest operator and lock accepted AIKit'
          git push origin HEAD:converge/oi-017-first-suite
