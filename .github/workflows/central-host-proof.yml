name: Central dependent document host
on:
  push:
    branches: [agent/w2-central-source-host-dependent-20260920]
    paths: ['.github/workflows/central-host-proof.yml']
  pull_request:
    paths: ['desktop/cradle/src/central/sourceContext.ts', 'desktop/cradle/src/surface/SourceSurface.tsx', 'desktop/cradle/tests/central-*', '.github/workflows/central-host-proof.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  joined:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/oi-w2-host-browsers
      HOST_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PARENT_HEAD: ac4116bfd1e835946a07d6cc77678a5a6527ca3b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac4116bfd1e835946a07d6cc77678a5a6527ca3b
          persist-credentials: false
      - name: Compose only the five explicitly dependent host files
        run: |
          mkdir -p "$RUNNER_TEMP/w2-host"
          git fetch --no-tags origin "$HOST_HEAD"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          files=['desktop/cradle/src/central/sourceContext.ts','desktop/cradle/src/surface/SourceSurface.tsx','desktop/cradle/tests/central-native-browser.mjs','desktop/cradle/tests/central-native-page.tsx','desktop/cradle/tests/central-source-host.test.mjs']
          receipt={'classification':'controlled composed source; no branch merge, install or machine acceptance','parent':os.environ['PARENT_HEAD'],'host':os.environ['HOST_HEAD'],'files':{}}
          for name in files:
              body=subprocess.check_output(['git','show',os.environ['HOST_HEAD']+':'+name]);Path(name).write_bytes(body)
              receipt['files'][name]=hashlib.sha256(body).hexdigest()
          subprocess.run(['git','add','--',*files],check=True)
          receipt['tested_tree']=subprocess.check_output(['git','write-tree'],text=True).strip()
          Path(os.environ['RUNNER_TEMP'],'w2-host','source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git diff --cached --check
          git diff --cached > "$RUNNER_TEMP/w2-host/host-only.diff"
          cat "$RUNNER_TEMP/w2-host/source-receipt.json"
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/Central
          ref: c4bb3605d233426600bdb462832e8ed55ac712b4
          path: native-central
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native products and bridge
        id: native
        run: |
          cargo build --manifest-path native-central/Cargo.toml --locked -p ctrl 2>&1 | tee "$RUNNER_TEMP/w2-host/ctrl-build.log"
          cargo build --manifest-path cli/Cargo.toml --locked --bin oi 2>&1 | tee "$RUNNER_TEMP/w2-host/oi-build.log"
          cargo build --manifest-path desktop/cradle/kernel/Cargo.toml --locked --bin walk-bridge 2>&1 | tee "$RUNNER_TEMP/w2-host/bridge-build.log"
          git -C native-central rev-parse HEAD > "$RUNNER_TEMP/w2-host/central-revision.txt"
          sha256sum native-central/target/debug/ctrl cli/target/debug/oi desktop/cradle/kernel/target/debug/walk-bridge > "$RUNNER_TEMP/w2-host/binaries.txt"
      - name: Strict kernel lint
        if: always()
        run: cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/w2-host/clippy.log"
      - name: Locked desktop dependencies
        id: deps
        if: always()
        working-directory: desktop/cradle
        run: npm ci
      - name: Production build
        if: always() && steps.deps.outcome == 'success'
        working-directory: desktop/cradle
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/w2-host/build.log"
      - name: Complete Node behaviour suite including host and Save regressions
        if: always() && steps.deps.outcome == 'success'
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/w2-host/node.log"
      - name: Browser engines
        id: browsers
        if: always() && steps.deps.outcome == 'success'
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium webkit
      - name: Real native Day Save plus root breadcrumb and dirty view-switch continuity
        if: always() && steps.native.outcome == 'success' && steps.browsers.outcome == 'success'
        env:
          CENTRAL_BROWSER_ENGINES: chromium,webkit
        run: python3 desktop/cradle/tests/central-native-walk.py --ctrl "$GITHUB_WORKSPACE/native-central/target/debug/ctrl" --oi "$GITHUB_WORKSPACE/cli/target/debug/oi" --bridge "$GITHUB_WORKSPACE/desktop/cradle/kernel/target/debug/walk-bridge" --browser --output "$RUNNER_TEMP/w2-host/browser" 2>&1 | tee "$RUNNER_TEMP/w2-host/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-host-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/w2-host
          retention-days: 7
