name: Technē source reconciliation
# Read-only public source/runtime recovery for the disconnected disposable sandbox.
# No user ground, credentials, repository writes or acceptance status is exported.
on:
  push:
    branches: ['codex/techne-constructive-field-20260920']
    paths: ['.github/workflows/techne-source-recovery.yml']
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover pinned current sources and locked application dependencies
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/techne-reconciliation"
          mkdir -p "$out"
          git fetch origin c91d25b0d6a7b55acea0cb954f1245803c691174
          git branch recovered-main c91d25b0d6a7b55acea0cb954f1245803c691174
          git bundle create "$out/O-I.bundle" HEAD recovered-main
          git rev-parse HEAD > "$out/O-I-branch.revision"
          git rev-parse recovered-main > "$out/O-I-main.revision"
          npm ci --prefix desktop/cradle --no-audit --no-fund
          tar -czf "$out/cradle-dependencies.tar.gz" -C desktop/cradle node_modules
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
          tar -czf "$out/expressions-dependencies.tar.gz" -C desktop/cradle/expressions-app node_modules
          for name in QL-MEF ai-kit Central Actuation; do
            git clone --depth=1 --branch main "https://github.com/EpiLogos/$name.git" "$RUNNER_TEMP/native-$name"
            git -C "$RUNNER_TEMP/native-$name" rev-parse HEAD > "$out/$name.revision"
            git -C "$RUNNER_TEMP/native-$name" archive HEAD | gzip > "$out/$name.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: techne-reconciliation-${{ github.sha }}
          path: ${{ runner.temp }}/techne-reconciliation
          retention-days: 7
          if-no-files-found: error
