name: Wire native encounter consumers
on:
  push:
    branches: [agent/native-agent-session-20260920]
    paths: [.github/workflows/agent-native-consumer-wire.yml]
permissions:
  contents: read
jobs:
  wire:
    if: github.ref == 'refs/heads/agent/native-agent-session-20260920'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded production consumer hunks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('desktop/cradle')
          def replace(s,old,new):
              assert s.count(old)==1, 'Expected one exact consumer hunk: '+old[:100]
              return s.replace(old,new,1)
          p=root/'src/encounter/client.ts';s=p.read_text();p.write_text(replace(s,'export type EncounterRequest = ','export type EncounterRequest = import("./nativeModel").NativeModelRequest | '))
          p=root/'kernel/src/agency.rs';s=p.read_text()
          s=replace(s,'    Providers,','''    Providers,
              ModelRead { agent_session:String },
              ModelSelect { agent_session:String, provider_model_id:String, #[serde(default,skip_serializing_if="Option::is_none")] provider_reasoning_effort:Option<String>, expected_native_session_id:String },''')
          s=replace(s,'Self::Status{agent_session}|','Self::Status{agent_session}|Self::ModelRead{agent_session}|Self::ModelSelect{agent_session,..}|')
          s=replace(s,'EncounterRequest::Open{space:requested,..}=>','EncounterRequest::Open{space:requested,..}|EncounterRequest::Reconnect{space:requested,..}=>');p.write_text(s)
          p=root/'src/encounter/session.ts';s=p.read_text()
          s=replace(s,'import {useEffect,useMemo,useSyncExternalStore}','import {NativeModelController,connectionLabel,type NativeModelState} from "./nativeModel";\nimport {useEffect,useMemo,useSyncExternalStore}')
          s=replace(s,' providers:{id:string;label:string}[];',' providers:{id:string;label:string}[];\n model:NativeModelState;')
          s=replace(s,' connect(provider:string):Promise<void>;',' readModel():Promise<void>;\n selectModel(model:string,effort?:string):Promise<void>;\n refreshProviders():Promise<void>;\n connect(provider:string):Promise<void>;')
          s=replace(s,' private state:EncounterSessionState;',' private state:EncounterSessionState;\n private models:NativeModelController;')
          s=replace(s,'space:binding.space,providers:[],draft:','space:binding.space,providers:[],model:{phase:"unread"},draft:')
          s=replace(s,'dispatch:{kind:"idle"},deliveries:[],a2a:{busy:false}};\n }','dispatch:{kind:"idle"},deliveries:[],a2a:{busy:false}};\n  this.models=new NativeModelController(binding.ref,request=>this.call(request),model=>this.set({model}));\n }')
          s=replace(s,'if(chain===this.chain)this.set({status:current});','if(chain===this.chain){this.models.observe(current);this.set({status:current});}')
          s=replace(s,'if(!this.allowed("prompt")||this.dirty','if(this.operations>0||!this.allowed("prompt")||this.dirty')
          s=replace(s,' // --- connection, consent, stop ----------------------------------------',''' // --- connection, consent, stop ----------------------------------------
           readModel=()=>this.models.refresh();
           selectModel=async(model:string,effort?:string)=>{this.begin();try{await this.models.select(model,effort);}finally{this.end();}};
           refreshProviders=async()=>{
            try{const providers=await this.call<{id:string;label:string}[]>({action:"providers"});this.set({providers,error:undefined});}
            catch(error){this.set({error:String(error)});}
           };
          ''')
          s=replace(s,'private onVisible=()=>{if(this.observing&&!hidden())this.restartChain();};','private onVisible=()=>{if(this.observing&&!hidden()){void this.refreshProviders();this.restartChain();}};')
          start=s.index('export function sessionStateLabel(');end=s.index('\n}',start)+2
          s=s[:start]+'export function sessionStateLabel(status:EncounterStatus|undefined):string {return connectionLabel(status);}'+s[end:];p.write_text(s)
          p=root/'src/agent/chat/ChatComposer.tsx';s=p.read_text()
          s='import {NativeModelControls,type NativeModelActions} from "../../encounter/NativeModelControls";\nimport {connectionLabel,type NativeModelState} from "../../encounter/nativeModel";\n'+s
          s=replace(s,'  openReason?: string;','  openReason?: string;\n  model?:NativeModelState;\n  modelActions?:NativeModelActions;\n  onRefreshProviders?:()=>void;')
          s=replace(s,'const connected=!!status&&status.state!=="Disconnected";','const connected=!!status?.native_session_id&&!status.error&&["Resident","TurnInFlight","InterruptRequested"].includes(status.state);')
          s=replace(s,'No ACP provider is configured; connect one in System → Sources, then return here.','No encounter harness is configured. Configure an eligible native harness in System, then refresh here; your draft stays.')
          s=replace(s,'      {connection.resume&&<button','      {connection.onRefreshProviders&&<button type="button" className="chat-provider oi-chip" disabled={pending} onClick={connection.onRefreshProviders}>Refresh harnesses</button>}\n      {connection.resume&&<button')
          s=replace(s,'          <span className="oi-eyebrow">Provider</span>','          {connection.model&&connection.modelActions&&<NativeModelControls state={connection.model} actions={connection.modelActions} disabled={pending||running}/>}\n          <span className="oi-eyebrow">Harness</span>')
          s=replace(s,'data-fact="disconnected">','data-fact="disconnected">\n      {status&&status.state!=="Disconnected"&&<span className="oi-note" role="status">{connectionLabel(status)}</span>}');p.write_text(s)
          p=root/'src/agent/chat/AgentChat.tsx';s=p.read_text()
          s=replace(s,'connection={{status,providers:state.providers,','connection={{status,model:state.model,modelActions:{refresh:actions.readModel,select:actions.selectModel},onRefreshProviders:()=>void actions.refreshProviders(),providers:state.providers,');p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/agent-native-consumer-wire.yml
          git add desktop/cradle/kernel/src/agency.rs desktop/cradle/src/encounter/client.ts desktop/cradle/src/encounter/session.ts desktop/cradle/src/agent/chat/ChatComposer.tsx desktop/cradle/src/agent/chat/AgentChat.tsx
          git -c user.name=Epii -c user.email=agent-session@users.noreply.github.com commit -m 'feat(encounter): connect native model controls and fence project-scoped reconnects'
          git push origin HEAD:refs/heads/agent/native-agent-session-20260920
          git rev-parse HEAD
      - name: Execute production controller fault regressions
        working-directory: desktop/cradle
        run: node --experimental-strip-types --test tests/agent-native-model.test.mjs
