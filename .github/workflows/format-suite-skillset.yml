name: Format suite SkillSet

on:
  push:
    branches:
      - agent/suite-operator-skillset
    paths:
      - "cli/src/skillset.rs"
      - "cli/tests/suite_skillset.rs"
      - ".github/workflows/format-suite-skillset.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/suite-operator-skillset
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Commit formatting
        run: |
          if git diff --quiet -- cli/src/skillset.rs cli/tests/suite_skillset.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/skillset.rs cli/tests/suite_skillset.rs
          git commit -m "style(oi): rustfmt suite SkillSet contract"
          git push origin HEAD:agent/suite-operator-skillset
