name: Wiki exact-source delivery
on:
  push:
    branches: [agent/wiki-constellation-loop-20260920]
    paths:
      - scripts/wiki-finish-source.py
      - .github/workflows/wiki-finish-source.yml
permissions:
  contents: write
concurrency:
  group: wiki-exact-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/agent/wiki-constellation-loop-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/kernel
      - name: Reconcile reviewed main changes and finish the view controls
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/wiki-constellation-loop-20260920 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/wiki-finish-source.py
          cargo test --locked --manifest-path desktop/cradle/kernel/Cargo.toml
          cargo clippy --locked --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets -- -D warnings
          cd desktop/cradle
          npm ci
          npx tsc --noEmit
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/wiki-*.test.mjs
      - name: Commit the tested source and reviewed main merge to this branch only
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/wiki-constellation-loop-20260920 | cut -f1)" = "$GITHUB_SHA"
          git add desktop/cradle/kernel/src/lib.rs desktop/cradle/src/knowledge/KnowledgeSurface.tsx desktop/cradle/src/knowledge/GraphCanvas.tsx desktop/cradle/src/knowledge/GraphFilters.tsx desktop/cradle/src/knowledge/WikiConstructionPanel.tsx desktop/cradle/tests/wiki-constructive-page.tsx desktop/cradle/tests/wiki-constructive-browser.mjs desktop/cradle/tests/wiki-reader-browser.mjs
          git commit -m 'feat(wiki): join native authoring with current main and complete graph view controls'
          git push origin HEAD:refs/heads/agent/wiki-constellation-loop-20260920
      - name: Retain exact source changes and any unresolved conflict for review
        if: always()
        run: |
          mkdir -p /tmp/wiki-source-review
          git rev-parse HEAD > /tmp/wiki-source-review/head
          git status --short > /tmp/wiki-source-review/status
          git diff HEAD > /tmp/wiki-source-review/worktree.diff
          git ls-files -u > /tmp/wiki-source-review/unmerged
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          paths = subprocess.check_output(['git','diff','--name-only','HEAD']).decode().splitlines()
          with tarfile.open('/tmp/wiki-source-review/changed-source.tar.gz','w:gz') as archive:
              for name in paths:
                  path=pathlib.Path(name)
                  if path.is_file(): archive.add(path,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiki-source-review-${{ github.run_id }}
          path: /tmp/wiki-source-review/
          retention-days: 7
