name: O:I desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - agent/oi-desktop-surface-host
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and lint O:I CLI library
        run: |
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and lint desktop core
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public front door against shared tokens
        run: |
          npm install --prefix site --no-audit --no-fund
          npm --prefix site run build
      - name: Build desktop rendered layer from lock
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
      - name: Preserve Explore and workbench presentation contracts
        run: |
          node --test shared-field/*.test.mjs
          node --test desktop/ui/src/explore-presentation.test.mjs
          node --test desktop/ui/src/workbench-presentation.test.mjs
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/living-wiki-model.test.mjs

  native-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rendered-layer dependencies from lock
        run: npm ci --prefix desktop/ui --no-audit --no-fund
      - name: Check Rust-owned native shell from lock
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin

  owner-main-finalize:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/flow-desktop-138
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - name: Advance Factory to accepted current main
        shell: python
        run: |
          from pathlib import Path
          path = Path('desktop/core/Cargo.toml')
          text = path.read_text()
          old = '621624c7c8a9919604ad36db451f1a30806fc0ce'
          new = 'ec08c99a55a6320c6f59d3c73024b5d48063a989'
          if old not in text and new not in text:
              raise SystemExit('Factory owner pin moved unexpectedly')
          path.write_text(text.replace(old, new))
      - name: Regenerate exact owner lock and verify desktop
        run: |
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path desktop/core/Cargo.toml
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
          git diff --check
      - name: Publish pin and lock without CI scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/flow-desktop-138
          remote_head="$(git rev-parse origin/feat/flow-desktop-138)"
          if [[ "$remote_head" != "$TRIGGER_HEAD" ]]; then
            echo "branch moved during owner-main finalization: trigger=$TRIGGER_HEAD remote=$remote_head" >&2
            exit 1
          fi
          git show "$TRIGGER_HEAD^:.github/workflows/desktop.yml" > .github/workflows/desktop.yml
          git rm .github/workflows/flow-owner-main-finalize.yml
          git add -u .github/workflows/desktop.yml desktop/core/Cargo.toml desktop/src-tauri/Cargo.lock
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git commit -m '[FLOW] Pin Factory accepted main in native desktop composition'
          git push origin HEAD:feat/flow-desktop-138
