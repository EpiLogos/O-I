name: O:I desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'shared-field/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - agent/oi-desktop-surface-host
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'shared-field/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and lint O:I CLI library
        run: |
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and lint desktop core
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install SpaceTimeDB module dependencies
        run: npm install --prefix shared-field/spacetimedb --no-audit --no-fund
      - name: Install pinned SpaceTimeDB CLI 2.8.1
        shell: bash
        run: |
          curl -sSf https://install.spacetimedb.com | \
            SPACETIME_DOWNLOAD_ROOT="https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.8.1" \
            sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version | tee /tmp/spacetimedb-version.txt
          grep -q '2.8.1' /tmp/spacetimedb-version.txt
      - name: Build public front door against shared tokens and live SharedField bindings
        run: |
          npm install --prefix site --no-audit --no-fund
          npm --prefix site run build
      - name: Build desktop rendered layer from lock
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
      - name: Preserve Explore contract regression and desktop convergence
        run: |
          node --test shared-field/*.test.mjs
          node --test desktop/ui/src/explore-presentation.test.mjs

  native-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rendered-layer dependencies from lock
        run: npm ci --prefix desktop/ui --no-audit --no-fund
      - name: Check Rust-owned native shell from lock
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
