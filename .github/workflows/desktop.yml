name: O:I desktop

# Guards the desktop surface only: the cradle kernel crate, the cradle web
# build and the native Tauri shell graph. The CLI is gated by verify.yml; the
# Existing owner-executable tests retain their original admission paths. The
# commissioned retained performance tests require actual separately qualified
# native producer/checkpoint/workload fixtures; no fallback or source retargeting.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'shared-field/**'
      - '.github/workflows/desktop.yml'
      - 'scripts/prepare-retained-performance-fixture.py'
      - 'scripts/retained-performance-ci-environment.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Read the separately qualified retained performance test source
        id: retained-performance-source
        run: |
          python3 - <<'PY_SOURCE'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('desktop/cradle/tests/fixtures/retained-performance/source-owner.json').read_text())
          assert value['schema'] == 'oi.retained-performance-test-source-owner/v1'
          assert value['repository'] == 'EpiLogos/QL-MEF'
          assert value['consumer'] == 'retained-performance-native-kernel-tests'
          assert re.fullmatch(r'[0-9a-f]{40}', value['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + value['revision'] + '\n')
          PY_SOURCE
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: ${{ steps.retained-performance-source.outputs.revision }}
          path: .native-owner/retained-performance/QL-MEF
          persist-credentials: false
      - name: Native retained performance codec dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            desktop/cradle/kernel
            .native-owner/retained-performance/QL-MEF
      - name: Produce the actual retained source, Manager, full workload and native checkpoints
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retained-performance"
          python3 scripts/prepare-retained-performance-fixture.py \
            --ql-source "$GITHUB_WORKSPACE/.native-owner/retained-performance/QL-MEF" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output "$RUNNER_TEMP/retained-performance" --timeout-seconds 900 \
            > "$RUNNER_TEMP/retained-performance/result.json"
          python3 scripts/retained-performance-ci-environment.py \
            --result "$RUNNER_TEMP/retained-performance/result.json" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output-root "$RUNNER_TEMP/retained-performance" --github-env "$GITHUB_ENV"
      - name: Complete cradle kernel unit and native target tests
        if: always()
        timeout-minutes: 15
        run: cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked --lib --bins --examples --benches --no-fail-fast
      - name: Complete cradle kernel integration tests
        if: always()
        timeout-minutes: 15
        run: cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked --test '*' --no-fail-fast
      - name: Lint all cradle kernel targets
        if: always()
        timeout-minutes: 15
        run: cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --locked --all-targets -- -D warnings
      - name: Preserve every actual producer fixture, original log and source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-performance-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/retained-performance
          if-no-files-found: error
          retention-days: 14

  cradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/kernel
      - name: Build cradle web bundle from the locked graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm --prefix desktop/cradle run build
      - name: Build and start the dev-only kernel walk bridge with a disposable OI_HOME
        id: bridge
        run: |
          set -euo pipefail
          cargo build --manifest-path desktop/cradle/kernel/Cargo.toml --locked --bin walk-bridge
          export OI_HOME="$RUNNER_TEMP/cradle-kernel-home"
          mkdir -p "$OI_HOME"
          OI_HOME="$OI_HOME" desktop/cradle/kernel/target/debug/walk-bridge 127.0.0.1:4179 \
            > "$RUNNER_TEMP/walk-bridge.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/walk-bridge.pid"
          for _ in $(seq 1 50); do
            curl -sf http://127.0.0.1:4179/state > /dev/null && exit 0
            sleep 0.2
          done
          echo "::error::walk bridge never came up"; cat "$RUNNER_TEMP/walk-bridge.log"; exit 1
      - name: Prove bounded native replay, owner resync and process generation
        working-directory: desktop/cradle
        env:
          OI_NATIVE_EVENT_REPLAY: '1'
          OI_KERNEL_BIN: ${{ github.workspace }}/desktop/cradle/kernel/target/debug/walk-bridge
          OI_EVENT_REPLAY_RECEIPT: ${{ runner.temp }}/kernel-event-replay.json
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/kernel-event-replay-native.test.mjs
      - name: Guard executable source — no unresolved markers, runner entry points parse
        working-directory: desktop/cradle
        run: |
          # The bundle build never imports the walk runner, so a syntax error
          # or an unresolved merge marker there is invisible to tsc/vite. Catch
          # both cheaply against tracked executable source (F01/F02).
          if git grep -lnE '^(<<<<<<<|>>>>>>>|=======$)' -- '*.mjs' '*.ts' '*.tsx'; then
            echo "::error::unresolved conflict markers in executable source"; exit 1
          fi
          for f in $(git ls-files 'walk/*.mjs' 'walk/scenarios/*.mjs' 'tests/*.mjs'); do
            node --check "$f" || { echo "::error::syntax error in $f"; exit 1; }
          done
          node --test tests/walk-runner.test.mjs
      - name: Enforce desktop architecture conformance and bounded debt
        working-directory: desktop/cradle
        run: node --test tests/conformance/*.test.mjs
      - name: Enforce the shell presentation rules and deliberate source disclosure
        working-directory: desktop/cradle
        run: node --test tests/cradle-shell-antipatterns.test.mjs
      - name: Prove native Encounter material rendering and source offsets
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/encounter-markdown.test.mjs tests/canvas-editor-contract.test.mjs
      - name: Prove Expression projection through the declared native engine
        working-directory: desktop/cradle
        run: node tests/expression-engine.mjs
      - name: Prove knowledge projection identity and provenance preservation
        working-directory: desktop/cradle
        run: node tests/knowledge-expression.mjs
      - name: Prove the Factory attempt-task consumer joins the native reads honestly
        working-directory: desktop/cradle
        run: node tests/factory-attempt-task.mjs
      - name: Prove the Factory run model and the World-inhabitation apertures (no silent picks)
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/factory-run-model.test.mjs tests/factory-inhabitation-model.test.mjs tests/share-world-authoring.test.mjs
      - name: Prove collection source identity and native-protocol consumer regressions
        working-directory: desktop/cradle
        run: |
          mkdir -p tests/artifacts/collection-source
          set -o pipefail
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/collection-source-identity.test.mjs tests/collection-consumers.test.mjs | tee tests/artifacts/collection-source/controlled.log
      - name: Prove Explore travel, field search and primary projection readings (SF1)
        working-directory: desktop/cradle
        run: node --test tests/explore-field.test.mjs
      - name: Prove the live configuration source against the typed kernel seam (#299 C6)
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-live-source.test.mjs
      - name: Prove the settings × composition interface (composition lock §5/§7)
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-composition.test.mjs
      - name: Prove Workspace state continuity across relaunch and degradation (#18/#65)
        working-directory: desktop/cradle
        run: node --test tests/workspace-continuity.test.mjs
      - name: Install browser engines for search component contracts
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium webkit
      - name: Prove native formation authoring and bounded particle candidate retention
        working-directory: desktop/cradle
        run: node tests/formation-native-regressions.mjs
      - name: Prove search component and literal query transport (D)
        working-directory: desktop/cradle
        run: node tests/search-overlay.mjs
      - name: Prove native composition names, disclosure and exact subject selection
        working-directory: desktop/cradle
        env:
          OI_KERNEL_BRIDGE: http://127.0.0.1:4179
          OI_PRESENTATION_EVIDENCE: tests/artifacts/readable-presentation
        run: node tests/presentation-readable-native.mjs
      - name: Interact with the production Library on controlled owner protocol
        working-directory: desktop/cradle
        run: node tests/collection-browser.mjs
      - name: Prove Expression page placement and capture on one WebGL context
        working-directory: desktop/cradle
        run: |
          node tests/expression-stage-placement.mjs
          node tests/expression-stage-ascii.mjs
      - name: Prove shared Expression ownership and sleeping lifecycle
        working-directory: desktop/cradle
        env:
          OI_KERNEL_BRIDGE: http://127.0.0.1:4179
        run: |
          node tests/expression-stage-lifecycle.mjs
          node tests/expression-provider-lifecycle.mjs
          node tests/visuals-preview-lifecycle.mjs
          node tests/welcome-lifecycle.mjs
      - name: Stop the dev-only kernel walk bridge
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/walk-bridge.pid" ] && kill "$(cat "$RUNNER_TEMP/walk-bridge.pid")" 2>/dev/null || true
      - name: Prove desktop appearance, source syntax and native prepaint policy
        working-directory: desktop/cradle
        run: |
          node tests/desktop-appearance.mjs
          node tests/text-editor-appearance.mjs
          node tests/expression-document-appearance.mjs
          node tests/theme-prepaint-csp.mjs
          npm --prefix ../../packages/oi-design-system run verify
          npm --prefix ../../packages/oi-design-system run verify:browser
      - name: Retain search browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-component-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/search
      - name: Retain native presentation browser and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readable-presentation-${{ github.sha }}
          path: |
            desktop/cradle/tests/artifacts/readable-presentation/
            desktop/cradle/tests/artifacts/visuals-preferences/
            ${{ runner.temp }}/walk-bridge.log
          if-no-files-found: warn
      - name: Retain collection source-identity consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-consumer-evidence-${{ github.sha }}
          path: |
            desktop/cradle/tests/artifacts/collection-source/
            ${{ runner.temp }}/kernel-event-replay.json
          if-no-files-found: warn

  native-shell:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Prove locked native-shell graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          cargo check --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Prove bounded native invalidation for an actual oversized receipt
        run: cargo test --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked event_hint_tests::kernel_event_invalidation_bounds_actual_oversized_native_receipt -- --exact
      - name: Prove the check did not rewrite locks
        run: git diff --exit-code -- desktop/cradle/src-tauri/Cargo.lock desktop/cradle/package-lock.json
