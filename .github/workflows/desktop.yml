name: O:I desktop

# Guards the desktop surface only: the cradle kernel crate, the cradle web
# build and the native Tauri shell graph. The CLI is gated by verify.yml; the
# kernel tests that need built owner executables are marked ignored and run
# through `oi dev gate`, so no sibling repository is built here.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/kernel
      - name: Test and lint cradle kernel
        run: |
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets -- -D warnings

  cradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Build cradle web bundle from the locked graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm --prefix desktop/cradle run build

  native-shell:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Prove locked native-shell graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          cargo check --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Prove the check did not rewrite locks
        run: git diff --exit-code -- desktop/cradle/src-tauri/Cargo.lock desktop/cradle/package-lock.json
