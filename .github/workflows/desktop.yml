name: O:I desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - agent/oi-desktop-surface-host
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and lint O:I CLI library
        run: |
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and lint desktop core
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public front door against shared tokens
        run: |
          npm install --prefix site --no-audit --no-fund
          npm --prefix site run build
      - name: Build desktop rendered layer from lock
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
      - name: Preserve Explore and workbench presentation contracts
        run: |
          node --test shared-field/*.test.mjs
          node --test desktop/ui/src/explore-presentation.test.mjs
          node --test desktop/ui/src/workbench-presentation.test.mjs
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/living-wiki-model.test.mjs

  native-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rendered-layer dependencies from lock
        run: npm ci --prefix desktop/ui --no-audit --no-fund
      - name: Check Rust-owned native shell from lock
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin

  living-native-finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/living-wiki-desktop-135'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch only the exact native composition seams
        shell: python
        run: |
          from pathlib import Path

          main = Path('desktop/src-tauri/src/main.rs')
          text = main.read_text()
          if not text.startswith('mod living;'):
              text = 'mod living;\n\n' + text
          needle = '            knowledge_status,\n'
          replacement = (
              '            living::living_knowledge_status,\n'
              '            living::living_contemplate_preflight,\n'
              '            living::living_contemplate,\n'
              '            knowledge_status,\n'
          )
          if 'living::living_knowledge_status' not in text:
              if needle not in text:
                  raise SystemExit('native handler insertion point moved')
              text = text.replace(needle, replacement, 1)
          main.write_text(text)

      - name: Resolve native dependency truth from Cargo
        run: |
          cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml
          cargo fmt --manifest-path desktop/core/Cargo.toml

      - name: Prove rendered Living workbench
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
          node --test desktop/ui/src/project-field-presentation.test.mjs
          node --test desktop/ui/src/living-wiki-model.test.mjs

      - name: Prove owner composition core
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

      - name: Prove Tauri shell from generated lock
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin

      - name: Preserve diff hygiene
        run: git diff --check

      - name: Atomically publish only the proven native files
        shell: python
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          paths = [
              'desktop/src-tauri/src/main.rs',
              'desktop/src-tauri/Cargo.lock',
          ]
          changed = subprocess.run(
              ['git', 'diff', '--quiet', '--', *paths],
              check=False,
          ).returncode != 0
          if not changed:
              print('Proven native files already match the branch; nothing to publish.')
              raise SystemExit(0)

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_HEAD_REF']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          root = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'oi-living-native-finalize',
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(root + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          ref = api('GET', f'/git/ref/heads/{branch}')
          current = ref['object']['sha']
          if current != expected:
              raise SystemExit(f'branch moved before publish: expected {expected}, found {current}')
          commit = api('GET', f'/git/commits/{expected}')
          entries = []
          for path in paths:
              blob = api('POST', '/git/blobs', {
                  'content': base64.b64encode(Path(path).read_bytes()).decode(),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = api('POST', '/git/trees', {
              'base_tree': commit['tree']['sha'],
              'tree': entries,
          })
          new_commit = api('POST', '/git/commits', {
              'message': 'feat: register Living Wiki native shell and lock exact owners',
              'tree': tree['sha'],
              'parents': [expected],
          })
          api('PATCH', f'/git/refs/heads/{branch}', {
              'sha': new_commit['sha'],
              'force': False,
          })
          print(f"published proven native commit {new_commit['sha']}")
