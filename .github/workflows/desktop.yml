name: O:I desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - agent/oi-desktop-surface-host
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  # Temporary branch-scoped bootstrap for PR #99. The normal locked jobs remain
  # authoritative. This job asks Cargo itself to update only the lock changes
  # required by the changed manifest, commits that generated lock to the PR head,
  # and is removed once the locked gates accept it.
  refresh-native-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/oi-desktop-workbench-94'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Let Cargo materialise the changed native dependency graph
        shell: bash
        run: |
          set +e
          cargo check --manifest-path desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin
          check_status=$?
          set -e

          git add desktop/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'desktop: refresh native dependency lock'
            git push origin HEAD:${{ github.head_ref }}
          fi

          exit "$check_status"

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and lint O:I CLI library
        run: |
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and lint desktop core
        run: |
          cargo test --manifest-path desktop/core/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public front door against shared tokens
        run: |
          npm install --prefix site --no-audit --no-fund
          npm --prefix site run build
      - name: Build desktop rendered layer from lock
        run: |
          npm ci --prefix desktop/ui --no-audit --no-fund
          npm --prefix desktop/ui run build
      - name: Preserve Explore contract regression and desktop convergence
        run: |
          node --test shared-field/*.test.mjs
          node --test desktop/ui/src/explore-presentation.test.mjs

  native-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install rendered-layer dependencies from lock
        run: npm ci --prefix desktop/ui --no-audit --no-fund
      - name: Check Rust-owned native shell from lock
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
