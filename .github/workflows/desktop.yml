name: O:I desktop

# Guards the desktop surface only: the cradle kernel crate, the cradle web
# build and the native Tauri shell graph. The CLI is gated by verify.yml; the
# kernel tests that need built owner executables are marked ignored and run
# through `oi dev gate`, so no sibling repository is built here.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/kernel
      - name: Test and lint cradle kernel
        run: |
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets -- -D warnings

  cradle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Build cradle web bundle from the locked graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm --prefix desktop/cradle run build
      - name: Guard executable source — no unresolved markers, runner entry points parse
        working-directory: desktop/cradle
        run: |
          # The bundle build never imports the walk runner, so a syntax error
          # or an unresolved merge marker there is invisible to tsc/vite. Catch
          # both cheaply against tracked executable source (F01/F02).
          if git grep -lnE '^(<<<<<<<|>>>>>>>|=======$)' -- '*.mjs' '*.ts' '*.tsx'; then
            echo "::error::unresolved conflict markers in executable source"; exit 1
          fi
          for f in $(git ls-files 'walk/*.mjs' 'walk/scenarios/*.mjs' 'tests/*.mjs'); do
            node --check "$f" || { echo "::error::syntax error in $f"; exit 1; }
          done
          node --test tests/walk-runner.test.mjs
      - name: Prove Expression projection through the declared native engine
        working-directory: desktop/cradle
        run: node tests/expression-engine.mjs
      - name: Prove knowledge projection identity and provenance preservation
        working-directory: desktop/cradle
        run: node tests/knowledge-expression.mjs
      - name: Prove the Factory attempt-task consumer joins the native reads honestly
        working-directory: desktop/cradle
        run: node tests/factory-attempt-task.mjs
      - name: Prove Explore travel, field search and primary projection readings (SF1)
        working-directory: desktop/cradle
        run: node --test tests/explore-field.test.mjs
      - name: Prove the live configuration source against the typed kernel seam (#299 C6)
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-live-source.test.mjs
      - name: Prove the settings × composition interface (composition lock §5/§7)
        working-directory: desktop/cradle
        run: node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-composition.test.mjs
      - name: Prove Workspace state continuity across relaunch and degradation (#18/#65)
        working-directory: desktop/cradle
        run: node --test tests/workspace-continuity.test.mjs
      - name: Install browser engines for search component contracts
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium webkit
      - name: Prove search component and literal query transport (D)
        working-directory: desktop/cradle
        run: node tests/search-overlay.mjs
      - name: Prove Expression page placement and capture on one WebGL context
        working-directory: desktop/cradle
        run: node tests/expression-stage-placement.mjs
      - name: Prove shared Expression ownership and sleeping lifecycle
        working-directory: desktop/cradle
        run: |
          node tests/expression-stage-lifecycle.mjs
          node tests/expression-provider-lifecycle.mjs
          node tests/visuals-preview-lifecycle.mjs
          node tests/welcome-lifecycle.mjs
      - name: Prove desktop appearance, source syntax and native prepaint policy
        working-directory: desktop/cradle
        run: |
          node tests/desktop-appearance.mjs
          node tests/text-editor-appearance.mjs
          node tests/expression-document-appearance.mjs
          node tests/theme-prepaint-csp.mjs
          npm --prefix ../../packages/oi-design-system run verify
          npm --prefix ../../packages/oi-design-system run verify:browser
      - name: Retain search browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-component-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/search
          if-no-files-found: warn

  native-shell:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Prove locked native-shell graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          cargo check --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Prove the check did not rewrite locks
        run: git diff --exit-code -- desktop/cradle/src-tauri/Cargo.lock desktop/cradle/package-lock.json
