name: O:I desktop

# Guards the desktop being built: the candidate shell (packages/live-shell/ui)
# with its hosted Expressions frame, the shared engine it imports from
# desktop/cradle/src, the live-* crates behind its server, the cradle kernel
# and the native Tauri host. The legacy everyday desktop (CradleFrame and the
# surfaces only it reaches) is frozen while its replacement is built: no job
# here exercises it, and its own workflows run only on dispatch. The CLI is
# gated by verify.yml; kernel tests that need built owner executables are
# marked ignored and run through `oi dev gate`.

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/live-shell/**'
      - 'packages/live-set/**'
      - 'packages/live-dynamics/**'
      - 'packages/expressions-boundary/**'
      - 'packages/oi-design-system/**'
      - 'shared-field/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Read the separately qualified retained performance test source
        id: retained-performance-source
        run: |
          python3 - <<'PY_SOURCE'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('desktop/cradle/tests/fixtures/retained-performance/source-owner.json').read_text())
          assert value['schema'] == 'oi.retained-performance-test-source-owner/v1'
          assert value['repository'] == 'EpiLogos/QL-MEF'
          assert value['consumer'] == 'retained-performance-native-kernel-tests'
          assert re.fullmatch(r'[0-9a-f]{40}', value['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('revision=' + value['revision'] + '\n')
          PY_SOURCE
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/QL-MEF
          ref: ${{ steps.retained-performance-source.outputs.revision }}
          path: .native-owner/retained-performance/QL-MEF
          persist-credentials: false
      - name: Native retained performance codec dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjson-c-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            desktop/cradle/kernel
            .native-owner/retained-performance/QL-MEF
      - name: Produce the actual retained source, Manager, full workload and native checkpoints
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/retained-performance"
          python3 scripts/prepare-retained-performance-fixture.py \
            --ql-source "$GITHUB_WORKSPACE/.native-owner/retained-performance/QL-MEF" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output "$RUNNER_TEMP/retained-performance" --timeout-seconds 900 \
            > "$RUNNER_TEMP/retained-performance/result.json"
          python3 scripts/retained-performance-environment-regressions.py \
            --result "$RUNNER_TEMP/retained-performance/result.json" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output-root "$RUNNER_TEMP/retained-performance" \
            > "$RUNNER_TEMP/retained-performance/publication-counterproof.json" \
            2> "$RUNNER_TEMP/retained-performance/publication-counterproof.log"
          python3 scripts/retained-performance-ci-environment.py \
            --result "$RUNNER_TEMP/retained-performance/result.json" \
            --expected-ql-head "${{ steps.retained-performance-source.outputs.revision }}" \
            --output-root "$RUNNER_TEMP/retained-performance" --github-env "$GITHUB_ENV"
      - name: Complete cradle kernel unit and native target tests
        if: always()
        timeout-minutes: 15
        run: cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked --lib --bins --examples --benches --no-fail-fast
      - name: Complete cradle kernel integration tests
        if: always()
        timeout-minutes: 30
        run: cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked --test '*' --no-fail-fast -- --nocapture
      - name: Complete the commissioned retained performance replay suites
        if: always()
        timeout-minutes: 120
        run: |
          cargo test --release --manifest-path desktop/cradle/kernel/Cargo.toml --locked --no-fail-fast \
            --test expression_performance --test expression_performance_checkpoint --test expression_performance_delivery \
            --test expression_performance_management --test expression_performance_recording --test expression_performance_source_asset \
            -- --nocapture --include-ignored --skip actual_captured_prefix_170_to_original_171_public_native_cas_restart_and_selection --skip full_actual_fifteen_minute_committed_workload --skip full_actual_source_form_fifteen_minute_45k --skip full_original_native_source_recipe_keys --skip actual_current_world_personal_shared_and_workload
      - name: Lint all cradle kernel targets
        if: always()
        timeout-minutes: 15
        run: cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --locked --all-targets -- -D warnings
      - name: Preserve every actual producer fixture, original log and source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-performance-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/retained-performance
          if-no-files-found: error
          retention-days: 14

  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/cradle/package-lock.json
            desktop/cradle/expressions-app/package-lock.json
            packages/live-shell/ui/package-lock.json
            packages/oi-design-system/package-lock.json
      - name: Install the locked graphs the candidate builds from
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
          npm ci --prefix packages/live-shell/ui --no-audit --no-fund
          npm ci --prefix packages/oi-design-system --no-audit --no-fund
      - name: Guard executable source — no unresolved conflict markers
        run: |
          if git grep -lnE '^(<<<<<<<|>>>>>>>|=======$)' -- '*.mjs' '*.ts' '*.tsx'; then
            echo "::error::unresolved conflict markers in executable source"; exit 1
          fi
      - name: Type-check the three TypeScript roots (candidate, shared engine, hosted frame)
        if: always()
        run: |
          (cd packages/live-shell/ui && npx tsc --noEmit -p tsconfig.json)
          (cd desktop/cradle && npx tsc --noEmit)
          (cd desktop/cradle/expressions-app && npm run lint)
      - name: Candidate shell suite
        if: always()
        working-directory: packages/live-shell/ui
        run: node scripts/test-all.mjs
      - name: Shared engine suite (desktop/cradle tests that reach a file the candidate imports)
        if: always()
        working-directory: packages/live-shell/ui
        run: |
          node ../../../desktop/cradle/documents/build-personal.mjs
          node scripts/test-engine.mjs
      - name: Shared engine architecture conformance and bounded debt
        if: always()
        working-directory: desktop/cradle
        run: node --test tests/conformance/*.test.mjs
      - name: Hosted Expressions frame suite
        if: always()
        working-directory: desktop/cradle/expressions-app
        run: npm test
      - name: Expressions boundary type-check and suite
        if: always()
        working-directory: packages/expressions-boundary
        run: |
          npm run check
          npm test
      - name: Production builds of the candidate and its hosted frame
        if: always()
        run: |
          npm --prefix desktop/cradle/expressions-app run build
          npm --prefix packages/live-shell/ui run build
      - name: Install browser engines for the component contracts
        working-directory: desktop/cradle
        run: npx playwright install --with-deps chromium webkit
      # Browser contracts over components the candidate mounts (each fixture's
      # subject is candidate-reachable) and the hosted frame; none needs a live
      # native service. Contracts whose subject only the legacy desktop reaches
      # are not run here.
      - name: Browser contracts — search, text editor, Expression stage, canvas surfaces, frame formations
        working-directory: desktop/cradle
        run: |
          node tests/search-overlay.mjs
          node tests/text-editor-appearance.mjs
          node tests/expression-provider-lifecycle.mjs
          node tests/canvas-editor-browser.mjs
          node tests/formation-native-regressions.mjs
      - name: Retain browser contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-browser-contracts-${{ github.sha }}
          path: desktop/cradle/tests/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  live-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            packages/live-dynamics
            packages/live-set
            packages/live-shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/cradle/package-lock.json
            desktop/cradle/expressions-app/package-lock.json
            packages/oi-design-system/package-lock.json
      # live-shell's packaging test serves the candidate's own built frame.
      - name: Build the hosted Expressions frame the server serves
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm ci --prefix desktop/cradle/expressions-app --no-audit --no-fund
          npm ci --prefix packages/oi-design-system --no-audit --no-fund
          npm --prefix desktop/cradle/expressions-app run build
      - name: Format, lint and test the crates behind the candidate's server
        run: |
          set -euo pipefail
          for crate in live-dynamics live-set live-shell; do
            cargo fmt --manifest-path packages/$crate/Cargo.toml -- --check
            cargo clippy --manifest-path packages/$crate/Cargo.toml --locked --all-targets -- -D warnings
            cargo test --manifest-path packages/$crate/Cargo.toml --locked
          done

  native-shell:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: desktop/cradle/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Prove locked native-shell graph
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          cargo check --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
      - name: Native host clippy (everyday and candidate)
        run: |
          cargo clippy --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin --all-targets -- -D warnings
          cargo clippy --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin --all-targets --features native_shell -- -D warnings
      - name: Prove the check did not rewrite locks
        run: git diff --exit-code -- desktop/cradle/src-tauri/Cargo.lock desktop/cradle/package-lock.json
