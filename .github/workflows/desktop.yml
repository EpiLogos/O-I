name: O:I desktop

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'packages/oi-design-system/**'
      - 'site/**'
      - 'cli/src/status.rs'
      - 'cli/src/lib.rs'
      - 'cli/tests/desktop_status.rs'
      - 'skills/suite-operator/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli
            desktop/cradle/kernel
            desktop/cradle/src-tauri
          cache-on-failure: true
      - name: Test and lint O:I CLI library
        run: |
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test and lint cradle kernel
        run: |
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets
          cargo clippy --manifest-path desktop/cradle/kernel/Cargo.toml --all-targets -- -D warnings

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public front door against shared tokens
        run: |
          npm install --prefix site --no-audit --no-fund
          npm --prefix site run build
      - name: Build cradle rendered layer from lock
        run: |
          npm ci --prefix desktop/cradle --no-audit --no-fund
          npm --prefix desktop/cradle run build
      - name: Preserve shared-field presentation contracts
        run: |
          node --test shared-field/*.test.mjs

  native-shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli
            desktop/cradle/kernel
            desktop/cradle/src-tauri
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cradle dependencies from lock
        run: npm ci --prefix desktop/cradle --no-audit --no-fund
      - name: Check Rust-owned native shell from lock
        run: cargo check --manifest-path desktop/cradle/src-tauri/Cargo.toml --locked --target aarch64-apple-darwin
