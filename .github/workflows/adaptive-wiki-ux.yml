name: Adaptive Wiki UX source integration
on:
  push:
    branches: [agent/adaptive-wiki-ux-20260920]
    paths: [.github/workflows/adaptive-wiki-ux.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/adaptive-wiki-ux-20260920
      - name: Extend the existing source, not a replacement campaign
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/agent/adaptive-wiki-ux-20260920
          python3 .github/adaptive-ux.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_adaptive_wiki_ux.py')
          s = p.read_text().replace('import copy\n', '').replace(', "additional"', '')
          s = s.replace('            if text == "additional":\n                continue\n', '')
          p.write_text(s)
          PY
          rm .github/adaptive-ux.py .github/workflows/adaptive-wiki-ux.yml
          git add .wayfinder/maps/wiki-constellation-development.md docs/experience/WIKI-CONSTELLATION-UX.md docs/experience/wiki-constellation.json tests/test_adaptive_wiki_ux.py .github
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: join feedback, operational projection and governance review to Wiki UX'
          git rev-parse HEAD > /tmp/adaptive-ux-revision.txt
          git push origin HEAD:refs/heads/agent/adaptive-wiki-ux-20260920
      - name: Verify inherited and new UX obligations
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p test_adaptive_wiki_ux.py -v 2>&1 | tee /tmp/adaptive-ux.log
          python3 -m unittest discover -s tests/experience -v 2>&1 | tee /tmp/adaptive-ux-existing.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-wiki-ux-${{ github.run_id }}
          path: /tmp/adaptive-ux*
          retention-days: 7
