name: Development Field evidence inventory (not acceptance)
on:
  push:
    branches: ['ci/development-field-dc-cut', main]
    paths:
      - '.github/workflows/development-field-evidence-inventory.yml'
      - 'scripts/development-field-evidence-inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: development-field-evidence-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate the inventory and its fail-closed cut input
        shell: bash
        run: |
          python3 -m py_compile scripts/development-field-evidence-inventory.py
          python3 - <<'PY'
          import json, pathlib, runpy
          module = runpy.run_path('scripts/development-field-evidence-inventory.py', run_name='inventory_test')
          raw = pathlib.Path('tests/development-field/cut.json').read_bytes()
          assert len(module['validate_cut'](raw)['owners']) == 7
          for mutation in ('duplicate', 'branch_alias', 'wrong_repository'):
              cut = json.loads(raw)
              if mutation == 'duplicate':
                  cut['owners'][-1] = cut['owners'][0]
              elif mutation == 'branch_alias':
                  cut['owners'][0]['revision'] = 'main'
              else:
                  cut['owners'][0]['repository'] = 'different-org/oi'
              try:
                  module['validate_cut'](json.dumps(cut))
              except ValueError:
                  pass
              else:
                  raise AssertionError(mutation)
          print('Exact cut accepted; duplicate owner, moving ref and wrong repository rejected.')
          PY
      - name: Observe every exact-owner run and S7 attempt without claiming acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/development-field-evidence-inventory.py --out "$RUNNER_TEMP/development-field-inventory"
      - name: Retain the inventory source basis
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/development-field-inventory/inventory-source"
          git rev-parse HEAD > "$RUNNER_TEMP/development-field-inventory/inventory-source/revision.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/development-field-inventory/inventory-source/tree.txt"
          cp tests/development-field/cut.json scripts/development-field-evidence-inventory.py .github/workflows/development-field-evidence-inventory.yml "$RUNNER_TEMP/development-field-inventory/inventory-source/"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-field-evidence-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-field-inventory
          if-no-files-found: error
