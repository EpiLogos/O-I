name: Current-main source preflight

on:
  pull_request:
    paths:
      - 'surfaces.json'
      - 'suite/mainline.json'
      - 'suite/manifest.json'
      - 'scripts/verify-current-main-source.py'
      - 'tests/project-context-handoff/**'
      - 'tests/native-action-parity/**'
      - 'tests/journey-routine-handoff/**'
      - '.github/workflows/current-main-source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-source:
    name: current-source / ${{ matrix.product }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # O:I #97 primary live-main source owners. Quaternal Logic remains the
        # separately owned sixth product and is intentionally not a #97 live-main gate.
        product:
          - central
          - actuation
          - ai-kit
          - software-factory
          - workcell
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test exact current in-scope native-main source
        run: >-
          python3 scripts/verify-current-main-source.py
          --product '${{ matrix.product }}'
          --receipt '${{ runner.temp }}/current-main-${{ matrix.product }}.json'
      - name: Upload exact-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-main-${{ matrix.product }}
          path: ${{ runner.temp }}/current-main-${{ matrix.product }}.json
          if-no-files-found: warn

  project-context-handoff:
    name: current-source / Project Context P3→P4→P5
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tests/project-context-handoff
      - name: Exercise exact AIKit → Factory context/Run/Return seam
        run: cargo test --manifest-path tests/project-context-handoff/Cargo.toml

  native-action-parity:
    name: current-source / Factory Action human→Agent→headless
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tests/native-action-parity
      - name: Consume one exact-main Factory Action across projections
        run: cargo test --manifest-path tests/native-action-parity/Cargo.toml

  journey-routine-handoff:
    name: current-source / AgentProfile→Method proof→Routine→Journey
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: tests/journey-routine-handoff
      - name: Exercise exact Central → AIKit → Factory W12 seam
        run: cargo test --manifest-path tests/journey-routine-handoff/Cargo.toml
