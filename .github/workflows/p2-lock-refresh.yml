name: P2 native lock refresh

on:
  pull_request:
    branches:
      - agent/oi-desktop-p1-host-105
    paths:
      - 'desktop/core/Cargo.toml'
      - 'desktop/src-tauri/Cargo.lock'
      - '.github/workflows/p2-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/oi-desktop-p2-project-field-106'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate the native shell lock from the accepted owner pins
        run: cargo generate-lockfile --manifest-path desktop/src-tauri/Cargo.toml
      - name: Remove this one-shot workflow
        run: rm .github/workflows/p2-lock-refresh.yml
      - name: Commit the generated lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/src-tauri/Cargo.lock .github/workflows/p2-lock-refresh.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh P2 native AIKit lock'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
