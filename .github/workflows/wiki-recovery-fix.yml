name: Wiki recovery source integration
on:
  push:
    branches: ['agent/wiki-constellation-loop-20260920']
    paths: ['.github/workflows/wiki-recovery-fix.yml', 'scripts/wiki-recovery-edits.json']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'EpiLogos/O-I' && github.ref == 'refs/heads/agent/wiki-constellation-loop-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply only the independently tested exact source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          blob=lambda s: hashlib.sha1(b'blob '+str(len(s.encode())).encode()+b'\0'+s.encode()).hexdigest()
          prepared=[]
          for item in json.loads(Path('scripts/wiki-recovery-edits.json').read_text()):
              p=Path(item['path'])
              assert str(p).startswith(('desktop/cradle/src/knowledge/','desktop/cradle/tests/')) and '..' not in p.parts and not p.is_symlink()
              old=p.read_text();assert blob(old)==item['before'],(p,blob(old))
              new=old
              for a,b,text in reversed(item['edits']):
                  assert 0<=a<=b<=len(old)
                  new=new[:a]+text+new[b:]
              assert blob(new)==item['after'],(p,blob(new))
              prepared.append((p,new))
          for p,new in prepared:p.write_text(new)
          PY
      - name: Verify complete TypeScript and Wiki regressions before publication
        working-directory: desktop/cradle
        run: |
          npm ci
          npx tsc --noEmit
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/wiki-*.test.mjs
      - name: Publish only this branch and retire the source transport
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/agent/wiki-constellation-loop-20260920 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/cradle/src/knowledge desktop/cradle/tests
          git rm .github/workflows/wiki-recovery-fix.yml scripts/wiki-recovery-edits.json
          git commit -m 'fix(wiki): resolve direct authoring entrance and recover exact native artifact saves'
          git push origin HEAD:refs/heads/agent/wiki-constellation-loop-20260920
          git rev-parse HEAD
