name: Jev Redis NOW exact OI source verification
on:
  push:
    branches: [agent/65-jev-redis-local-integration]
    paths: ['.github/workflows/jev-redis-now-exact-source.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact requested experience tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tests/experience -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/experience-tests.log"
      - name: Exact requested experience compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/experience_map.py 2>&1 | tee "$RUNNER_TEMP/experience-map.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-redis-now-oi-exact-source
          path: |
            ${{ runner.temp }}/experience-tests.log
            ${{ runner.temp }}/experience-map.log
          retention-days: 14
