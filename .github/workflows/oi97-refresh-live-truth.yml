name: OI97 restore scoped convergence truth

on:
  push:
    branches: [repair/oi97-trust-closure]
    paths:
      - '.github/workflows/oi97-refresh-live-truth.yml'

permissions:
  contents: write

jobs:
  restore-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/oi97-trust-closure

      - name: Restore authored #97 scope and current returned state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # #97 primary convergence scope is O:I + five non-QL native owners.
          # QL-MEF remains the sixth product in suite composition while its moving
          # computational/Epi development is owned by the explicitly separate
          # convergence programme and must not gate this ref-cleanup pass.
          PRIMARY_REPOS = [
              'EpiLogos/O-I',
              'EpiLogos/Central',
              'EpiLogos/ai-kit',
              'EpiLogos/agent-system-design',
              'EpiLogos/Actuation',
              'EpiLogos/Workcell',
          ]

          ledger_path = Path('suite/convergence-ledger.json')
          ledger = json.loads(ledger_path.read_text())
          ledger['observed_at'] = '2026-08-24'
          repos = {entry['repository']: entry for entry in ledger['repositories']}
          missing = [repo for repo in PRIMARY_REPOS if repo not in repos]
          if missing:
              raise SystemExit(f'missing authored #97 primary repositories: {missing}')
          ledger['repositories'] = [repos[repo] for repo in PRIMARY_REPOS]

          def branch_map(repo):
              return {item['name']: item for item in repos[repo].get('branches', [])}

          # O:I: parallel Flow desktop work appeared while the repair was running.
          oi = repos['EpiLogos/O-I']
          oi_branches = branch_map('EpiLogos/O-I')
          oi_branches['feat/flow-desktop-138'] = {
              'name': 'feat/flow-desktop-138',
              'disposition': 'KEEP_ACTIVE_EXCEPTION',
              'owner': 'O:I #138 / Flow desktop programme',
              'reason': 'active Flow application work composing the accepted Central Flow owner and current AIKit Flow cognition into the existing Project/Canvas/AgentSession workbench',
              'reentry_condition': 'the #138 implementation line returns an owned PR/candidate and is reconciled with the selected desktop ancestry',
              'closure_blocking': False,
          }
          oi['branches'] = list(oi_branches.values())

          # Central: Flow was reconstructed on post-#94 main and accepted as PR #96.
          central = repos['EpiLogos/Central']
          central_branches = branch_map('EpiLogos/Central')
          central_branches['feat/flow-source-93'] = {
              'name': 'feat/flow-source-93',
              'disposition': 'RETIRE_SUPERSEDED',
              'owner': 'Central #93 / superseded PR #95',
              'reason': 'the original Flow branch was cut from the pre-#94 main and was explicitly superseded by the current-main reconstruction in PR #96',
              'reentry_condition': 'delete the superseded remote branch after the PR #95 → #96 provenance link is retained',
              'closure_blocking': True,
          }
          central_branches['feat/flow-source-93-main48'] = {
              'name': 'feat/flow-source-93-main48',
              'disposition': 'RETIRE_MERGED',
              'owner': 'Central #93 / merged PR #96',
              'reason': 'stable Project Flow source owner is accepted on Central main as merge 31d54eb4a6202c89c7f60ec004654916133dea94',
              'reentry_condition': 'delete the merged remote branch after accepted provenance remains reachable from PR #96/main',
              'closure_blocking': True,
          }
          central['branches'] = list(central_branches.values())
          central['open_pull_requests'] = []

          # AIKit: Flow cognition is current development from accepted Living-Wiki main.
          aikit = repos['EpiLogos/ai-kit']
          aikit_branches = branch_map('EpiLogos/ai-kit')
          aikit_branches['feat/flow-context-122'] = {
              'name': 'feat/flow-context-122',
              'disposition': 'KEEP_ACTIVE_EXCEPTION',
              'owner': 'AIKit #122 / PR #123',
              'reason': 'active Flow standing-context and Contemplate scope; deliberately provider-neutral and explicitly proves QL-absent operation',
              'reentry_condition': 'AIKit #122 acceptance/merge or explicit supersession',
              'closure_blocking': False,
          }
          aikit['branches'] = list(aikit_branches.values())
          aikit_prs = {item['number']: item for item in aikit.get('open_pull_requests', [])}
          aikit_prs[123] = {
              'number': 123,
              'disposition': 'KEEP_ACTIVE_EXCEPTION',
              'owner': 'AIKit #122',
              'reason': 'current Flow standing-context / Contemplate implementation on accepted AIKit main',
              'reentry_condition': 'owner acceptance/merge or explicit supersession',
              'closure_blocking': False,
          }
          aikit['open_pull_requests'] = list(aikit_prs.values())

          ledger['external_active_exceptions'] = [
              {
                  'repository': 'EpiLogos/QL-MEF',
                  'owner': 'dedicated QL/Epi computational convergence programme',
                  'reason': '#97 explicitly excludes the actively moving QL-MEF computational/Bimba/Pratibimba development field from its primary main-only convergence pass; QL remains a separately owned product and does not become a dependency gate for the other owners',
                  'reentry_condition': 'the dedicated QL/Epi owner session returns an explicit settled convergence candidate/handoff',
              },
              {
                  'repository': 'EpiLogos/Epi-Logos-C-Experiments',
                  'owner': 'dedicated Epi/Pratibimba producer programmes',
                  'reason': 'current Epi producer/deep-subsystem work remains coordinated source ground for the separate QL/Epi programme rather than generic #97 cleanup scope',
                  'reentry_condition': 'the producer programme returns an explicit reviewed owner/host convergence handoff',
              },
          ]
          ledger_path.write_text(json.dumps(ledger, indent=2) + '\n')

          # Restore verifier hard boundary to exactly the six repositories authored by #97.
          verifier_path = Path('scripts/verify-convergence-ledger.py')
          verifier = verifier_path.read_text()
          verifier = verifier.replace(
              '    "EpiLogos/Workcell",\n    "EpiLogos/QL-MEF",\n}',
              '    "EpiLogos/Workcell",\n}',
          )
          if '"EpiLogos/QL-MEF",\n}' in verifier:
              raise SystemExit('QL-MEF still present in #97 REQUIRED_REPOSITORIES')
          verifier_path.write_text(verifier)

          # Refresh the accepted source snapshot for in-scope owners. QL remains a
          # separately pinned parallel product observation and is intentionally not
          # live-equality-gated by #97.
          snapshot_path = Path('suite/mainline.json')
          snapshot = json.loads(snapshot_path.read_text())
          snapshot['observed_at'] = '2026-08-24'
          products = {item['id']: item for item in snapshot['products']}
          products['central'].update({
              'revision': '31d54eb4a6202c89c7f60ec004654916133dea94',
              'state': 'accepted-main',
              'note': 'Current Central main includes current-machine↔Workcell, authored Project ground, NOW/DAY, Agent governance, Source Change Horizon, native host extensions and the stable Project Flow source owner merged through PR #96.',
          })
          products['quaternal-logic'].update({
              'revision': '30171fb9f3646a1ef6e306357503d8a9df4a8a1c',
              'state': 'parallel-native-owner-exception',
              'note': 'QL-MEF remains the separately owned sixth product. This is the stable suite source pin observed before the currently moving QL/Epi computational and musical tranche; #97 does not chase or converge that development field, which has its own owner session.',
          })
          snapshot_path.write_text(json.dumps(snapshot, indent=2) + '\n')

          # Mainline verifier: keep six-product structural/source coherence, but live
          # equality is only a #97 gate for the five in-scope native product owners.
          mainline_verifier_path = Path('scripts/verify-mainline-snapshot.py')
          mv = mainline_verifier_path.read_text()
          marker = '''EXPECTED_IDS = {
              "central",
              "actuation",
              "ai-kit",
              "software-factory",
              "workcell",
              "quaternal-logic",
          }
'''
          replacement = marker + '''PARALLEL_LIVE_EXCEPTIONS = {"quaternal-logic"}
'''
          if 'PARALLEL_LIVE_EXCEPTIONS' not in mv:
              if marker not in mv:
                  raise SystemExit('mainline EXPECTED_IDS anchor moved')
              mv = mv.replace(marker, replacement, 1)
          old = '''        if args.live:
                      observed = live_main(product["repository"])
                      if observed != revision:
                          die(
                              f"{product_id} live main moved: snapshot {revision}, live {observed}; "
                              "update the snapshot/catalog or explicitly reclassify the line before claiming convergence"
                          )
'''
          new = '''        if args.live and product_id not in PARALLEL_LIVE_EXCEPTIONS:
                      observed = live_main(product["repository"])
                      if observed != revision:
                          die(
                              f"{product_id} live main moved: snapshot {revision}, live {observed}; "
                              "update the snapshot/catalog or explicitly reclassify the line before claiming convergence"
                          )
                  elif args.live and product_id in PARALLEL_LIVE_EXCEPTIONS:
                      if product.get("state") != "parallel-native-owner-exception":
                          die(f"{product_id} must declare parallel-native-owner-exception while outside #97 live-main gating")
'''
          if old not in mv:
              raise SystemExit('mainline live-equality anchor moved')
          mv = mv.replace(old, new, 1)
          mv = mv.replace(
              '        print("live native-main equality: PASS")',
              '        print("live #97 in-scope native-main equality: PASS; QL-MEF parallel owner: NOT GATED")',
          )
          mainline_verifier_path.write_text(mv)

          # Align the source catalogue with the same six-product snapshot. QL stays
          # represented as a product without its moving owner programme becoming a
          # generic #97 dependency.
          surfaces_path = Path('surfaces.json')
          surfaces = json.loads(surfaces_path.read_text())
          surfaces['verified_at'] = '2026-08-24'
          pins = {
              'central': '31d54eb4a6202c89c7f60ec004654916133dea94',
              'actuation': 'bb36b3c20561359bdfbc5c826a11d15a5e693aed',
              'ai-kit': 'e440153051d3b26481a369a4e53536056b54d3ec',
              'software-factory': 'ec08c99a55a6320c6f59d3c73024b5d48063a989',
              'workcell': '3949f8c5e8e9f75d1e7b34d10f119da2881e5496',
              'quaternal-logic': '30171fb9f3646a1ef6e306357503d8a9df4a8a1c',
          }
          by_id = {surface['id']: surface for surface in surfaces['surfaces']}
          if set(by_id) != set(pins):
              raise SystemExit(f'surface id set drift: {sorted(by_id)}')
          for surface_id, revision in pins.items():
              surface = by_id[surface_id]
              surface['docs_ref'] = revision
              surface['install']['ref'] = revision
              surface['install']['revision'] = revision

          by_id['central']['verification']['note'] = (
              'Portable Central acceptance targets current main including ProjectCentral, current-machine↔Workcell, native host extensions and the accepted Flow source owner. Physical owner-world observations remain separate evidence.'
          )
          by_id['central']['compatibility'] = (
              'Central current main owns the personal/Project source world, current-machine relation, Living Wiki source-change horizon, Flow and native host extension seams. O:I composes these without taking ownership of their source or provider policy.'
          )
          by_id['ai-kit']['verification']['note'] = (
              'Current accepted AIKit main includes V2/SessionSpace/Knowledge/ProjectCentral/praxis, harness admission and bounded Living Knowledge Contemplate. Flow #122/#123 and other named lines remain explicit development exceptions.'
          )
          by_id['quaternal-logic']['verification']['note'] = (
              'This stable QL-MEF suite pin records the separately owned product without making its currently moving computational/music/Epi programme a #97 closure dependency. QL owner convergence proceeds in its dedicated session.'
          )
          by_id['quaternal-logic']['compatibility'] = (
              'Quaternal Logic remains an optional, independently owned product in the six-position field. O:I can compose its accepted interfaces when present; #97 does not converge or gate on the active QL/Epi development topology.'
          )
          surfaces_path.write_text(json.dumps(surfaces, indent=2) + '\n')
          PY

      - name: Verify checked-in structures
        run: |
          python3 scripts/verify-mainline-snapshot.py
          python3 scripts/verify-convergence-ledger.py

      - name: Prove live #97 owner truth
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-mainline-snapshot.py --live
          python3 scripts/verify-convergence-ledger.py --live

      - name: Commit correction and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add suite/mainline.json surfaces.json suite/convergence-ledger.json scripts/verify-convergence-ledger.py scripts/verify-mainline-snapshot.py
          git rm .github/workflows/oi97-refresh-live-truth.yml
          git commit -m '[OI97] Restore parallel QL boundary and scoped convergence truth'
          git push origin HEAD:repair/oi97-trust-closure
