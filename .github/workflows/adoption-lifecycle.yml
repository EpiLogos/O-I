name: Adoption lifecycle
on:
  push:
    branches: [agent/adoption-lifecycle-20260920]
  pull_request:
    paths:
      - '.github/workflows/adoption-lifecycle.yml'
      - 'cli/**'
      - 'desktop/cradle/src/configuration/**'
      - 'desktop/cradle/src/workspace/settings/v2/SystemHome.tsx'
      - 'desktop/cradle/kernel/**'
      - 'desktop/cradle/tests/*adoption*'
      - 'desktop/cradle/walk/*adoption*'
      - 'scripts/*adoption*'
permissions:
  contents: read
concurrency:
  group: adoption-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Install the desktop cradle graph the CLI's hosted-contracts tests exercise
        run: npm ci --prefix desktop/cradle --no-audit --no-fund
      - name: Record exact source
        run: |
          set -euo pipefail
          mkdir -p /tmp/adoption-evidence
          git rev-parse HEAD | tee /tmp/adoption-evidence/head.txt
          python3 - <<'PY'
          import subprocess, tarfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          prefixes = ('cli/', 'desktop/cradle/src/', 'desktop/cradle/kernel/', 'desktop/cradle/tests/', 'desktop/cradle/walk/', 'packages/', 'suite/', 'shared-field/', 'desktop/documents/', 'docs/', '.wayfinder/', 'skills/', 'scripts/', '.github/workflows/')
          selected = [p for p in paths if p and (p.startswith(prefixes) or (p.startswith('desktop/cradle/') and p.count('/') == 2)) and '/artifacts/' not in p and Path(p).is_file()]
          assert 'desktop/cradle/src/configuration/PlanDrawer.tsx' in selected
          assert 'cli/src/setup.rs' in selected
          with tarfile.open('/tmp/adoption-evidence/source.tar.gz', 'w:gz') as archive:
              for path in selected:
                  archive.add(path, arcname=path, recursive=False)
          PY
      - name: Adoption controller and real CLI tests
        run: |
          set -o pipefail
          cargo test --manifest-path cli/Cargo.toml --locked --test setup_lifecycle 2>&1 | tee /tmp/adoption-evidence/setup-tests.log
      - name: Full native regression suite
        if: always()
        run: |
          set -o pipefail
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked 2>&1 | tee /tmp/adoption-evidence/native-tests.log
      - name: Native kernel transport regressions
        if: always()
        run: |
          set -o pipefail
          cargo test --manifest-path desktop/cradle/kernel/Cargo.toml --locked 2>&1 | tee /tmp/adoption-evidence/kernel-tests.log
      - name: Actual CLI and terminal acceptance in disposable HOME
        if: always()
        run: python3 scripts/test-adoption-local.py --oi cli/target/debug/oi --output /tmp/adoption-evidence/local-cli.json
      - name: Native lint
        if: always()
        run: |
          set -o pipefail
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee /tmp/adoption-evidence/clippy.log
      - name: Retain controlled executable and formatter
        if: always()
        run: |
          if test -f cli/target/debug/oi; then cp cli/target/debug/oi /tmp/adoption-evidence/oi; strip /tmp/adoption-evidence/oi; fi
          cp "$(rustup which rustfmt)" /tmp/adoption-evidence/rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Existing configuration and adoption regressions
        if: always()
        working-directory: desktop/cradle
        run: |
          npm ci --no-audit --no-fund
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-setup.test.mjs tests/adoption-lifecycle.test.mjs > /tmp/adoption-evidence/configuration-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-native-${{ github.run_id }}
          path: /tmp/adoption-evidence
          retention-days: 5
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: desktop/cradle
      - name: Whole desktop type check and build
        working-directory: desktop/cradle
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee /tmp/adoption-types.log
          npx vite build 2>&1 | tee /tmp/adoption-build.log
      - run: npx playwright install --with-deps chromium webkit
        if: always()
        working-directory: desktop/cradle
      - name: Existing configuration browser regression
        if: always()
        working-directory: desktop/cradle
        run: node walk/configuration-setup.test.mjs
      - name: Adoption browser interaction
        if: always()
        working-directory: desktop/cradle
        run: node walk/adoption-lifecycle.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-browser-${{ github.run_id }}
          path: |
            desktop/cradle/tests/artifacts/configuration-setup
            desktop/cradle/tests/artifacts/adoption-lifecycle
            /tmp/adoption-types.log
            /tmp/adoption-build.log
          retention-days: 5
  mac-packet-compile:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile explicit opt-in media checker without accessing devices
        run: swiftc scripts/adoption-media-check.swift -o /tmp/adoption-media-check
