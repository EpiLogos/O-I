name: Adoption lifecycle
on:
  push:
    branches: [agent/adoption-lifecycle-20260920]
  pull_request:
    paths:
      - '.github/workflows/adoption-lifecycle.yml'
      - 'cli/**'
      - 'desktop/cradle/src/configuration/**'
      - 'desktop/cradle/kernel/**'
      - 'desktop/cradle/tests/*adoption*'
      - 'desktop/cradle/walk/*adoption*'
      - 'scripts/test-adoption-local.py'
permissions:
  contents: read
concurrency:
  group: adoption-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      # Temporary scoped CLI delivery; removed before review-ready promotion.
      - name: Repair the recovered branch compilation
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/adoption-lifecycle-20260920'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cli/src/setup_command.rs')
          s = p.read_text()
          s = s.replace('json!(receipt.bundle_sha256)', 'json!(receipt.bundle.sha256)')
          p.write_text(s)
          p = Path('cli/src/current_world.rs')
          s = p.read_text()
          s = s.replace('let cases: [(&[&str], &str); 5] = [', 'let cases: [(&[&str], &str); 4] = [')
          p.write_text(s)
          PY
          git add cli/src/setup_command.rs cli/src/current_world.rs
          if ! git diff --cached --quiet; then
            git config user.name 'O:I adoption implementation'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(adoption): verify native Desktop bundle and retain four local composition cases'
            git push origin HEAD:refs/heads/agent/adoption-lifecycle-20260920
          fi
      - name: Record exact source and controlled dependencies
        if: always()
        run: |
          mkdir -p /tmp/adoption-evidence
          git rev-parse HEAD | tee /tmp/adoption-evidence/head.txt
          git archive --format=tar HEAD cli desktop/cradle/src desktop/cradle/kernel desktop/cradle/tests desktop/cradle/walk/configuration-setup.test.mjs desktop/cradle/package.json desktop/cradle/package-lock.json desktop/cradle/tsconfig.json desktop/cradle/vite.config.ts desktop/packages docs .wayfinder skills scripts .github/workflows | gzip > /tmp/adoption-evidence/source.tar.gz
      - name: Adoption controller and real CLI tests
        run: |
          set -o pipefail
          cargo test --manifest-path cli/Cargo.toml --locked --test setup_lifecycle 2>&1 | tee /tmp/adoption-evidence/setup-tests.log
      - name: Full native regression suite
        if: always()
        run: |
          set -o pipefail
          cargo test --manifest-path cli/Cargo.toml --all-targets --locked 2>&1 | tee /tmp/adoption-evidence/native-tests.log
      - name: Native lint
        if: always()
        run: |
          set -o pipefail
          cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee /tmp/adoption-evidence/clippy.log
      - name: Retain controlled executable and formatter
        if: always()
        run: |
          if test -f cli/target/debug/oi; then cp cli/target/debug/oi /tmp/adoption-evidence/oi; strip /tmp/adoption-evidence/oi; fi
          cp "$(rustup which rustfmt)" /tmp/adoption-evidence/rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/cradle/package-lock.json
      - name: Recover the existing configuration regression dependencies
        if: always()
        working-directory: desktop/cradle
        run: |
          npm ci --no-audit --no-fund
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/configuration-setup.test.mjs > /tmp/adoption-evidence/configuration-tests.log 2>&1
          tar czf /tmp/adoption-evidence/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoption-native-${{ github.run_id }}
          path: /tmp/adoption-evidence
          retention-days: 5
