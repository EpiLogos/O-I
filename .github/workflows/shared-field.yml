name: Shared field

on:
  push:
    branches:
      - main
    paths:
      - 'shared-field/**'
      - '.github/workflows/shared-field.yml'
  pull_request:
    paths:
      - 'shared-field/**'
      - '.github/workflows/shared-field.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared-field contract, Explore, A2A and security tests
        run: node --test shared-field/*.test.mjs

  spacetimedb-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SpaceTimeDB SDK client dependencies
        run: npm install --prefix shared-field/spacetimedb
      - name: Install SpaceTimeDB CLI 2.8.1
        shell: bash
        run: |
          curl -sSf https://install.spacetimedb.com | \
            SPACETIME_DOWNLOAD_ROOT="https://github.com/clockworklabs/SpacetimeDB/releases/download/v2.8.1" \
            sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          spacetime version install 2.8.1
          spacetime version use 2.8.1
          spacetime --version | tee /tmp/spacetimedb-version.txt
          grep -q '2.8.1' /tmp/spacetimedb-version.txt
      - name: Build SpaceTimeDB shared-field module
        run: spacetime build --module-path shared-field/spacetimedb
      - name: Start local SpaceTimeDB
        shell: bash
        run: |
          spacetime start --listen-addr 127.0.0.1:3000 > /tmp/spacetimedb.log 2>&1 &
          echo $! > /tmp/spacetimedb.pid
          for attempt in $(seq 1 60); do
            if spacetime server ping local; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/spacetimedb.log
          exit 1
      - name: Publish live shared-field security database
        run: spacetime publish oi-shared-field-ci --server local --module-path shared-field/spacetimedb --yes=all
      - name: Generate current TypeScript client bindings
        run: spacetime generate --lang typescript --out-dir shared-field/spacetimedb/module_bindings --module-path shared-field/spacetimedb
      - name: Prove large client envelopes survive native process exit
        run: node --test shared-field/spacetimedb/field-cli.test.mjs
      - name: Prove unavailable relation isolation and exact owner repair
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        working-directory: shared-field/spacetimedb
        run: npx tsx relation-recovery-live-acceptance.ts
      - name: Prove Phase 1 privacy, Phase 2 Admission and Phase 3 Exchange conformance
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: npm --prefix shared-field/spacetimedb run acceptance
      - name: Prove live SharedField drives Explore Surface and Projection refinement
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: npm --prefix shared-field/spacetimedb run acceptance:explore-surface
      - name: Prove W11 authorised Projection return across application Surfaces
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: npm --prefix shared-field/spacetimedb run acceptance:w11-return
      - name: Publish a Central-shaped inhabited world (wiki, Positions, occupancy, constellation) through the real Projection provider and hosted push
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: |
          node shared-field/scripts/publish-world.mjs \
            --selection shared-field/fixtures/central-world-ci.selection.json \
            --reading shared-field/fixtures/central-world-ci.root-reading.json \
            --reading shared-field/fixtures/central-world-ci.project-reading.json \
            --reading shared-field/fixtures/central-world-ci.positions.json \
            --reading shared-field/fixtures/central-world-ci.population.json \
            --reading shared-field/fixtures/central-world-ci.constellation.json \
            --sentinel PRIVATE_SENTINEL --sentinel identity.md --sentinel 'wiki:node:identity' \
            --sentinel agent-session --sentinel 'claude-code:session' --sentinel 'ws://100.64.0.7' --sentinel 'Control/agents/expressions' \
            --out /tmp/oi-world-ci
          npm --prefix shared-field/spacetimedb run publish:world -- --bundle /tmp/oi-world-ci/bundle.json --token-file /tmp/oi-world-ci/owner-token --receipt /tmp/oi-world-ci/receipt.json
          node -e '
            const receipt = JSON.parse(require("fs").readFileSync("/tmp/oi-world-ci/receipt.json", "utf8"));
            const want = ["world:ci:central:project:Fixture/central:position:project:Fixture:anima-4", "world:ci:central:project:Fixture/central:position:project:Fixture:aletheia-5", "world:ci:central:project:Fixture/wiki:frame:ci-fixture-inquiry"];
            for (const ref of want) if (!receipt.entries.includes(ref)) throw new Error(`hosted field lacks ${ref}`);
            for (const kind of ["oi.world/position", "oi.world/constellation", "aikit.constellation/participation", "oi.world/works-on"]) if (!receipt.relations.some((ref) => ref.includes(`#${kind}#`))) throw new Error(`hosted field lacks a ${kind} relation`);
            if (!receipt.source.revision.startsWith("oi.world-sources/v1:")) throw new Error("the inhabited World carries its composite source revision");
            console.log("hosted World carries", receipt.entries.length, "entries and", receipt.relations.length, "relations");'
      - name: Prove two independently grounded worlds meet, contribute, return and re-project in one field
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: npm --prefix shared-field/spacetimedb run acceptance:two-world
      - name: Prove the revisioned Shared Stage with two independently admitted identities
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_DATABASE: oi-shared-field-ci
        run: npm --prefix shared-field/spacetimedb run acceptance:shared-stage
      - name: Publish isolated live A2A SharedField database
        run: spacetime publish oi-shared-field-a2a-ci --server local --module-path shared-field/spacetimedb --yes=all
      - name: Prove grant-gated A2A exchange returns only to generic quarantine
        env:
          SPACETIMEDB_URI: ws://127.0.0.1:3000
          SPACETIMEDB_A2A_DATABASE: oi-shared-field-a2a-ci
        run: npm --prefix shared-field/spacetimedb run acceptance:a2a
      - name: Show SpaceTimeDB log on failure
        if: failure()
        run: cat /tmp/spacetimedb.log || true
