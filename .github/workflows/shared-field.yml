name: Shared field

on:
  push:
    branches:
      - platform/shared-field-explore
      - research/cordis-composable-agency
    paths:
      - 'shared-field/**'
      - '.github/workflows/shared-field.yml'
  pull_request:
    paths:
      - 'shared-field/**'
      - '.github/workflows/shared-field.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared-field contract and Explore tests
        run: node --test shared-field/*.test.mjs
