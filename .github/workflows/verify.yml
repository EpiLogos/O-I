name: OI Verify

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply rustfmt on development branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          cargo fmt --manifest-path cli/Cargo.toml
          if ! git diff --quiet -- cli; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cli
            git commit -m "style: rustfmt oi CLI"
            git push
          fi
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path cli/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets
      - name: Descriptor JSON
        run: python -m json.tool surfaces.json >/dev/null
