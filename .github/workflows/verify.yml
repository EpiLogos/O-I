name: OI Verify

# The one pull-request gate for O:I. Every claim a change to the CLI or the
# suite data must satisfy runs here, once, on the tree being merged:
#   suite-data       pure-python checks of the checked-in suite records
#   rust             format, lint, tests and the binary-backed smokes
#   central-bootstrap O:I's own install path from a clean HOME (only when the
#                    CLI or suite data changed)
# Surface-specific work has its own path-scoped workflow (desktop.yml,
# site.yml, shared-field.yml, npm-distribution.yml). Checks that build or
# test sibling repositories run weekly in cross-product.yml, never per push.
# Artifacts are built from main by release.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'Antykathera-Essay-Work/**'
      - 'ProjectCentral/**'
      - 'quarry/**'
      - '.superpowers/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'Antykathera-Essay-Work/**'
      - 'ProjectCentral/**'
      - 'quarry/**'
      - '.superpowers/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'suite/**'
              - 'surfaces.json'
              - 'schemas/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/workflows/verify.yml'

  suite-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Descriptor JSON
        run: python3 -m json.tool surfaces.json >/dev/null
      - name: Mainline snapshot and historical build record stay distinct
        run: python3 scripts/verify-mainline-snapshot.py
      - name: Convergence ledger structure
        run: python3 scripts/verify-convergence-ledger.py
      - name: Development Field S0 protocol, package and suite conformance
        run: python3 scripts/verify-development-field-s0.py
      - name: Product capability collation matches carried sources
        run: |
          python3 scripts/collate-product-capabilities.py --check-snapshot
          python3 -m unittest -v tests/test_collate_product_capabilities.py
      - name: Routing descriptor selection (fixtures only)
        run: python3 scripts/test-desktop-suite-routing-descriptors.py -v
      - name: CI helper unit tests
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_install_retry.py -v
          python3 -m unittest discover -s tests/development-field -p test_ci_execution.py -v

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets --locked
      - name: Build the binary the smokes below exercise
        run: cargo build --manifest-path cli/Cargo.toml --locked
      - name: CLI capability disclosure matches the shipped projection
        run: |
          cli/target/debug/oi capabilities --json > "$RUNNER_TEMP/oi-capabilities.json"
          python3 - "$RUNNER_TEMP/oi-capabilities.json" <<'PY'
          import json, sys
          from pathlib import Path
          expected = json.loads(Path('suite/product-capabilities.json').read_text())
          observed = json.loads(Path(sys.argv[1]).read_text())
          assert expected == observed, 'oi capabilities --json drifted from suite/product-capabilities.json'
          PY
      - name: S0 suite command surface fails closed before activation
        shell: bash
        run: |
          set -euo pipefail
          export OI_HOME="$RUNNER_TEMP/oi-config"
          export OI_DATA_HOME="$RUNNER_TEMP/oi-data"
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"

          "$OI" protocol --json | jq -e '.protocol == "1.0"'
          "$OI" suite status --json | jq -e '.selected_channel == "mainline" and .active == null and .historical_manifest_authority == false'
          "$OI" suite check --json | jq -e '.ok == true and .active_receipt == null'
          "$OI" suite channel source
          "$OI" suite channel --json | jq -e '.channel == "source"'

          if "$OI" suite update >"$RUNNER_TEMP/source-update.log" 2>&1; then
            echo "source update unexpectedly activated without six developer-source registrations" >&2
            exit 1
          fi
          grep -F "source suite requires all six current developer registrations" "$RUNNER_TEMP/source-update.log"

          "$OI" suite channel mainline
          if "$OI" suite update >"$RUNNER_TEMP/mainline-update.log" 2>&1; then
            echo "mainline update unexpectedly borrowed an unmaterialised or historical candidate" >&2
            exit 1
          fi
          grep -F "Historical suite/manifest.json is evidence-only" "$RUNNER_TEMP/mainline-update.log"

          "$OI" where central --json | jq -e '.product == "central" and .authority == "legacy-fallback-no-active-receipt"'
      - name: Omarchy host lifecycle is deterministic against the pinned contract
        shell: bash
        run: |
          set -euo pipefail
          OI="$GITHUB_WORKSPACE/cli/target/debug/oi"
          contract="$RUNNER_TEMP/omarchy-contract"
          git init -q "$contract"
          git -C "$contract" remote add origin https://github.com/omacom/omarchy.git
          git -C "$contract" fetch --depth 1 origin d3d23fdddef846ebb98b52122a6ece66211c0daf
          git -C "$contract" checkout -q --detach FETCH_HEAD
          test "$(git -C "$contract" rev-parse HEAD)" = "d3d23fdddef846ebb98b52122a6ece66211c0daf"
          "$contract/bin/omarchy-plugin-validate" "$GITHUB_WORKSPACE/integrations/omarchy/org.epilogos.oi"
          "$contract/bin/omarchy-plugin-validate" "$GITHUB_WORKSPACE/integrations/omarchy/org.epilogos.oi.switcher"

          tmp_home="$(mktemp -d)"
          mkdir -p "$tmp_home/.config/omarchy"
          printf '%s\n' '{"version":1,"plugins":[]}' > "$tmp_home/.config/omarchy/shell.json"
          before="$(sha256sum "$tmp_home/.config/omarchy/shell.json" | cut -d' ' -f1)"
          "$OI" host omarchy plan --home "$tmp_home" --json > "$RUNNER_TEMP/omarchy-plan.json"
          "$OI" host omarchy realise --home "$tmp_home" --json > "$RUNNER_TEMP/omarchy-realise.json"
          "$OI" host omarchy verify --home "$tmp_home" --json > "$RUNNER_TEMP/omarchy-verify.json"
          "$OI" host omarchy realise --home "$tmp_home" --json > "$RUNNER_TEMP/omarchy-realise-2.json"
          after="$(sha256sum "$tmp_home/.config/omarchy/shell.json" | cut -d' ' -f1)"
          test "$before" = "$after"
          grep -q '"contract_revision": "d3d23fdddef846ebb98b52122a6ece66211c0daf"' "$RUNNER_TEMP/omarchy-verify.json"
          grep -q '"state": "exact"' "$RUNNER_TEMP/omarchy-verify.json"
          ! grep -q 'shell.json.*create' "$RUNNER_TEMP/omarchy-realise.json"

  central-bootstrap:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Clean O:I to native current Central encounter
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_HOME="$HOME"
          TEST_HOME="$RUNNER_TEMP/oi-home"
          mkdir -p "$TEST_HOME/bin"
          export HOME="$TEST_HOME"
          export OI_HOME="$TEST_HOME/.config/oi"
          export OI_BIN_DIR="$TEST_HOME/bin"
          export OI_CARGO_ROOT="$TEST_HOME/oi-cargo"
          export RUSTUP_HOME="$ORIGINAL_HOME/.rustup"
          export CARGO_HOME="$ORIGINAL_HOME/.cargo"
          export PATH="$OI_BIN_DIR:$ORIGINAL_HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"

          bash cli/install.sh
          if command -v ctrl >/dev/null 2>&1; then
            echo "clean bootstrap unexpectedly began with ctrl on PATH"
            exit 1
          fi

          oi install central
          oi init --personal-ground "$HOME/Central"
          oi status --json > "$RUNNER_TEMP/status.json"
          oi ctrl doctor --json > "$RUNNER_TEMP/doctor.json"
          oi ctrl action list --json > "$RUNNER_TEMP/actions.json"
          oi init --personal-ground "$HOME/Central"

          oi snapshot --output "$RUNNER_TEMP/suite.json"
          set +e
          oi verify \
            --snapshot "$RUNNER_TEMP/suite.json" \
            --receipt "$RUNNER_TEMP/receipt.json" \
            --json > "$RUNNER_TEMP/verify.json"
          VERIFY_EXIT=$?
          set -e
          if [ "$VERIFY_EXIT" -ne 3 ]; then
            echo "partial Central pre-local verification returned $VERIFY_EXIT, expected 3"
            exit 1
          fi

          mkdir -p "$HOME/existing/demo/.git"
          printf '%s\n' 'ref: refs/heads/main' > "$HOME/existing/demo/.git/HEAD"
          printf '%s\n' 'ordinary work' > "$HOME/existing/demo/work.txt"
          oi migrate "$HOME/existing/demo"

          mkdir -p "$HOME/another/demo"
          printf '%s\n' 'collision source' > "$HOME/another/demo/work.txt"
          if oi migrate "$HOME/another/demo"; then
            echo "collision migration unexpectedly succeeded"
            exit 1
          fi
          test -f "$HOME/another/demo/work.txt"

          python3 - \
            "$HOME/Central" \
            "$OI_HOME/composition.json" \
            "$RUNNER_TEMP/status.json" \
            "$RUNNER_TEMP/doctor.json" \
            "$RUNNER_TEMP/actions.json" \
            "$RUNNER_TEMP/suite.json" \
            "$RUNNER_TEMP/verify.json" \
            "$RUNNER_TEMP/receipt.json" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          state = json.load(open(sys.argv[2]))
          status = json.load(open(sys.argv[3]))
          doctor = json.load(open(sys.argv[4]))
          actions = json.load(open(sys.argv[5]))
          suite = json.load(open(sys.argv[6]))
          verify = json.load(open(sys.argv[7]))
          receipt = json.load(open(sys.argv[8]))
          mainline = json.load(open("suite/mainline.json"))
          release = json.load(open("suite/manifest.json"))

          required = [
              "Control/user",
              "Control/agents/governance",
              "Control/agents/wiki",
              "Control/machines",
              ".central",
              "Work",
          ]
          for relative in required:
              assert (root / relative).is_dir(), relative
          for relative in ["Control/user", "Control/agents/governance"]:
              assert list((root / relative).iterdir()) == [], relative
          # Fresh-ground machine adoption (Central #87 through O:I #192):
          # exactly one authored current-machine declaration, bound to the
          # local Workcell.
          assert [p.name for p in (root / "Control/machines").iterdir()] == ["current.json"]
          machine = json.load(open(root / "Control/machines/current.json"))
          assert machine["role"] == "current"
          assert machine["bindings"] == [{"kind": "workcell", "reference": "workcell:local"}]
          assert (root / "Control/agents/wiki/wiki.json").is_file()

          assert set(state) == {"schema", "personal_ground", "modules"}
          assert state["personal_ground"] == str(root)
          central = state["modules"]["central"]
          assert set(central) <= {"id", "public_name", "native_executable", "alias", "version", "docs", "skill", "root", "modality", "install_source"}
          assert central["alias"] == "ctrl"
          # Installation modality (#192): the fresh-ground frame is recorded
          # on the registration, with the pinned source build declared.
          assert central["modality"] == "fresh-ground"
          assert central["install_source"] == "oi-pinned-source-build"
          current_central = next(item for item in mainline["products"] if item["id"] == "central")["revision"]
          released_central = next(item for item in release["products"] if item["id"] == "central")["revision"]
          assert central["version"] == current_central
          assert current_central != released_central

          central_status = next(item for item in status["surfaces"] if item["id"] == "central")
          assert central_status["state"] == "registered"
          assert central_status["modality"] == "fresh-ground"
          assert central_status["install_source"] == "oi-pinned-source-build"
          assert doctor["status"] == "success" and doctor["data"]["valid"] is True
          ids = {item["id"] for item in actions["data"]["actions"]}
          assert {
              "action.list",
              "central.init",
              "central.doctor",
              "projectcentral.inspect",
              "projectcentral.doctor",
              "projectcentral.init",
              "machine.adopt-current",
          } <= ids

          assert suite["kind"] == "oi.suite-snapshot/v1"
          assert suite["completeness"] == "partial-or-unaccepted"
          assert [item["id"] for item in suite["surfaces"]] == ["central"]
          assert suite["surfaces"][0]["selection"]["value"] == central["version"]
          assert suite["surfaces"][0]["mainline_accepted"] is False

          assert verify["kind"] == "oi.composition-receipt/v1"
          assert verify["environment"] == "pre-local"
          assert verify["result"] == "incomplete"
          central_verify = next(item for item in verify["surfaces"] if item["id"] == "central")
          assert central_verify["status"] == "passed"
          assert central_verify["verification_operation"] == "central.doctor"
          assert central_verify["evidence"]["exit_code"] == 0
          assert json.loads(central_verify["evidence"]["stdout"])["data"]["valid"] is True
          assert receipt == verify

          migrated = root / "Work/demo"
          assert (migrated / ".git/HEAD").read_text().strip() == "ref: refs/heads/main"
          assert (migrated / "work.txt").read_text().strip() == "ordinary work"
          PY
