name: OI Verify

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Format
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check
      - name: Check
        run: cargo check --manifest-path cli/Cargo.toml --all-targets
      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path cli/Cargo.toml --all-targets
      - name: Descriptor JSON
        run: python -m json.tool surfaces.json >/dev/null

  central-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Clean O:I to native current Central encounter
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL_HOME="$HOME"
          TEST_HOME="$RUNNER_TEMP/oi-home"
          mkdir -p "$TEST_HOME/bin"
          export HOME="$TEST_HOME"
          export OI_HOME="$TEST_HOME/.config/oi"
          export OI_BIN_DIR="$TEST_HOME/bin"
          export OI_CARGO_ROOT="$TEST_HOME/oi-cargo"
          export RUSTUP_HOME="$ORIGINAL_HOME/.rustup"
          export CARGO_HOME="$ORIGINAL_HOME/.cargo"
          export PATH="$OI_BIN_DIR:$ORIGINAL_HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"

          bash cli/install.sh
          if command -v ctrl >/dev/null 2>&1; then
            echo "clean bootstrap unexpectedly began with ctrl on PATH"
            exit 1
          fi

          oi install central
          oi init --personal-ground "$HOME/Central"
          oi status --json > "$RUNNER_TEMP/status.json"
          oi ctrl doctor --json > "$RUNNER_TEMP/doctor.json"
          oi ctrl action list --json > "$RUNNER_TEMP/actions.json"
          oi init --personal-ground "$HOME/Central"

          oi snapshot --output "$RUNNER_TEMP/suite.json"
          set +e
          oi verify \
            --snapshot "$RUNNER_TEMP/suite.json" \
            --receipt "$RUNNER_TEMP/receipt.json" \
            --json > "$RUNNER_TEMP/verify.json"
          VERIFY_EXIT=$?
          set -e
          if [ "$VERIFY_EXIT" -ne 3 ]; then
            echo "partial Central pre-local verification returned $VERIFY_EXIT, expected 3"
            exit 1
          fi

          mkdir -p "$HOME/existing/demo/.git"
          printf '%s\n' 'ref: refs/heads/main' > "$HOME/existing/demo/.git/HEAD"
          printf '%s\n' 'ordinary work' > "$HOME/existing/demo/work.txt"
          oi migrate "$HOME/existing/demo"

          mkdir -p "$HOME/another/demo"
          printf '%s\n' 'collision source' > "$HOME/another/demo/work.txt"
          if oi migrate "$HOME/another/demo"; then
            echo "collision migration unexpectedly succeeded"
            exit 1
          fi
          test -f "$HOME/another/demo/work.txt"

          python3 - \
            "$HOME/Central" \
            "$OI_HOME/composition.json" \
            "$RUNNER_TEMP/status.json" \
            "$RUNNER_TEMP/doctor.json" \
            "$RUNNER_TEMP/actions.json" \
            "$RUNNER_TEMP/suite.json" \
            "$RUNNER_TEMP/verify.json" \
            "$RUNNER_TEMP/receipt.json" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          state = json.load(open(sys.argv[2]))
          status = json.load(open(sys.argv[3]))
          doctor = json.load(open(sys.argv[4]))
          actions = json.load(open(sys.argv[5]))
          suite = json.load(open(sys.argv[6]))
          verify = json.load(open(sys.argv[7]))
          receipt = json.load(open(sys.argv[8]))
          mainline = json.load(open("suite/mainline.json"))
          release = json.load(open("suite/manifest.json"))

          required = [
              "Control/user",
              "Control/agents/governance",
              "Control/agents/wiki",
              "Control/machines",
              ".central",
              "Work",
          ]
          for relative in required:
              assert (root / relative).is_dir(), relative
          for relative in ["Control/user", "Control/agents/governance"]:
              assert list((root / relative).iterdir()) == [], relative
          # Fresh-ground machine adoption (Central #87 through O:I #192):
          # exactly one authored current-machine declaration, bound to the
          # local Workcell.
          assert [p.name for p in (root / "Control/machines").iterdir()] == ["current.json"]
          machine = json.load(open(root / "Control/machines/current.json"))
          assert machine["role"] == "current"
          assert machine["bindings"] == [{"kind": "workcell", "reference": "workcell:local"}]
          assert (root / "Control/agents/wiki/wiki.json").is_file()

          assert set(state) == {"schema", "personal_ground", "modules"}
          assert state["personal_ground"] == str(root)
          central = state["modules"]["central"]
          assert set(central) <= {"id", "public_name", "native_executable", "alias", "version", "docs", "skill", "root", "modality", "install_source"}
          assert central["alias"] == "ctrl"
          # Installation modality (#192): the fresh-ground frame is recorded
          # on the registration, with the pinned source build declared.
          assert central["modality"] == "fresh-ground"
          assert central["install_source"] == "oi-pinned-source-build"
          current_central = next(item for item in mainline["products"] if item["id"] == "central")["revision"]
          released_central = next(item for item in release["products"] if item["id"] == "central")["revision"]
          assert central["version"] == current_central
          assert current_central != released_central

          central_status = next(item for item in status["surfaces"] if item["id"] == "central")
          assert central_status["state"] == "registered"
          assert central_status["modality"] == "fresh-ground"
          assert central_status["install_source"] == "oi-pinned-source-build"
          assert doctor["status"] == "success" and doctor["data"]["valid"] is True
          ids = {item["id"] for item in actions["data"]["actions"]}
          assert {
              "action.list",
              "central.init",
              "central.doctor",
              "projectcentral.inspect",
              "projectcentral.doctor",
              "projectcentral.init",
              "machine.adopt-current",
          } <= ids

          assert suite["kind"] == "oi.suite-snapshot/v1"
          assert suite["completeness"] == "partial-or-unaccepted"
          assert [item["id"] for item in suite["surfaces"]] == ["central"]
          assert suite["surfaces"][0]["selection"]["value"] == central["version"]
          assert suite["surfaces"][0]["mainline_accepted"] is False

          assert verify["kind"] == "oi.composition-receipt/v1"
          assert verify["environment"] == "pre-local"
          assert verify["result"] == "incomplete"
          central_verify = next(item for item in verify["surfaces"] if item["id"] == "central")
          assert central_verify["status"] == "passed"
          assert central_verify["verification_operation"] == "central.doctor"
          assert central_verify["evidence"]["exit_code"] == 0
          assert json.loads(central_verify["evidence"]["stdout"])["data"]["valid"] is True
          assert receipt == verify

          migrated = root / "Work/demo"
          assert (migrated / ".git/HEAD").read_text().strip() == "ref: refs/heads/main"
          assert (migrated / "work.txt").read_text().strip() == "ordinary work"
          PY
