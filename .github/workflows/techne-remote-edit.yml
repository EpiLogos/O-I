name: Technē bounded branch edit

# Temporary delivery transport for the disconnected development sandbox.
# Only the commissioned integration branch is writable. Original blobs and
# readable patch digest must match. No force push, main write or gate bypass.
on:
  pull_request:
    paths: ['tests/techne-remote-edit.patch']
permissions:
  contents: read
concurrency:
  group: techne-remote-edit-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/techne-constructive-field-20260920'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply exact readable source patch on integration branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          envelope = json.load(open('tests/techne-remote-edit.patch'))
          assert envelope['schema'] == 'techne.branch-text-patch/v1'
          patch = envelope['patch_text'].encode('utf-8')
          assert len(patch) <= 8 * 1024 * 1024, 'patch budget exceeded'
          assert hashlib.sha256(patch).hexdigest() == envelope['sha256'], 'patch digest mismatch'
          for line in patch.decode().splitlines():
              if line.startswith(('--- ', '+++ ')):
                  path = line[4:]
                  if path == '/dev/null': continue
                  assert path.startswith(('a/', 'b/')), 'unexpected patch path'
                  path = path[2:]
                  assert path.startswith(('desktop/cradle/', 'packages/oi-design-system/', '.wayfinder/maps/techne-')), path
                  assert '..' not in pathlib.PurePosixPath(path).parts and '/node_modules/' not in path, path
          open(os.environ['RUNNER_TEMP'] + '/techne.patch', 'wb').write(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/techne.patch"
          git apply --index "$RUNNER_TEMP/techne.patch"
          git rm tests/techne-remote-edit.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(techne): apply verified constructive-field source edits'
          git push origin HEAD:refs/heads/codex/techne-constructive-field-20260920
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          echo 'Source delivery only. Normal PR gates must run on this resulting revision.' >> "$GITHUB_STEP_SUMMARY"
