name: W2 dependent source host publication
on:
  push:
    branches: [agent/w2-central-source-host-dependent-20260920]
    paths: [.github/workflows/w2-host-publish.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish only the verified dependent host and browser patch
        run: |
          test "$GITHUB_REF" = refs/heads/agent/w2-central-source-host-dependent-20260920
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          r=Path('desktop/cradle')
          p=r/'src/surface/SourceSurface.tsx'
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='65310469805f3adde890c7aeffd383a46cc8d7b0'
          s=p.read_text()
          s=s.replace('import {EditorFrame} from "../editor/EditorChrome";','import {EditorFrame} from "../editor/EditorChrome";\nimport {sourceBreadcrumb,nativeDaySource,sourceSaveLabel} from "../central/sourceContext";')
          s=s.replace('    if (binding.ref) void kernel.saveSource(binding.ref);','''    if (dayDocument) {
                setDraftError("This native Day has protected source ownership. Use Save Daily Die to native source in Rendered view; the original form’s Save HTML copy remains a separate export.");
                return;
              }
              if (binding.ref) void kernel.saveSource(binding.ref);''')
          a=s.index('  const dayDocument = (()=>{');b=s.index('  const dieView =',a)
          s=s[:a]+'  // Presentation follows canonical bytes, never a dirty raw-source proposal.\n  const dayDocument = nativeDaySource(buffer.saved_content);\n  const breadcrumb = sourceBreadcrumb(buffer);\n'+s[b:]
          s=s.replace('<EditorCommands editor={textareaRef} markdown={markdown}/>','<EditorCommands editor={textareaRef} markdown={markdown} readOnly={!!dayDocument}/>')
          s=s.replace('title={`Central / Work / ${buffer.project} / ${buffer.path}`}>Central / Work / {buffer.project} / {buffer.path}','title={breadcrumb}>{breadcrumb}')
          s=s.replace('{buffer.dirty?"Unsaved":"Saved"}','{sourceSaveLabel(buffer.dirty,!!dayDocument)}')
          s=s.replace('onClick={onSave} disabled={!buffer.dirty}>Save · ⌘S','onClick={onSave} disabled={!buffer.dirty||!!dayDocument}>Save · ⌘S')
          s=s.replace('{dieView&&dayDocument&&<DayDieFace ','{dayDocument&&<div hidden={!dieView} style={{height:"100%",minHeight:0}}><DayDieFace ')
          s=s.replace('project={dayProject}/>}\n      <div','project={dayProject}/></div>}\n      {historyOpen && <SourceHistory sourceRef={binding.ref} revision={buffer.conflict?.current_revision ?? buffer.base_revision} />}\n      <div')
          s=s.replace('onChange={onEdit} onSelect={updateCaret} onSave={onSave}/>','onChange={onEdit} onSelect={updateCaret} onSave={onSave} readOnly={!!dayDocument}/>')
          s=s.replace('        {historyOpen && <SourceHistory sourceRef={binding.ref} revision={buffer.conflict?.current_revision ?? buffer.base_revision} />}\n','')
          browser=r/'tests/central-native-browser.mjs'
          assert subprocess.check_output(['git','hash-object',str(browser)],text=True).strip()=='2e09b806ae84af1ca7e8ad0a86ec82a5e87aea3b'
          t=browser.read_text()
          t=t.replace('   const before=native();',"   assert.match(await page.locator('.editor-path').textContent(),/^Central \\/ Control\\//);\n   const before=native();")
          t=t.replace("   await page.getByRole('button',{name:'Back to Central ground',exact:true}).click();","   await page.getByRole('tab',{name:'Source',exact:true}).click();\n   await page.getByRole('tab',{name:'Rendered',exact:true}).click();\n   assert.equal(await input.textContent(),text);check(name+': source/rendered switch preserves unsaved Day and root scope');\n   await page.getByRole('button',{name:'Back to Central ground',exact:true}).click();")
          p.write_text(s);browser.write_text(t)
          PY
          git diff --check
          git add desktop/cradle/src/surface/SourceSurface.tsx desktop/cradle/tests/central-native-browser.mjs
          git rm .github/workflows/w2-host-publish.yml
          git -c user.name='EpiLogos W2' -c user.email='186434782+EpiLogos@users.noreply.github.com' commit -m 'fix(central): retain native Day drafts across source views and honest root save state'
          git push origin HEAD:refs/heads/agent/w2-central-source-host-dependent-20260920
          mkdir -p "$RUNNER_TEMP/w2-host"
          git rev-parse HEAD > "$RUNNER_TEMP/w2-host/revision.txt"
          git diff HEAD~1 HEAD > "$RUNNER_TEMP/w2-host/host.patch"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production build and executable host regressions
        working-directory: desktop/cradle
        run: |
          npm ci
          npm run build 2>&1 | tee "$RUNNER_TEMP/w2-host/build.log"
          node --experimental-strip-types --import ./tests/ts-register.mjs --test tests/central-ground.test.mjs tests/central-source-host.test.mjs 2>&1 | tee "$RUNNER_TEMP/w2-host/tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-dependent-host-publication
          path: ${{ runner.temp }}/w2-host
          retention-days: 7
