name: Product capability collation
on:
  pull_request:
    paths:
      - 'suite/**'
      - 'surfaces.json'
      - 'scripts/collate-product-capabilities.py'
      - 'tests/test_collate_product_capabilities.py'
      - 'cli/**'
      - '.github/workflows/product-capabilities.yml'
  push:
    branches: [main]
    paths:
      - 'suite/**'
      - 'surfaces.json'
      - 'scripts/collate-product-capabilities.py'
      - 'tests/test_collate_product_capabilities.py'
      - 'cli/**'
      - '.github/workflows/product-capabilities.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate carried sources and derived companions
        run: python3 scripts/collate-product-capabilities.py --check-snapshot
      - name: Exercise collation, relocation and drift detection
        run: python3 -m unittest -v tests/test_collate_product_capabilities.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: cli
      - name: Build suite capability entry point
        run: cargo build --manifest-path cli/Cargo.toml --locked
      - name: Verify CLI disclosures match the shipped projections
        run: |
          cli/target/debug/oi capabilities --json > /tmp/oi-capabilities.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('suite/product-capabilities.json').read_text())
          observed = json.loads(Path('/tmp/oi-capabilities.json').read_text())
          assert expected == observed
          PY
