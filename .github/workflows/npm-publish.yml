name: Publish O:I npm package

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish
        required: true
        default: prelocal
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify package
        working-directory: packages/oi-cli
        run: |
          npm test
          npm pack --dry-run
      - name: Require matching immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/oi-cli/package.json').version")"
          gh release view "oi-v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Publish with npm trusted publishing
        working-directory: packages/oi-cli
        run: npm publish --provenance --access public --tag '${{ inputs.dist_tag }}'
