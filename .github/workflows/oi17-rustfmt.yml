name: OI17 rustfmt cleanup

on:
  push:
    branches:
      - converge/oi-017-first-suite
    paths:
      - .github/workflows/oi17-rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi-017-first-suite
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path cli/Cargo.toml
      - name: Commit formatting
        run: |
          git config user.name oi17-convergence-bot
          git config user.email actions@users.noreply.github.com
          git add cli
          git diff --cached --check
          git commit -m 'style(cli): apply rustfmt to convergence tests'
          git push origin HEAD:converge/oi-017-first-suite
