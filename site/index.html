<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{O:I} — an architecture for the engineering around the model.">
  <title>{O:I}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #000;
    }

    main {
      width: min(92vw, 48rem);
      min-height: 60vh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      align-items: center;
      justify-items: center;
      text-align: center;
    }

    h1 {
      grid-row: 2;
      margin: 0;
      font-size: clamp(3rem, 11vw, 8rem);
      font-weight: 500;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }

    a {
      grid-row: 3;
      align-self: end;
      margin-bottom: 2rem;
      color: inherit;
      font-size: 0.875rem;
      text-underline-offset: 0.2em;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <!-- The main element is deliberately the future participant/projection root. -->
  <main data-oi-surface="projection-root" data-oi-subject="participant">
    <h1>{O:I}</h1>
    <a href="https://github.com/EpiLogos/O-I">GitHub</a>
  </main>
</body>
</html>
