[package]
name = "oi-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
aikit-core = { git = "https://github.com/EpiLogos/ai-kit", rev = "9ff28ca31c723b314ddf62b7f85b6e2611d53d66" }
serde = { version = "1", features = ["derive"] }
