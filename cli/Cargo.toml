[package]
name = "oi-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
aikit-core = { git = "https://github.com/EpiLogos/ai-kit", rev = "8ec1f923b8cc59b7e18e7b6c1afa0974ca6f1208" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
