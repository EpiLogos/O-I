[package]
name = "oi-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
oi-cradle-kernel = { path = "../desktop/cradle/kernel" }
aikit-core = { git = "https://github.com/EpiLogos/ai-kit", rev = "ace1496a277d69047e4cead073f4f1bd67932f31" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[workspace]
# C7 conformance harness (#299): the owner-stub + conformance-suite crate
# lives beside the fixtures in `suite/conformance/` and shares this
# workspace's target directory so one build serves both suites.
members = ["../suite/conformance"]
