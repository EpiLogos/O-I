[package]
name = "oi-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
oi-cradle-kernel = { path = "../desktop/cradle/kernel" }
aikit-core = { git = "https://github.com/EpiLogos/ai-kit", rev = "e53801d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[workspace]
