[package]
name = "oi-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "oi"
path = "src/main.rs"

[dependencies]
aikit-core = { git = "https://github.com/EpiLogos/ai-kit", rev = "b7843b437a8d4edd364b22aec9d7625bc8124915" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
