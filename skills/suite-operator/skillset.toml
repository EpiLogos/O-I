# The O:I guardian SkillSet — the one bootstrap SkillSet: the `oi` router and
# the suite operator. It is not the six-product Guardian roster.
#
# O:I declares only what it owns. Every other product's skills stay
# authoritative in their own repository and are composed, reviewed and
# resolved by AIKit's sets — the suite's normal resolver. This manifest used
# to pin every product's skills here (owner, path, exact revision); that was
# a second skill registry in a second format, and it drifted the moment a
# product moved its files. Registration is AIKit functionality.
#
schema = "oi.suite-skillset/v1"

[[profiles]]
profile_ref = "oi:skillset:base-guardian"
purpose = "Default shipped bootstrap SkillSet: O:I suite routing through the oi CLI and composed-suite operation. It does not carry Central ground practice or the six-product Guardian roster. Procedural composition only; grants no authority."
scope = "ordinary"
inherits = []

[[profiles.members]]
skill_ref = "oi:skill:operate-suite"
requiredness = "required"

[[profiles.members]]
skill_ref = "oi:skill:suite-operator"
requiredness = "required"

[[skills]]
skill_ref = "oi:skill:operate-suite"
owner_product = "O:I"
purpose = "Inspect, compose and route O:I whole-level operations through product-owned public contracts."
source = { repository = "EpiLogos/O-I", path = "skills/oi/SKILL.md", revision_policy = "resolve_authoritative_installed_revision" }
compatibility = []
required_actions = []
required_capabilities = []
risk_class = "suite-operation"
permission_requirements = []

[[skills]]
skill_ref = "oi:skill:suite-operator"
owner_product = "O:I"
purpose = "Compose and explain the installed suite from source-owned native refs without copying procedures or authority."
source = { repository = "EpiLogos/O-I", path = "skills/suite-operator/SKILL.md", revision_policy = "resolve_authoritative_installed_revision" }
compatibility = []
required_actions = []
required_capabilities = []
risk_class = "suite-operation"
permission_requirements = []
