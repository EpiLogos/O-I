<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face rig 2</title>
<style>
/* Tokens from world-shell-mockup.html / agent-shell-mockup.html (live-shell styles at 45e15ed8b). */
:root{
  --bg-0:#26292d; --bg-1:#33363b; --bg-2:#3f4348; --bg-3:#4a4e54; --surface:#43464c;
  --line:#24262a; --line-strong:#3d4147;
  --text:#d4d7da; --text-dim:#a2a7ad; --text-faint:#71767c;
  --accent:#ffbe00; --accent-soft:rgba(255,190,0,.13); --sel:#7ec3e6; --rec:#e0523f; --green:#8fd0a8; --stall:#ff9b4a;
  --fizz:#5cc6b4; --honey:#e2a35e; --bumble:#d985a6; --drone:#8fbfb6; --fixgen:#a8c9c2; --parasakti:#c79ae0;
  --w-ariadne:#d1a46c; --w-satya:#5fb3b0; --w-kestrel:#a9c4dc; --w-field:#7ec3e6;
  --mercurius:#c9a0dc; --selfc:#9fc7e8; --tower:#d8c89a;
  --paper:#EFEFED; --pfield:#FAFAF8; --ink:#111; --pmid:#6E6E6A; --hl:#FFE97A;
  --serif:Charter,"Iowan Old Style",Palatino,Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1b1d20;color:var(--text)}
body{font:12.5px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}
a{color:var(--sel);text-decoration:none}
.plate{max-width:1180px;margin:0 auto;padding:28px 28px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
header.top h1{font:500 22px/1.15 var(--serif);color:var(--text);letter-spacing:-.01em}
header.top p{max-width:62ch;color:var(--text-dim);margin-top:8px}
.meta{color:var(--text-faint);font-size:11px;text-align:right;line-height:1.5}
nav.jump{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 6px}
nav.jump a{color:var(--text-dim);padding:3px 8px;border:1px solid var(--line);background:var(--bg-0)}
nav.jump a:hover{color:var(--text);border-color:var(--line-strong)}

section{margin-top:34px}
section h2{font:500 15px/1.2 var(--serif);margin-bottom:4px}
section .lead{color:var(--text-dim);max-width:78ch;margin-bottom:14px}
h3{font-weight:500;font-size:11px;color:var(--text-faint);letter-spacing:.04em;margin:16px 0 8px}

/* shell chrome, copied in kind from the mockups */
.nc{height:22px;min-width:20px;padding:1px 5px;background:var(--bg-0);border:1px solid #30343a;line-height:14px;font-size:10px;color:var(--text-dim);display:inline-flex;align-items:center;justify-content:center;gap:3px}
.nc.on{background:var(--accent);color:#1d1f22;border-color:var(--accent)}
.nc.warn{color:var(--stall);border-color:#6a4630}
.nc.soon{opacity:.4}
.fld{height:22px;padding:2px 6px;font-size:10px;background:var(--bg-0);color:var(--text);display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);border:1px solid transparent}
.fld small{font-size:8.5px;color:var(--text-faint)}
.fld.act{outline:1px solid var(--accent)}
.tbtn{width:22px;height:24px;display:inline-grid;place-items:center;color:var(--text-dim)}
.tbtn.play{color:var(--accent)} .tbtn.rec{color:#c9c8ad}
.tbtn.on.play{color:#1d1f22;background:var(--accent)} .tbtn.on.rec{color:var(--rec)}
.cpu{width:36px;height:18px;border:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--bg-0) 0,var(--bg-0) 9px,var(--line) 9px,var(--line) 10px);position:relative;overflow:hidden;display:inline-block}
.cpu i{position:absolute;left:0;top:0;bottom:0;width:38%;background:repeating-linear-gradient(90deg,#8fd0a8 0,#8fd0a8 9px,transparent 9px,transparent 10px)}
.surf{display:inline-flex;gap:4px;align-items:center}
.surf button{color:var(--text-dim);width:24px;height:24px;display:grid;place-items:center}
.surf button.on{color:var(--accent)}

.transport{background:var(--bg-1);border:1px solid var(--line-strong);padding:8px 10px 10px;margin-top:8px}
.transport .ttl{text-align:center;color:var(--text-dim);font-size:12px;margin-bottom:6px}
.transport .ttl b{color:var(--text);font-weight:500}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g{display:flex;align-items:center;gap:2px}
.sp{flex:1;min-width:8px}
.modebar{display:flex;gap:0;border-top:1px solid var(--line);margin-top:8px}
.modebar button{flex:1;text-align:left;padding:6px 8px;color:var(--text-dim);border-right:1px solid var(--line);font-size:10.5px}
.modebar button:last-child{border-right:none}
.modebar button.on{color:var(--text);background:var(--bg-0)}
.modebar button small{display:block;color:var(--text-faint);font-family:var(--mono);font-size:10px;margin-top:2px}
.modebar button.on small{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.cell{background:var(--bg-1);border:1px solid var(--line);padding:8px 8px 10px}
.cell .well{background:var(--bg-0);border:1px solid var(--line);min-height:64px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
.cell .nm{margin-top:7px;color:var(--text);font-size:12px}
.cell .sub{color:var(--text-faint);font-size:10.5px;margin-top:2px;line-height:1.35}
.transport{overflow-x:auto}
.transport .ctl{flex-wrap:nowrap;width:max-content;min-width:100%}
.surfrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);width:max-content}
.surfrow .lab{color:var(--text-faint);font-size:10px;margin-right:4px}
.tag{display:inline-block;font-size:9px;letter-spacing:.06em;color:#1d1f22;background:var(--accent);padding:1px 4px;margin-left:6px;vertical-align:1px}
.tag.alt{background:var(--bg-3);color:var(--text-dim)}

.states{display:flex;gap:4px;align-items:center;justify-content:center}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:10.5px;font-family:var(--mono)}
.sw i{width:14px;height:14px;border:1px solid #0006}

/* bee */
@keyframes flap{to{transform:scaleY(.35)}}
@keyframes bob{50%{transform:translateY(-1.5px)}}
@keyframes breathe{50%{transform:translateY(.6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.pface{display:block}
.dev.facedev{width:100%;max-width:1124px;flex:1 1 100%}
.facedev svg,.facedev .fd-pl{user-select:none;-webkit-user-select:none}
.fd{display:flex;flex-wrap:wrap;gap:14px;padding:10px}
.fd-col{display:flex;flex-direction:column;gap:6px;align-items:center}
.fd-pads{display:grid;grid-template-columns:repeat(3,96px);grid-template-rows:auto auto;gap:8px;align-content:start}
.fd-pad{display:flex;flex-direction:column;gap:3px}
.fd-pad svg{width:96px;height:96px;background:var(--bg-0);border:1px solid var(--line);touch-action:none;cursor:crosshair;display:block}
.fd-pad.big{grid-column:span 2;grid-row:span 2}
.fd-pad.big svg{width:200px;height:200px}
.fd-pl{font-size:10px;color:var(--text-dim);display:flex;gap:6px;align-items:center}
.fd-split{font-size:9px;color:var(--text-faint);border:1px solid var(--line-strong);padding:0 3px;cursor:pointer}
.fd-pad.split .fd-split{color:#1d1f22;background:var(--accent);border-color:var(--accent)}
.fd-pad .pc{fill:var(--accent)}
.fd-pad .pt{font-size:6px;fill:var(--text-faint)}
.fd-pad.big .pt{font-size:3.6px}
.fd-pad .pa{font-size:4.6px;fill:var(--text-faint);opacity:.75}
.fd-pad .pa.near{fill:var(--accent);opacity:1}
.fd-pad .pk{fill:var(--text);stroke:#1d1f22;stroke-width:.8}
.fd-pad .pkL{fill:none;stroke:var(--text);stroke-width:1.4}
.fd-pad .gh{fill:none;stroke:var(--sel);stroke-width:1}
.fd-mxw{display:flex;flex-direction:column;gap:3px}
.fd-mx{width:198px;touch-action:none;cursor:ns-resize}
.fd-mx .mt{font-size:6.6px;fill:var(--text-faint)}
.fd-mx .mc{fill:var(--bg-0);stroke:var(--line-strong);stroke-width:.4}
.fd-mx .mf,.fd-mx .mo{pointer-events:none}
.fd-side{flex:1;min-width:240px;display:flex;flex-direction:column;gap:5px}
.fd-chips{display:flex;flex-wrap:wrap;gap:3px}
.fd-chips .nc{height:19px;font-size:9.5px;padding:0 5px}
.fd-stack{display:grid;gap:2px;margin-bottom:4px;font-size:10px}
.fd-stack .fs{display:grid;grid-template-columns:9px 70px 1fr;align-items:center;gap:6px;color:var(--text-faint)}
.fd-stack .fs i{width:7px;height:7px;border-radius:50%;background:var(--bg-3)}
.fd-stack .fs.on{color:var(--text-dim)}
.fd-stack .fs.on i{background:var(--accent)}
.fd-stack .fs b{font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:9.5px}

.pface .pn{transform-box:fill-box;transform-origin:center}
.stage{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;background:#1b1d20;padding:18px}
.stage-ctl{display:flex;flex-direction:column;gap:6px;max-width:360px}
.stage-ctl .lab{color:var(--text-faint);font-size:10px;margin-top:6px}
.stage-ctl .g{gap:4px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;margin-top:8px;font-size:10px;color:var(--text-faint)}
.legend .lg{display:flex;align-items:center;gap:5px;min-width:0}
.legend i{width:8px;height:8px;flex:none}
.legend span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{height:4px;background:var(--text-dim);width:0;flex:none;transition:width .1s}
.rowline.warn{color:var(--stall)}
.rowline .cut{flex:none}
.shots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.shots figure{margin:0;background:#fff;border:1px solid var(--line)}
.shots img{width:100%;height:auto;display:block}
.shots figcaption{background:var(--bg-1);color:var(--text-dim);font-size:10px;padding:4px 6px}
.bee-s .wing{transform-box:fill-box;transform-origin:50% 100%}
.bee-s.working .wing{animation:flap .12s infinite alternate}
.bee-s.working .bodyg{animation:bob 1.4s ease-in-out infinite}
.bee-s.idle .bodyg{animation:breathe 3.2s ease-in-out infinite}
.form{transform-box:fill-box;transform-origin:center}
.form.spin{animation:spin 16s linear infinite}

/* clips — agent-shell geometry */
.cs{height:26px;width:148px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px;font-size:10px;position:relative;background:var(--bg-2);color:var(--text-dim)}
.cs .sg{width:9px;height:9px;border:1px solid var(--line);flex:none}
.cs.clip{background:var(--tc);color:#252a2d}
.cs.clip .tri{width:0;height:0;border-left:7px solid #252a2dbb;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;flex:none}
.cs.clip .n{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.cs.done{opacity:.55}
@keyframes blink{50%{opacity:.25}}
.cs.run .tri{animation:blink 1s steps(2) infinite}
.cs.queued .tri{animation:blink .35s steps(2) infinite}
.cs.stall{background:repeating-linear-gradient(135deg,var(--tc) 0,var(--tc) 7px,#ff9b4a55 7px,#ff9b4a55 9px)}
.cs.stall .tri{border-left-color:var(--stall)}
.cs .pg{position:absolute;left:0;bottom:0;height:2px;background:#252a2dbb}
.cs.recs{background:var(--rec);color:#fff}
.cs.recs .tri{border-left-color:#fff}
.lane{position:relative;height:46px;background:var(--bg-2);border:1px solid var(--line);overflow:hidden}
.ac{position:absolute;top:6px;bottom:6px;background:var(--tc);color:#22282c;font-size:10px;padding:2px 5px}
.ac small{display:block;font-size:9px;opacity:.7}
.needle{position:absolute;top:0;bottom:0;width:2px;background:var(--tc)}
.needle span{position:absolute;left:6px;top:3px;font:9px var(--mono);background:#1d1f22d8;color:var(--text);padding:1px 4px;border-left:2px solid var(--tc);white-space:nowrap}
.needle.stall{background:var(--stall)} .needle.stall span{border-left-color:var(--stall);color:var(--stall)}

/* device */
.dev{background:var(--bg-1);border:1px solid var(--line-strong);width:250px}
.dh{height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--bg-0);border-bottom:1px solid var(--line);font-size:11px}
.pw{width:8px;height:8px;border-radius:50%;background:var(--accent);border:1px solid #0006;flex:none}
.pw.off{background:var(--bg-3)}
.own{color:var(--text-faint);font-size:10px}
.x{margin-left:auto;color:var(--text-faint);display:flex;gap:6px}
.db{display:flex;gap:8px;padding:8px}
.lt{width:9px;height:9px;border-radius:50%;border:1px solid #0007;background:var(--bg-0);display:inline-block}
.lt.on{background:var(--accent)}
.rowline{display:flex;align-items:center;gap:6px;height:20px;font-size:11px;color:var(--text-dim)}
.rowline.off{color:var(--text-faint)}

.pair{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.note{font-size:11px;color:var(--text-faint);margin-top:8px;max-width:78ch}
kbd{font-family:var(--mono);font-size:10px;color:var(--text-dim)}
.wood{flex:none;overflow:visible}
.wood *{vector-effect:non-scaling-stroke}
.wood.dim{opacity:.45}
.x svg{display:block}
</style>
<style>
.dev.facedev{max-width:none}
#fd-face .pface{width:min(400px, 30vw);height:auto}
.fd-col{position:sticky;top:10px;align-self:flex-start}
.fd-pads{grid-template-columns:repeat(4, 118px)}
.fd-pad svg{width:118px;height:118px}
.fd-pad.big{grid-column:span 2}
.fd-pad.big svg{width:244px;height:244px}
.fd-mx{width:260px}
.anat .fiber{fill:none;stroke-linecap:round;cursor:pointer}
.anat .bone{fill:#eadcc8;fill-opacity:.16;stroke:#f4ead8;stroke-width:1.7;stroke-linejoin:round}
.anat .bone.line{fill:none;stroke-width:2.3}
.plate{max-width:1440px}
</style>
</head>
<body>
<div class="plate">
  <header class="top">
    <div>
      <h1>Face rig</h1>
      <p>The face on its own: a polygon mesh moved by muscles and a jaw, with speech, expressions, gestures and the anatomy overlay. The body that carries this face is in body-face-rig.html.</p>
    </div>
  </header>
  <div class="pair" id="device-body"></div>
</div>
<script src="face-core.js"></script>
<script src="face-speech.js"></script>
</body>
</html>
