<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inhabitant rack harness — six families · document devices · conversation device</title>
<style>
/* Tokens from the shell styles (widget guide §1). */
:root{
  --bg-0:#26292d; --bg-1:#33363b; --bg-2:#3f4348; --bg-3:#4a4e54;
  --line:#24262a; --line-strong:#3d4147;
  --text:#d4d7da; --text-dim:#a2a7ad; --text-faint:#71767c;
  --accent:#ffbe00;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b1d20;overflow:hidden}
body{font:12px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#app{display:grid;width:100%;height:100%;grid-template-rows:44px minmax(0,1fr)}
.harness-bar{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg-1);border-bottom:3px solid var(--line)}
.harness-bar .label{color:var(--text-faint);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.harness-bar .reading{font-family:ui-monospace,'SF Mono',Menlo,monospace;color:var(--text-dim);font-size:11px}
.harness-bar .gap{flex:1}
.harness-bar button{font:11px/1 inherit;color:var(--text);background:var(--bg-2);border:1px solid var(--line-strong);border-radius:2px;padding:3px 8px;cursor:pointer}
.harness-bar button:hover{color:var(--accent);border-color:var(--accent)}
.rack-scroll{overflow:auto;min-height:0;padding:6px}
</style>
</head>
<body>
<div id="app">
  <div class="harness-bar" id="bar">
    <span class="label">inhabitant rack</span>
    <span class="reading" id="reading">loading families…</span>
    <span class="gap"></span>
    <button id="identity-btn">fixture identity: off</button>
  </div>
  <div class="rack-scroll" id="rack"></div>
</div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
