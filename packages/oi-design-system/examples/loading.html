<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>O:I · pending status reference</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../point-cloud.css"><link rel="stylesheet" href="../desktop.css"><style>
*{box-sizing:border-box}body{margin:0;background:var(--oi-surface);color:var(--oi-foreground);font:var(--oi-shell-type-prose) var(--oi-font-sans)}main{max-width:var(--oi-reading-width);padding:var(--oi-space-5);margin:auto}h1{font-size:var(--oi-shell-type-title)}p{line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:var(--oi-desktop-gap)}button,select{font:inherit}button:focus-visible,select:focus-visible{outline:var(--oi-focus-ring-width) solid var(--oi-focus);outline-offset:var(--oi-focus-ring-offset)}
</style></head><body class="oi-desktop"><main><h1>Pending operation text</h1><p>This reference has no product connection. It exercises the portable accessible status body; opening and expressive motion belong to the actual desktop's one native stage.</p><section id="stage" aria-label="Portable status reference"></section><nav><button class="oi-action" id="update">Update reference label</button><button class="oi-action" id="remove">Remove reference status</button><label>Appearance <select aria-label="Appearance"><option value="light">Light</option><option value="dark">Dark</option></select></label></nav></main><script type="module">
import {createLoadingIndicator} from '../loading.mjs';
const status=createLoadingIndicator({label:'Pending status reference',detail:'No product operation is running'});document.querySelector('#stage').append(status.element);
document.querySelector('#update').onclick=()=>status.update({label:'Updated reference text',detail:'Text supplied by the reference control',active:false});
document.querySelector('#remove').onclick=()=>status.remove();
document.querySelector('select').onchange=e=>document.body.dataset.theme=e.target.value;
</script></body></html>
