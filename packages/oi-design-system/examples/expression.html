<!doctype html>
<html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>O:I expression module reference</title>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../expression.css">
<style>body{margin:24px;background:var(--oi-surface);color:var(--oi-foreground);font:14px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}article{height:170px;border-bottom:1px solid var(--oi-foreground)}.field{height:130px}nav{display:flex;gap:12px;margin-bottom:20px}button,select{font:inherit}#resize{width:260px;height:100px;resize:horizontal;overflow:auto;border:1px solid var(--oi-foreground)}</style>
<body class="oi-desktop"><h1>Expression</h1><p>Real module reference. Forms here are visual samples, not product activity.</p>
<nav><button id="pause">Pause</button><select aria-label="Theme"><option>oi-desktop</option><option>oi-surface-light</option><option>oi-surface-dark</option><option>oi-surface-warm-dark</option><option>oi-surface-contrast</option></select><button id="edge">Resize expression</button></nav><main></main><div id="resize">Resize reference</div>
<script type="module">
import {createExpressionOverlay,formNames} from '../expression.mjs';
const overlay=createExpressionOverlay(document.body),handles=[];
for(const name of formNames.filter(n=>n!=='waiting')){const article=document.createElement('article');article.innerHTML=`<strong>${name}</strong><div class="field"></div>`;document.querySelector('main').append(article);const field=article.querySelector('.field');handles.push(overlay.express(name,{rect:()=>field.getBoundingClientRect(),hold:true}));}
const timer=setInterval(()=>handles.forEach(handle=>overlay.update(handle,{})),10000);
let paused=false;document.querySelector('#pause').onclick=e=>{paused=!paused;overlay.pause(paused);e.target.textContent=paused?'Resume':'Pause';};
document.querySelector('select').onchange=e=>document.body.className=e.target.value;
document.querySelector('#edge').onclick=()=>overlay.express('edge',{rect:()=>document.querySelector('#resize').getBoundingClientRect(),dir:[1,0]});
window.expressionReference={overlay,handles};window.addEventListener('pagehide',()=>{clearInterval(timer);overlay.dispose();});
</script></html>
