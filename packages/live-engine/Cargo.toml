[package]
name = "live-engine"
version = "0.1.0"
edition = "2021"
description = "Audio graph core for the Live shell (M1 of shell/SHELL-BLUEPRINT.md): tracks, device chains, mixer, transport clock, offline render"

[dependencies]
live-dynamics = { path = "../live-dynamics" }
live-set = { path = "../live-set" }
# Realtime output only — the offline render path (the acceptance path) stays
# zero-dep. Default off so the gated tests build without an audio stack.
cpal = { version = "0.15", optional = true }

[features]
realtime = ["dep:cpal"]
# The Torus instrument node over QL's K8 typed API (src/k8.rs): build.rs
# compiles the C ABI shim against QL_MEF_PREFIX (an installed QL prefix with
# include/ql/continuous_field.hpp and lib/libql-mef-c.a).
k8 = []

[[example]]
name = "key_to_sound"
required-features = ["k8"]
